{t:'流苏之道 · 自由求真',meta:'强制节点：瑶光现世——源初的另一道意识',scene:'参悟门碎片的第七日，一道身影不请自来。她立于紫微殿外的云海之上，白衣猎猎，周身气息混沌难测，似道似魔，亦正亦邪——你分明感觉到，她身上的气息，与流苏有某种说不清道不明的同源。她自称瑶光，是开天辟地之前便存在的意识。她看着你，目光又仿佛透过你，看着你识海深处那道白玉小人：有趣。一缕残魂，竟教出个能镇混沌的徒弟。流苏终于开口，声音冷得像万古不化的冰，却带着一丝你极少听过的郑重：瑶光，你我之间的事，不必牵连旁人。瑶光轻笑，笑声在云海间回荡：别紧张——我今日来，不是来打架的。只是告诉你一声：那道天外之影，与我同源而生。它若吞了此界，你我皆无归处。她顿了顿，笑意淡去，眼底第一次露出认真：所以，这一回——我站你这边。流苏沉默了很久。瑶光也不急，就那么立在云海上，等着。许久，流苏才开口，声音里带着一丝极淡的复杂：你当年选秩序，我选自由。争了万古，谁也没赢。瑶光轻轻道：是啊，谁也没赢。可你教出来的这个徒弟……倒是把两条路都走通了些。她说着，目光转向你，眼底有一丝审视，又有一丝好奇：你身上有我们都没有的东西——一颗人心。你迎着那道跨越万古的目光，一时不知该说什么。流苏在识海深处沉默了很久，终于开口，声音里带着一丝你从未听过的疲惫与释然：瑶光，当年混沌之中，你我相伴而生——你求秩序，我求自由。开天后你建了天界，又亲手推翻了它；我困在一缕残魂里，浑浑噩噩过了万古。争了这么久，谁也没赢，谁也没输。瑶光静静听着，没有打断。等流苏说完，她才轻声道：是啊，谁也没赢。可她话锋一转，目光落向你：可你教出来的这个徒弟，把两条路都走通了些——他管人间的事，也问道的尽头；他守妖城的约，也闯幽冥的门。她说着，忽然一笑：我忽然明白你当年为何选他了。流苏没有答话，可你感觉到识海里那道白玉小人的气息，微微暖了一瞬。瑶光转身，立在云海边缘，声音远远传来：天外之影将至，我需回源初之地做些布置。流苏——你我之间的事，等此劫过后，再慢慢算。她说完，身影化作一道流光，消失在云海深处。你站在紫微殿外，望着她消失的方向，风鼓起衣袍。身后，曦月不知何时走来，轻声道：瑶光前辈……她很强。你点头：嗯。可她现在，是站在我们这边的。曦月看了你一眼，没有再多问。你在紫微殿外站了很久，回味着瑶光那句你我本来的家，心头泛起一丝说不清的涟漪。识海里，流苏难得主动开口：她说的源初之地……我曾听幽皇提过。那是开天之前混沌所在之处，也是我与瑶光诞生的地方。你问：你想回去看看么？她沉默了片刻，才道：……想。可也怕。你问：怕什么？她没有立刻答话，过了很久，才轻声道：怕回去之后，发现当年的自己已经找不回来了。你听着她话里那丝不易察觉的涩意，没有安慰，也没有追问，只道：那我陪你回去看看。不管找不找得回来，总得先看看，才知道路该怎么走。她嗯了一声，没有再说话。你抬头望向云海尽头——瑶光的身影已经消失在暮色里，但她留了一道若有若无的气息，像一盏引路的灯。你捏了个遁诀，正要动身，身后忽然传来一声呼唤：秦先生。你回头，见曦月站在殿门口，手里托着一只玉匣：鹤悼师兄闭关前留了一句话给你——源初之地凶险，若遇不测，捏碎匣中玉符，可唤他相助。你接过玉匣，郑重道谢。曦月微微颔首，没有再多言，只望着你化作流光，消失在云海深处。她站在殿门口，衣袂被风吹起，像一尊守候了万年的石像。',opts:[
  {k:'A',tag:'联手',c:'#A98FD9',tx:'与瑶光定下攻守同盟',hint:'影响：得源初之力；直面天外之影',run:()=>{S.flags.天外之敌=true;S.six.神识=clamp(S.six.神识+2,1,20);log('红尘卷·六卷','你与瑶光击掌为盟。她转身欲去时，忽然回头，看着你识海的方向轻声说：“流苏——当年是我先选了‘秩序’那条路，你选了‘自由’。争了万古，谁也没赢。可如今看来……你教出的这个徒弟，倒是把两条路都走通了些。”流苏沉默良久：“……彼此彼此。”');}},
  {k:'B',tag:'问心',c:'#6FA698',tx:'问她与流苏的源初旧事',hint:'影响：洞悉流苏完整身世',run:()=>{S.flags.流苏身世线索=true;log('红尘卷·六卷','瑶光倒也不藏私：“混沌之中，两道意识相伴而生——她求自由，我求秩序。开天后各走各路，她一缕残魂困了万古，我建了天界又推翻了它……到头来，都不如你这个小辈活得明白。”她看着你，忽然一笑：“我忽然明白她为何挑中你了——你身上有我们都没有的东西：一颗人心。”');}},
  {k:'C',tag:'护道',c:'#8B6FA8',tx:'以道心立约，不许她伤人间分毫',hint:'影响：为人间立规矩',run:()=>{S.jianghu.xia=(S.jianghu.xia||0)+3;log('红尘卷·六卷','“联手可以，规矩先讲好：不管你们源初的神仙打架打成什么样，人间、妖城、幽冥——不许你伸手。”瑶光挑眉看你半晌，忽然笑了：“有意思。一个连太清都还不是的小辈，敢跟我谈条件。”她却没有拒绝：“行。冲你这句硬话，我答应你。”');}},
]},
{t:'终幕 · 三生石前',meta:'终幕抉择：开天路现，前世今生尽在眼前',scene:'天外之影的阴影越来越近——北冥的魔渊又开始躁动，三途的怨气无端起浪，连妖城的万妖都隐隐不安。瑶光说，要对付它，须回溯到开天辟地之初，找到那影子的本源。于是你循着她指的路，穿过云海，越过忘川，来到一处不存于任何舆图的地方：三生石畔。那是一块通体莹白的巨石，立在灰蒙蒙的天地之间，像一柄插入大地的古剑。石上光影流转，如水波般荡漾，映出你的前世今生：有端坐云端的神祇，垂眸俯瞰众生；有仗剑人间的侠客，快意恩仇；有挑灯夜读的书生，红袖添香；还有，一道在混沌初开时，轻轻拨动第一缕光的影子——那道影子模糊不清，可你看见它的刹那，心头却像被什么轻轻撞了一下。你怔怔看着，忽然明白了许多事——明白了自己为何总爱多管闲事，为何见不得弱者受欺，为何明明可以独善其身，却总忍不住往浑水里跳。身后，凤皇不知何时现出身形——那是开天第一组生灵，身形巨大，通体流转着古老的光，声音带着亘古的回响：看见自己从何而来了？你回头，望着天外越来越近的阴影，又看了看三生石上那些流转的光影，忽然笑了：看见了。所以也知道——该往哪里去了。凤皇没有答话，只是静静地望着你，眼底有一丝极淡的赞许。你又在三生石前站了很久。那些流转的光影一帧帧掠过——你看见自己在前世的山村里替人看病，看见自己在前世的战场上替人挡刀，看见自己在前世的灯下替人抄书。每一世，你都做着差不多的事：多管闲事，替人出头，见不得弱者受欺。你忽然笑了——原来不是这一世的你如此，是每一世的你，都是如此。三生石畔的风带着亘古的凉意，拂过你的眉眼。你转过身，望向天外那道越来越近的阴影，眼底没有惧色，只有一种尘埃落定的平静。凤皇的声音在身后响起，带着亘古的回响：决定了？你点头：决定了。他问：去哪边？你笑了笑，没有立刻答话，只望向远方——北冥的魔渊需要镇守，三途的轮回需要照看，天枢的门需要参悟，而那道天外之影，终究需要有人去面对。你忽然想起这一路走来遇见的那些人：李青君、明河、夜翎、程程、孟轻影、居云岫、羽裳、安安、李无仙……她们每一个人，都曾在你最需要的时候，站到你身边。你轻声说：我这一路走来，欠了很多人的情。天外之影要吞此界，那我便替她们，把这道影子拦在门外。凤皇沉默片刻，忽然发出一声亘古的叹息，那叹息里带着一丝极淡的笑意：好。那便去吧——你身后的人间灯火，会替你照亮归途。你最后看了一眼三生石上那万千光影，转身，大步离去。你走出三生石畔时，天边的阴影已经压得更低了，连风都带着一丝不祥的腥涩。可你的脚步却很稳——你心里清楚，此去要面对的是什么。你走了不知多远，忽然听见身后传来一声呼唤：秦弈！你脚步一顿，回头——三生石畔的灰雾里，不知何时多了一道道身影：李青君提着银枪立在雾边，枪尖还沾着露水；明河蓝白衣袂，静静站在一株彼岸花旁；夜翎扑棱着翅膀，从雾里探出脑袋，眼睛亮晶晶的；程程化作白狐蹲在石上，尾巴轻轻晃着；孟轻影倚着另一块石头，指尖飞梭转得飞快；羽裳与安安并肩站在远处，一个冷着脸，一个温温柔柔地笑着；居云岫抱着琴，清茶在旁捧着茶壶；李无仙一身戎装，腰间的剑泛着寒光。你看着她们，一时怔住。李青君先开口，声音平静却笃定：你要去拦那道天外之影，怎么也不说一声？你张了张嘴，想说怕你们担心，话到嘴边又咽了回去——她们既然都来了，说这些就矫情了。夜翎扑到你肩头，翅膀蹭了蹭你的脸：哥哥，我们跟你一起去！你看着那一张张熟悉的脸，忽然觉得，这一路走来所有的颠沛流离，都在这一刻有了意义。你深吸一口气，笑道：好。那便一起——去会会那道天外之影。三生石畔，风起。你的身后，站着整个你拼了命也要守护的人间。',opts:[
  {k:'A',tag:'北冥',c:'#7FA8C9',tx:'回北冥与羽裳安安共镇魔渊，稳固此界根基',hint:'影响：成就「北冥归心 · 双王镇渊」',run:()=>{log('红尘卷·六卷','三生石前你看了很久，最终转身：“此界根基未稳，谈何天外。”你回到北冥，与羽裳安安并肩站在魔渊之巅，将混沌道则的余韵镇入深渊。羽裳冷着脸把魔纹令塞进你掌心：“北冥认你这个朋友。”安安在旁边温温柔柔补了一句：“她是说，欢迎常来。”你握着那枚令牌，忽然觉得此界的灯火，比三生石上的光影更暖。');rd6Ending('北冥归心');}},
  {k:'B',tag:'轮回',c:'#8B6FA8',tx:'随孟轻影坐镇三途，了结轮回因果',hint:'影响：成就「万象归流 · 轮回之主」',need:()=>(rdInit().love.孟轻影||0)>=2||S.karma>=5,needMsg:'你与孟轻影的因果还浅，或业力尚轻——先助她走完三途那场仗。',run:()=>{log('红尘卷·六卷','你把三生石上的光影一一看完，忽然对孟轻影说：“走，我陪你把轮回盘最后的因果了了。”她怔了怔，随即笑得张扬：“行啊——本座正愁没人替我看轮回盘的炉火。”三途深处，轮回盘重光，万魂归位。她站在忘川之畔回头看你，难得认真：“若有来世……我还想跟你做这一世的冤家。”');rd6Ending('万象归流');}},
  {k:'C',tag:'天枢',c:'#A98FD9',tx:'留在天枢，与众道友共参门中大道',hint:'影响：成就「天枢共道 · 门开一线」',need:()=>!!S.flags.天外之敌||S.six.悟性>=10,needMsg:'尚未得瑶光之盟或悟性不足——先在紫微殿多参悟些时日。',run:()=>{log('红尘卷·六卷','你没有急于去往任何一方，而是回到紫微殿，在门之碎片前坐了下来。曦月与鹤悼也没有催你——他们知道，有些人参的是道，有些人参的是自己的心。四十九日后你睁眼，眸中仿佛有古门洞开。曦月轻声道：“看见了？”你点头：“看见了门后的路——那条路，通向来处，也通向去处。”');rd6Ending('天枢共道');}},
  {k:'D',tag:'开天',c:'#C9A45C',tx:'踏上开天路，直溯源初，问那天外之影',hint:'影响：成就「开天问道 · 三生石前」→ 通往终卷',run:()=>{log('红尘卷·六卷','你最后看了一眼三生石上那万千光影，转身踏入开天路。身后传来凤皇亘古的叹息，和故人们远远的呼唤。你没有回头——因为你知道，此去若成，这方天地与所有你在乎的人，才能安然无恙。开天路的尽头，是混沌；混沌的尽头，是一扇门。你推门而入。');rd6Ending('开天问道');}},

 '人间太阿':{title:'人间太阿 · 人皇之师',review:'你辅佐李无仙破掉巫神宗的饕餮祭坛之局，人间自此不再畏仙神。太阿剑出，天下归心。',text:'红门崩塌那一瞬，李无仙的剑光与你的剑光同时落下。她收剑时回头看你，眉眼间依稀是当年那个追着银枪跑的南离小姑娘：“先生，人间这一局——我们赢了。”你望着她身后的千军万马，忽然想起很多年前仙迹山下那个红衣少年，和那句“天命在孤，何惧仙神”。你笑了笑：“赢了。往后人间的事，人间自己说了算。”',give:()=>{S.reputation+=40;S.merit+=10;S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='人间太阿'))S.fashu.push({n:'人间太阿',elem:'金',power:52,mp:24,系:'剑'});}},
 '棒灵成仙':{title:'棒灵成仙 · 白玉归身',review:'冥华玉晶与血凛幽髓在幽冥最深处寻得，又经混沌之火祭炼——那道陪你半生的白玉小人，终于有了自己的身躯。',text:'混沌火燃尽最后一缕杂质时，白玉小人在火光中缓缓凝实——眉眼、身量、温度，都真实起来。她睁开眼，第一件事就是一巴掌拍在你脑门上：“让你别来，非来！”你却看着她笑：“手劲儿不错，看来是真身。”她怔了怔，别过脸去，声音闷闷的：“……谢谢。”两个字，重过你听过的一切道法。',give:()=>{S.six.神识=clamp(S.six.神识+4,1,20);S.six.道心=clamp(S.six.道心+2,1,20);S.hpMax+=80;S.hp+=80;S.gongfa=S.gongfa||[];if(!S.gongfa.find(g=>g.n==='混元金身'))S.gongfa.push({n:'混元金身',grade:'仙阶'});}},
 '南离新火':{title:'南离新火 · 凡尘有仙',review:'你在离火的废墟上重建了一座新城。李青君卸下摄政王的担子那日，城中燃起万盏灯火——那是南离的新火。',text:'新城落成那日，李青君亲手把虎符挂上城门当门环。夜里她靠在你肩头看万家灯火，忽然轻声说：“秦弈，谢谢你回来。”你揉了揉她的发顶：“当年说好替你扛一半担子，忘了？”她笑了，眼角却亮晶晶的。远处，明河的身影在月色里一闪而逝，只留下一缕若有若无的道香——像是对这段仙凡缘分，最后的祝福。',give:()=>{S.six.道心=clamp(S.six.道心+2,1,20);S.wudao['体道']=(S.wudao['体道']||0)+3;S.daoban=S.daoban||[];if(!S.daoban.includes('李青君'))S.daoban.push('李青君');}},
 '道魔并肩':{title:'道魔并肩 · 问道苍穹',review:'你成了两界都认的那个“怪人”：仙宫监察使、妖城之友、幽冥过客、魔女旧识。道与魔的界线在你身上，早已模糊。',text:'又是月圆。孟轻影蹲在仙宫墙头等你，指尖飞梭转得飞快：“喂，听说你把幽冥搅了个天翻地覆？”你笑道：“顺手。”她跳下来与你并肩而行，难得正色：“秦弈，你若真想看看这天上天下到底有多少规矩是错的——算我一个。”远处，居云岫的琴音、明河的道钟、程程的妖铃，在月光下遥相呼应。你忽然觉得，这条问道的路，从来不是一个人走的。',give:()=>{S.reputation+=30;S.six.悟性=clamp(S.six.悟性+3,1,20);S.six.仙缘=clamp(S.six.仙缘+2,1,20);}},
 '云游幽冥':{title:'云游幽冥 · 过客有痕',review:'你没有在幽冥或人间久留。你在两界之间来来往往，像一叶不系之舟。',text:'幽冥的鬼差认得你，人间说书人传你，妖城的狐狸偶尔叼来一坛酒。你没有固定的家，可走到哪儿，都有人记得你曾帮过他们。某日你在幽冥忘川边钓鱼，钓上一只旧木屐——你翻过来一看，底上刻着一行小字：此身虽在红尘外，此心已系红尘中。你笑了笑，把木屐放回河里。',give:()=>{S.six.道心=clamp(S.six.道心+2,1,20);S.merit+=5;}},
};

{t:'东海 · 蓬莱鉴宝',meta:'强制节点：东海蓬莱，鉴宝大会风云际会',scene:'为寻流苏复生的先天之材，你东行数万里，一路踏浪而来，终于来到传说中的东海蓬莱。此地坊市繁华，散修云集，岛上仙雾缭绕，白玉般的台阶从海面一直铺到山巅，正逢三年一度的鉴宝大会——各家散修拿出压箱底的宝物请高人掌眼，有鱼目混珠的赝品，也有蒙尘多年的明珠，更有为一件真宝争得面红耳赤的场面。你混在人群中走了一上午，看够了热闹，也记住了几件真宝贝的买家。临近午后，你在一处偏僻的地摊前驻足——摊主是名瞎了一只眼的老散修，满脸风霜，面前只摆着两样东西：一枚血色玉佩，与一枚灰扑扑、不起眼的珠子。老散修叹道：都是祖上传的，说是宝贝，可没人认得。实不相瞒，老朽跑了大半辈子腿，也没寻着个识货的主。你俯身细看那枚血玉——内里隐隐有一道幽光流转，如活物般游走不定，竟与你在裂谷地脉深处见过的符文同源，带着一丝说不清道不明的阴冷。你正要开口，识海深处，那道陪你走过千山万水的白玉小人忽然出声，声音收紧，罕见的凝重：这血玉……有冥界的气息。你心头一跳：冥界？流苏顿了顿，声音低下去：我复生所需的冥华玉晶，多半便与幽冥脱不开干系。这血玉若真是从幽冥流出的，顺着它，或许能找到路。摊主听见你低语，浑浊的眼珠忽然亮了，声音也压低了几分：道友……认得此物？他那只独眼直勾勾盯着你，像溺水的人抓住了最后一根稻草：老朽年轻时在东海深处吃过几年饭，知道些旁人不知道的门道——道友若是识货，价钱好商量。你蹲在摊前，指尖轻轻摩挲着那枚温凉的血玉，心里飞快地盘算着：这趟东海，果然来对了。你付了灵石，那老散修把血玉与珠子用一块旧布包好，递给你时，忽然压低声音：这玉是老朽年轻时，从东海深处一座沉墓里带出来的——那墓里，有活人进出的痕迹。老朽当年吓得魂飞魄散，只捞了这两样东西就跑了，回来大病一场，瞎了一只眼。他顿了顿，声音更轻：道友若真要追这玉的来路，切记——墓里那扇门，别在满月之夜开。你握着温凉的血玉，心头微动，又低头看那枚灰扑扑的珠子——方才流苏只说血玉有冥界气息，可这珠子，她竟一个字也没提。你捏着珠子转了转，忽然发现珠心深处有一道极细的裂纹，裂纹里似乎藏着一缕暗红的光，一闪而逝。你正要细看，识海里流苏忽然开口，声音淡淡的：那珠子……别碰。你问为什么，她沉默了片刻，才道：那东西上缠着一道旧怨，不是你现在该沾的。你心头一凛，把珠子单独收进一只玉匣，又贴身放好。摊主收了摊，颤巍巍地站起来，朝你拱了拱手：道友保重。你望着他佝偻的背影消失在人群里，忽然觉得，这趟东海之行，像是一脚踏进了一盘埋了不知多少年的旧局。当夜，你宿在蓬莱岛上一间临海的客栈。窗外潮声阵阵，月光洒在海面上，碎成万点银鳞。你把那枚血玉取出，对着灯火细细端详——玉身温凉，内里那道幽光流转不定，像困着一尾活的鱼。你试着以灵力探入，却被一层无形的壁障轻轻弹开。识海里流苏忽然开口：别硬来。这玉上附着一道极古老的封印，若不得其法强行破开，只怕会惊动布封印的人。你问：那要怎么解？流苏沉默片刻：幽冥的东西，多半要以幽冥之法解。你这一路往东，若真能找到那座沉墓，或许能从那墓主人身上，寻到解开封印的法门。你收好血玉，吹熄灯火，躺下时却翻来覆去睡不着。窗外的潮声一浪接一浪，像有什么东西在远处轻轻呼唤。你忽然想起白天那老散修的话——那墓里，有活人进出的痕迹。活人。什么样的活人，会往幽冥深处的沉墓里跑？你望着天花板，把那句话在心里翻来覆去嚼了几遍，越想越觉得，那墓里藏着的东西，恐怕比一枚血玉要深得多。',opts:[
  {k:'A',tag:'鉴宝',c:'#A98FD9',tx:'花200灵石收下血玉与珠子',hint:'影响：得幽冥血玉（指向幽冥通道）',run:()=>{if(S.lingShi<200){log('红尘卷·五卷','囊中羞涩。老散修倒也不恼，只把血玉收了回去：“有缘再会。”');return;}S.lingShi-=200;S.rd.f.血玉=true;log('红尘卷·五卷','你付了灵石，那老散修忽然低声道：“这玉是我年轻时，从东海深处一座沉墓里带出来的——那墓里，有活人进出的痕迹。”你握着温凉的血玉，与流苏对视一眼：幽冥的路，有眉目了。');}},
  {k:'B',tag:'斗宝',c:'#C4675C',tx:'登台亮出你的珍藏，以宝换宝',hint:'影响：声望+8；换得深海线索',run:()=>{S.reputation+=8;log('红尘卷·五卷','你取出一枚在裂谷所得的火鳞上台掌眼，引来一阵惊叹。鉴宝台上那位高人端详半晌，递回火鳞时低声道：“小友这火鳞，与东海水底一处古墓的禁制同源——若想探那墓，这东西是钥匙。”你拱手称谢，心下已有了计较。');}},
  {k:'C',tag:'观局',c:'#6FA698',tx:'只冷眼旁观，摸清此地深浅',hint:'影响：悟性+1；识破几桩骗局',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·五卷','你在鉴宝大会站了一下午，看穿了至少五桩“祖传宝贝”的骗局，也记住了几件真宝贝的买家。临散场时，一个其貌不扬的老者与你擦肩而过，低声道：“小友好眼力。东海水底有桩大机缘，缺个明白人——有兴趣，三日后渡口见。”');}},

{t:'深海墓室 · 彼岸花开',meta:'强制节点：东海沉墓，黑棺与幽冥之门',scene:'三日后，你依约来到东海深处那座沉墓。墓室极大，穹顶足有十丈高，棺椁森然排列成阵，幽幽的磷火在角落明灭，映得满室鬼影幢幢。可正中的主棺却空空如也——棺盖半开，仿佛刚有人来过，棺沿上还残留着一丝极淡的、不属于凡尘的气息。你正要上前查看，一道身影忽然从棺后转出——那是一名白衣道人，负手而立，气质沉静如渊，仿佛早已在此等候多时。他见了你，也不惊讶，只微微一笑：贫道玉真人。这口黑棺与门中旧事有关，今日特来取走。他袖袍一拂，也不见如何作势，那口足有丈许长的黑棺竟凭空缩小，化作巴掌大小，落入他掌中。棺底露出的，是一个深不见底的幽黑洞口——阴风自洞中涌出，呜呜咽咽，像无数亡魂在低声絮语。你探头望去，隐约可见一丛丛彼岸花在洞壁两侧怒放，殷红如血，花叶相离，在幽暗中妖异地亮着。玉真人将黑棺收入袖中，看着你，目光意味深长：幽冥之门，每甲子只开三月。小友若有所寻，当趁此时。他顿了顿，又补了一句，声音忽然放轻：贫道观你身上，有故人之气——若见了那位门中旧客，替贫道带句话：欠她的，贫道记着。你心头微动，正想追问那故人是谁，他却已转身，衣袂飘飘，向墓室外走去。你望着他的背影消失在幽暗中，又低头看了看脚下那个深不见底的洞口。阴风灌上来，带着彼岸花的腥甜与忘川水的气息。你识海里那道白玉小人难得地安静着——你几乎能感觉到她也在望着那洞口出神。半晌，你听见她极轻地、几不可闻地说了一句：……他说的故人，是我。你心头一震。你站在洞口边，沉默了许久，才问：他说的故人……是你？流苏没有立刻答话。风从洞口涌上来，带着幽冥深处亘古的寒意，吹得你衣袍猎猎。许久，她才开口，声音比平日低了几分：我当年……确实与玉真人有过一段渊源。他是太一宗的人，算起来，与我那旧主是同门。你皱了皱眉：他欠你什么？流苏轻声道：欠我一句道歉。他说记着，那就是还记着。你没有再追问——流苏不愿说的事，你从来不逼她。你只是又看了一眼脚下那个深不见底的幽黑洞口，彼岸花在洞壁两侧怒放，殷红如血，仿佛在无声地招手。你深吸一口气：那便下去吧。幽冥之门六十年一开，错过这一遭，不知还要等多久。流苏嗯了一声，声音里有一丝几不可察的柔软：……多谢你。你笑了笑：谢什么——你陪我蹚了那么多浑水，这回换我陪你走一趟黄泉路，应该的。你纵身一跃，阴风灌满衣袍，无数彼岸花影在眼前飞掠而过，像一场殷红的雨。坠落的失重感里，你听见流苏极轻地说了一句什么，被风声吞了大半——你只隐约听清两个字：傻子。你嘴角微微翘起。坠落不知持续了多久，你终于踏上一片灰暗无边的土地。幽冥界的天穹是灰蓝色的幽光，没有日月，也没有星辰，像一块永远凝固的旧冰。你环顾四周，彼岸花在脚下蔓延开去，红得触目惊心。你深吸一口气——空气里没有凡间的草木清香，只有一种淡淡的、说不上来的阴冷，像深秋的霜气。你试着运转灵力，发现并无阻滞，这才稍稍安心。流苏的声音在识海响起，带着一丝谨慎：幽冥界不比人间，此地规矩与凡俗大不相同——切记，莫要随意应承鬼魂的请求，莫要回头看叫你名字的声音，莫要在三更之后还走在无人的路上。你记下她的叮嘱，又问：那冥华玉晶，到底在何处？流苏顿了顿：传说在幽冥最深处的幽冥渊。可那地方……她没说完，但你听出她话里的凝重。你握了握拳：那便去幽冥渊。她嗯了一声，没有再劝。你选定方向，向着灰雾深处走去，彼岸花在你脚下无声地分开又合拢，像在为你让路。',opts:[
  {k:'A',tag:'入冥',c:'#C4675C',tx:'趁门开，纵身跃入幽冥',hint:'影响：开启幽冥界主线',run:()=>{log('红尘卷·五卷','你朝玉真人一拱手，纵身跃入那幽黑洞口。坠落的刹那，无数彼岸花影在眼前飞掠而过，阴风灌满衣袍。识海里流苏轻声道：“……他说的故人，是我。”你心头一震，却已来不及细问——脚下已踏上一片灰暗无边的土地。幽冥界，到了。');}},
  {k:'B',tag:'问路',c:'#7FA8C9',tx:'先向玉真人请教幽冥地势与忌讳',hint:'影响：得幽冥志略（少走弯路）',run:()=>{log('红尘卷·五卷','玉真人不吝赐教，将幽冥界的几大势力、通行规矩、瘴气禁地一一说与你听，末了递来一枚玉简：“此间风物志，聊作薄礼。”你收下玉简，躬身道谢。他摆摆手：“去吧。幽冥事毕，若有机缘，天上再见。”');}},
  {k:'C',tag:'采花',c:'#A98FD9',tx:'先采几株彼岸花入药，再行入冥',hint:'影响：得彼岸花（丹材/悟道）',run:()=>{giveItem('彼岸花',1);S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·五卷','彼岸花生于阴阳交界，花叶永不相见，其性最通幽冥。你小心采了三株收好，流苏在识海点评：“此花炼入悟道丹，可窥前世因果。倒是好东西。”你把花收进囊中，纵身跃入幽洞。');}},
]},
{t:'初入幽冥 · 忘川界桥',meta:'强制节点：幽冥界群像，冥火凤凰之影',scene:'幽冥界没有日月，天穹永远蒙着一层灰蓝的幽光，像一块永远化不开的旧冰。你沿着忘川前行，两岸彼岸花开成无边血海，风一吹，花浪层层叠叠，像无声的潮汐。一条白骨铺就的界桥横跨忘川，桥身由无数巨大的骨骸搭成，森白如雪，桥头立着一块石碑，碑上只有六个字：过桥者，忘前尘。桥边泊着一叶扁舟，摆渡的鬼差是个圆脸老者，披着蓑衣，叼着烟杆，见你是个活人，啧啧称奇，绕着你看了一圈：活人入幽冥，百年难得一遇。稀奇，真稀奇。你拱手问路：老丈，可知冥华玉晶在何处寻得？鬼差老者吧嗒吧嗒抽了两口烟，眯着眼，指了指远方灰雾深处：要找冥华玉晶？那得去冥府最深处的幽冥渊——不过那儿守着一位凶神，方圆百里，连鬼都绕道走。你正要细问，天穹忽然亮起一片暗红的火光——一头通体燃烧着冥火的凤凰自幽冥渊方向展翅掠过，羽翼所过之处，万鬼俯首，连忘川的水面都泛起一圈圈涟漪。那凤凰一声清鸣，声音穿云裂石，带着亘古的苍凉。鬼差老者缩了缩脖子，烟杆都差点掉进水里，压低声音道：瞧，那就是冥渊那位养的看门鸟……惹不得，惹不得。他顿了顿，又补了一句，像是自言自语：说来也怪，那凤凰从前性子温顺得很，这些年却愈发暴躁了——听说是那位凶神……在闹什么脾气。你望着冥火凤凰消失在灰雾深处的身影，心头那种说不清的预感，越来越重了。你谢过鬼差老者，沿着忘川继续前行。越走，两岸的彼岸花开得越盛，密密匝匝，像一片燃烧的血海。沿途你见尽幽冥百态：有鬼差押着新鬼过河，新鬼哭哭啼啼，一步三回头，望着人间方向；有老鬼蹲在岸边钓前尘，钓竿垂进忘川水里，半晌提起来，钩上挂着一缕银白的丝——那是记忆凝成的丝，老鬼便小心翼翼地把那缕丝收进怀里，像收着什么宝贝；还有一头驴脸的鬼差，叼着根草茎，冲你咧嘴傻笑，也不知是善意还是别的什么。你走了一程，忽然听见岸边传来一阵哭声——那哭声极细，像小兽的呜咽。你循声望去，看见一个七八岁模样的新鬼蹲在岸边，抱着膝盖，望着河对岸的迷雾，哭得一抽一抽的。你走过去，蹲下来问他：小娃娃，哭什么？他抽噎道：我娘……我娘还在河那边……她说让我先走，她随后就来……可她一直没来……你心里一软，又不知该如何安慰一个亡魂，只在他身边坐下，陪他望着那片迷雾。过了许久，那新鬼忽然不哭了，转头看你，认真道：大哥哥，你是活人吧？你点头。他咧嘴笑了笑：那你能不能告诉我娘，让她别来找我了……就说，就说我在这边过得挺好的。你望着他那张故作懂事的小脸，心头像被什么东西堵住，半晌才点了点头：好。我替你带话。你起身继续赶路时，那新鬼忽然又叫住你：大哥哥！你回头。他站在岸边，朝你用力挥了挥手：你也要好好的啊！你娘要是还活着，肯定也舍不得你走这么远的路！你被他那句没头没脑的话说得一愣，随即笑了笑，也朝他挥了挥手。走出老远，你回头，还能看见那个小小的身影蹲在岸边，像一粒灰暗世界里的小黑点。你忽然想起人间那些战乱中流离失所的孩童——他们中许多人，大约也是这样，在某个黄昏与亲人走散，然后就再也没有等到重逢的那一天。你心里那点东西堵得更实了。你加快脚步，向着幽冥渊的方向走去。忘川在身侧静静流淌，水面倒映着灰蓝的天穹，偶尔有半透明的鬼影在水面上一闪而过，像被水流冲散的旧梦。你走了一程，忽然听见身后传来一声极轻的呼唤——叫的是你的名字。你脚步一顿，想起流苏的叮嘱，没有回头，继续往前走。那声音又响了一次，这一次带上了几分急切。你仍旧没有回头，只是加快了脚步。走出很远，那声音终于消失了。你长长吐出一口气，额上却已沁出细汗——幽冥界的第一课，你已经学会了。',opts:[
  {k:'A',tag:'渡桥',c:'#A98FD9',tx:'以道心护住记忆，过忘川界桥',hint:'影响：道心+1；保留前尘',run:()=>{S.six.道心=clamp(S.six.道心+1,1,20);log('红尘卷·五卷','你踏上白骨桥，忘川水声在耳畔轰然作响，无数前尘记忆翻涌着要离你而去。你紧守灵台，一句“我有未竟之事”将那些记忆尽数拽回。下桥时，鬼差老者望着你，意味深长：“能带着记忆过桥的活人，老夫摆渡三千年，只见过两三个。”');}},
  {k:'B',tag:'绕行',c:'#7FA8C9',tx:'不入忘川，沿河岸另寻他路',hint:'影响：安全；路更长',run:()=>{log('红尘卷·五卷','你避开了白骨桥，沿忘川河岸绕行。这一路你见尽幽冥百态：有鬼差押着新鬼过河，有老鬼蹲在岸边钓“前尘”，还有一头驴脸鬼差冲你咧嘴傻笑——你说不清那是好意还是坏笑。绕了七日，终于望见幽冥渊的黑影。');}},
  {k:'C',tag:'问鬼',c:'#C9A45C',tx:'向摆渡鬼差买一份冥渊情报',hint:'影响：花100灵石，得守渊凶神虚实',run:()=>{if(S.lingShi<100){log('红尘卷·五卷','鬼差老者摆摆手：“没钱免谈。”你只好悻悻而去。');return;}S.lingShi-=100;S.rd.f.冥渊情报=true;log('红尘卷·五卷','鬼差老者收了灵石，压低声音：“冥渊那位凶神唤作‘狱主’，本是幽冥初开时的第一缕怨念所化——他不好斗，只守着渊底一物。你若真想下渊，切记：别碰他的灯。”你默默记下。');}},
]},
{t:'幽冥群雄 · 三足鼎立',meta:'强制节点：幽冥三大势力，各怀机锋',scene:'幽冥渊外围，是幽冥界最繁华的鬼市。此地鬼影幢幢，却出奇的热闹——有鬼差换了便装来逛，有修士蒙着面买阴材，有老鬼蹲在墙角卖前世的记忆，一盏盏装在琉璃瓶里，幽幽地发着光。你混迹其中，很快摸清此间格局——幽冥界三分天下：冥府正统的判官府，掌生死簿，管轮回，最是家大业大；专收凶魂厉鬼的罗刹岭，凶名在外，岭中鬼众个个手上沾着血；以及渊主狱主镇守的幽冥渊，深不可测，超然物外，无人敢犯。判官府与罗刹岭斗了千年，恩怨说不清道不明，唯独幽冥渊像一根扎在两方之间的钉子，谁也不敢去拔。鬼市茶楼里，一个说书鬼正唾沫横飞地讲着狱主与冥火凤凰的旧事——说那凤凰本是狱主少年时救下的一缕残魂，养了不知多少万年，养出了灵智，养出了情分；又说狱主性子孤僻，唯独对那凤凰有求必应。茶客们听得入神，连连追问后来呢、后来呢。你邻桌坐着一个红衣女鬼，面纱半掩，看不清面容，只露出一双幽深的眼，指尖夹着一枚铜钱转得飞快。她忽然开口，声音沙哑，像被烟熏过：活人？来冥渊寻东西的？你心头一凛，转头看她。她轻轻一笑，也不解释自己如何看破你的身份：别紧张——我是罗刹岭的。你若要去幽冥渊，我劝你死了这条心。那渊主……连我们岭主都要绕道。她说着，指尖铜钱一顿，忽然压低声音：不过嘛——你要是真有什么非要下渊不可的理由，我倒可以给你指条明路。你看着她那双在面纱后若隐若现的眼睛，总觉得那双眼睛背后，藏着什么你暂时看不透的东西。那红衣女鬼见你不答话，也不追问，只把指尖那枚铜钱往桌上一搁，站起身来：走吧，姐姐带你去个能说话的地方。她领着你穿过鬼市，拐进一条偏僻的巷子，尽头是一间挂着半旧灯笼的小酒肆。酒肆里没什么客人，柜台后趴着一个打盹的老板，也是鬼。女鬼熟门熟路地要了两碗幽冥酿，推给你一碗：喝吧，壮胆的。你端起碗，酒液浑浊，泛着幽蓝的光，入口却意外地醇厚，像陈年的黄酒里兑了一丝忘川水的凉。她抿了一口酒，才缓缓开口：我叫红姑，罗刹岭的三当家。你心头微动——罗刹岭三当家，这身份可不低。她像是看穿你的心思，笑了笑：别紧张，我今儿不是来跟你打架的。她放下酒碗，指尖在桌上画了个圈：幽冥渊那把钥匙，不在渊主手里——这话不是我骗你。判官府那本生死簿的夹页里，确实藏着一枚古钥匙，是当年幽冥初开时留下的，能开渊底那扇门。可判官府把那本生死簿看得比命还重，别说你一个活人，就是罗刹岭岭主亲去，也未必能碰到那簿子一页。她说着，忽然意味深长地看你：不过嘛——你既然是活人，倒有一条路可以试试。判官府的老判官，最是铁面无私，可他也最重因果。你若能替他办成一桩他办不了的案子，借那生死簿翻一页，未必没有可能。你放下酒碗，看着她：什么案子？红姑却没有立刻答话，只把玩着那枚铜钱，眼底掠过一丝复杂的光。半晌，红姑才把那枚铜钱往桌上一按，声音压低了几分：判官府最近在查一桩案子——幽冥界一位德高望重的老鬼医，被人害了，魂飞魄散，连投胎的机会都没留。老判官查了三个月，毫无头绪。她抬眼看你：你若能查出真凶，替那位老鬼医讨回公道——老判官欠你一个人情，借生死簿翻一页，未必没有商量。你皱了皱眉：魂飞魄散，连残魂都不剩，这案子要怎么查？红姑笑了笑，笑意却不及眼底：这就是蹊跷的地方。魂飞魄散，本该一点痕迹都不留——可那位老鬼医生前有个习惯，每医好一个病人，便在那人魂魄深处留一道极淡的药香。他说，那是他给病人留的记号，怕有朝一日故人重逢，认不出来。她说着，指尖在桌上轻轻叩了两下：你若有本事顺着那药香，找到最后一个见过他的人——真凶，大约也就浮出水面了。你端着酒碗，慢慢喝了一口，心里已把这案子翻来覆去过了几遍。幽冥界的水，果然比人间还要浑。可越浑的水，越容易藏大鱼。你放下酒碗，看着红姑：这案子，我接了。红姑眼底掠过一丝光，举碗与你碰了一下：痛快。那我便等着，看你这活人，如何在幽冥翻江倒海。',opts:[
  {k:'A',tag:'结缘',c:'#8B6FA8',tx:'与红衣女鬼攀谈，套问罗刹岭底细',hint:'影响：得罗刹岭态度；孟轻影式故人？',run:()=>{log('红尘卷·五卷','你与那红衣女鬼聊了半宿，从她话里套出罗刹岭与判官府积怨的旧事。临别她忽然压低声音：“看你这人还算顺眼——送你一句：幽冥渊的钥匙，不在渊主手里，在判官府那本生死簿的夹页里。”说罢化作一缕红烟散去。你望着她消失的方向，总觉得那身影有几分眼熟。');}},
  {k:'B',tag:'直入',c:'#C4675C',tx:'不绕弯子，直接闯幽冥渊外关',hint:'影响：入战（渊外凶魂·强）',run:()=>{log('红尘卷·五卷','你向来不是绕弯子的人。幽冥渊外关，两头守关的凶魂拦住去路，嘶声道：“渊主有令，活人止步！”你拔剑：“那就麻烦通传一声——就说有个活人，来取渊底一物。”凶魂对视一眼，齐齐扑来！');startCombat(rdEnemy('渊外凶魂王',2.1),'rd5Fight');}},
  {k:'C',tag:'营生',c:'#7FA8C9',tx:'在鬼市摆摊炼丹，赚幽冥功绩',hint:'影响：丹道+1；得鬼市人脉',run:()=>{S.wudao['丹道']=(S.wudao['丹道']||0)+1;log('红尘卷·五卷','你在鬼市支了个摊子，专炼“安魂丹”——活人炼的丹在幽冥是稀罕物，一时门庭若市。七日下来，你赚了三百灵石与一屋子鬼送的“不值钱”人情。收摊那日，连守关的凶魂都冲你点头：“先生下回来，俺给你留门。”');}},
]},
{t:'幽冥渊 · 狱主之灯',meta:'强制节点：幽冥渊最深处，狱主与冥华玉晶',scene:'幽冥渊深不见底，越往深处，阴风越厉，到最后竟如刀割一般，刮得人魂魄都在发颤。你一路下行，不知走了多久，脚下的岩壁从灰黑渐渐变成深紫，又变成纯粹的漆黑——那是被万年阴气浸透的颜色。渊底是一片死寂的黑色虚空，没有光，没有风，没有声音，仿佛天地初开前的混沌。虚空正中，悬着一盏幽幽的铜灯——灯焰不摇，如亘古长明，幽幽的蓝光洒落，照亮了方圆三丈。灯下盘坐着一道身影，通体漆黑，仿佛与虚空融为一体，唯有双眼是两点幽蓝，像两簇不灭的鬼火。他没有起身，声音却响彻渊底，带着亘古的疲惫与漠然：活人。三千年了，敢走到灯前的活人，你是第一个。你拱手，声音在死寂的渊底显得格外清晰：晚辈为冥华玉晶而来——敢问前辈，可否割爱？狱主沉默了很久，久到你几乎以为他不会再开口。然后他缓缓道：你可知道，这盏灯下压着什么？你摇头。他抬手，指尖轻点，灯焰忽然大亮——灯下竟镇压着一道怨气冲天的残魂，嘶吼着要挣出灯焰，那怨气浓得几乎凝成实质，映得整片虚空都扭曲起来。狱主的声音依旧平静，却带着一丝说不出的倦意：本座是幽冥初开时第一缕怨念所化，活了不知多少万年，早已倦了。这玉晶镇在渊底，本座守着它，也守着自己最后一点清明。他忽然抬眼，两点幽蓝直直望向你：你若能替我渡化这道残魂，冥华玉晶——送你。你看着灯下那道挣扎嘶吼的残魂，又看看狱主那双平静得近乎死寂的眼睛，忽然觉得，这位幽冥初开时的第一缕怨念，守着这盏灯守了不知多少万年，守的或许不是玉晶，而是某个连他自己都说不清的执念。你盘坐于灯前，没有急着运功渡化，而是先凝神细看那道残魂——它嘶吼着，挣扎着，怨气冲天，可你看着看着，却觉得那怨气底下，似乎压着什么别的东西。你试着以道心靠近，那残魂忽然安静了一瞬，随即爆发出更剧烈的挣扎，像是被什么刺痛了。狱主在灯下静静看着，忽然开口：它生前……是个守墓人。你一愣。狱主的声音依旧平静，像在说一件极远的事：幽冥初开时，这渊底镇着一位古神的遗蜕。那守墓人奉命看守，一守便是三万年。后来……天上有人来，要取那遗蜕炼器，守墓人拼死相抗，被打散魂魄，只余这一缕怨念。他顿了顿：他怨的，不是那个来取遗蜕的人。你问：那他怨什么？狱主沉默了很久，才道：他怨自己——怨自己守了三万年，到最后，还是没能守住。你看着灯下那道残魂，忽然明白了它为何挣扎得那般剧烈——它不是在反抗，它是在恨，恨自己到死都没能完成那份守了整整三万年的职责。你盘坐良久，没有用功德去渡它，而是缓缓开口，声音在这死寂的渊底显得格外清晰：你守了三万年，已经够了。那遗蜕……早就被人取走了，可你守的那份心，没有人能夺走。灯下那道残魂猛地一颤，嘶吼声渐渐低了下去，像一只终于被抚平的野兽。狱主望着你，眼底那两点幽蓝，第一次有了一丝极淡的波动。狱主静默了不知多久，那道亘古不动的身影才终于又有了声息，声音比先前柔和了几分——虽然是极细微的变化，可在死寂的渊底，连一丝波澜都清晰可辨：三千年了。本座看着无数人来，无数人走，有人求玉晶，有人求长生，有人求往生。可从来没有人，会对灯下这道残魂说一句话。他说着，忽然抬手，灯焰微微晃动——那道残魂已经不再挣扎，蜷成一线幽光，伏在灯下，像一只终于睡着的困兽。狱主看着它，声音更轻：它是本座亲手收的。三万年前，本座路过那座古墓，见它守着空棺流泪，便把它带了回来。本座本想渡它，可渡了整整三万年，也没能化开它那口怨气。他顿了顿，抬眼望你：你倒好，一句话，就让它放下了。你说：它守了三万年，等的或许不是渡化，而是一句有人懂它。狱主沉默良久，忽然低低笑了一声——那笑声在渊底回荡，带着亘古的苍凉与一丝释然：有趣。本座活了这么久，头一回觉得，有人说话，中听。他抬手，渊底深处缓缓升起一点幽蓝的光——那是一枚流转着幽蓝光华的水晶，巴掌大小，晶莹剔透，像凝固的月光。冥华玉晶。狱主将玉晶轻轻推向你：拿去。本座守了它这么多年，也该让它见见天日了。你伸手接过玉晶，入手温凉，一股精纯到极点的阴属灵力顺着掌心涌入经脉，连识海都微微一清。你郑重拱手：多谢前辈。狱主没有答话，只是重新阖上眼，仿佛又变回那座亘古不变的雕像。可你转身离去时，听见他在身后极轻地说了一句：若有一日，你路过人间……替本座看看，忘川的彼岸花，今年开得可好。你脚步一顿，没有回头，却郑重地应了一声：好。',opts:[
  {k:'A',tag:'渡魂',c:'#6FA698',tx:'以道心与功德，渡化灯下残魂',hint:'影响：功德+5、道心+1；狱主赠玉晶',run:()=>{S.merit+=5;S.six.道心=clamp(S.six.道心+1,1,20);log('红尘卷·五卷','你盘坐于灯前，将毕生功德化作温润的道光渡向那残魂。残魂嘶吼挣扎了七日七夜，终于渐渐安静——它蜷成一线幽光，向你微微一拜，消散于虚空中。狱主沉默良久，抬手，渊底升起一枚流转着幽蓝光华的水晶：“冥华玉晶，拿去。”他顿了顿：“这灯……总算可以灭了。”');}},
  {k:'B',tag:'强取',c:'#C4675C',tx:'不渡魂，直接与狱主做过一场',hint:'影响：入战（狱主·极凶）；险胜夺晶',run:()=>{log('红尘卷·五卷','你拔剑而立：“前辈，得罪了。”狱主不怒反笑：“三千年头一遭有人跟本座动手，有趣。”他长身而起，渊底阴风化作万千鬼影——幽冥初开的第一缕怨念，怒矣！');startCombat(rdEnemy('幽冥狱主',2.5),'rd5Fight');}},
  {k:'C',tag:'交易',c:'#A98FD9',tx:'以彼岸花与安魂丹换一缕玉晶',hint:'影响：耗彼岸花；得玉晶（量少）',run:()=>{log('红尘卷·五卷','你取出三株彼岸花与一炉安魂丹：“晚辈身无长物，唯此聊表寸心。”狱主看着彼岸花，忽然低低笑了一声：“彼岸花……本座渡了万年，倒头来还是忘不了她。”他弹指削下一缕玉晶递给你：“拿去吧。这渊里，好久没人跟本座说这么多话了。”');}},
]},
{t:'回人间 · 七年之变',meta:'强制节点：幽冥事了，归返人间已是七年后',scene:'幽冥之门将闭时，你带着冥华玉晶匆匆回返。然而人间，已是七年后。七年，对修士不过弹指一瞬，对凡尘却是沧海桑田——你踏出东海，一路北上，处处闻见烽烟。昔年繁华的官道上行人寥寥，偶尔有逃难的百姓拖家带口，脸上都是麻木的倦色。茶馆里说书人拍着醒木，声音沙哑：那大乾被妖僧祸乱了十年，如今又冒出个巫神宗，装神弄鬼，祸害苍生……听说北边凉王那儿的军队，请了仙师助阵，火球满天飞，凡人士兵哪里挡得住……你坐在角落，默然饮茶。茶是粗茶，带着陈年的涩味。你想起七年前离开时，人间虽乱，却还没乱到这般地步。忽然有人在你对面坐下——一个灰衣老道，须发皆白，气息却深沉如海，一双眼睛清亮得不像他这个年纪该有的。他看你半晌，忽然低声道：阁下身上……有幽冥气。可是刚从那边回来？你微微颔首，没有否认。老道叹道：那便难怪了——你走这七年，巫神宗与太一宗打成了世仇，两边都在搜罗能人异士，闹得民不聊生。他顿了顿，声音忽然放轻，带着一丝说不清道不明的意味：而南方，有个叫李无仙的小丫头，带着残兵败将，竟一路打出了人皇的名号。你听到那个名字，端茶的手微微一顿。李无仙。南离李氏，皇族血脉。你想起七年前离火城破那一夜，从妖潮里抱出的那个襁褓中的婴儿——她那时才多大？如今竟已能打出人皇的名号了。你放下茶盏，望向南方的天际，眼底有光一闪而过。你在那间茶馆又坐了一下午，陆陆续续打听到不少故人的消息。有人说，当年南离城破后，那位银枪女将带着残存的百姓一路南迁，在一处山谷里落了脚，开荒种地，建起一座新的镇子——镇子没有名字，可南离的旧民都叫它新离。又有人说，那位女将如今已是满头霜色，可一杆银枪依旧使得虎虎生风，镇上的后生都尊她一声婆婆，她却总说：叫什么婆婆，叫姐姐。你听着，嘴角不由浮起一丝笑意。还有人说，这些年游历天下、专除妖魔的道姑里，有一位蓝白衣袂的，剑术通神，凡她过处，妖邪辟易——只是她行踪不定，神龙见首不见尾，有人曾在北地的雪原上见过她，也有人曾在南疆的雨林里与她擦肩。你想起明河，心里默默算了算——她若还守着当年那誓言，这些年，怕是又斩了不少妖。至于妖城……传闻更是玄乎：说那位妖王统合了裂谷诸部，连天上人的使者都在她手里吃过亏，如今连天界都默认了妖城的地位；又说妖王座下有条小螣蛇，翅膀一展能遮半座城，却还总爱缠着她师父要糖吃。你听着这些或真或假的传闻，心头又酸又暖。你放下茶钱，起身走出茶馆。南方的天际，暮云四合，隐约可见一线金光从云缝里漏下来。你望着那个方向，轻声自语：李无仙……我来了。你一路南下，沿途的风物比北地更萧条——战火像一把无形的犁，把整片中原大地翻了个底朝天。你路过一个村庄，村口的老槐树被烧得只剩半截焦黑的树桩，树下却新搭了个草棚，一个老婆婆在棚下卖茶。你坐下歇脚，老婆婆颤巍巍给你倒了碗茶，忽然问：后生，你是去投那位人皇的军么？你点头。她浑浊的眼里亮了一下：好，好。我那孙儿，上月也去投军了。她说，那女娃娃看着年纪小，可待兵是真心的好——我孙儿信里说，她跟将士们吃一样的饭，睡一样的营帐，受了伤还先紧着兵卒医。你听着，低头看着碗里粗粝的茶沫，忽然觉得，李青君若知道她当年从妖潮里抱出来的那个孩子长成了这样，大约会既欣慰，又心疼。你一口气喝完那碗茶，多放了几枚铜钱，起身告辞。老婆婆在你身后喊：后生，见着那女娃娃，替老婆子问她一声好！你回头应道：一定。你继续南行，越走，路上投军的人越多——有扛着锄头的庄稼汉，有背着书箱的穷书生，有腰间别着弯刀的猎户，他们操着不同的口音，却朝着同一个方向。你混在他们中间，忽然觉得，这人间虽然千疮百孔，可只要还有这么多人愿意为它拿起刀枪，它就还没有输。',opts:[
  {k:'A',tag:'南寻',c:'#C4675C',tx:'循着“李无仙”的名号，南下寻她',hint:'影响：开启人皇线',run:()=>{log('红尘卷·五卷','“李无仙……”你念着这个名字，心头忽然一动。南离李氏，皇族血脉——青君她哥的遗孤，当年那个在城破时被你抱出重围的小娃娃。你放下茶钱，起身南下。灰衣老道在你身后喊道：“道友，巫神宗那边水深！”你头也不回：“我知道。”');}},
  {k:'B',tag:'问故',c:'#7FA8C9',tx:'先打听故人近况：李青君、明河、程程',hint:'影响：故人消息入心',run:()=>{log('红尘卷·五卷','你花了半月打听故人近况：李青君早在妖祸那年就带着南离遗民迁去了一处山谷，如今是那儿人人敬重的“枪神婆婆”；明河游历天下除妖，行踪不定；而妖城程程——听说她统合了裂谷诸部，与天上人的使者打了几场硬仗，如今连天界都默认了妖城的地位。你听完，心头又酸又暖。');}},
  {k:'C',tag:'复命',c:'#C9A45C',tx:'先回仙宫安置玉晶，再谋后计',hint:'影响：仙宫声望+5',run:()=>{S.reputation+=5;log('红尘卷·五卷','你带着冥华玉晶回到万道仙宫。居云岫正在琴棋书画山翻书，见你回来，抬眼看了好一会儿：“瘦了。幽冥的饭，果然难吃。”清茶从她袖子里探出半个脑袋：“师父说错啦——他明明晒黑了。”你笑着把玉晶交给仙宫保管，又听居云岫说起人间七年之变，眼底渐渐沉凝。');}},
]},
{t:'李无仙 · 人皇誓师',meta:'强制节点：南离皇裔李无仙已成人皇，誓师亲征',scene:'你南行千里，沿途听见越来越多关于那位人皇的传闻——有人说她是天降紫微星，有人说她行军如神，有人说她阵前一枪挑翻敌方主将，有人说她不过十四五岁。你循着传闻，终于寻到那支号称人皇的军队——营帐连绵数十里，旌旗猎猎，帅旗上绣着一个大大的李字，在风中猎猎作响。营中将士虽多带伤，却士气昂扬，见了你也不盘问，只当你是来投军的散修。高台之上，一名戎装少女正对着三军誓师。她不过十四五岁模样，却身量高挑、眉眼凌厉，战甲金光，披风猎猎，活脱脱一个少年版的李青君——眉宇间那股倔强与锋芒，简直是一个模子刻出来的。她拔剑斜指苍天，声音清越，却带着千军万马也压不住的气势：大乾乱于妖僧，已历十年，苍生疲敝！今伪凉暴虐，却有妖道装神弄鬼，顽抗天命！本王亲征，就是要告诉天下——他们没什么好怕的！天命在孤，何惧仙神！台下三军轰然应和，声震四野，连营帐上的旌旗都被声浪卷得猎猎作响。你远远望着她，恍然如见当年离火城头那个银甲身影——像，实在太像了。夜里，你潜至她帐前。帐帘未掀，里面先传出一道清冷的声音：阁下跟了我军三日——是敌是友？你心头微动，这丫头好敏锐的知觉。你揭帐而入，灯下，那少女端坐案后，一双眼在灯下亮得惊人，直直望着你，手已按在剑柄上。你缓缓揭下兜帽：故人。她怔住，盯着你的脸看了很久，眼底的神色从警惕到疑惑，再到不敢置信，最后声音竟微微发颤：……是你？当年……把我从妖潮里抱出去的那个……你看着她，忽然想起七年前那个在襁褓中哇哇大哭的婴儿，如今已长成这般英姿飒爽的模样，一时百感交集：是我。你长大了。那一夜，你们在帅帐里谈了许久。李无仙屏退左右，亲自为你斟了一盏茶，茶是粗茶，她却捧得郑重：先生，当年的事，姑姑都跟我说了。她顿了顿：姑姑说，若不是你，她活不到今天，南离也留不下那么多血脉。她说这话时，眼底有感激，却也有一种属于帝王的审视——她在看你值不值得她信。你坦然迎着她的目光：你姑姑说的，是她的版本。我的版本是——当年我也没做什么，不过是恰好在场，又恰好愿意伸手。李无仙盯着你看了许久，忽然笑了，那笑意让她眉宇间的凌厉淡了几分，露出几分少女的模样：先生说话，和姑姑说的一模一样。她说着，从怀里摸出一枚磨得温润的旧平安符，针脚粗拙：姑姑说，这是当年她缝给你的。你走了以后，她把符供在祠堂里，每年都添一炷香。你看着那枚平安符，正是当年李青君追出城外十里、系在你酒壶上的那一枚。你伸手接过，指尖触到那温润的旧布，忽然觉得，七年的时光，仿佛在这一刻被那枚平安符轻轻串了起来。你把平安符贴身收好，抬眼望着李无仙：说吧，你打算怎么打这一仗？李无仙眼底亮起两簇火：无仙早有打算——只差先生这把刀。李无仙引你到沙盘前，指尖在上面连点几处：巫神宗的主力在西凉城，可他们真正的命脉，在城东三十里那座祭坛。她抬眼看你，声音压低：无仙的人探到，那祭坛底下埋着一条灵脉，巫神宗这些年搜刮的灵材、炼制的法器，都藏在祭坛地宫里。若先生能潜入那地宫，毁掉他们的根基——她说着，指尖在沙盘上重重一划：西凉城便是一座孤城。你看着她在沙盘上划出的那一道，又看了看她眼底那两簇火，忽然笑了：你这丫头，连自己的亲征大军都敢拿来当诱饵。她扬了扬下巴，理直气壮：舍不得孩子套不着狼。先生当年在裂谷，不也是拿自己当饵，钓那条守潭的老蛟？你被她噎得一愣，随即失笑：你这都是从哪听来的？她嘿嘿一笑：姑姑说的。姑姑说先生年轻时干的疯事，三天三夜都讲不完。你望着她那张神采飞扬的脸，忽然觉得，李青君把这个孩子教得很好——她不但学会了怎么打仗，还学会了怎么笑着活下去。你伸手在沙盘上补了几道：那便依你所言。不过，地宫我进，灵脉我断——你只记住一件事：若见红门异动，即刻后撤，不许恋战。她敛了笑，郑重地朝你行了一个军礼：无仙领命。',opts:[
  {k:'A',tag:'认亲',c:'#D88FA5',tx:'告诉她你与青君、与南离的旧事',hint:'影响：李无仙好感+3；她唤你“先生”',run:()=>{rdLove('李无仙',3);log('红尘卷·五卷','你说起南离旧事：离火城的银枪、仙迹山的老虎、她姑姑李青君当年追出城十里送你酒。李无仙听得入神，末了眼眶微红，却倔强地没有落泪：“姑姑说，她这辈子最信的人就是你。”她忽然起身，郑重地朝你行了一个大礼：“先生——无仙这七年，没有靠过任何神仙。往后，也想靠自己。”你伸手扶起她，心头百味杂陈。');}},
  {k:'B',tag:'考校',c:'#C4675C',tx:'以一剑考校她的武艺与道心',hint:'影响：李无仙好感+2；摸清她虚实',run:()=>{rdLove('李无仙',2);log('红尘卷·五卷','月色下，你以五成功力与她对了一剑。剑光交错，你心中暗惊——她的剑路刚猛凌厉，竟隐隐有几分当年李青君枪法的影子，却更添了帝王独有的杀伐之气。收剑时她微微喘息，却笑得张扬：“先生，无仙这一剑，可还入得眼？”你点头：“入得。只是剑太重——重到会伤人伤己。”她沉默片刻：“那我便学着，让剑轻一些。”');}},
  {k:'C',tag:'献计',c:'#7FA8C9',tx:'以仙家手段探知巫神宗虚实，为她谋划',hint:'影响：李无仙好感+2；定破局之计',run:()=>{rdLove('李无仙',2);log('红尘卷·五卷','你以通幽洞冥之法夜探巫神宗营地，三日后将一叠情报摆在李无仙案头：巫神宗主力所在、那位“仙师”的功法路数、甚至他们正在秘密筹备的祭坛方位。李无仙逐页看完，抬头看你的眼神又敬又疑：“先生……你这手本事，神仙都未必有。”你笑笑：“神仙没有的，我正好有一点。”');}},
]},
{t:'那一年的离火 · 饕餮祭坛',meta:'强制节点：巫神宗以战养祭，红门将开',scene:'李无仙亲征西凉，战事胶着，双方在西凉城外对峙了半月有余，互有胜负。而你潜伏侦察时，发现了一个惊天秘密——西凉境内那座被巫神宗重重把守的祭坛，正以两军交战的杀伐之气、修士斗法的能量为薪，缓缓开启一扇血色红门。那红门虚悬于祭坛上空，门缝里透出的气息凶戾而古老，仿佛门后关着什么亘古的凶物。你想起当年在焚天岛见过的旧事，心头一凛：这是截天之门！门后若召唤出饕餮凶魂，便是乾元巅峰、乃至无相之凶——到那时，别说西凉，整座人间都要沦为饕餮的食场。更惊人的是，你潜行探查时发现——巫神宗那位助阵的仙师，周身的气息竟与祭坛的纹路隐隐相连，仿佛他本身就是那扇门的一把钥匙。你心头升起一个可怕的念头：那位仙师……恐怕不但是开门的钥匙，还会成为祭品。你连夜将此事告知李无仙。她听罢，竟没有惊慌，反而眼底燃起幽火，像两簇小小的火苗：先生猜得不错——无仙等的，就是这门开的那一刻。她拔剑，剑尖指向西凉城方向，声音沉而稳：巫神宗想借饕餮吞我人间气运，那我便借他们的祭坛，送他们一份大礼。你看着她眼底那簇火，忽然明白，这丫头能一路打出人皇的名号，靠的从来不只是运气——她有胆，有谋，更有一种敢把整座人间扛上肩的狠劲。你点头：好。那这一局，你我师徒，一起下。那一夜，你与李无仙在帅帐中对着沙盘推演到天明。她年纪虽小，排兵布阵却老辣得不像话，一处处疑兵、一次次佯攻，在你看来竟挑不出什么大错。你忍不住赞了一句：你这兵法，跟谁学的？她头也不抬，笔尖在沙盘上又划了一道：跟我姑姑。我姑姑说，她年轻时也只会蛮打，后来有个人教会她——打仗，先要算人心。她说着，忽然抬头看了你一眼：先生，那个人是你吧？你笑了笑，没有答话。天亮时，你与她定下破局之计：她正面佯攻西凉城，吸引巫神宗主力；你则趁乱潜入祭坛，从根子上断掉那扇红门。临出帐前，李无仙忽然叫住你，声音里带着一丝不易察觉的担忧：先生——那祭坛深处，若真如你所料有饕餮凶魂……你回头看她：怎么，怕我打不过？她抿了抿嘴，难得露出一点少女的别扭：无仙不是怕先生打不过。无仙是怕——先生又要像七年前那样，一个人扛下所有，然后一走又是好几年。你看着她眼底那点认真的担忧，忽然觉得心里某个角落被轻轻戳了一下。你走过去，伸手揉了揉她的发顶——她先是一愣，随即微微红了脸，却到底没有躲开。你说：放心。这回，我不会再让你等七年了。定下计策后，你连夜出发。潜行至祭坛外围时，你才发现这座祭坛比想象中更大——坛基以九万块阴刻符文的黑石垒成，高逾十丈，坛顶那扇血色红门虚悬半空，门缝里透出的气息凶戾得让人的魂魄都在发颤。祭坛四周，披发祭司盘坐成阵，口中念念有词，一道道肉眼可见的血气从战场方向飘来，汇入坛顶的红门。你伏在暗处观察了整整一夜，终于摸清他们换班的规律。三更时分，你趁着一队祭司换防的空当，无声潜入坛下地宫。地宫里的景象让你心头一沉——数以百计的凡人生魂被锁在石柱上，他们大多已经浑浑噩噩，只剩一缕残魂还在苟延残喘。你压住心头的杀意，没有立刻动手救人——打草惊蛇，只会让更多人陪葬。你顺着地宫甬道继续深入，终于在最深处寻到那条灵脉的节点——一枚人头大小的血色晶石，悬在地宫正中，缓缓搏动着，像一颗活的心脏。你正要上前，身后忽然传来一声沙哑的冷笑：好胆。敢孤身潜入我神宗地宫的活人，你是头一个。你缓缓转身，看见一名披着血袍的老者立于甬道尽头，一双眼睛浑浊如鬼火，正阴恻恻地盯着你。你握紧剑柄，心里却松了口气——来得正好。省得你还要去寻他。',opts:[
  {k:'A',tag:'斩祭',c:'#C4675C',tx:'直捣红门祭坛，斩巫神宗祭司',hint:'影响：入战（巫神宗祭司·强）',run:()=>{log('红尘卷·五卷','你与李无仙兵分两路：她正面牵制巫神宗大军，你化作遁光直扑祭坛。血色红门前，数名披发祭司齐齐转身，厉声道：“何方鼠辈，敢坏我神宗大事！”你懒得废话，一剑递出：“万道仙宫，监察使——来收你们这些装神弄鬼的账。”');startCombat(rdEnemy('巫神祭司·血颅',2.3),'rd5Fight');}},
  {k:'B',tag:'偷梁',c:'#8B6FA8',tx:'反向施法，将红门指向巫神宗老巢',hint:'影响：恶名+1；一石二鸟',run:()=>{S.jianghu.evil=(S.jianghu.evil||0)+1;log('红尘卷·五卷','你冒险潜入祭坛核心，以通幽洞冥之法篡改了红门的坐标——当那扇截天之门彻底洞开时，涌出的饕餮凶魂将直扑巫神宗腹地。远处传来巫神宗修士惊恐的嘶吼。你退出时，识海里流苏难得赞了一句：“损是损了点，但这一手——漂亮。”');}},
  {k:'C',tag:'护民',c:'#6FA698',tx:'先布阵护住战场上的凡人将士',hint:'影响：功德+5；稳人心',run:()=>{S.merit+=5;log('红尘卷·五卷','大战将至，你连夜在凡人士兵营帐四周布下三百六十道护身符阵。当夜巫神宗以邪术召唤阴兵，撞上符阵金光，折戟大半。李无仙在帅帐中听报，久久不语，末了低声道：“先生护的是兵——可无仙知道，先生护的其实是‘人’。”');}},
]},
{t:'终幕 · 人皇与仙',meta:'终幕抉择：红门破后，人间与仙途，你心归何处',scene:'红门崩塌的那一夜，天穹都被映成了血色。李无仙的剑光与你的剑光同时斩落最后一道血幕，饕餮凶魂未及成形，便被无穷的杀伐之气反噬消散，化作漫天血雨洒落。巫神宗元气大伤，那位被当作祭品的仙师也在红门反噬中灰飞烟灭，残余的修士如鸟兽散，退守深山。战后，西凉城头，李无仙望着满目疮痍的大地——焦黑的田野、残破的村庄、远处仍在冒烟的废墟，久久没有说话。她忽然问你，声音很轻：先生——人间这一局，无仙赢了吗？你没有立刻回答，也望着那片疮痍的大地。赢了吗？妖僧乱了十年，巫神宗又祸害数年，即便这一仗胜了，满目焦土上的人间，要多少年才能养回元气？你正要开口，忽然心有所感，转头望向城楼下——一道素衣身影不知何时来了，正站在城楼下，朝你微微一笑。是李青君。七年前你答应过她的话，还作数。她老了，眉眼却还是那般温润坚定，像一坛陈年的酒，岁月只添了醇厚。识海深处，流苏轻声开口，声音带着一丝不易察觉的期待：材料凑齐了。你若想为我塑身，混沌火还需最后一味天演流光之耀——那在天上。你望着城楼下的李青君，又望了望身边英姿飒爽的李无仙，再感受着识海里那道白玉小人微温的气息——人间、天上、幽冥、妖城，你的道途走到这里，忽然多了无数个方向。风起，吹动你的衣袍。你站在城头，望着这片你用七年换来的、千疮百孔却又重新燃起炊烟的人间，忽然觉得，无论往哪边走，这一路走来遇见的每一个人，都已经成了你道途上不可分割的一部分。往哪边走，都由你。入夜，西凉城的灯火次第亮起来，像一地的碎星。李无仙在城头设了庆功宴，三军难得开怀，酒碗碰得叮当响。你坐在角落里，端着一碗酒，望着那些劫后余生的将士们笑闹、拼酒、抱着哭——他们中许多人，明天就要解甲归田，回到那片焦土上去，重新垒灶、开荒、过日子。李青君不知何时走到你身边，也在城垛上坐下，接过你手里的酒碗，抿了一口，轻声道：当年离火城破的时候，我以为南离的血脉要断了。她顿了顿，望着城下那片灯火：没想到，七年过去，她竟能走到这一步。你说：她像你。李青君摇头：她比我强。我当年只会守一座城，她如今要守的，是整座人间。你说：那便让她守。守累了，你我这些老骨头，还能替她搭把手。李青君转头看你，月光下，她眼角的细纹比七年前深了些，眼底却依旧温润：你这一走七年，可曾想过……有人一直在等你？你沉默了一会儿，才道：想过。正因为想过，才更要回来。她没有再说话，只是把酒碗递还给你，指尖在你手背上轻轻一触，又若无其事地收回。远处，李无仙正被将士们灌酒，她举着碗，朝城头遥遥一举，眼底亮晶晶的，像有星光落进了那碗酒里。你端起酒碗，回敬她。风从城头掠过，带着人间烟火与酒香。你忽然觉得，所谓问道长生，或许从来不在天上，而就在这一碗酒、这一城灯火、这一群愿意把后背交给你的人中间。宴至深夜，三军将士大多醉了，东倒西歪地靠在一起，有人还抱着酒碗说着胡话，说要回家种地，娶个媳妇，把被烧掉的村子重新建起来。你坐在城垛上，望着那些醉倒的将士，忽然想起很多年前，你在仙迹山脚那个小村里，也是这样看着村里的汉子们劳作归来。那时候你还不知道，自己会走这么远的路，遇见这么多人。李青君不知何时又走了回来，在你身边坐下，手里拿着两碗醒酒汤，递给你一碗：喝了吧，明早还要赶路。你接过汤碗：你怎么知道我要走？她笑了笑：你这个人，从来闲不住。南离留不住你，妖城留不住你，幽冥也留不住你——你心里装着的东西太大，这人间装不下。你低头喝了一口醒酒汤，汤是甜的，放了蜜枣。你忽然说：其实我想留下来。她怔了怔。你继续说：走了这么多年，忽然觉得，能有个地方，有一群人，愿意等你回来——比什么都强。她没有接话，只是望着城下那片灯火，过了很久，才轻声道：那就留下。你要是累了，这儿永远有个位置给你。你看着她被月光照亮的侧脸，忽然觉得，这一路的颠沛流离，似乎都有了答案。远处，李无仙不知何时醒了酒，正扒着城垛朝你们这边探头探脑，一脸八卦。你被她逗笑了，朝她挥了挥手：小丫头，回去睡你的觉。她吐了吐舌头，缩回脑袋，却到底没忍住，又探头喊了一句：先生！姑姑！你们聊，我什么都没看见！李青君的脸腾地红了。你望着这对姑侄，忽然笑出声来——这笑声在夜风里传出很远，惊起城头几只栖鸦。人间灯火，万里星河，此刻都在你脚下。你忽然觉得，这一碗酒，敬人间，值了。',opts:[

{t:'归宗 · 百年晖阳',meta:'强制节点：岁月流转，你在仙宫站稳脚跟；故人消息传来前的最后宁静',scene:'妖城一别后，你在万道仙宫一住经年。战堂的事务渐渐上手——从最初连名册都认不全的生手，到如今能把各峰弟子调派得井井有条，连宫主都夸过你一句孺子可教；琴棋书画山的琴音也听惯了许多，居云岫依旧爱喝清茶的茶，清茶依旧一边泡一边嘟囔师父又拿我当茶童，可嘟囔归嘟囔，她泡的茶却一天比一天香，连棋痴师叔都学会赖在竹楼等茶喝了；棋痴师叔的棋路依旧野得没边，你陪他下了三百多局，才总算摸清他哪一手是真杀招、哪一手是虚晃。日子像山间的溪水，平缓而安稳地流着，你偶尔会想起南离的残旗，想起裂谷的血色黄昏，想起妖城含香殿那盏暖黄的灯火——可那些都隔得很远，像另一个人的故事，只在夜深人静时，从记忆深处浮起来，晃一晃，又沉下去。这一日，你于峰顶打坐，晨钟暮鼓声里，丹田气海澄明一片，灵力如潮汐般自有涨落，周天运转间再无滞涩。你识海深处那道声音懒洋洋地开口，带着几分难得的满意：不错，总算有点样子了。这仙宫虽比天上差点，养你也够了。你睁开眼时，云海正翻涌如沸，一轮红日从云隙间跃出，把整座琴棋书画山染成一片金红，连竹楼檐角的露珠都闪着细碎的光。你正要起身，山门外却忽然传来一阵骚动——有弟子在惊呼，声音里满是惊惶：哪来的……蛇？！紧接着，一道翅翼染血的螣蛇跌跌撞撞坠在山门前，几乎连人形都维持不住，只能勉强抬起头，气若游丝地望着你，眼底全是濒临崩溃的焦急与委屈：哥哥……师父……师父受伤了……求你……救救她……你认出那双眼睛的瞬间，浑身的血都往头顶涌——那是夜翎。她从不轻易求人，更不会带着一身伤从万里之外飞来找你。她肯来，说明妖城那边，真的出了天大的事。你三步并作两步冲过去，一把扶住她摇摇欲坠的身体，声音却意外地稳：别急，慢慢说。有我在。夜翎望着你，眼泪终于滚了下来，声音抖得不成样子：是巫……有人给师父下了巫咒……她为了护着我……才中的招……你一边听，一边把灵力渡进她体内，替她理顺翻涌的气血。夜翎这几年在妖城跟着程程，早已不是当年那个怯生生的小蛇妖，可此刻伏在你怀里，她又变回了那个会拽着你衣角喊哥哥的小丫头，把脸埋在你肩窝里，肩膀一抽一抽的。你摸出随身带的灵丹，撬开她的嘴喂下去，又用神识扫了一遍她的伤势——还好，多是奔波的损耗与旧伤迸裂，没有新添的致命伤。你这才稍稍松了口气，把她往怀里拢了拢，低声道：程程……师父是怎么中的招？夜翎止住抽噎，断断续续道：是巫咒……藏在供奉里，师父一时不察……那东西专噬妖力，师父为了护住含香殿的妖众，硬生生用妖力扛了三天……她说着，又攥紧你的衣襟：哥哥，你快去……我怕她撑不住……你把她交给闻讯赶来的居云岫，居云岫只看了一眼，便道：你且去，她交给我。你点了点头，望向南方的天际——妖城，含香殿，那盏暖黄的灯火。你捏碎一枚遁符，身形化作流光，消失在云海之间。遁光破空时，你低头看着怀里那张夜翎哭花的小脸，心里像被什么东西揪着。你在万道仙宫安稳了太久，久到几乎忘了——那些你放在心里的人，正替你挡着你看不见的风雨。程程那个人身总是笑得没心没肺，妖身总是黏人撒娇，可你比谁都清楚，她撑起妖城这些年，靠的不是运气。夜翎窝在你怀里，昏昏沉沉间又呢喃了一句：哥哥……快些……你把她往怀里拢了拢，遁光又快了几分。云海在脚下翻涌，中土十八州在身下掠过，你头一次觉得，这遁术还是太慢了些。',opts:[
  {k:'A',tag:'急赴',c:'#C4675C',tx:'二话不说，背起夜翎直奔妖城',hint:'影响：开启妖城主线；夜翎好感+2',run:()=>{rdLove('夜翎',2);log('红尘卷·四卷','你把丹药一股脑塞进夜翎嘴里，抱起她化作遁光南去。风驰电掣间，夜翎在你怀里断断续续说起原委——程程闭关冲击万象时遭人暗算，妖城如今内忧外患。你沉声道：“撑住，我来了。”');}},
  {k:'B',tag:'求援',c:'#7FA8C9',tx:'先请居云岫同往，多一分照应',hint:'影响：居云岫好感+1；妖城之行有强援',run:()=>{rdLove('居云岫',1);log('红尘卷·四卷','居云岫正倚窗看书，听你说完只抬眼看了你一下：“妖城？倒是个画风物志的好去处。”她慢悠悠收了书卷：“走吧，清茶看家。”清茶在屋檐下探出半个脑袋：“师父你又丢下我！”');}},
  {k:'C',tag:'镇守',c:'#6FA698',tx:'先稳住仙宫战堂再走，交代后路',hint:'影响：仙宫声望+2；行程稍缓',run:()=>{S.reputation+=2;log('红尘卷·四卷','你连夜把战堂诸事交割妥当，又向宫主递了道“外出游历”的辞帖，这才动身。仙鹤师兄追出山门塞给你一叠灵符：“妖城水深，留着保命。”你收下符箓，心头微暖。');}},

{t:'夜翎 · 万里求援',meta:'强制节点：妖城之危，程程重伤之谜',scene:'妖城在望时，你才真正明白夜翎为何急成那样——城头妖气翻涌如浪，守军的甲胄上犹带焦痕与爪印，好几处城墙是新砌的，砖色还没被风霜染旧，空气中飘着淡淡的巫术余烬味，混着妖血的腥气，一闻便知这里刚经历过一场恶战。你一路走来，看见不少妖众神色惶惶，连街边叫卖的小妖都压低了嗓门，再没了往日的喧闹。含香殿内，人身程程斜倚软榻，依旧是一副歌舞升平的模样，手里还捻着一串葡萄，可你一眼就看穿她的底子虚——脸色白得近乎透明，指尖微颤，捻着的那枚烧了一半的巫符在烛火下泛着幽幽的青光。她看见你，先是一愣，随即笑靥如花，声音还是那副慵懒腔调：哟，稀客。来看我这快死的狐狸精最后一眼？你皱眉上前，不由分说一把扣住她的脉门，灵力探入的刹那，你的脸色也变了——她体内缠着一股极其阴毒的巫咒，像一条盘踞在丹田里的毒蛇，正日夜不停地蚕食她的妖力与寿元，这伤没有一年半载养不回来，若是放任不管，连根基都要被啃空。程程却浑不在意地抽回手，把葡萄丢进嘴里，嚼了两下：别紧张，死不了。我只是……钓条鱼。她眼底闪过一丝狡黠的光，声音压得极低：妖城里有人盼着我死，那便让他们以为我快死了——看看谁先跳出来。她说着，又拈起那枚烧了一半的巫符，在指尖转了一圈，笑意更深：你看，我连饵都准备好了。你看着她那张明明虚弱却还在逞强的脸，一时不知该气还是该笑。你扣着她脉门的手指没有松开，沉声道：这巫咒是谁下的，你心里有数没有？程程的笑意淡了一瞬，又漫上来：有数。可钓鱼嘛，总得先让鱼以为钩子上没刺。她说着，忽然正色看你，声音里难得带了一丝认真：秦弈，这几日你陪我把戏演足——我这重伤将死的消息，得传得满城风雨才行。你望着她眼底那簇幽幽的光，忽然明白，这妖城的水，比她露出来的要深得多。当夜你宿在含香殿偏殿，程程遣人送来一碗热气腾腾的妖城特色羹汤，汤里搁着几片提神的灵草。你端着汤，没有立刻喝，先以神识细细探查了一遍——果然，汤里被人动了手脚，混着一缕极淡的噬魂巫蛊之气，若是以往，你或许察觉不出，可今日你刚在程程体内见过同源的巫咒，对这气息再熟悉不过。你放下汤碗，指尖在碗沿轻轻敲了两下。程程的声音从隔间传来，带着笑意：怎么，怕我毒死你？你淡淡道：汤里加了料，不是你下的。隔间安静了一瞬，随即传来她低低的笑：好眼力。看来我这含香殿里，藏着的耗子比我想的多。你端起那碗汤，走到廊下，倒进花丛里，又走回来，在她隔间门外站定：你故意的？程程没有答话，半晌才道：饵已经放出去了，就看哪只耗子先忍不住。你听出她声音里的疲惫，没有再追问，只道：早些歇息。明日，我陪你把这出戏唱完。隔间里传来一声极轻的嗯。第二日，程程果然把重伤将死的戏码唱得满城皆知——她让人把含香殿里里外外挂满安神的符幡，又召了几路妖将入殿，当着他们的面咳出两口血，虚弱地靠在软榻上交代后事：本王的伤……怕是撑不过这个秋天了。夜翎……那丫头还小，往后妖城，就仰仗各位叔叔伯伯了。那几路妖将有的红了眼眶，有的低头抹泪，你站在殿角，看着程程那副气若游丝的样子，若不是早知底细，连你都要信了三分。散殿之后，程程屏退左右，忽然从软榻上坐起来，精神奕奕地冲你眨了眨眼：如何？我这演技，够不够格去仙宫唱一出戏？你哭笑不得：你就不怕那几路妖将里真有心软的，夜夜来替你哭丧？她哈哈一笑：那正好，哭得越真，传得越广。你看着她那双亮晶晶的眼睛，忽然有些佩服——这姑娘把整座妖城都当成了棋盘，连自己的命都敢拿出来做饵。',opts:[
  {k:'A',tag:'诊咒',c:'#7FA8C9',tx:'彻查巫咒来源，拔除内患',hint:'影响：查得幕后黑手线索',run:()=>{S.rd.f.程程伤='查咒';log('红尘卷·四卷','你以神识细察那巫符残纹，认出这是南疆失传的“噬魂巫蛊”之咒——需以施术者精血为引。程程眯起眼：“能拿到我精血的人，可不多。”你与她对视一眼，都从对方眼底看到了一个名字：当初虢嚣二王麾下逃走的那个巫祝。');}},
  {k:'B',tag:'续命',c:'#A98FD9',tx:'以灵药先稳住她的伤势',hint:'影响：耗灵药·玉髓×2，程程好感+2',run:()=>{rdLove('程程',2);giveItem('灵药·玉髓',-2);log('红尘卷·四卷','你把珍藏的玉髓炼成清灵丹喂她服下，那股巫咒之气被暂时压住。程程面色好了些许，却懒洋洋道：“浪费。留着给你自己续命不好么？”你气道：“闭嘴，养着。”她难得没有顶嘴，只垂着眼，不知在想什么。');}},
  {k:'C',tag:'问局',c:'#C9A45C',tx:'问清她的布局，顺势而为',hint:'影响：洞悉程程为夜翎铺路的深意',run:()=>{log('红尘卷·四卷','程程懒懒道：“夜翎那丫头，性子软，做不得王。我若不替她把碍事的扫干净，她坐不稳那位置。”你沉默片刻，忽然伸手揉了揉她的发顶：“你倒是……什么都替她想。”程程怔了怔，别过脸去：“少来这套。”耳尖却悄悄红了。');}},
]},
{t:'含香殿 · 双面妖王',meta:'强制节点：识破程程“人身/妖身”双身之谜，直面妖城暗流',scene:'当夜，你亲眼看见一幕奇景——含香殿里另一个程程正被人身程程一路骂出门外：明明是陪我的，被你这骚蹄子抢走一整天！今晚他是我的！那妖身程程竟一脸抱歉地连连后退，真被骂了出去，临走还依依不舍地往殿里望了一眼，尾巴尖都耷拉下来。你目瞪口呆地看着这一出独角戏，半天没回过神。夜翎蹲在你肩头，翅膀轻轻扇了扇，小声给你科普：师父有两个身体啦——人身管城务，妖身管打架，其实都是她一个人，就是两个人格偶尔会互相吃醋。她说着，又补了一句：不过妖身师父打架可凶了，前些天那个下咒的巫祝，就是被妖身师父撕掉半条胳膊逃走的。你这才恍然，为何妖城上下都说大王神出鬼没，一会儿温柔一会儿凶悍，敢情是两位一体。妖身程程是通体无杂色的乘黄白狐，毛色如雪，背上一支晶莹独角，月下看去如雪映流光，一双琥珀色的眼睛又媚又野，偏又带着几分纯真的好奇。她美滋滋地钻进你怀里窝好，尾巴一卷你的手腕，声音带着点撒娇的软：走，陪我去巡城——今晚有客要来。你被她拖着在妖城的屋脊上飞掠，夜风猎猎，满城灯火在脚下连成一片，远处的裂谷在月光下像一道沉默的伤疤。她一边走一边跟你念叨城里的八卦：东街的熊妖又跟媳妇吵架了，南巷的狐狸精新开了一间胭脂铺，生意好得不得了……忽然，她脚步一停，耳朵竖了起来，声音变得又冷又利：来了。果不其然，三更时分，几道鬼祟身影摸向含香殿地库——那里埋着程程垂死的消息引来的蛇。月色下，那几道影子贴着墙根潜行，像一群闻见血腥味的豺狼，为首的腰间悬着一枚骨牌，在月光下泛着惨白的光。妖身程程蹲在你肩头，尾巴尖轻轻晃了晃，琥珀色的眼底映着月光，竟透出几分狩猎前的兴奋，声音却压得极轻极柔：你看，鱼上钩了。那几道黑影果然一头扎进了地库的陷阱。你与妖身程程悄无声息地缀在他们身后，看着他们撬开地库的暗门，摸向那口封着假息术的棺材。为首的巫祝阴恻恻一笑，指尖凝起一道青黑色的巫火，正要往棺材上按去——他大概以为，只要补上一记咒，程程便再无回天之力。就在此时，地库四角的符纹同时亮起，你一脚踹开暗门，长剑横在他颈侧：动一下，试试。那巫祝吓得手一抖，巫火差点烧到自己，颤声道：你……你不是重伤……妖身程程从你肩头跃下，化作人形，笑眯眯地接过话头：重伤的是我另一个身子，我这个身子可好着呢。她说着，指尖一点，那巫祝脚下的影子忽然活了过来，化作锁链将他四肢捆了个结实。巫祝这才反应过来，嘶声道：你诈我！程程蹲下来，歪头看他，笑得又甜又冷：不诈你，你怎么会乖乖上门送人头呢？你站在一旁，看着这一出请君入瓮的好戏，忽然觉得，这妖城的大王，远比你最初见时那个哑巴绣娘要厉害得多——她不是不狠，只是把狠都藏在了笑里。把那名巫祝押入地牢后，妖身程程伸了个懒腰，又变回白狐模样，跳上你的肩头，尾巴有一下没一下地扫着你的后颈：走，去审讯。你本以为她会用什么酷刑，谁知她进了地牢，只让人搬了把椅子，坐在那巫祝面前，慢悠悠地开口：说说吧，谁让你来的。那巫祝嘴硬：哼，要杀要剐……程程哦了一声，也不恼，只对左右道：把他嘴堵上，吊到城头，跟满城百姓说——这人想害你们大王，如今被拿下了，欢迎大家来参观。那巫祝脸色顿时就白了：你！程程笑眯眯地看着他：我这妖城，别的不多，就是看热闹的妖多。你猜猜，他们认出你是哪家派来的之后，会怎么招呼你？那巫祝嘴唇哆嗦了半天，终于颓然低头：我说……是西城的老供奉，他收了天上人的好处……程程脸上的笑意淡了下去。',opts:[
  {k:'A',tag:'收网',c:'#C4675C',tx:'随妖身程程布网，当场拿贼',hint:'影响：入战（叛妖·咒师）；拔除内患',run:()=>{log('红尘卷·四卷','地库里灯火骤亮，你与妖身程程一左一右堵住来路。为首的黑影嘶声道：“你不是重伤将死……”程程化作白狐蹲在你肩头，尾巴一甩，笑眯眯道：“骗你们的呀。”众叛妖勃然变色，巫咒漫天而起！');startCombat(rdEnemy('噬魂巫祝',1.9),'rd4Fight');}},
  {k:'B',tag:'暗桩',c:'#8B6FA8',tx:'故意放走一条小虾，钓出背后大鱼',hint:'影响：程程好感+2；引蛇出洞',run:()=>{rdLove('程程',2);log('红尘卷·四卷','你按住要动手的程程，悄悄在那“漏网之鱼”身上留了一缕追魂香。程程眨了眨眼，立刻懂了：“放长线？”你点头：“咒师的精血引子，总得有人去接头。”三日后，追魂香指向城外一处废弃巫庙——那里藏着当年虢嚣余孽的老巢。');}},
  {k:'C',tag:'镇场',c:'#6FA698',tx:'以你人族修士的身份坐镇，震慑异心者',hint:'影响：妖城人心稍定',run:()=>{log('红尘卷·四卷','翌日，你以程程“座上宾”的身份在妖城最热闹的坊市走了一遭——满街妖众看见人族修士与大王并肩而行，议论纷纷。有老妖感叹：“大王竟请了人族高人镇场……”消息传开，几路蠢蠢欲动的妖军果然按兵不动。程程在含香殿里听报，弯起眼睛：“这狐假虎威，用得不错。”');}},
]},
{t:'影踪 · 魔女再合作',meta:'强制节点：为查天上人线索，与孟轻影再会于裂谷边',scene:'程程的伤势稳住后，你从巫祝残魂的记忆里挖出一桩更惊人的旧事——那巫祝当年不过是个跑腿的，真正驱使虢嚣二王与妖城作对的，是裂谷对面天上来的客人。他们要的不是地盘，不是财货，而是妖城这条养了千年的血脉——万妖之源，鲲鹏之血，在他们眼里不过是一味可以反复收割的药材。你把那段残魂记忆反复看了三遍，越看心越沉，那些看似寻常的只言片语拼凑起来，竟指向一张绵延千年的网。你决定亲自去裂谷对面探一探虚实。裂谷边，暮色四合，风从谷底倒灌上来，呜呜咽咽，像大地在低泣。一道黑影早已等在那里——黑衣墨发，苍白面容，指尖一枚飞梭转得飞快，正是孟轻影。她偏头看你，笑得意味深长：巧了，我也在查同一件事。要不要……搭个伙？你还没答话，她已经抛来一物，你抬手接住——是一卷泛着幽光的玉简。万象森罗宗的通幽洞冥，借你一用——神融幽影，有影子处皆是耳目。学会它，天上人的影子也瞒不过你。她说这话时难得没有笑，眼底掠过一丝极淡的冷意：那群天上的，把手伸到我们九幽道头上来了——敢在我们的地盘上圈养血脉，当我们是死的？她顿了顿，又恢复那副漫不经心的样子，指尖飞梭转了个圈，声音懒洋洋的：当然，你要是怕沾因果，现在把东西还我也来得及。你捏着那卷玉简，迎着谷风，缓缓笑了：怕因果，我就不来裂谷了。你展开玉简，神识沉入的瞬间，只觉天地一暗——那卷通幽洞冥的功法，竟像一扇门，把你引向一个影子与暗影交织的世界。孟轻影站在你身边，难得安静地看着你参悟，月光落在她苍白的脸上，把她眉眼间那点狡黠都柔化了几分。她忽然开口，声音很轻：喂，秦弈。你要是真查到了天上人的老巢，打算怎么办？你没有睁眼，答：先看看，再想想。她嗤笑一声：说人话。你睁眼看她，认真道：要是他们好好说话，那就谈；要是不肯好好说话——那就打到他们肯。孟轻影愣了一下，随即笑弯了眼：行，这话我爱听。当夜，你在裂谷边寻了一处僻静的崖洞参悟通幽洞冥。那门功法的确玄妙——神念化影，潜踪匿形，习成之后，凡有影子处，皆可成你的耳目。你一连参了三个日夜，才勉强摸到门槛。第三日夜里，你正要试着将神念融入崖壁上自己的影子，忽然听见洞外传来一阵极轻的脚步声——你心头一凛，正要收功，却见来人是孟轻影。她手里提着一只食盒，倚在洞口，挑眉道：怕你饿死在洞里，回头还要我收尸。你接过食盒，打开一看，竟是几碟精致的点心与一壶热茶。你抬头看她，她别过脸去，声音淡淡的：九幽道旁支送来的，本姑娘吃腻了，赏你的。你也不拆穿她，只拈起一块点心咬了一口，道：谢了。她嗯了一声，转身要走，走了两步又顿住：喂，秦弈。你要是真打算去闯天上人的地盘——记得叫上我。你望着她的背影，忽然觉得，这个嘴上不饶人的魔女，其实比谁都重情义。三日后，你终于参透了通幽洞冥的门槛——神念化影，潜踪匿形，当你试着将神念融入崖壁上自己的影子时，只觉眼前一花，仿佛整个世界都换了一副模样：风声里有低语，石缝里有窥探，连月光照不到的暗处，都藏着无数细碎的耳目。你收回神念，长长吐出一口浊气，只觉神识竟隐隐凝实了几分。孟轻影不知何时又来了，倚在洞口，手里抛着一枚黑色的果子：参透了？你点头。她上下打量你，忽然道：试试。你依言将神念沉入影子，下一瞬，你看见她的影子里浮起一道极淡的轮廓——那不是她，是另一个气息，被她的影子牢牢锁着，像一只困在琥珀里的飞虫。你心头微动：你影子里锁着东西？孟轻影的笑意一僵，随即又漫上来：锁着一个仇人。她轻描淡写地转了转飞梭：天上人派来的探子，被我抓了个活的。你皱眉：你打算拿他做什么？她淡淡道：养着，等他的主子来赎。要是没人来赎，就当我的影子养料。你看着她那张笑意盈盈的脸，忽然觉得，这魔女手底下的故事，怕是比妖城的还要多。',opts:[
  {k:'A',tag:'学秘',c:'#A98FD9',tx:'参悟通幽洞冥，潜入玄阴宗查证',hint:'影响：习得通幽洞冥（神识+1）',run:()=>{S.six.神识=clamp(S.six.神识+1,1,20);S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='通幽洞冥'))S.fashu.push({n:'通幽洞冥',elem:'阴',power:0,mp:8,系:'遁'});log('红尘卷·四卷','你花了三日参透通幽洞冥的诀窍——神念化影，潜踪匿形。夜里你潜入裂谷对面玄阴宗闭山的驻地，从弟子闲谈中拼凑出关键情报：天上人的“收割者”每甲子来一次，最近一次就在眼前。你退出暗影时，孟轻影倚在墙根等你，挑眉道：“有收获？”你点头：“够开一局了。”');}},
  {k:'B',tag:'交换',c:'#8B6FA8',tx:'以一卷妖纹秘术与她交换情报',hint:'影响：孟轻影好感+2；得天上人档案',run:()=>{log('红尘卷·四卷','孟轻影翻着你默出的妖纹残卷，眼睛越来越亮：“好东西……这东西在万象森罗能换半个长老席位。”她也不白拿，抛来一卷泛黄的《天界见闻录》——上面详细记载了“天上人”的位阶、行走人间的规矩，以及裂谷这处“牧场”的管理者是谁。你翻到最后一页，指尖一顿：那管理者最近的巡视时间，就在本甲子内。');}},
  {k:'C',tag:'独行',c:'#6FA698',tx:'不假外求，自己夜探裂谷对面',hint:'影响：风险高，但情报最真',run:()=>{log('红尘卷·四卷','你谢绝了孟轻影的好意，独自贴着裂谷崖壁摸向对面。夜色里，你看见一座孤悬的观星台上有人影走动——那人的衣袍上绣着一枚太阳纹，与妖城地脉深处的图腾如出一辙。你记下方位，无声退回。回来时孟轻影还在原地等你，嗤笑一声：“倒是没缺胳膊少腿。”');}},
]},
{t:'万妖之源 · 鲲鹏之血',meta:'强制节点：入妖族主地脉，窥见妖城万年的根基',scene:'叛党肃清后，程程伤势渐愈，这一日她屏退左右，只带你与夜翎深入妖城地底。越往下走，空气里的妖力越浓郁，到最后竟凝成实质般的血色雾气，呼吸之间，连经脉都在嗡嗡作响，像是被什么古老的力量一遍遍叩问。当那条血色地脉真正出现在你眼前时，你有一瞬间的失语——它没有边际，如古老的巨兽经络，蜿蜒着伸向大地深处，一眼望不见尽头，搏动之间，仿佛整片大地都在随之呼吸，每一下都沉稳有力，带着亘古的节律。妖力浓郁如无垠之海，你只吸了一口，便觉得周身经脉像被温热的泉水浸过，说不出的熨帖，连丹田里那缕灵力都活跃了几分。夜翎贴着你，声音小得像怕惊动什么：哥哥，这里……是鲲鹏的血。往圣之血化为族群最根本的地脉之力，滋养万妖数万年而不绝——你终于明白，妖城为何能在裂谷边屹立千年不倒，也明白天上人为何对它垂涎欲滴。程程站在地脉边缘，难得收起那副玩世不恭的模样，火光映着她的侧脸，她轻声说起往事：妖城当年也不是铁板一块，分裂成三国，各占一脉，互相攻伐了不知多少年，血流成河，把地脉都染得更红了。是她以身入紫府作饵，奇袭二国，三脉归一，才重铸了这份鼎盛——那场仗她打了三年，赢了，也落下满身暗伤，有些到现在还没好利索。你说这话时，她语气平平的，像在说别人的事，可你听得出来，那三年里的血与火，都被她轻描淡写地带过了。你识海里那道白玉小人飘了出来，难得正色，声音带着一丝感慨：有这般妖脉，妖族兴盛只是时间问题。程程化作白狐蹲在你肩上，尾巴卷着你的手腕，声音又恢复了那副慵懒腔调：参悟一月，抵你人间十年——这地方，够你吃一辈子的红利了。她说着，琥珀色的眼睛望向你，眼底映着血色地脉的微光：要不要下去试试？你点头，纵身跃入血色地脉。那股妖力浓稠得像实质的琥珀，瞬间将你包裹——你没有急着运功吸纳，而是先沉下心，细细感受这份力量的本源。渐渐地，你仿佛听见远古的潮声，一浪一浪，由远及近；又仿佛看见一头遮蔽天日的巨兽，在北冥的海面上展翅，一飞便是九万里——那是鲲鹏，是这片大地上所有妖族的始祖，它的血化作了这条滋养万妖的地脉。你盘坐其中，让妖力如潮水般一遍遍冲刷经脉，每一次冲刷，都像在替你洗去一层杂质。不知过了多久，你睁开眼时，丹田里的气海比先前壮阔了近三成，连经脉都隐隐粗了一圈。出定时，程程化作白狐守在洞口，尾巴尖沾着露水，显然守了不止一日。她看见你睁眼，懒洋洋道：怕你被妖力撑爆了，守着点。你心头一暖，走过去，伸手揉了揉她毛茸茸的耳朵：谢了。她耳朵一抖，别过脸去，尾巴却悄悄卷了一下你的手指：……少来这套。在地脉中闭关的那几日，你并非全无所得。有一回，你在极深的地脉壁上看见一幅刻痕——不是妖纹，更像是某位极古老的妖圣随手留下的涂鸦：一只大鸟，一只大鱼，在云海与沧海之间追逐，画得歪歪扭扭，却透着一股说不出的辽阔。你盯着那幅刻痕看了很久，忽然觉得，这妖脉深处，沉睡的不仅仅是鲲鹏的血，还有一段被时间掩埋的、属于妖族的自由记忆。出关后你把那幅刻痕临摹给程程看，她难得怔了半晌，才轻声道：这是……先祖们还在天上飞的时候画的。她说着，眼底掠过一丝极淡的向往：那时候，它们想去哪就去哪，不用看任何人的脸色。你看着她，忽然道：会再有的。她没答话，只是把脸埋进你肩头，蹭了蹭。',opts:[
  {k:'A',tag:'入脉',c:'#A98FD9',tx:'在地脉深处盘坐，借万妖之源冲关',hint:'影响：修为+35、资质+0.5',run:()=>{S.xiu=clamp(S.xiu+35,0,100);S.six.资质=clamp(S.six.资质+0.5,1,20);log('红尘卷·四卷','你盘坐于血色地脉之中，妖力如江河倒灌，一遍遍冲刷你的经脉。恍惚间你仿佛听见远古鲲鹏的呼吸——一呼一吸，皆是日月开合。出定时，程程化作白狐守在洞口，尾巴尖沾着露水，看见你睁眼，懒洋洋道：“怕你被妖力撑爆了，守着点。”你心头一暖。');}},
  {k:'B',tag:'护法',c:'#D88FA5',tx:'为夜翎护法，助她参悟螣蛇血脉刻纹',hint:'影响：夜翎好感+3、血脉精进',run:()=>{rdLove('夜翎',3);log('红尘卷·四卷','夜翎盘坐在一块血色石壁前，壁上铭刻着古老的螣蛇妖纹——她参悟得极慢，时常眉心紧蹙。你便在她身后坐了三天三夜，把妖纹流转的气机一遍遍为她推演分明。第四日晨，她忽然睁眼，瞳孔掠过一道暗金：“哥哥……我好像，看见祖先了。”你摸摸她的头：“看见了什么？”“一条很大很大的蛇……它说，它等了我好久。”');}},
  {k:'C',tag:'观势',c:'#7FA8C9',tx:'不入定，只细察地脉符文与妖城命脉',hint:'影响：洞悉裂谷与妖城隐秘（推进主线）',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·四卷','你沿着血色地脉走了很久，发现一个惊人的规律——地脉的纹路并非天然，而是被某种古老的力量“修整”过。那些纹理与你在裂谷对面见过的太阳图腾隐隐呼应。你心中升起一个可怕的念头，却没说出口。回到含香殿，程程正斜倚软榻等你，笑意盈盈：“看出什么了？”你沉默片刻：“这地脉……好像是一处圈养之地。”程程的笑意淡了下去。');}},
]},
{t:'凤与凰 · 妖纹秘窟',meta:'强制节点：秘窟考古告一段落，与程程并肩同行',scene:'地脉深处的秘窟考古终于完毕——程程的妖纹镌刻之术大有进境，从只能刻简单的聚灵纹，到如今能镌刻完整的传承妖纹，一笔一划都透着古老的韵味；夜翎也带回了螣蛇残魂的破解之法，那份纠缠她许久的血脉传承，终于有了头绪。尘埃落定，妖怪们带着一脸复杂的神色一步三回头地离开——有人惋惜，有人庆幸，有人盯着壁上那些残缺的妖纹看了又看，仿佛要把它们刻进心里。洞里渐渐安静下来，只余你与程程。她并肩与你出洞，慢慢回城，一路踢着石头，小嘴撅得能挂油瓶，声音闷闷的：你是不是很得意？当众落我面子，看我忍气吞声的样子是不是让你很有成就感？你被她这没头没尾的指控逗得一愣，随即淡淡道：要落面子，落的是鹰厉他们的面子——连自己的命运都要依靠着我，他们哪来的脸摆妖族谱。程程还是噘着嘴，声音更闷：那我也无能。你忽然笑了：你做得够多了。再说了，能吊到这个男人，就是你的本事嘛——让野猪精来试试？程程愣了一下，随即忍不住也笑了，眉眼弯弯，方才那点闷气一扫而空：明明是你一直在吊我！你忽然伸手，牵住她的手。她怔了怔，指尖在你掌心里僵了一瞬，终究没有抽回去，只低下头，耳尖慢慢红了起来。裂谷的暖风送来青草与野花的芬芳，有百灵在枝头歌唱，歌声清越婉转——这一刻没有算计，没有交换，只是两个人，慢慢走。你牵着她的手，忽然觉得，这妖城的风，竟比仙宫的云海还要让人心安。你低头看她，她仍别着脸，可嘴角那点弧度怎么也压不下去。你忽然想起一句很老的话：山高路远，同行的人，最难得。回城的路不长，你们却走了很久。程程一路踢着石子，忽然没头没尾地问：秦弈，你以后……会一直待在仙宫吗？你听出她话里那点小心翼翼的试探，想了想，答：仙宫是我的落脚处，但不是我的家。她脚步顿了一下：那你的家在哪？你转头看她，认真道：我这个人，从小就没什么家——走到哪，哪就是家。她低着头，声音闷闷的：那……妖城算不算？你没有立刻回答。她像是怕听见答案，又急急补了一句：算了，当我没问。你停下脚步，她走了两步，发现你没跟上，也停下来，回头看你。你看着她，一字一句道：妖城有你，有夜翎，有那么多把我当朋友的人——它当然算。程程怔住了，那双总是含着狡黠笑意的眼睛里，第一次浮起一点水光。她飞快地别过头去，声音却软了下来：……谁稀罕你说这些。可你分明看见，她垂在身侧的手，悄悄攥紧了又松开。那之后几日，程程待你似乎有些不一样了。她不再总拿话刺你，偶尔你在含香殿看书，她会端一盏茶过来，也不说话，只在你对面坐下，低头绣她的帕子；有时你与妖将议事，她在一旁听着，你若看向她，她便飞快地移开目光，耳尖却悄悄泛红。夜翎把这些看在眼里，某日夜里忽然凑过来，一本正经地跟你咬耳朵：哥哥，师父最近老看你。你说：她以前也看。夜翎摇头：不一样——以前是打量，现在是……她想了想，憋出一个词：是藏。你被她逗笑了：你个小丫头，懂得倒多。夜翎哼了一声，翅膀一扇，振振有词：我活了几十年了，又不是真的小孩！说完又有点心虚，补了一句：……虽然样子是小了点。你揉揉她的脑袋，心里却不由琢磨起夜翎那句话——程程看你时的眼神，的确和从前不同了。那种目光，你在南离的城头见过，在裂谷的暮色里见过，可从未想过，有一天会在这妖城的含香殿里，再次撞见。',opts:[
  {k:'A',tag:'交心',c:'#D88FA5',tx:'握住她的手，说几句掏心窝的话',hint:'影响：程程好感+4；情感线关键',run:()=>{rdLove('程程',4);log('红尘卷·四卷','你牵着她的手，低声道：“你我之间，不是恩怨就是交换，累你也累我。今日不提别的，就好好走一段，行么？”程程怔怔看着你的侧脸，那句“你这就是征服我的套路”在舌尖滚了滚，终究没说出口。她垂下眼，把指尖与你扣得更紧了些，轻声说：“……行。”');}},
  {k:'B',tag:'参纹',c:'#A98FD9',tx:'将妖纹之术的关窍说与她听，共同推演',hint:'影响：悟性+2、程程好感+2',run:()=>{rdLove('程程',2);S.six.悟性=clamp(S.six.悟性+2,1,20);log('红尘卷·四卷','你在石壁上以指代笔，将妖纹流转的几处生门死穴一一剖开。程程本是此道大家，听得眼睛越来越亮，到最后竟拉着你连夜推演到天明。晨光里，她望着石壁上新成的完整妖纹，忽然道：“我这辈子，第一次觉得有个人能懂我在想什么。”你没有答话，只是在她额上轻轻弹了一下。');}},
  {k:'C',tag:'护翎',c:'#6FA698',tx:'替夜翎化解螣蛇残魂的侵蚀之患',hint:'影响：夜翎好感+2、血脉稳固',run:()=>{rdLove('夜翎',2);log('红尘卷·四卷','夜翎参悟传承时总被一道残魂干扰——那是远古螣蛇留下的一缕凶戾执念，稍有不慎便会反客为主。你以道心为引，替她将那道残魂一点一点渡化。夜翎蜷在蒲团上，额头沁出细汗，却忽然睁开眼，声音发颤：“哥哥……那缕执念说，它当年是被天上人活活抽干妖血而死的。”洞中骤然安静。');}},
]},
{t:'裂谷真相 · 圈养之地',meta:'强制节点：真相大白——裂谷是天界圈养妖怪的牧场',scene:'结合妖纹残卷、孟轻影的情报与地脉符文的推演，你终于拼出了完整的真相——裂谷从来不是什么上古秘境，而是天界某位大能刻意留存的一处牧场。远古神兽在此繁衍，一代代成长，等它们修炼到一定境界，天上便来人取丹、取血、剥皮、炼器，如人间养鸡养猪，留种再育，循环往复，不知过了多少万年。那些所谓失踪的龙凤麒麟，未必真的绝了种——它们中的许多，正被圈养在天上，充当坐骑与血库，世代为奴，永无天日。你识海里那道白玉小人的声音响起，带着前所未有的冷意：所以有些所谓绝种的龙凤，未必真绝了——说不定正被圈养在天上当坐骑。你听得心口发堵，那些残卷上的符文仿佛活了过来，在你眼前拼成一幅幅画面：幼兽在裂谷边嬉戏，长成后被铁链锁住，被抽血取丹，哀鸣声被风沙掩埋。你转头看向程程。她听完，久久没有说话，只是望着远处妖城的万家灯火。那些灯火下，有小妖在学走路，有老妖在教孙儿识字，有织坊的灯火亮到深夜，绣娘们一针一线地绣着明日的嫁衣——他们不知道自己脚下的这片土地，不过是别人案板上的一盘菜，养肥了便要上桌。良久，程程抬起头，眼底燃着两簇幽火，声音却出奇地平静：朱雀秘境里，有我妖族祖圣的一缕残魂——若得它相助，裂谷便不再是任人收割的牧场。她说着，转向你，那两簇幽火映着你的影子，声音低而沉：你……愿意陪我去吗？夜风从裂谷方向吹来，带着远古的血腥与不甘。你望着她，缓缓点头：妖城的事，就是我的事。那一夜，你与程程在含香殿的屋顶上坐了很久。她难得没有化作白狐，而是以人身的模样坐在你身边，抱着膝盖，望着漫天的星子。她忽然开口，声音很轻：我小时候，老绣娘给我讲过一个故事——说远古的时候，妖族的祖先们都是天地间的宠儿，凤凰栖于梧桐，麒麟行于山野，龙潜于九渊，逍遥自在，谁也管不着。她顿了顿：后来天上来了人，说它们资质好，要把它们接去享福。再后来……就没有后来了。你说：后来它们都成了坐骑。她嗯了一声，没有再说。夜风很凉，你把自己的外袍解下来，披在她肩上。她没有拒绝，只是把外袍拢了拢，低声道：秦弈，若有一天妖城真的保不住了……你带着夜翎走，别管我。你皱眉：说什么胡话。她笑了笑，没有争辩，只是把脸埋进膝间，声音闷闷的：我不是胡话。我这条命是妖城给的，妖城在，我在；妖城没了，我也没有独活的道理。可你不一样，你还有很长的路要走。你看着她蜷成一团的背影，忽然伸手，把她连人带袍子揽进怀里：那我也告诉你——我这条命，是你从荒山里背回来的。你要守妖城，我陪你守。守不住，我陪你走。走到哪，算哪。她没有挣扎，只是在你怀里，极轻极轻地嗯了一声。那夜之后，程程像是下定了什么决心。她开始每日清点妖城的战力，把几路妖将召到含香殿，一版一版地推演裂谷的防线；又让人把城中的老弱妇孺分批迁往妖城后方一处隐秘的山谷，说是未雨绸缪。夜翎不解，跑来问你：哥哥，师父为什么要把大家送走？不是说要守城吗？你蹲下来与她平视，想了想，道：你师父不是要弃城。她是要让那些不能打仗的妖，先有个安全的去处——这样真打起来，她才没有后顾之忧。夜翎似懂非懂地点点头，忽然道：那我也不走。我要留下来帮师父打架。你看着她认真的小脸，没有说好，也没有说不好，只摸了摸她的头：等你师父安排。夜翎急了：那她肯定让我走！你笑了笑：那你便求求她。夜翎眼睛一亮，扑棱着翅膀就去找程程了。你望着她的背影，心里那根弦却绷得更紧了——程程开始安排后路，说明她心里清楚，那场大战，怕是躲不掉了。',opts:[
  {k:'A',tag:'解封',c:'#C4675C',tx:'随程程赴朱雀秘境，解封祖圣残魂',hint:'影响：入战（守窟妖物·强）；得朱雀火线',run:()=>{log('红尘卷·四卷','朱雀秘境的封印在裂谷最东，一红一暗两色交织如狱。程程以乘黄之血为引叩开封印，窟中骤然传来一声穿云裂石的清鸣——朱雀残魂，苏醒了。守窟的怨灵也随之一齐暴动，向你扑来！');startCombat(rdEnemy('守窟火魈',2.0),'rd4Fight');}},
  {k:'B',tag:'布防',c:'#7FA8C9',tx:'先回妖城布置裂谷防线，再谋朱雀',hint:'影响：程程好感+2；稳扎稳打',run:()=>{rdLove('程程',2);log('红尘卷·四卷','你与程程星夜回城，将裂谷各处秘境的入口一一设下连环妖阵。鹰厉领命巡边，沙雕杠精石头几个小妖被派去放哨——它们叽叽喳喳：“大王放心，天上人来了我们第一个知道！”程程望着忙碌的妖城，忽然低声道：“若真有那么一天……你会在么？”你答：“我这不是还在么。”');}},
  {k:'C',tag:'潜天',c:'#8B6FA8',tx:'将计就计，借“收割者”身份混入天界联络点',hint:'影响：高风险；获天上人布防图',run:()=>{log('红尘卷·四卷','你易容改扮，冒充玄阴宗引荐的“人界供奉”，混入裂谷对面那处观星台。台上供奉正与天上联络，你旁听许久，拼凑出那“收割者”的巡谷路线与兵力布防。临别时你顺手毁了台上半座传讯阵——够他们乱一阵子了。');}},
]},
{t:'圣龙峰 · 龙蛇演义',meta:'强制节点：天上人乾元提前降临，妖城存亡一战；圣龙峰龙骨之秘',scene:'朱雀残魂归位那一夜，妖城上空忽然乌云压顶，云层低得几乎要贴上城楼，雷光在云隙间明灭不定，空气里弥漫着一股山雨欲来的压迫感。云中传来一声漠然的宣判，不带任何情绪，像在宣读一道早已写好的旨意：圈养千年，收成之时。尔等妖物，当献血脉。天上人的收割者，乾元级的存在，提前来了。程程立于城头，化作丈许白狐，独角映月，通体如雪，身后万妖列阵，妖气连成一片，竟把城头的灯火都压得暗了几分。她回头看了你一眼，琥珀色的眼底没有惧色，只有一种决然——那是守土之兽的眼神，身后就是家，退无可退。你站在她身侧，一柄长剑横在身前，剑身映着月华，泛着冷冷的光，剑尖微微指向云端那道人影。大战将起，空气凝滞得像要滴出水来，连风都停了。可就在此时，夜翎忽然浑身发抖，一把拽住你的衣角，声音带着前所未有的惊惶：哥哥……圣龙峰……它在叫我。你顺着她的目光望向极东之地——那座龙骨化作的圣山，此刻正喷涌出滔天怨气，黑雾翻腾，隐约可见龙形虚影在雾中挣扎嘶吼，一声声低沉的龙吟穿过百里传来，震得人耳膜发麻。山腹深处，仿佛有什么东西正在苏醒，连大地都在随之震颤，城头的旗帜无风自动。你识海里那道白玉小人的声音猛地发紧，罕见的急促：那是门之碎片……先天之宝！它顿了顿，声音沉了下去：难怪天上人提前来了——他们等的，恐怕不只是妖城这一季的血脉，还有圣龙峰底下那件东西。你握紧剑柄，目光在云端那道人影与圣龙峰之间来回扫过，电光火石间，已明白今夜的选择不只关乎妖城存亡，还关乎一件连天上人都觊觎的至宝。这一夜，注定不好过。云端那道人影显然也察觉了圣龙峰的异动，他目光一凝，望向极东之地翻涌的黑雾，声音里第一次带上了情绪——是贪婪：门之碎片……竟在这里。他当即舍弃妖城，身形一晃，直扑圣龙峰而去。程程立时明白他的意图，寒声道：他要去抢那东西！你咬牙：追！你与她一前一后追向圣龙峰。龙骨化作的山体在月色下泛着惨白的光，山腹中怨气冲天，无数龙骨怨灵感应到生人的气息，从山壁中探出半透明的身躯，张牙舞爪地扑来。你且战且走，程程的独角射出雪白的妖光，替你开出一条路。追到半山腰，你看见那收割者正悬于山腹裂口上方，一只手探入黑雾之中，掌心金光涌动，竟是要强行摄取那枚门之碎片。黑雾中的龙形虚影发出痛苦的嘶吼，整座圣龙峰都在震颤。你望着那枚在雾中若隐若现的碎片，又看了看身边气喘吁吁的程程，一个念头在心底飞速成型——绝不能让他得手。你与程程对视一眼，无需多言，便明白了彼此的意思。你纵身跃下山腹裂口，抢在那收割者之前，一剑斩向那团黑雾——剑光没入雾中，却没有斩碎它，反而像捅了马蜂窝，无数龙骨怨灵从雾中汹涌而出，铺天盖地地扑向最近的气息来源。那收割者首当其冲，被怨灵缠了个正着，惊怒道：区区怨灵，也敢拦我！他袍袖一拂，金光四射，将扑到身前的怨灵扫灭一片——可怨灵无穷无尽，灭了一批又涌上一批，饶是他修为通天，也一时脱不开身。你趁乱贴着山壁潜入雾中，在龙形虚影盘旋的中心，看见那枚碎片静静悬浮——它只有巴掌大，通体流转着混沌的光，像一块凝固的星河，又像一枚睁开一半的眼瞳。你伸手握住它的刹那，一股浩瀚到近乎蛮横的力量顺着掌心涌入四肢百骸，识海里那道白玉小人发出一声低低的闷哼，竟被震得摇摇欲坠。你咬牙忍住，将那枚碎片收入袖中，转身便走。身后，那收割者的怒吼与怨灵嘶鸣混成一片，震得整座圣龙峰都在颤抖。',opts:[
  {k:'A',tag:'迎战',c:'#C4675C',tx:'与程程并肩，正面迎战天上收割者',hint:'影响：终局BOSS战（乾元级·极凶）',run:()=>{log('红尘卷·四卷','你与白狐形态的程程冲天而起，一左一右夹击那云端的身影。收割者冷笑：“萤火之光。”抬手间，天雷如雨倾泻而下。你咬牙硬扛，程程的独角凝聚万妖之力，一寸寸逼近那团云影——“这一战，不为别的——为我妖城万年，不再做任何人的牛羊！”');startCombat(rdEnemy('天上收割者·玄冥',2.2),'rd4Boss');}},
  {k:'B',tag:'取门',c:'#A98FD9',tx:'趁乱直取圣龙峰，先夺门之碎片',hint:'影响：得门碎片（武修至宝）；需战怨灵',run:()=>{log('红尘卷·四卷','你化作遁光射向圣龙峰。山腹之中怨气如潮，无数龙骨怨灵向你扑来——你且战且走，终于在山心看见一枚流转着混沌光的碎片，静静悬浮于虚空。你伸手握住它的刹那，一股浩瀚的力量顺着掌心涌入四肢百骸。');startCombat(rdEnemy('龙骨怨灵王',2.1),'rd4Fight');}},
  {k:'C',tag:'借势',c:'#7FA8C9',tx:'引天上人入圣龙峰，借怨灵困敌',hint:'影响：借刀杀人；破其护身法',run:()=>{log('红尘卷·四卷','你佯败向圣龙峰退去，那收割者果然追入山腹——龙骨怨灵认生，刹那将这位“不速之客”围了个严实。天上人又惊又怒：“区区怨灵……”你立于洞口，笑眯眯道：“前辈慢慢玩，我先走一步。”身后传来他的怒吼与怨灵嘶鸣混成一片。');}},
]},
{t:'终幕 · 永久留存',meta:'终幕抉择：天上之危暂解，流苏复活之愿与你的前路',scene:'圣龙峰一战惊动了天上——那位收割者铩羽而归，临走时撂下一句此事不算完，声音冷得像淬了冰，身影消失在云层深处时，天边的乌云还压了很久才散。妖城上下加紧备战，鹰厉带着巡卫日夜不歇，连街边卖胭脂的小妖都开始学着握刀，城头添了三重箭楼，地库里堆满了符箓与妖兵。可程程却在深夜里独自站在含香殿的回廊下，望着裂谷的方向发呆，月光把她白狐的影子拉得很长很长，风拂过她的毛尖，她却一动不动，像在望着什么看不见的远方。而你识海深处，那道陪你走过千山万水的白玉小人忽然轻声开口，声音带着一种许久未见的温柔与迟疑：我复生所需的先天之物——冥华玉晶、天魄玄壤、血凛幽髓、建木天实……大多在幽冥与天外。秦弈，你……不必为我冒这个险。它说着，声音低了下去：我只是一缕残魂，能陪你走到这里，已经很好了。窗外，夜翎的螣蛇翅在月光下泛着新生的金光，她睡得正熟，梦里不知梦见了什么，嘴角微微翘着，翻了个身，翅膀轻轻收拢；远处，程程的窗棂透出暖黄的灯火，隐约可见白狐蜷在软榻上的剪影，一只耳朵还竖着，像在听夜里的动静。天上人的阴影仍在，随时可能卷土重来；流苏的心愿未了，那四味先天之材一样比一样难寻，冥华玉晶在幽冥，血凛幽髓在魔渊，天魄玄壤在建木之下，建木天实在天外之天；妖城的前路未卜，程程肩上担着万妖的生死，夜翎还在学着长大。你立于裂谷之巅，风鼓起衣袍，猎猎作响。月光下，四条路在你面前铺开，每一条都通向不同的远方——有的灯火可亲，有的云雾缭绕，有的直上九霄。你握了握拳，又松开，指尖触到怀里那枚温润的平安符，那是南离故人一针一线缝的。你把它按在胸口，低声道：无论走哪条路，我都不会是一个人。往哪边走，都由你。你又在裂谷之巅站了很久，那些先天之材的名字，她早已念过许多遍，此刻又在心底沉沉过了一遍——每一样都只在传说中听过，每一样都难如登天，可她从未催过你半句。识海里的白玉小人仿佛感知到你的念头，轻轻叹了口气：其实你不必如此。我最初只是一缕执念，能陪你看过这么多风景，已经很满足了。你没有答话，只是望着天上的月亮，想起很多年前，在仙迹山脚那个小小的村庄里，徐伯磕着烟杆对你说：小伙子，人这一辈子，总得有个念想。那时候你还不明白，念想是什么。后来你走过南离、走过裂谷、走过妖城、走过万道仙宫，遇见过许多人，也送走过许多人，才渐渐明白——念想不是虚无缥缈的东西，它是你在最冷的夜里，还愿意往前走的那点火。你把手伸进怀里，那枚平安符的针脚已经有些磨旧了，却依旧结实。你轻声道：流苏，你陪我蹚过南离的地宫、裂谷的血潭、妖城的地脉、仙宫的云海——这回，换我陪你去幽冥走一趟。白玉小人在识海里安静了很久，才极轻地嗯了一声。你最后望了一眼妖城的方向——含香殿的灯火还亮着，像一颗暖黄的星子，缀在夜色里。你转身，向东，往东海尽头走去。传说那里，有通往幽冥的路。你走出一段路，忽然停下脚步。身后传来一阵极轻的脚步声——你回头，看见夜翎不知何时跟了上来，手里攥着一包东西，跑得气喘吁吁：哥哥，程程师父说你去很远的地方，让我把这个给你！她把那包东西塞进你怀里，你打开一看，是一叠缝得结结实实的灵符，还有一包糖渍的灵果——符是程程连夜画的，果是夜翎攒了许久的零嘴。你蹲下来，看着她跑得红扑扑的小脸，忽然道：夜翎，哥哥要去的地方，可能很久都回不来。她用力点头：我知道！所以你一定要回来——师父说，你要是敢不回来，她就亲自去幽冥把你拎回来！她说着，学着程程的语气，凶巴巴道：听到没有！你忍不住笑了，伸手揉了揉她的发顶：听到了。你目送她挥着翅膀跑远，把那包灵符贴身收好，又拈起一颗糖渍灵果放进嘴里——很甜，甜得有点发苦。你转身，继续向东。身后，妖城的灯火渐渐远了，远成一颗暖黄的小星子。你摸了摸怀里那枚平安符，又摸了摸那叠灵符，忽然觉得，前路虽然漫长，可那些牵挂你的人，已经把你的行囊装满了。',opts:[

 '凡尘归人':{title:'凡尘归人 · 携卿同行',review:'南离已毁，你却把南离的人带在了身边。青君卸下摄政王的担子那日，笑得像当年仙迹山下那个追着银枪跑的小姑娘。',text:'你在离火废墟旁建了一座小城，安置南离遗民。李青君把虎符挂在城门口当门环，任谁都能推门进来讨碗水喝。夜里她靠在你肩头，忽然说：“当年你说，等你学成归来保护我——我等到了。”你揉了揉她的发顶：“那说好了，往后我替你挡着，你只管做你自己。”远处，明河的身影在月光下一闪而过，只留下一声轻叹，像是替这段跨越仙凡的缘分，落了个句点。',give:()=>{S.six.道心=clamp(S.six.道心+2,1,20);S.wudao['剑道']=(S.wudao['剑道']||0)+2;if(!(S.daoban||[]).includes('李青君')){S.daoban=S.daoban||[];S.daoban.push('李青君');}}},
 '云游仙凡':{title:'云游仙凡 · 处处是仙',review:'你没有在一处停留太久。明河说得对——只要你踏足人世，自然会发现处处是仙。',text:'你辞别仙宫，辞别大乾，背着那卷居云岫送你的《山海画谱》，一路走走停停。凡人的庙会、妖怪的夜市、古战场的一缕剑意，都被你收进眼里。某天你路过一座无名小镇，茶馆里说书人正拍着醒木，讲“万道仙宫那位监察使大人”的故事——你听了一耳朵，往桌上放了枚铜钱，笑着走了。',give:()=>{S.six.悟性=clamp(S.six.悟性+2,1,20);S.six.仙缘=clamp(S.six.仙缘+2,1,20);}},
};

{t:'别离 · 君子攸行',meta:'强制节点：与南离故人作别，明河指路万道仙宫',scene:'西荒既平，南离百废待兴。离火城的断墙在一点点长回原样，街市上重新有了叫卖声，连长生观门前的石阶都被香客磨得发亮。李青君一身戎装站在议事厅里发号施令，眉眼间的天真已尽数化作沉凝——她是南离摄政王了，案头堆着灾后重建的折子，腰间别着虎符，可你偶尔经过她窗前，会看见她对着南离舆图发呆，指尖摩挲着当年太子府的位置。你没有道别，只在夜里与她并肩看过最后一次南离的星月——她难得卸了盔甲，换了身素净的衣裳，坐在城楼上，两壶酒，一碟花生米，谁也没说话，就那么看了半夜的星星。天将亮时，她忽然开口：什么时候走？你一愣，随即笑了：瞒不过你。她没回头，声音淡淡的：你这一身本事，窝在南离修城墙，本来就是屈才。她顿了顿，声音低下去：走可以，但记着——南离的门，永远给你开着。翌日清晨，你悄悄离城，没有惊动任何人。行至城郊，明河已在官道边等你，蓝白道袍上沾着晨露，像站了很久：贫道历练已毕，当回宗门闭关，特来辞行。她顿了顿，又递过一枚玉简，指尖在简上停留了一瞬：道友层次已与凡俗不同，若想看看今人修行与远古的差异——可往万道仙宫一行。所谓万道，尽是近古才出现的稀奇古怪的修行理念。你接过玉简，入手温凉，隐隐有清气流转。你问她：仙宫在何处？她抬手遥遥一指北方的天际：数万里云路，翻过中土十八州。道友若去，可报监察使之名。你握着玉简，忽然想起什么，回头遥遥望了一眼离火城的方向。晨雾未散，城头残旗下，一个银甲身影静静站着，像一杆插在城墙上的银枪——她到底还是来送了，只是没有上前。她看见你回头，远远举起手，晃了晃，又放下，转身下了城楼，步伐利落，没有半点拖泥带水。你目送她消失在晨雾里，才发觉自己一直在屏着气。你翻身下马，把鞍上那壶昨夜没喝完的酒提下来，对着城门的方向遥遥一举，仰头灌了一大口——酒还是温的，她大概一早就温好了，放在你必然能看见的地方。你喝完最后一口，把空壶挂在路边的歪脖子树上，心想：下回回来，再给你带一壶好的。明河在旁静静看着，没有说话，只是等你收好玉简，才淡声道：走吧，天要亮了。两人一前一后踏上官道，晨光将影子拉得很长。你与明河一路同行，她话少，你便也不多言，只并肩赶路。倒是她见你闷头走，沉默半晌，主动开口：你那位南离的摄政王，是个可敬之人。你嗯了一声。她顿了顿：此去仙宫，数万里之遥，你若思念故人，不妨修书一封，贫道可托人捎回。你笑着摆手：不必。她自己就是撑得起一座城的人，用不着我婆婆妈妈。明河看你一眼，没有再说。行至一处渡口，两人歇脚。你买了两碗阳春面，她看着那碗面，难得露出一点温和的神色：贫道修行至今，极少吃这些凡物。你问：那吃什么？她道：辟谷。你失笑：那多没意思。她看了你片刻，低头挑起一箸面，慢慢吃了。那一碗面，她吃得很慢，也很认真。过了几日，你们行至一处山隘，明河忽然停下脚步：再往前百里，便是贫道师门所在了。她顿了顿：送君千里，终须一别。道友，我们就此别过。你抱拳：后会有期。她颔首，正要转身，忽然又停住，从袖中取出一枚素白的玉佩递给你：此佩有贫道一缕剑气，若遇强敌，可挡一击。她说完，不待你推辞，已飘然而去，蓝白衣袂在风里翻飞，像一朵远去的云。你握着那枚尚带余温的玉佩，忽然想起一路同行时她那些话少却认真的指点——这道姑看着清冷，心里却比谁都记着情分。你收好玉佩，独自踏上通往万道仙宫的云路。你忍不住回头，看见那壶酒还挂在树上，在风里轻轻晃着，像有人在朝你挥手。你望着那道渐渐被晨雾吞没的背影，心里忽然有点说不清道不明的滋味，像那壶没喝完的酒，温温地搁在胸口。你收回目光，把玉简贴身收好，朝明河点点头：走吧。',opts:[
  {k:'A',tag:'随行',c:'#7FA8C9',tx:'与明河同行一段，顺路请教修行',hint:'影响：明河好感+2；遇险时她护你',run:()=>{rdLove('明河',2);log('红尘卷·三卷','明河没有拒绝你同行。她话少，却会在你问及功法时认真答上许久；你偶尔口花花，她便别过脸去，耳尖却悄悄红了。两人一路向北，翻过南离边境的青山，往中土而去。');}},
  {k:'B',tag:'独行',c:'#6FA698',tx:'谢绝同行，独自云游历练',hint:'影响：自由路线；少一段羁绊',run:()=>{log('红尘卷·三卷','明河也不强求，稽首道：“那道友自便。万道仙宫数万里之遥，途中或有凶险，多加小心。”她飘然而去。你独自踏上官道，哼着不知名的小调，倒也自在。');}},
  {k:'C',tag:'带信',c:'#C9A45C',tx:'托明河替南离留意仙家后台之约',hint:'影响：李青君好感+2；埋下故国伏笔',run:()=>{rdLove('李青君',2);log('红尘卷·三卷','你托明河：若南离有事，望她垂念今日同行之谊。明河沉默片刻，颔首道：“南离与贫道也算有缘。道友放心。”她转身时衣袂微动，你隐约听见一声低语：“……他倒是，真的惦记着。”');}},

{t:'仙落凡尘 · 古画执念',meta:'强制节点：地脉封法之险，古尸执念托付',scene:'数日后，你与明河行至一处地脉异常的山谷——此地灵气被地脉扭曲，天地间像蒙了一层灰纱。你试着一引法诀，丹田空空如也，法力竟半点感应不到！你心头一沉，又试了两次，仍旧毫无动静，仿佛一夜之间被打回凡人。明河同样脸色微白，扶着一块山石缓缓坐下：此地方圆……怕是要一月方能复原。她话未说完，山腹深处忽然传来一声低吼，沉闷浑厚，震得山谷嗡嗡回响。下一瞬，一头近乎不灭的古尸破土而出——它浑身缠着干枯的皮肉，双目灰蒙，见活物便扑，动作虽僵，力道却大得惊人，一爪拍碎山石，碎石飞溅如雨。你抱着法力尽失的明河就地翻滚，狼狈至极，滚出七八丈才堪堪避开。古尸不依不饶，步步紧逼。千钧一发之际，你识海深处那道声音冷哼一声，一缕幽光自你眉心射出，凝成一柄寒光凛冽的狼牙棒虚影，一棒砸在古尸天灵盖上——那古尸竟被一棒敲得僵住，浑浊的眼珠里，凶戾之气慢慢退去，竟渐渐柔和下来：抱歉……我本不该苏醒，变成这副模样。它沉默良久，转身蹒跚着走回山腹，停在一座石室前。你扶着明河跟进去，才发现石室墙壁上挂着一幅画——画中一个白衣女子正在舞剑，衣袂飘飘，剑光如水，虽是死物，却透着勃勃生气。古尸痴痴望着那幅画，声音沙哑得像风干的树皮：她叫阿荷，是我师妹。百年前我等她出关，她却在闭关时走火入魔，等我赶到，只来得及把她最后一缕执念封进画里。它低声道：万道仙宫说，或许能帮我把画中人具现……可我自己却已到寿限。若只是长着一张相同的脸，要了何用？若是真的一样的她……她活了而我死了，岂非把我的痛苦转嫁给她？它说着，枯槁的眼窝里竟滚出一滴浑浊的泪：珍惜眼前人，莫到了永诀之后，才知后悔。它说完，缓缓盘膝坐下，双手结印，周身浮起一层淡金的光——它把自己仅剩的执念与法力，尽数封进那幅画里。画上的白衣女子仿佛活了过来，剑光流转，似在无声地舞蹈。古尸的气息渐渐淡去，最后留一句话：带了此画，墓葬禁制便不会伤你们。它的身躯化作飞灰，只余一枚骨珠滚落在地，温润如玉。你站在那幅画前，久久没有说话。你弯腰拾起那枚骨珠，入手温热，像还残留着古尸百年的执念。你把它仔细收进怀里，又取下那幅画，卷好，背在背上——画上的白衣女子仍在舞剑，剑光如水，仿佛下一秒就要从画里走出来。你回头看了一眼明河，她正靠着石壁调息，脸色比方才好了些，道巾散乱，长发披垂，像一朵被风雨打湿的云。你走过去，把水囊递给她：能走么？她接过水囊，低声道：法力还要些时日才能恢复。此地不宜久留，我们先寻个安全处。你点头，弯腰把她背起来——她身子一僵，半晌才轻声道：放我下来，我自己能走。你头也不回：等你法力恢复了再说。她沉默片刻，终究没有再坚持，只是把脸偏向一侧，耳根微微泛红。你背着她在山谷里寻了一处避风的岩洞，生起火，又取出干粮分给她。火光映着她的侧脸，她忽然开口：方才那古尸说，珍惜眼前人。你嗯了一声。她顿了顿，像是想说什么，终究没有说出口，只低低道：睡吧，我来守夜。你靠着岩壁合上眼，梦里却总看见那幅画你睡到半夜，忽然被一阵极轻的剑鸣惊醒。睁眼一看，那幅背在背上的古画竟自行展开，悬在半空，画中的白衣女子剑光流转，正一板一眼地演练着一套剑法——剑势缥缈，暗合天地之理，竟是一门极上乘的传承。你屏息凝神，将这路剑法默默记下。待到画中女子收剑而立，画卷无声落回你怀中，一切重归寂静，仿佛什么都没发生过。你望着那幅画，忽然明白古尸那句执念为何要封进画里——他不止是想念师妹，更是把毕生所学与那句珍惜眼前人，一并托付给了有缘人。你朝那幅画郑重一揖。夜风穿过岩洞，画角轻轻扬起，像是在回应。——画里的白衣女子舞着剑，剑光流转间，仿佛在问：你心里那个眼前人，又是谁？',opts:[
  {k:'A',tag:'得宝',c:'#A98FD9',tx:'依言取画入墓，收下前辈遗藏',hint:'影响：得《古画残卷》（可鉴妖/悟道）',run:()=>{S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='画魂·残'))S.fashu.push({n:'画魂·残',elem:'',power:0,mp:6,系:'奇'});S.lingShi+=200;log('红尘卷·三卷','墓中禁制果然不伤持画之人。你取出一卷泛黄的《古画残卷》，画中剑意凛然，隐约有那白衣女子的影子。你望着那画，忽然想起古尸最后一句话——珍惜眼前人。转头看明河，她正虚弱地靠墙调息，道巾散乱，长发披垂，像一朵被风雨打湿的云。');}},
  {k:'B',tag:'安魂',c:'#6FA698',tx:'将画焚于墓前，送前辈执念归去',hint:'影响：功德+3；得前辈一缕道意',run:()=>{S.merit+=3;S.six.道心=clamp(S.six.道心+1,1,20);log('红尘卷·三卷','你将画置于墓前，一点灵火落下，画中白衣女子渐渐化作飞灰。古尸仿佛终于安心，微微颔首。一缕若有若无的道意却飘入你眉心——那是他一辈子“珍惜眼前人”的执念，化作了你道心上的淡淡印痕。道心+1、功德+3。');}},
  {k:'C',tag:'疗伤',c:'#D88FA5',tx:'先寻药为明河疗伤，不问遗藏',hint:'影响：明河好感+3',run:()=>{rdLove('明河',3);log('红尘卷·三卷','你顾不上什么墓葬遗藏，背起明河寻到山涧灵泉，又取出随身丹丸为她续气。明河靠在你怀里，睫毛微微颤动，半晌才低声道：“……多谢。”她素来清冷，这一句“多谢”里，却带了前所未有的温度。');}},
]},
{t:'魔女 · 孟轻影的交易',meta:'强制节点：遇魔女孟轻影，亦敌亦友',scene:'弘法寺前，你为解救被掳的良家女子而来——江湖传言，这寺里的和尚表面吃斋念佛，暗地里却干着采花掳人的勾当，半月来已有七八个姑娘失踪。你潜入寺中，一路摸到后院柴房，正要破门，却听见里面传来一声轻笑。你一脚踹开门，看见的却不是被掳的女子——一个黑衣魔女正笑吟吟地把玩着一枚飞梭，脚下躺着几具和尚的尸首，那些被掳的姑娘缩在墙角，瑟瑟发抖，却毫发无伤。她抬起头，上下打量你，眼底带着饶有兴味的光：哟，来晚了。这寺里的秃驴，本姑娘已经替天行道了。她自称孟轻影，九幽道中人，炼傀儡、御影术，与你是敌非友。你说她滥杀，她理直气壮得让人想笑：我炼傀儡，原本与你们无关；明河来坏我好事，我便杀明河——有什么问题？那几具和尚尸首里的确有作恶多端的，可也有几个只是普通僧众。你指出来，她眨了眨眼：哦，那几个啊？顺手，顺手。一番交手，你与她谁也奈何不得谁——她的影遁神出鬼没，你的剑意密不透风，两人在院子里你来我往拆了上百招，瓦片碎了一地，却谁也没占到便宜。孟轻影忽然收了飞梭，退后三步，笑道：听说你是个讲道理的人。既然互相奈何不得，今日便罢了——那些良家女子，你行侠仗义救了便是；寺外残余的和尚，也只看见杀进寺的是你。她偏了偏头，笑得很甜：秦弈，咱们后会有期。话音未落，她的影子一扭，像水里的墨迹一样散开，人已消失在阴影里，只留一阵若有若无的香气。你站在原地，看着她消失的方向，心里那根弦绷着没放。你收好那枚黑色铃铛，正欲离开，忽然想起一事——方才交手时，孟轻影使的那套影遁，分明有几分九幽道嫡传的影子，可她的身法里又夹杂着一丝不属于九幽道的飘逸，像是从别处学来的。她一个九幽道魔女，怎么会别的门派的功夫？你心里记下这个疑点，又想起她临走前那句后会有期——她不像是在放狠话，倒像是真打算再找你。你摇摇头，把那些念头暂时按下。走出寺门时，天已黄昏，残阳如血。你回头望了一眼那座空荡荡的寺院，忽然觉得，这一趟救人，倒像是撞上了一桩更大的因果。那枚铃铛在你怀里，隐约透着一丝凉意，仿佛在提醒你：这段缘分，才刚刚开始。当夜你宿在城中客栈，把那枚铃铛放在枕边，翻来覆去看了半晌——铃身内壁刻着后会有期四个字，笔迹清秀，倒像她认真写的。你想起她交手时的身法，忽然坐起身，在灯下铺开一张纸，把记忆里她的招式一招一招画下来。画到一半，你停住笔——那套影遁的路数，你不止在孟轻影身上见过。当年在裂谷，那个被怨魂反噬的驭妖巫师，临死前催动的遁法，与她的影子几乎同出一源。你心头一凛：九幽道、裂谷巫师、欢喜寺……这些线头，似乎正在悄悄指向同一个地方。你把那张画纸仔细折好收进怀里。这趟万道仙宫之行，怕是要比预想中更热闹了。这魔女修为不弱，行事却处处透着古怪——她说自己是九幽道中人，可方才交手时，她几次能下杀手，都收了几分力。是试探，还是别的什么？你暂时想不明白，只把那几个姑娘送出寺去。那几个姑娘千恩万谢，说家在城西，要请你回去喝碗茶。你摆摆手，让她们赶紧回家，别回头。她们走了两步，一个年纪最小的忽然回头，怯生生问：恩公，那个黑衣姐姐……是好人还是坏人？你被问住了，想了想才答：她现在还不是好人，但也没那么坏。小姑娘似懂非懂地点点头，小跑着追上前面的姐姐们。你目送她们走远，转身时，却见寺墙的阴影里不知何时多了一枚飞梭——孟轻影留下的。飞梭上缠着一根丝线，线上系着一枚小小的黑色铃铛，轻轻一晃，发出细碎的声响。你拿起那枚铃铛，发现铃身内侧刻着两个字：后会有期。你捏着那枚铃铛，忽然笑了：这魔女，还挺会留东西。你把它收进怀里，想着那铃铛的样子，却莫名觉得，这九幽道的魔女，好像也没有传闻里那么不近人情。',opts:[
  {k:'A',tag:'记仇',c:'#C4675C',tx:'记下这笔账，下次见真章',hint:'影响：孟轻影好感-1；留一宿敌',run:()=>{log('红尘卷·三卷','你望着她消失的方向，冷声道：“下次见面，可没这么便宜。”夜里你复盘交手，发现这魔女的影遁与傀儡之术处处透着古怪——若下次再遇，得留三分后手。');}},
  {k:'B',tag:'交易',c:'#8B6FA8',tx:'以一份炼魂材料换她的情报',hint:'影响：孟轻影好感+2；得九幽道见闻',run:()=>{log('红尘卷·三卷','你隔空传音：“等等——你既要炼傀儡，想来缺一味‘凝魂沙’？”孟轻影的身影在阴影里顿住，片刻后重新凝实，眯眼笑道：“有意思。说吧，你想换什么？”你用一袋凝魂沙，换来一卷关于九幽道与各宗魔修的见闻录。临别她难得正色：“秦弈，你是第一个和我做交易不耍花招的人。下回，给你打个折。”');}},
  {k:'C',tag:'提防',c:'#7FA8C9',tx:'暗中记下她功法破绽，留给明河',hint:'影响：明河好感+1；克制影遁之法',run:()=>{rdLove('明河',1);log('红尘卷·三卷','你把交手时察觉的影遁破绽写成密卷，托人送去明河师门。数日后回信只有两个字：“收到。”但你后来听说明河在斩妖时，专克九幽遁法——那一手，显然是从你密卷里来的。');}},
]},
{t:'琴棋书画 · 居云岫',meta:'强制节点：万道仙宫·琴棋书画山，见居云岫',scene:'数万里云路，你风餐露宿，踏过中土十八州，终于寻到万道仙宫所在。可更先一步迎接你的，是仙宫外一座云雾缭绕的山——琴棋书画山。山门处古松参天，溪水潺潺，隐隐有琴音从云雾深处传来，时断时续，像有人在云端闲敲棋子。你拾级而上，转过一道山弯，眼前豁然开朗：一座竹楼依山而建，廊下摆着琴案棋枰，墙上挂着水墨丹青，满院子都是墨香与茶香。一名女子斜倚窗边看书，清晨的阳光落了她一身，她穿了件素白的衣裳，乌发松松挽着，手边一盏热茶悠悠冒着白汽，整个人像是从画里走出来的。她抬眼看了你一下，目光平静，声音也淡淡的：来找仙宫的路人，多半先去主殿。寻到我这琴棋书画山来的，倒是头一个。你拱手：听闻此山琴音渺渺、画意飘飘，特来瞻仰。女子微微一笑，放下书卷：会画么？你摇头：略懂。她指尖一点，一道画魂自你眼前凝成——墨色流转，竟化作一只栩栩如生的蝴蝶，绕你三匝，翅上还带着细碎的光点，最后轻轻落回她指尖，化作一点墨痕。她看着你：那就从画学起——对了，我姓居，居云岫。她顿了顿，似笑非笑：不许喊前辈，我没那么老。你还没来得及答话，屋檐下钻出一个小丫头，扎着总角，手里捧着一只大茶壶，正偷偷往壶里添水，嘴里嘟囔：师父又拿我泡茶……她抬头看见你，愣了一下，随即把茶壶往身后一藏，装作什么都没发生，一本正经地行礼：这位公子好，我是清茶，师父的大弟子——兼煮茶的。居云岫瞥了她一眼，悠悠道：清茶，你刚才那句嘟囔，为师听见了。清茶的脸腾地红了。居云岫领你进了竹楼。楼里的陈设极简单，一张琴案，一方棋枰，一面墙的书架，架上的书卷不是功法秘籍，而是满满一墙的画册、棋谱、琴谱与杂记——从山水虫鱼到市井百态，什么都有。她随手抽出一卷画册丢给你：先看这个，明日我考你。你翻开一看，竟是上百幅笔意各异的墨竹——有的挺拔，有的萧疏，有的被风压弯了腰，有的刚冒出笋尖。画旁用小字批着心得，字迹清秀，偶尔还有几笔朱笔的批注，像是另一个人的字。你问：这朱批是谁的？居云岫正低头沏茶，闻言手上动作顿了顿：我师父的。她声音淡淡的，听不出情绪：她走得早，就留下这一墙的画。她说着，把沏好的茶推到你面前，自己端起另一盏，望着窗外远山，不再说话。你低头看那卷画册，忽然觉得那上百幅墨竹里，每一笔都藏着一个人对另一个人的念想。你在琴棋书画山住了下来。居云岫教画，教得极耐心——她不多讲道理，只让你画，画完她便看，看完了只批一句话。有时是墨色太重，有时是留白太少，有时只画一个圈，圈在你最得意的那处笔意旁边。你不解，她便道：这里，是你自己的。记住这个感觉，下次别丢了。七日后，你终于能凝出一分画意，画上的墨竹有了风骨。她看了半晌，难得点了头：有灵性，比清茶强。角落的清茶小姑娘捧着茶壶，一脸委屈：师父，你礼貌吗？居云岫不答，只端起清茶刚沏好的茶，慢悠悠喝了一口。清茶眼巴巴看着那杯被喝掉的茶，欲哭无泪。你站在竹楼前，看着这对师徒，忽然觉得这万道仙宫，比传闻里更有意思。傍晚时分，居云岫留你吃了顿斋饭。饭是清茶做的，素菜豆腐，清淡却爽口。你夸了一句，清茶立刻挺起胸脯：那是，师父的胃，都是我养出来的！居云岫不置可否，只慢悠悠夹了一筷子青菜。饭后你起身告辞，居云岫却道：山高路远，今夜且住下吧——明日我再教你画竹。你怔了怔，随即笑了：那便叨扰了。夜里你躺在客房的竹榻上，听着山风穿过竹林，沙沙作响，像有人在远处低语。你翻了个身，忽然觉得，这琴棋书画山的日子，若能一直这样过下去，倒也不错。',opts:[
  {k:'A',tag:'学画',c:'#A98FD9',tx:'留下学画，观画魂之道',hint:'影响：得画道传承；悟性+2',run:()=>{S.six.悟性=clamp(S.six.悟性+2,1,20);log('红尘卷·三卷','居云岫的画道不拘一格——她随手一挥，墨色自会寻径。你跟着画了七日，从歪歪扭扭的墨竹到能凝出三分画意。她难得赞了一句：“有灵性，比清茶强。”角落的清茶小姑娘：“……师父你礼貌吗？”');}},
  {k:'B',tag:'问琴',c:'#7FA8C9',tx:'求问琴心之境，参悟修行正法',hint:'影响：参悟琴心；悟性+1',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·三卷','居云岫也不藏私，取出一张旧琴随手一拨：“琴心者，以音问心。你听——”琴音入耳，你竟觉丹田微震，多年来囫囵吞枣的修行感悟在这一瞬如珠玉相击。她收琴淡淡看你：“你根基极杂却都通，是走‘万道’的坯子。琴心一关，对你不过是水到渠成。”');}},
  {k:'C',tag:'观棋',c:'#C9A45C',tx:'寻棋痴师叔对弈，磨炼心性',hint:'影响：棋道入心；道心+1',run:()=>{S.six.道心=clamp(S.six.道心+1,1,20);log('红尘卷·三卷','棋痴师叔白眉一挑：“会下棋？”你坐下执黑，杀得他须发皆张。三局过后，他拍案而起：“好小子，心性够野！”他随手丢给你一枚黑子：“这枚子送你——棋如人生，落子无悔。”你握着那枚温润的黑子，若有所思。');}},
]},
{t:'琴心初成 · 破境之悟',meta:'强制节点：琴棋书画山巅悟道',scene:'你在琴棋书画山一住月余。白天跟居云岫学画，看她指尖墨色如何寻径；黄昏陪棋痴师叔对弈，听他讲棋如人生的道理；夜里则坐在山巅看云海翻涌，把多年来囫囵吞下的诸般功法在心底细细梳理——医卜星相、阵纹符箓、剑意丹道，像一抽屉散乱的珠子，总差一根线把它们串起来。居云岫教画教得耐心，她不多讲道理，只让你画，画完她便看，看完了只批一句话：墨色太重、留白太少，或在你最得意的那笔旁画个圈。你不解，她便道：这里，是你自己的。记住这个感觉，下次别丢了。七日后你终于能凝出一分画意，她看了半晌难得点头：有灵性，比清茶强。清茶小姑娘一脸委屈：师父，你礼貌吗？这一日黄昏，居云岫邀你上主峰听琴。山巅云海翻涌，天地苍茫，她盘膝坐在青石上，膝上搁着一张旧琴，琴身漆面斑驳，显然用了许多年。她拨动琴弦，琴音如流水漫过群山，时高时低，时急时缓——你闭目倾听，忽觉多年来杂学的诸般感悟尽数贯通，如百川归海，又如万丝归线，那些散乱的珠子终于被一根看不见的线串成了串。丹田深处一声轻响，壁垒应声而碎，气海暴涨，明台洞开，连眼前的世界都仿佛亮了三分——云是云，山是山，却又不止是云、不止是山。居云岫收了琴，指尖按在琴弦上，琴音余韵袅袅，难得露出赞许的神色：万道归一，是为琴心。恭喜——你算是正式踏上修行之途了。你睁开眼，只觉得浑身上下说不出的通透，朝她郑重一礼：多谢先生。她摆摆手：谢什么，是你自己悟的。正说着，清茶端茶来贺，自己却先灌了一口，含糊道：师父说破境当以茶贺……这茶是我自己喝的！居云岫看着她，意味深长：清茶，你师父我还没聋。清茶一口茶差点呛出来，咳得惊天动地。夜里你坐在竹楼廊下，取出那幅从南离带来的古画残卷，对着月光临摹画中白衣女子的剑意。笔锋落处，剑意隐然成形。身后传来脚步声，居云岫披着外衫走来，看了一眼你的画，难得沉默片刻：画里有人。你一愣：什么？她说：你笔下有牵挂——这是好事，也是修行路上最难的一关。她说完便转身回屋。翌日清晨，你照例去山巅吐纳，却见居云岫已经坐在那块青石上，膝上搁着琴，却没有弹，只望着云海出神。你走过去，在她身边坐下，没有出声。过了许久，她才开口：我师父走的时候，我也问过自己，修行是为了什么。她顿了顿：是为了长生，还是为了不辜负那些已经走远的人？你沉默片刻，答：大概是为了不辜负自己。她闻言，微微一怔，随即笑了：你这个答案，比我当年想的通透。她说着，抬手拨了一串琴音，清越如泉：那便记住今日的答案。往后修行路上，若有迷惘，就回来听听这山风。你听着那琴音，忽然觉得，这一趟万道仙宫，来得值。此后数日，你每日清晨都去山巅与居云岫同坐，听风，看云，偶尔说话，更多时候只是安静地待着。她不再教你具体的术法，只在你修行遇阻时，用一两句话点破——有时是一句琴理，有时是一句画论，有时只往你画的墨竹上加一笔，那竹子便活了。你渐渐明白，她教你的不是术，而是道——如何让万般杂学各归其位，如何让心不乱，如何在漫长的修行路上，守住那一点本心。清茶私下偷偷问你：公子，我师父是不是偏心？她教你可比教我有耐心多了。你笑：那是因为你师父知道，茶壶里的水该烧多久，比怎么画竹子更重要。清茶愣了愣，琢磨了半天，忽然跺脚：你是不是在说我只会煮茶！你哈哈大笑。',opts:[
  {k:'A',tag:'悟剑',c:'#C4675C',tx:'以画入剑，悟一式破境剑招',hint:'影响：剑道+2、得《画剑·破》',run:()=>{S.wudao['剑道']=(S.wudao['剑道']||0)+2;S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='画剑·破'))S.fashu.push({n:'画剑·破',elem:'金',power:34,mp:18,系:'剑'});S.xiu=clamp(S.xiu+25,0,100);log('红尘卷·三卷','你想起墓中那幅白衣女子舞剑的古画，剑意自笔尖流淌而出——一笔落下，剑光竟随墨迹破空而走。居云岫看了片刻：“好，我琴棋书画山，又多一个会画画又会砍人的。”');}},
  {k:'B',tag:'静心',c:'#7FA8C9',tx:'不急于精进，先夯实根基',hint:'影响：资质/悟性/神识+0.5、道心+1',run:()=>{S.six.资质=clamp(S.six.资质+0.5,1,20);S.six.悟性=clamp(S.six.悟性+0.5,1,20);S.six.神识=clamp(S.six.神识+0.5,1,20);S.six.道心=clamp(S.six.道心+1,1,20);log('红尘卷·三卷','破境之后你反而沉下心来，每日与居云岫论道、陪棋痴师叔对弈、看清茶泡茶——然后被她师父连茶带叶一起喝掉。居云岫难得评价你：“知其雄，守其雌——你这性子，能走很远。”');}},
  {k:'C',tag:'万道',c:'#C9A45C',tx:'兼修杂学，观仙宫百艺图谱',hint:'影响：悟性+1、丹道+1',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);S.wudao['丹道']=(S.wudao['丹道']||0)+1;log('红尘卷·三卷','你翻遍琴棋书画山藏简，将医卜星相诸般杂学尽收眼底。居云岫看你这架势：“……你这么学下去，怕不是要成仙宫新一代的‘百科全书’？”你笑笑：“能多懂一点，往后就少求人一点。”');}},
]},
{t:'大乾 · 潜龙求援',meta:'强制节点：以仙宫监察使身份入大乾，见龙影稀薄',scene:'你凭仙宫监察使之名踏入大乾——中土最鼎盛的王朝，果然气象不凡。皇城巍峨，殿宇连云，可当你凝神望去，却见皇城之上那道龙形虚影盘旋，只是影像稀薄，金光晦暗，如风中残烛，仿佛随时会散。你眉头微皱：一国气运，怎会衰败至此？你换了便装入城，走了半日便看出蹊跷——城中道观香火鼎盛，可那些仙师尽是买来的假道姑、装神弄鬼的把式，掐指一算便说人有血光之灾，转头就推销开光的法器，十两银子一件，成本怕是不到一吊。你冷眼看了几场，心里有了数。这一日，你寻到城东潜龙观——那是一座真正有道行的道观，观主灵虚是个清瘦的老道。他见你进门，打量片刻，忽然脸色一变，惶恐下拜：前辈大驾！仙宫监察使驾临敝观，贫道有失远迎！你摆手：闲话少说。这观星台上的龙形虚影，是你们求援之物？灵虚起身，长长叹了口气：前辈明鉴。我潜龙观与朝廷本是互相依存，观中道众为皇家祈福禳灾，朝廷护我道统香火。可如今却有一伙自称大欢喜寺的淫寺渗透朝野，以双修欢喜禅勾引王公贵戚，行刮骨吸髓之事——他们背地里分明有修仙者撑腰，坏了人间事人间毕的规矩。灵虚说着，声音低下去：陛下被那欢喜禅迷了心智，朝中忠臣或被构陷下狱，或遭排挤外放，再这样下去，大乾的气运……怕是要被他们抽干了。你望着那稀薄的龙影，忽然想起南离那句国名——南明离火。一国气运，如人之元气，损一分便弱一分，再大的王朝，也经不起这样日复一日的掏空。你握紧拳，心里那杆秤，已经偏了。你当夜便宿在潜龙观。灵虚给你收拾了一间静室，又送来斋饭，你摆手说不用，老道却执意搁在桌上：监察使远道而来，敝观虽清贫，一碗素斋还是备得起的。你端起碗，扒了两口，忽然问他：灵虚，你在这大乾多少年了？老道一怔，苦笑道：贫道八岁入观，至今……怕是有六十余年了。你问：六十年，看着这王朝一年年败下去，你就不想走？灵虚沉默良久，轻声道：走？往哪走？贫道八岁那年，是大乾闹饥荒，观里的老道长在路边捡了贫道，用半碗粥养大的。他顿了顿：这朝堂再烂，可这天下还有百姓——他们种田，纳粮，养儿育女，盼的就是个太平。贫道若走了，那些被欢喜寺祸害的人，连个能说话的地方都没了。你放下碗，看着这个清瘦的老道，忽然觉得他佝偻的脊背，比这皇城里那些锦衣玉食的贵人要直得多。你轻声说：这碗粥，我记下了。灵虚抬头看你，浑浊的老眼里，有光一闪而过。翌日，你换了便装，混进欢喜寺的外院。寺里香火极盛，来进香的多是锦衣华服的贵人，身边跟着的随从却个个面黄肌瘦，眼窝深陷，像被抽了骨髓。你冷眼看了半晌，发现那些贵人进香时，都有僧人引着往后院去——后院深处，隐隐传来一丝极淡的阴魅气息，不是凡间手段。你循着气息摸到地宫入口，正要潜入，肩头忽然被人轻轻一拍。你霍然回头，却见孟轻影正倚在墙角，笑吟吟地看着你：哟，监察使大人，也来逛窑子？你皱眉：你怎么在这？她晃了晃手里的飞梭：巧了，我也是来查案的，这欢喜寺，动了我们九幽道的生意。她说着，眯起眼：要不要合作一把？你看着她，沉默片刻：九幽道什么时候也管起人间闲事了？她歪了歪头：谁说我是来管闲事的？那伙秃驴借欢喜禅的名义，偷炼我们九幽道的傀儡术——这是偷师，懂么？偷到本姑娘头上了。你听出她话里半真半假，却也不拆穿，只道：合作可以，规矩先说好——你若在城中滥杀无辜，我第一个拿你。她眨了眨眼：放心，我杀人，只杀该杀的。她说着，忽然压低声音：地宫下面那东西，我一个人吃不下。你来得正好——就当是，你欠我那袋凝魂沙的利息。你心里一动，想起她说的凝魂沙，那分明是卷一赠她的东西——原来她一直记着。',opts:[
  {k:'A',tag:'明查',c:'#7FA8C9',tx:'先查欢喜寺背后撑腰的仙家势力',hint:'影响：揭开大欢喜寺后台',run:()=>{log('红尘卷·三卷','你换了便装混进欢喜寺外院。香烛气里混着一丝极淡的阴魅气息——那不是凡间手段。你循着气息摸到地宫，发现他们竟在暗中收集百官魂魄祭炼。退出地宫时，身后传来一声轻笑：“阁下好灵的鼻子。”回头一看，孟轻影正倚在檐角，笑吟吟地看着你。');}},
  {k:'B',tag:'暗访',c:'#8B6FA8',tx:'潜行入宫，探皇帝虚实',hint:'影响：窥见气运衰败之因',run:()=>{log('红尘卷·三卷','你夜入大乾皇宫，见那皇帝龙袍下隐隐透着一缕邪气——他被“长生丹”吊着命，早已被欢喜寺拿捏。你在寝殿暗格里发现一枚刻着欢喜佛的令牌。回到潜龙观，灵虚听了你的见闻，长叹一声：“陛下……也是可怜人。”');}},
  {k:'C',tag:'直捣',c:'#C4675C',tx:'不查了，直接踏平欢喜寺总坛',hint:'影响：入战（欢喜禅护法）',run:()=>{log('红尘卷·三卷','你懒得绕圈子，一道遁光直扑欢喜寺总坛。护法和尚结成欢喜阵将你围住：“哪来的狂徒！”你掂了掂手里家伙：“万道仙宫，监察使——来查账的。”');startCombat(rdEnemy('欢喜禅护法',1.8),'rd3Fight');}},
]},
{t:'气运 · 镇运之争',meta:'强制节点：大乾气运局收官',scene:'大乾的气运之争终于摊牌。你连着数日明查暗访，把大欢喜寺的底细摸了个七七八八——他们不是普通的淫寺，背后有一尊腾云级的邪修坐镇，借着布种天下的幌子，把一座王朝的气运当成自家的牧场，采补了不知多少年。你正待收网，那邪修却先按捺不住，显出身形——他立于皇城之上，一身血红的袍子，面目俊朗得近乎妖异，一手攥着大乾龙影的虚像，狞笑道：小小监察使，也敢坏本座好事？人间王朝，本就是我等圈养的气运牛羊，万道仙宫也管不到这人间事！他声音滚滚如雷，震得满城百姓抬头望天，人人色变。你飞身而起，剑光直指他攥着龙影的那只手：人间事人间毕——可你修的，已经是仙家的手了。这一趟，我管定了。你识海深处那道声音难得亢奋，像个看见热闹的老流氓：上！拆了这装神弄鬼的玩意！那邪修冷笑，一手探出，漫天邪雾化作无数狰狞鬼手，铺天盖地压来。你举剑迎上，剑意凛冽如霜。皇城上空，一正一邪两道遁光交错纵横，打得风云变色。你眼角余光瞥见城下——无数百姓跪在街巷里，有人双手合十，有人默默望着天上那道护着龙影的剑光，有人低声念着大乾的名字。你忽然明白，这一战，你守的不仅仅是一座王朝的气运，更是这些凡人心里那点念想——天塌下来，总该有人顶着。你与那邪修在皇城上空缠斗了近半个时辰。他修为高你一个大境界，正面硬撼你占不到便宜，可你胜在路数杂、后手多——阵纹、符箓、画魂轮番上阵，逼得他不得不分心应对，那攥着龙影的手始终没能腾出来施法。你瞅准一个空当，一剑削向他腕脉，他被迫松手，龙影虚像脱困而出，发出一声低沉的龙吟，没入皇城深处。邪修惊怒交加：竖子敢尔！他正要再施法召回龙影，城下忽然响起一片山呼——无数百姓不知何时聚到了皇城前的广场上，有人跪着，有人站着，有人手里攥着香，有人只是仰着头，齐声高喊：大乾的气运，是我们大乾人的！不许你抢！那邪修脸色一僵——他修的采补之术，最忌人心背离。那一瞬，他攥着龙影的手上，竟浮起一丝裂痕。你抓住机会，一剑递出，剑光如龙，直取他心口！那一剑落下时，你心头反而异常平静。你想起了南离——想起离火城头那些替你挡箭的守军，想起张家庄棺材下那些白骨，想起长生观地宫里东华子那张温润如玉的脸。这些人，这些事，像一条隐线，把你从南离一路牵到裂谷，又牵到这座皇城之上。你终于明白，你这一路斩的从来不只是妖邪魔修，而是一张张把凡人当牛羊的嘴脸。剑光贯穿邪修护体邪雾时，他脸上的狞笑终于裂了：你……你究竟是什么人！你收剑而立，衣袍猎猎：一个爱管闲事的人。那邪修至死也不明白，他算尽了一座王朝的气运，却没算到会有这么一个人，愿意为了满城不相干的凡人，把命豁出去。你望着他化作飞灰的身影，淡淡道：人间事，人间毕。你不该把手伸到凡人头上。皇城上空恢复了平静。你收剑落地时，广场上的百姓还仰着头，半晌才反应过来——那个护着大乾龙影的人，赢了。不知是谁先喊了一声恩公，接着，山呼海啸般的呼喊声响彻皇城，有人跪下来磕头，有人哭，有人笑，有人把怀里的香一股脑塞给你。你被百姓围在中间，一时有些手足无措。灵虚老道挤进人群，一把攥住你的手，老泪纵横：前辈……大乾，有救了！你拍了拍他的手背，轻声道：龙影还在，往后好好守着。灵虚重重点头。你抬头望了一眼皇城上方——那道龙影重新凝实了些，金光虽然仍淡，却已经不再摇曳如残烛。你忽然觉得，这一战打得值。夜里你独自登上皇城城楼，望着万家灯火，忽然想起远方的南离。你摸出怀里那枚平安符，看了一会儿，又小心收好。',opts:[
  {k:'A',tag:'镇龙',c:'#C4675C',tx:'正面一战，斩邪修护龙影',hint:'影响：入战（采运邪修·强）',run:()=>{log('红尘卷·三卷','你一剑斩开那邪修的护身邪雾，剑光直取他攥着龙影的那只手。他惊怒：“你敢毁我道业！”你冷笑：“你的道业，是吸别人血吸出来的。”');startCombat(rdEnemy('采运邪修·欢喜天',1.9),'rd3Fight');}},
  {k:'B',tag:'谋运',c:'#7FA8C9',tx:'先断其采补之根，再行诛杀',hint:'影响：功德+3；削弱Boss',run:()=>{S.merit+=3;log('红尘卷·三卷','你潜入那邪修老巢，把他埋在大乾地脉下的九九八十一根采补之柱尽数斩断。地脉怒涛反噬，邪修气息肉眼可见地萎靡——他养了百年的“气运牧场”一朝尽毁。你这才施施然升上皇城：“现在，可以好好打一场了。”');startCombat(rdEnemy('采运邪修·欢喜天',1.6),'rd3Fight');}},
  {k:'C',tag:'借势',c:'#C9A45C',tx:'借大乾龙气为剑，一举破敌',hint:'影响：以国运压敌',run:()=>{log('红尘卷·三卷','你引动大乾国运龙气加身，金鳞覆体，一剑递出带着一国之重。邪修脸色狂变：“你竟能御一国之气运！”剑光落下，邪雾尽散。识海里那声音啧了一声：“借国运打架，你也是头一份。”');startCombat(rdEnemy('采运邪修·欢喜天',1.55),'rd3Fight');}},
]},
{t:'援救 · 离火倾覆',meta:'强制节点：南离遭裂谷妖祸，李青君浴血突围',scene:'大乾事毕，你收到一枚带血的传讯符——符上那缕气息熟悉得让你心头一紧，是南离故人！你来不及细想，昼夜兼程赶回。然而迎接你的，却是冲天妖气与满目疮痍：裂谷底下涌出无数妖怪，两三日间毁了这座千年古城——离火城的城墙塌了大半，街市上到处是断壁残垣，长生观被烧成一片白地，只剩半截焦黑的梁柱指着天。你心口像被人狠狠攥了一把，脚下遁光更快。城头，一个浑身浴血的银甲身影正护着一群百姓死守最后一道缺口——是李青君。她枪尖染血，盔甲上全是爪痕箭孔，头发散乱，脸上也添了一道新伤，可她握着银枪的手依然稳如磐石，把冲上来的妖物一头头挑落城下。她看见你从天而降，愣了一瞬，眼底掠过一丝复杂的光，随即沙哑着嗓子喊：你还回来做什么！走啊！你一剑荡开扑向她的妖物，反手扶住她摇摇欲坠的身体，回头一笑：你是我罩的，我不回来谁回来？她眼眶一红，嘴唇哆嗦了几下，忽然把脸埋进你怀里，闷声道：秦弈……南离……没了……她声音抖得厉害，像终于找到一个可以哭的地方，把攒了不知多久的委屈和恐惧一次性倾泻出来。你一手揽住她，一手握剑，望着城下黑压压涌来的妖潮，眼底没有半分惧色。城下那些百姓，有的抱着孩子，有的搀着老人，有的已经挂了彩，可他们都仰着头，看着城头那个抱着他们将军的身影。你深吸一口气，低声道：别怕。城没了，人还在。人还在，就什么都在。你话音刚落，城下妖潮中传来一声震耳欲聋的咆哮——一头山岳般巨大的妖王踏碎半截城墙现身，血红的独眼死死盯着城头。它口吐人言，声音沙哑如磨石：南离……的气运……归我……你握紧剑，正要跃下城楼，却被李青君一把拉住手腕。她抬起头，眼底的泪还没干，声音却已经稳了下来：一起。你看着她，她重复了一遍：秦弈，这一次，我们一起。她说着，把银枪往地上一顿，枪缨猎猎：南离的城可以破，南离的将，不能倒。你心里一热，重重点头：好，一起。你与她并肩跃下城楼，一左一右，剑光与枪芒交织成一片。城下那些百姓看着城头那两个身影，不知是谁先喊了一声：将军还在！城还在！越来越多的人跟着喊起来，声音汇成一片，竟把妖潮的嘶吼都压了下去。那一夜，你与李青君并肩死守离火城，从黄昏杀到天明。天光破晓时，妖潮终于退了。城头上下，尸横遍地，有妖物的，也有人类的。李青君拄着银枪，站在城垛旁，身上的血已经分不清是她的还是妖物的。她望着东方的晨曦，忽然低声说：我爹以前总说，离火城的日出，是南离最好看的。她顿了顿，声音有些哑：他没骗我。你站在她身边，没有说话，只把外袍解下来，披在她肩上。她没有拒绝，只是把外袍拢了拢，轻声道：秦弈，谢谢你回来。你笑了笑：谢什么，我说过，你是我罩的。她闻言，没有像从前那样啐你，只是低低嗯了一声，把脸埋进外袍里。晨光落在她沾血的银甲上，竟泛出一点柔和的暖意。你低头看着她，她肩头那道伤还在渗血，你撕了条衣角替她包扎。她任你动作，忽然没头没尾地问：裂谷那边……你怎么赶回来的？你说：收到传讯符就来了。她又问：那要是没收到呢？你手上动作顿了一下，答：没收到，我也会来。她没再说话，可你分明感觉到，她靠在你肩上的力道，悄悄重了几分。城垛下，有士兵在低声清点伤亡，报着一个个名字，每报一个，便有人应一声在，或者长久的沉默。李青君听着听着，忽然轻声说：秦弈，等安顿好百姓，我想去一趟裂谷。你一愣：去裂谷做什么？她抬起头，眼底有火光跳动：去看看那些妖，到底为什么忽然发了疯。这城破得蹊跷，我不信没有人在背后推动。你看着她重新燃起斗志的眼睛，忽然笑了：好，我陪你。',opts:[
  {k:'A',tag:'并肩',c:'#C4675C',tx:'护住她与百姓，斩尽妖潮',hint:'影响：入战（裂谷妖王·极凶）',run:()=>{log('红尘卷·三卷','你将她护在身后，剑指妖潮：“各位，此城我保了——想死的尽管来。”妖潮中传来一声嘶哑长啸，一头山岳般的妖王踏碎城楼现身。李青君在你身后握紧银枪，声音哽咽却坚定：“我……还能打。”');startCombat(rdEnemy('裂谷妖王·噬山',2.0),'rd3Fight');}},
  {k:'B',tag:'布阵',c:'#7FA8C9',tx:'以镇妖大阵封城，护百姓先撤',hint:'影响：功德+3',run:()=>{S.merit+=3;log('红尘卷·三卷','你以九丈墨线为引，在残城四方刻下镇妖大阵。阵成金光如罩，妖潮撞阵而退。你回头：“带百姓走，我来断后。”李青君深深看你一眼，转身振臂：“老弱先行——南离人，跟我撤！”那一夜，你一人一剑，在城门口站到天明。');}},
  {k:'C',tag:'断后',c:'#C9A45C',tx:'引走妖王主力，给百姓留出生路',hint:'影响：声望+15（极高风险）',run:()=>{S.reputation+=15;log('红尘卷·三卷','你冲天而起，一剑削在妖王脑门上：“喂，大块头——追我啊！”妖王暴怒追来，你且战且退，将妖潮主力引离城池数十里。待你满身是血绕回，李青君已带百姓撤入山中，留了一匹马在路边，鞍上挂着一壶温酒。你灌了一口，望着残月笑骂：“南离人真会送行。”');}},
]},
{t:'终幕 · 仙凡各择',meta:'终幕抉择：故国已毁，你心归何处',scene:'妖潮退去，南离已成废墟。李青君站在残破城墙上，望着满城招魂幡，轻声说：南离没了……我父王的国，我哥哥的国，都没了。她声音平静，可你看见她攥着枪的手，指节泛白。风掠过废墟，吹起漫天灰烬与纸钱，有几张纸钱打着旋儿，落在她肩头，她也没有拂去，就那么站着，像一尊沉默的雕像。你站在她身边沉默良久。远处，明河的身影踏云而来——她许是循着那枚带血的传讯符找来的，远远看了一眼城头的身影，又悄然退去，只留下一声几不可闻的叹息。夜翎不知何时蹲在你肩头，翅膀轻轻蹭了蹭你的脸，小声问：哥哥，我们把家……建在哪？她问得很轻，眼底却亮亮的，像在说一件认真的、值得期待的事。你望着那个银甲身影，又看了看肩上收翅的小妖，再看看满城飘摇的白幡，心里那些念头转了几转，忽然笑了：家不在城，在人在。人在哪儿，家在哪儿。李青君闻言，终于回过头来看你，眼底有水光一闪而过，又被她压了下去。城楼下，幸存的人们开始三三两两地聚拢，有人低声商量着往哪里去，有人蹲在废墟里翻找还能用的家什，有个孩子趴在一截断墙上，用炭笔认认真真地画着什么——画的是城，城墙上插着一面旗，旗下一个持枪的身影。你看着那幅歪歪扭扭的画，忽然觉得，南离虽然没了，可南离的人还在，南离的根就还在。夜翎从你肩头跳下来，变回少女模样，走到那个画画的男孩身边，蹲下来看他画：你画的是谁呀？男孩抬头，怯生生指了指城头的李青君：画的是将军。我娘说，将军把妖怪打跑了，以后我们还能回家。夜翎伸手摸了摸他的头，认真道：嗯，能回家的。她回头看你，眼底亮亮的。李青君不知何时走了过来，站在你身边，看着那幅画，声音有些哑：这孩子，是我从妖堆里抢出来的。他爹娘……都不在了。她顿了顿：我打算把南离的百姓，安置到离火城南边那片山谷去。那里有水源，有地，能种粮。她说着，转头看你，目光平静，却藏着一点试探：你要是想走，现在就可以走。你看着她，忽然道：谁跟你说我要走了？她一愣。你继续说：我说过，你守城，我守你。城没了，那就换我来当你的城。她眼眶一红，又强忍着，别过头去，声音闷闷的：……油嘴滑舌。可你分明看见，她垂在身侧的手，悄悄攥紧又松开，像在努力压着什么。远处，明河的身影在云端若隐若现，停留片刻，终究没有落下，只留下一声若有若无的叹息，散在风里。风又起，吹动你的衣袍。这个选择，终究要你自己做。数日后，你与李青君并肩站在那片山谷的入口。身后是浩浩荡荡的南离遗民——有人背着行囊，有人抱着孩子，有人赶着牛车，车上堆着从废墟里刨出来的家当。队伍很长，却没有人哭，也没有人抱怨，人们只是沉默地走着，像一群迁徙的候鸟，向着南方那片有水源、有土地的山谷而去。李青君回头看了一眼离火城的方向，那座千年古城已经成了一片废墟，可她眼底没有悲戚，只有一种沉静的笃定。她转过头，朝你伸出手：走？你握住她的手，笑道：走。两人并肩走进山谷。身后的晨光里，那幅画着将军的炭笔画被一个孩子小心地揣在怀里，画上的城墙虽然歪歪扭扭，可那面旗、那个持枪的身影，却画得格外认真。南离的根，就在那幅画里，也在每一个人的心里。你回头望了一眼那片山谷——炊烟已经升起来了，稀稀落落，却一处一处连成片。有人在坡上开荒，有人在水边洗衣，有孩子追着一条黄狗跑，惊起一滩水鸟。李青君站在人群里，正弯腰跟那个画画的男孩说话，男孩仰着脸，把自己那幅画举给她看。她看了很久，伸手摸了摸男孩的头，说了句什么，男孩咧嘴笑了。你看着这一幕，忽然觉得，所谓长生，所谓问道，或许并不在天上那些缥缈的仙宫里，而就在这一缕缕人间烟火里。你把手伸进怀里，摸到那枚温润的玉简——万道仙宫的方向，在云路尽头等着你。可你知道，无论走多远，这片山谷里的炊烟，都会是你回头时最先望见的光。',opts:[
  {k:'A',tag:'仙宫',c:'#A98FD9',tx:'带故人归仙宫，从此监察四方',hint:'影响：成就「仙宫留名」',run:()=>{log('红尘卷·三卷','你向李青君伸出手：“南离没了，可你没散——跟不跟我去个能讲理的地方？”她怔怔看你半晌，终于把满是血污的手放进你掌心。仙宫山门前，居云岫看着你带回来的一串人，难得怔了怔：“……你出去一趟，是把人家一国都搬回来了？”你嘿嘿一笑：“监察使大人带家属，应该不犯门规吧？”');rd3Ending('仙宫留名');}},
  {k:'B',tag:'魔约',c:'#8B6FA8',tx:'携一缕魔缘远行，与孟轻影周旋天下',hint:'影响：成就「魔女之约」',run:()=>{log('红尘卷·三卷','你安置好南离遗民后，独自踏入夜色。果然，某个月黑风高的路口，孟轻影正等着你，飞梭在指尖转了一圈：“我就知道你会来——这世上能跟我做交易还做得这么开心的，也就你了。”你挑眉：“谁说我是来做交易的？”“那你来干嘛？”你笑了笑：“来交个朋友——你敢交么？”她愣了愣，随即笑弯了腰：“行啊秦弈，你是我见过最有趣的冤家。”');rd3Ending('魔女之约');}},
  {k:'C',tag:'凡尘',c:'#6FA698',tx:'留在凡尘，陪她重建家园',hint:'影响：成就「凡尘归人」',run:()=>{log('红尘卷·三卷','你在废墟旁择了一处背风的山坳，亲手劈下第一根梁木。李青君提着银枪走来，把枪往地上一插：“我来监工。”你笑：“行，监工大人，晚上吃什么？”她想了想，忽然红了眼眶：“……随便。有你在，什么都行。”那一夜，篝火在废墟边升起，有人轻声哼起了故国的调子。');rd3Ending('凡尘归人');}},
]},
];
