<style>

  }
  *{box-sizing:border-box;}

  #log{background:var(--paper);border:1px solid #E2DACC;border-radius:8px;padding:10px 14px;margin-bottom:10px;max-height:200px;overflow-y:auto;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  #log .t{color:var(--gold);font-weight:bold;letter-spacing:1px;}
  #log .n{color:var(--ink);margin:2px 0 8px;white-space:pre-wrap;}

  #feedbackToast b{color:#F2D28B;margin-right:6px;}
  #panel{scroll-margin-top:8px;}
  .panel{border:3px solid var(--cyan);background:var(--paper);border-radius:10px;padding:0;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden;}
  .panel.warn{border-color:var(--purple);background:var(--warn);}
  .panel.mystic{border-color:var(--violet);background:var(--mystic);}
  .panel.love{border-color:var(--pink);background:var(--love);}
  .panel.fight{border-color:var(--red);background:var(--paper);}
  .titlebar{background:var(--cyan);color:#fff;font-weight:bold;font-size:17px;padding:8px 12px;letter-spacing:2px;text-align:center;}
  .panel.warn .titlebar{background:var(--purple);}
  .panel.mystic .titlebar{background:var(--violet);}
  .panel.love .titlebar{background:var(--pink);}
  .panel.fight .titlebar{background:var(--red);}
  .body{padding:10px 14px 12px;}
  .sep{border:0;border-top:2px solid var(--gold);margin:8px 0;opacity:.7;}
  .row{margin:3px 0;}
  .sm{color:var(--grey);font-size:12.5px;}
  .em{color:var(--blk);font-weight:bold;}
  .bar{display:inline-block;width:7.2em;height:1em;background:var(--empty);border-radius:2px;vertical-align:middle;overflow:hidden;border:1px solid #ddd6c8;}
  .bar .fill{display:block;height:100%;}
  .barval{font-size:12px;color:var(--grey);margin-left:4px;}
  .wb{display:inline-block;color:#fff;background:#999;border-radius:3px;padding:0 6px;margin:0 2px;font-size:12.5px;font-weight:bold;}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--cyan);border-radius:7px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--blk);transition:.12s;}
  .opt:hover{background:#f1f6f3;}
  .optkey{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;background:var(--cyan);color:#fff;font-weight:bold;border-radius:5px;}
  .opttag{display:inline-block;color:#fff;font-size:11.5px;font-weight:bold;padding:1px 7px;border-radius:4px;letter-spacing:1px;}
  .opt.sel{background:#eef4ef;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
  .opt:disabled{opacity:.45;cursor:not-allowed;}
  .cgrp{margin:6px 0;}
  .clabel{display:block;color:var(--cyan);font-weight:bold;font-size:13px;margin-bottom:3px;letter-spacing:1px;}
  .cinline{font-family:inherit;padding:3px 6px;border:1px solid #ccc;border-radius:5px;}
  .cwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;}
  .cwrap label{color:var(--ink);font-size:13px;}
  .opttext{flex:1;}
  .opthint{display:block;width:100%;font-size:11px;color:var(--grey);margin-top:3px;line-height:1.5;letter-spacing:.3px;}
  .opthint b{color:var(--red);}
  .opthint .g{color:#5C8C6E;}
  .cmdbar{position:fixed;bottom:0;left:0;right:0;background:#f3efe6;border-top:1px solid #ddd6c8;padding:7px 8px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:780px;margin:0 auto;z-index:5;}
  .cmdbar button{background:var(--cyan);color:#fff;border:0;border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:1px;}
  .cmdbar button:hover{opacity:.85;}
  .cmdbar input{flex:1;min-width:140px;border:1px solid #ccc;border-radius:6px;padding:6px 9px;font-family:inherit;font-size:14px;}
  .cmdbar .send{background:var(--gold);}
  .danger{color:var(--red);font-weight:bold;}
  .questbox{background:#F7F1E4;border:1px solid #DAC58F;border-radius:8px;padding:9px 10px;margin:7px 0;}
  .questbox .chapter{color:#9A7027;font-weight:bold;letter-spacing:1px;}
  .actiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px;}
  .actiongrid .opt{height:100%;}
  .intent{border:1px dashed #C4675C;background:#FBEDE9;border-radius:6px;padding:6px 9px;color:#8A4038;margin:6px 0;}
  .center{text-align:center;}
  a.lnk{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .qi{display:inline-block;margin-right:8px;font-size:12.5px;}
  /* 账号条 */
  .acctbar{text-align:center;color:var(--grey);font-size:12.5px;margin:2px 0 8px;letter-spacing:1px;}
  .acctbar b{color:var(--blk);}
  /* 触感优化：去除点击延迟，避免误触缩放 */
  button,.opt,a.lnk{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  html,body{text-size-adjust:100%;-webkit-text-size-adjust:100%;}
  /* 大屏：输入框与按钮同行 */
  .cmdbar input{flex:1 1 160px;}
  /* 移动端适配 */
  @media (max-width:600px){
    body{font-size:14px;line-height:1.55;}
    #wrap{max-width:100%;padding:8px 8px 168px;}
    h1{font-size:18px;letter-spacing:3px;margin:4px 0 2px;}
    .sub{font-size:10.5px;letter-spacing:1px;margin-bottom:6px;}
    #log{max-height:160px;padding:8px 10px;margin-bottom:8px;}
    .panel{border-width:2px;margin:8px 0;}
    .titlebar{font-size:15px;padding:7px 10px;}
    .body{padding:9px 11px 10px;}
    .opt{font-size:13.5px;padding:10px 11px;border-radius:8px;}
    .optkey{min-width:24px;height:22px;}
    .acctbar{font-size:11.5px;}
    /* 指令栏：输入框独占一行，按钮下方自动换行 */
    .cmdbar{left:0;right:0;max-width:100%;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:5px;justify-content:flex-start;}
    .cmdbar input{order:0;flex:1 1 100%;min-width:0;font-size:16px;padding:11px 10px;margin-bottom:4px;border-radius:8px;}
    .cmdbar button{flex:0 0 auto;font-size:13px;padding:9px 8px;letter-spacing:0;border-radius:7px;}
    .cmdbar .send{flex:0 0 auto;}
    #feedbackToast{bottom:158px;font-size:12.5px;}
    .actiongrid{grid-template-columns:1fr;}
  }
  @media (min-width:601px) and (max-width:820px){
    #wrap{max-width:680px;}
  }
</style>
</head>

  '山门夜战后的清晨，万峰皆是残雪与硝烟。顾清玄带你回到初见的洗剑台，将本命剑横放于膝，又把另一枚同样的剑穗系在你剑上。她说天下辽阔，仙途又长，可她想要的并非独自登顶，而是每次回首时都能看见你。你们在万顷云海前相拥，剑鸣如群鹤，替这场无声誓言作证。'
 ],
 '云栖':[
  '天机坊市灯火如昼，云栖故意把一枚假玉简卖给你，又笑吟吟等你拆穿。你没有掀她的摊子，反而借假玉简钓出了追查她的黑市杀手。收市后，她请你坐在堆满账册的小阁楼里，第一次收起商人的笑：“人人都想从我这里买答案，只有你先问我怕不怕。”那夜她送你的不是宝物，而是一枚只对你发亮的传音铜钱。',
  '你替云栖追回被劫的商队，却发现货箱中藏着她多年搜集的失踪修士名册。她承认自己一直在用逐利的外表掩护救人。雨打窗纸，她靠在桌边看你，一遍遍确认你不会因此离开。你替她合上账册，说她算尽天下人心，却可以不必算你。她笑了很久，眼尾却悄悄红了。',
  '帝京拍卖会设下杀局，你与云栖被困在焚金阵中。她把价值连城的护命奇宝毫不犹豫按进你心口，自己却被火浪吞没。你逆阵将她抱出时，她仍有力气调笑：“这笔买卖亏大了，你拿什么赔？”你回答用余生。她怔住，随即攥紧你的衣襟，把那枚铜钱贴在你唇边，落下一个带泪的吻。',
  '后来天机坊市开遍九州，最高处却永远留着一间不对外营业的小楼。云栖在窗边替你温酒，将天下情报推到一旁，只问今日可曾受伤。她仍爱算账，唯独你们之间从不计得失。夜深时万城灯火落进她眼里，她靠着你说：“我这一生做过最好的买卖，是拿全部身家与真心，换你每一次平安归来。”'
 ],
 '谢无咎':[
  '血月客栈屋脊上，谢无咎浑身是伤，却仍用玩世不恭的口吻问你为何不补最后一剑。你说正邪应由所行之事来定，不由出身。风吹动她染血的红衣，她沉默许久，将血魔宗追杀令撕成两半：“那便看看，你能不能让我做一次不负你的人。”从此她在暗处替你截下了许多你从不知道的杀机。',
  '你被正道误认为血魔同党，昔日同门纷纷拔剑。谢无咎原可置身事外，却独自闯进审剑台，将所有罪名揽到自己身上。你与她杀出重围后，她在荒寺里替你包扎，笑说自己本就是恶人，不在乎多背几口黑锅。你按住她的手告诉她，你在乎。那一瞬，她眼底惯有的戏谑彻底碎了。',
  '血河暴涨时，谢无咎体内魔功失控，求你趁她清醒杀了她。你却踏进血河，一遍遍叫她的名字，以自身灵台替她承受反噬。她醒来时把你抱得几乎窒息，声音颤得不像她：“我这一世从未怕死，方才却怕极了——怕睁眼以后，世上再没有一个肯信我的人。”',
  '最终决战前，谢无咎把少主令烧成灰，斩断血魔宗留给她的最后一条退路。她在漫天火星里吻住你，霸道之中带着从未有过的小心。此后江湖仍有人骂她邪魔，可每当你陷入绝境，血河都会先一步横贯长空。她红衣猎猎立于血河之上，不求天下原谅，只守着你给她的那句“可以重新做人”。'
 ],
 '白凝霜':[
  '北原暴雪封路，你在冰窟里找到白凝霜时，她正用最后的灵力护着一只幼小雪灵。你把唯一的火种推给她，自己守在风口一夜。天亮后，她没有道谢，只把冰魄珠放入你掌心：“雪族不轻易欠人。此珠在，你若遇险，我会知道。”她转身走入风雪，却在百步之外第一次回头。',
  '寒渊祭典上，族人逼白凝霜斩断尘缘。她站在万丈冰台上仍旧清冷，直到看见你独自穿过雪族剑阵。你没有要求她离开族群，只说愿意陪她承担选择的代价。冰台崩裂时，她握住你的手，指尖依旧冰凉，却再也没有松开。',
  '玄冰雪魇吞噬神识，你被困在最痛苦的旧梦里。白凝霜以本命冰莲闯入梦境，一寸寸替你冻结心魔。她因此修为大损，却只在你醒来时淡淡说了一句“无妨”。你看见她雪白长发间新生的霜色，终于明白这两个字背后，是她几乎押上了全部性命。',
  '北原极夜，万里冰川映着星河。白凝霜摘下圣女冠，任长发落在你肩头。她说自己从前以为道心应当无情，后来才知道，真正的强大是有了牵挂仍敢迎向天劫。她主动吻你，冰雪在脚下开出一线春花。从此寒渊有两位主人，也有了一盏永远为你亮着的灯。'
 ],
 '叶知秋':[
  '问道崖上，叶知秋问你为何执剑。你没有答苍生大义，只说弱小时曾无人替你出头，所以想成为后来者身前的那个人。她听罢久久不语，最终将自己的旧剑借给你三日。那柄剑曾斩过化神妖王，而她真正交给你的，是一位玄门女长老罕见的信任。',
  '你在论道会上被诸宗天骄围攻，叶知秋没有出手替你取胜，只在你最狼狈时传来一句：“不必像任何人。”你因此悟出自己的剑意，反败为胜。散场后她在无人处替你擦去脸侧血迹，端方神色里藏着压不住的欣慰：“我教过许多人，唯有你让我想陪着看得更远。”',
  '天衍宗要她以你为祭推演大劫，叶知秋当众毁去宗门至宝天机盘。反噬令她一夜白发，她却仍平静地护你下山。你问是否值得，她望着远山说，修道千年若连想护之人都护不住，所谓天机不过是笑话。那是她第一次牵你的手，也是第一次违逆整个天下。',
  '悟道花开之日，叶知秋在崖边摆了两盏茶。她不谈师徒名分，不谈天地纲常，只问你愿不愿与她共同写一部没有结局的道经。你答应后，她低头吻过你的眉心，漫天道纹化作金雨。往后每逢你出剑，都会有一道古老而温柔的玄光护在身后。'
 ],
 '姬无夜':[
  '古妖山王庭前，你接下姬无夜三招，膝骨几乎碎裂也不肯跪。她本在王座上冷眼旁观，第三招落下时却亲自收了力。群妖都以为你必死，她却俯身将你抱起，宣告你是古妖山的贵客。只有你看见，那位绝代风华的女妖王眼中第一次出现了欣赏之外的东西。',
  '妖族诸王反叛，姬无夜被困万妖噬魂阵。你明知境界悬殊仍闯阵，将自己的血抹在她眉心，替她唤回神智。她破阵后杀意滔天，却先把披风裹在你身上。面对跪伏群妖，她只朱唇轻启：“今日之后，见此人如见本王。”那不是赏赐，而是她能给出的最高承认。',
  '天劫降临古妖山，姬无夜本可独自飞升，却为护你硬生生折断一角妖王真身。你在雷海中抱住她，说若不能同行，长生也无趣。她仰天大笑，第一次放下帝王威仪，低头与你额心相抵。万妖看见他们的王为一女子红了眼，却无人敢出声。',
  '九州平定后，姬无夜将半座王庭改成你喜欢的模样。朝会散去，她会卸下冠冕，把头枕在你膝上，任你触碰无人敢近的妖角。她仍号令天下、威压万族，却会在你远行时亲自撕开虚空来接。所谓妖王法旨，最常说的一句竟成了：“谁敢动你，本王便让这一界换个主人。”'
 ],
 '萧景行':[
  '帝京长街刺客暴起，你与萧景行隔着人海同时拔剑。事后她没有拿无辜侍卫顶罪，反而顶着朝臣压力彻查幕后。你因此答应暂入长公主府相助。她给你最高规格的客卿令，却在无人处问：“若我不是长公主，只是萧景行，你还愿不愿与我喝一杯？”',
  '夺嫡风波中，萧景行被逼在江山与你之间选择。她当着满朝文武烧掉能置你于死地的伪证，也因此失去最稳妥的登基之路。深夜宫墙上，她笑得仍旧英锐，说帝位可以再争，真正并肩的人失去便不会再有。你替她披上风氅时，她握住你的手，久久未放。',
  '敌国仙师压境，萧景行以龙气强行迎战，重伤坠下城楼。你在万军之前接住她，她醒来的第一句话不是战况，而是问你有没有受伤。后来你们共守孤城七日，她将背后交给你，也把最不容人窥见的恐惧与疲惫一并交给了你。',
  '新朝立国那日，萧景行没有把你困在后宫或王座旁。她在百官面前赐你与帝王并行之权，又在夜里独自捧来一枚没有刻凤纹龙纹的素戒。她说天下是责任，你才是归处。宫灯万盏，她吻你时不再是长公主或女帝，只是那个终于得偿所愿的萧景行。'
 ],
 '玄机子':[
  '无名棋亭不在地图上，你循着一片逆风而飞的落叶找到那里。玄机子与你下了三日残局，每一步都能看见自己不同的死法。你最终没有落在唯一的生门，而是替棋盘外受劫的村庄挡下一灾。她第一次抬眼认真看你：“能舍天命而取本心，才配与我再下一局。”',
  '玄机子带你行走在被抹去的时间支流，看见你若从未修道，本可平安终老。你没有后悔，只问那些与你相识的人是否仍会孤独。她沉静千年的心湖因此起了波澜。归来时，她把一枚棋子放进你掌心，允许你在任何生死时刻唤她一次。',
  '域外天魔以众生未来逼玄机子回归无情大道，她几乎抹去与你有关的全部记忆。你在棋亭等了七年，每年都摆同一盘棋。第八年雪落时，她终于回来，明明不记得你，却在看见残局的一刻落下泪来。原来有些情意比轮回更深，连天道也删不干净。',
  '最终她替你落下一枚逆天之子，改去必死命数，也因此失去窥见未来的能力。你问可曾后悔，玄机子只是握住你的手，说从前看遍万世却从未真正活过，如今前路一片未知，反而觉得欢喜。棋亭外春山如笑，她俯身吻你眉心，从此不再算你们的结局。'
 ],
 '温若曦':[
  '药王谷的百草园里，一株千年药王正以肉眼可见的速度枯黄。满谷丹师束手无策，温若曦却对着它连诊了三日，像在为一个老友把脉。你没有随众离开，而是替她翻遍谷中残卷，终于找出病根——不是药王中毒，而是地脉灵气被人抽走了一条。你连夜以自身灵机温养地脉，天光破晓时，药王重新抽芽。她捧着一盏清茶走到你面前，指尖还沾着泥：“你救的不是一株药，是我医道里最不舍的一课。”',
  '疫病蔓延至药王谷外三镇，温若曦一人之力救不了一城。你把攒下的灵石尽数换了药材，跟着她一头扎进疫镇。她在前头看诊，你在后头煎药，七天七夜不曾合眼。最后一名病愈的孩子搂着她的脖子不肯松手，她回头看你，眸子里是疲惫而明亮的笑意：“从前我以为医者孤身可渡众生，如今才知，有人并肩比什么灵丹都管用。”',
  '北疆大旱，温若曦为救一片将死的药田，透支本源招来灵雨，自己却灵力溃散倒在田埂上。你背着她走了三百里找到药王谷，又守在榻前看她昏迷了整整七日。她醒来第一句话是问你田里的药活没活。你气笑，把那株她拼死救下的药草放进她手里：“活得好好的——现在轮到你的命，我来治了。”',
  '药王谷千年庆典那夜，温若曦在满谷灯火中牵起你的手，走到那株被她视为老友的药王树下。她没有说山盟海誓，只把一枚刻着“同春”的玉牌系在你腕上：“我的医术救天下人，从此也救你。你病我病，你老我老。”药香满园，她踮脚吻你，像春风终于肯为一个人停留。'
 ],
 '花千影':[
  '幻月楼的夜宴宾客如云，人人都戴着精心雕琢的面具。花千影坐在最高处，一双桃花眼扫过满座真假，笑意始终不达眼底。你在她面前的酒里下了常人闻不出的追魂引——那是幻月楼暗杀客的记号。她没有拆穿，只在你敬酒时轻轻按住你的手：“今夜月色这样好，公子何必急着做不该做的事。”你第一次看见，这双见惯风月的眼里，竟有一瞬真实的疲惫。',
  '幻月楼遭正道围剿，花千影以一己之力撑开幻境，却在阵眼处灵力将尽。你破阵而入时，她半边面具已碎，露出底下与你想象截然不同的素净眉眼。她怔怔看着你：“看清了？这才是真面目——一个活腻了的骗子。”你替她系好面具：“骗子也好，宗主也罢，我只认方才那一瞬没藏住的你。”她别过脸，难得没有还嘴。',
  '你被仇家以秘术困入幻梦，梦里她一遍遍背叛你、算计你。破梦而出后，你第一眼看见的是守了七日的她，眼底青黑，指尖还攥着你的衣角。她说幻梦本是她所布，引你入局只为钓出真正的幕后黑手。你没有问她为何不早说，只握住她冰凉的指尖：“梦里你伤我千百次，可每次醒来，你都在。”她沉默良久，低低笑了：“栽了，我认。”',
  '幻月楼顶，月华如练。花千影卸下所有伪装，把一块平平无奇的月牙坠子放进你掌心——那是她作为孤女时，唯一没舍得卖的念想。“从前我只信这世上没有真心，只有值不值得。”她仰头看你，桃花眼里终于落下月光，“可你让我觉得，赌一次也值得。”月下她吻你，不再是满座戏弄的虚情，而是颤抖而郑重的真。'
 ],
 '洛青瑶':[
  '青云剑峰终年积雪，洛青瑶立于峰顶等你。她出剑快得像雪落，你没有退，硬生生用剑脊接住那一击，虎口迸血也不肯跪。她收剑时冷道：“就这点本事，也敢登我的剑峰？”你擦掉嘴角的血，问她为何三年前在宗门大比中败给一个不如她的外门弟子。她握剑的手极轻地颤了一下：“那场比试，是有人替我在剑上做了手脚。”自此，峰顶的雪里多了一个能听她说旧事的人。',
  '你替她查那场旧案的剑痕，从铁匠铺查到执事堂，一路被人警告。洛青瑶没有替你挡，却在每个深夜拎着酒来找你，剑横在膝上，替你守着门。真相大白那日，她当着全宗的面折断了那柄做过手脚的剑：“我败给的不是你，是人心。”散场后，她站在雪里等你，耳尖微红：“那夜的话……我只对你说。”',
  '天外剑门的仙使想招她入上界，许她举世无双的剑道前程。洛青瑶站在剑峰之巅，回望了你很久。仙使离去后，她走到你面前，把从不离身的本命剑横过来，剑柄朝向你：“我要的剑道，是从今天起，跟一个人并肩。”她低头，极轻地碰了碰你的唇，雪花落在两人睫毛上，谁也没舍得眨眼。',
  '剑峰之巅的雪终于停了。洛青瑶把两柄剑并排插在雪里，与你并肩坐下，像许多年前她独自练剑的无数个黄昏。“我以为高处的风景只有一个人看才配叫孤独，”她说，“如今才知道，有人分着看，这雪才不冷。”她侧过头吻你，剑意温柔地缠上你的灵机，从此青云剑峰多了一位常客，和一则无人敢传的佳话。'

function sbConfig(){const c=window.WENDA_SUPABASE||{};return {url:String(c.url||'').replace(/\/$/,''),anonKey:String(c.anonKey||'')};}
function supabaseReady(){const c=sbConfig();return /^https:\/\/.+\.supabase\.co$/.test(c.url)&&c.anonKey.length>40;}
function loadSbSession(){try{SB_SESSION=JSON.parse(localStorage.getItem('wenda_supabase_session')||'null');SB_USER=SB_SESSION&&SB_SESSION.user||null;}catch(e){SB_SESSION=null;SB_USER=null;}}
function saveSbSession(){try{localStorage.setItem('wenda_supabase_session',SB_SESSION?JSON.stringify(SB_SESSION):'');}catch(e){}}
async function sbFetch(path,opts={}){
  const c=sbConfig();if(!supabaseReady())return {err:'云同步尚未配置'};
  const headers={apikey:c.anonKey,'Content-Type':'application/json',...(opts.headers||{})};
  if(opts.auth!==false&&SB_SESSION&&SB_SESSION.access_token)headers.Authorization='Bearer '+SB_SESSION.access_token;
  try{
    const res=await fetch(c.url+path,{...opts,headers});
    const data=await res.json().catch(()=>null);
    if(!res.ok)return {err:(data&&(data.msg||data.message||data.error_description||data.error))||('请求失败 '+res.status),status:res.status};
    return {data,status:res.status};
  }catch(e){return {err:'云端网络不可达：'+e.message};}
}
async function refreshSbSession(){
  if(!SB_SESSION||!SB_SESSION.refresh_token)return false;
  const r=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:JSON.stringify({refresh_token:SB_SESSION.refresh_token})});
  if(r.err){SB_SESSION=null;SB_USER=null;saveSbSession();return false;}
  SB_SESSION=r.data;SB_USER=r.data.user;saveSbSession();return true;
}
async function ensureSbAuth(){
  if(!SB_SESSION||!SB_SESSION.access_token)return false;
  const expires=(SB_SESSION.expires_at||0)*1000;
  if(expires&&Date.now()>expires-60000)return refreshSbSession();
  return true;
}
function detectApi(){ if(location.protocol.indexOf('http')===0){API_BASE='';} else {API_BASE=(localStorage.getItem('wenda_apibase')||'').trim();} }
function loadAcct(){try{ACCT=JSON.parse(localStorage.getItem('wenda_account')||'null');}catch(e){ACCT=null;}}
function saveAcct(){try{localStorage.setItem('wenda_account',ACCT?JSON.stringify(ACCT):'');}catch(e){}}
async function api(path,body,method){
  const url=(API_BASE||'')+path;
  const headers={'Content-Type':'application/json'};
  if(ACCT&&ACCT.token)headers['Authorization']='Bearer '+ACCT.token;
  try{
    const res=await fetch(url,{method:method||(body?'POST':'GET'),headers,body:body?JSON.stringify(body):undefined});
    const j=await res.json().catch(()=>({err:'返回非JSON'}));
    if(!res.ok)return {err:j.err||('错误'+res.status)};
    return j;
  }catch(e){return {err:'网络不可达：请确认服务器已启动且地址正确（'+e.message+'）'};}
}

/* ============ 状态卡 ============ */
function statusCard(){

  const lp=(MAXAGE[S.realm]-S.age)/MAXAGE[S.realm];
  const lc=lp<0.33?'#C05F55':'#5C8C6E';
  const aff=Object.keys(NPCS).filter(n=>(S.aff||{})[n]).map(n=>`${n} ${(S.aff||{})[n]}`).join('｜')||'无';
  const wd=Object.keys(S.wudao||{}).filter(k=>(S.wudao||{})[k]).map(k=>`${k}${(S.wudao||{})[k]}`).join(' ')||'无';

  const body=`
  <div class="row"><span class="em">状态卡 · ${timeLine()}</span></div><hr class="sep">
  <div class="row">道号 ${S.name} · ${S.gender} · ${S.age}岁 · 寿元 ${bar(S.age,MAXAGE[S.realm],lc,'#C05F55')} 已逝${Math.round((1-lp)*100)}%</div>
  <div class="row">境界 ${realmLabel()}　宗门 ${S.sect}·${S.sectRank}</div>
  <div class="row">六维 资${sx.资质||0} 悟${sx.悟性||0} 识${sx.神识||0} 遁${sx.遁速||0} 心${sx.道心||0} 缘${sx.仙缘||0}</div>

  <div class="row">气血 ${bar(S.hp,S.hpMax,'#C05F55')}</div>
  <div class="row">灵力 ${bar(S.mp,S.mpMax,'#5E8FAE')}</div>
  <div class="row">修为 ${bar(S.xiu,100,'#A87E2E')}</div>
  <div class="row">灵石 ${S.lingShi}　功德 ${S.merit>0?'+':''}${S.merit}　业力 ${S.karma}　异常 ${S.status}</div>
  <div class="row">江湖名号 ${jianghuTitle()}　侠义 ${S.jianghu.xia}　恶名 ${S.jianghu.evil}　委托 ${S.jianghu.contracts}</div>
  <div class="row sm">所在地 ${S.loc}；主线：${S.mainLine}</div>

  return panel('',`状态卡 · ${S.name}`,body);

/* ============ 时间 ============ */
function advanceTime(m){
  for(let i=0;i<m;i++){monthIdx++;if(monthIdx>=12){monthIdx=0;year++;onNewYear();}if(S.age>=MAXAGE[S.realm])return endGame('坐化');}
  turn++;
}
function onNewYear(){
  S.age++;
  if((year-387)%5===3 && year>387){ eventAscend(); }
  if(year===397 && !S.flags.tide){ S.flags.tide=true; eventTide(); }
  maybeQuest();
}

/* ============ 修炼 ============ */
function doCultivate(close){
  if(phase!=='play')return;
  const k=1+S.six.资质*0.05, lc=LING_COEF[S.lingType]||1, gc=Math.max(...S.gongfa.map(g=>GONG_COEF[g.grade]||1)), qc=QI_COEF[S.dongfu.qi];

  const rate=BASE[S.realm]*k*lc*gc*qc*mc*(close?2:1);
  S.xiu=clamp(S.xiu+rate,0,100); S.mp=clamp(S.mp-5,0,S.mpMax);
  const scenes=close?[
    '你封闭洞府，以青石压住门缝，只留一线天光。最初十日心猿如野马，旧敌、旧情与未竟之愿轮番叩问；待到第二十一日，呼吸终于与山中灵脉同起同落，丹田里那一点微光渐成星河。',
    '聚灵阵一层层亮起，你将功法运转三十六周天。经脉如被烈火重新锻打，疼痛几乎令人昏厥，可每熬过一轮，灵力便精纯一分。出关前一夜，你听见体内传来潮汐般的轰鸣，知道旧日根基已被彻底洗炼。',

  ]:[
    '晨钟未响，你已在悬崖松下吐纳。云海从脚边漫过，灵气沿周身窍穴徐徐入体；一套心法走完，汗水浸透衣背，剑锋却比昨日更稳。',
    '你在瀑布下负石运气，让万钧水势一遍遍击散护体灵光，再重新凝聚。直到暮色降临，灵力终于能在压力下自行护主，根基也因此扎实许多。',

  ];
  let msg=`${scenes[Math.floor(Math.random()*scenes.length)]}<br><br>修为 +${rate.toFixed(1)}（${S.xiu.toFixed(0)}/100）。`;

/* ============ 突破 ============ */
function doBreakthrough(){
  if(phase!=='play')return;
  if(S.xiu<100){log('突破','修为未满（需100/100），先「修炼」填满。');renderPlay();return;}
  if(S.sub!=='圆满'){
    const r=d100(),need=60+S.six.悟性*1.5;
    if(r<=need){const i=SUBS.indexOf(S.sub);S.sub=SUBS[i+1];S.xiu=0;log('小突破',`心有所悟，${realmLabel()}更进一层。`);}
    else{S.xiu=70;log('小突破','小瓶颈桎梏，修为回落七成。');}
    advanceTime(1);maybeEvent();renderPlay();return;
  }
  if(S.realm==='登仙'){
    const base=20,rate=clamp(base+S.merit*2-S.karma*4+S.six.道心*0.5+S.six.资质*0.2,3,92);
    const body=`<div class="row em">你已登仙圆满，前路唯「飞升」一途——白日飞升，或殒于天道雷劫。</div><div class="opts">
    ${opt('A','风险','#C4675C','引动飞升雷劫，逆天而上','ascend','go',`胜算：约 <b>${rate}%</b>（功德+${S.merit*2} · 业力-${S.karma*4} · 道心+${Math.round(S.six.道心*0.5)}）`)}
    ${opt('B','平和','#6FA698','暂压道心，行走人间','cmd','面板','影响：放弃此次飞升，可继续积累机缘')}
    </div><div class="sm">飞升是你此生终局一战：天道雷劫+心魔劫，功德可护、业力招罚。成败在此一举。</div>`;
    $('panel').innerHTML=panel('warn',`飞升 · 天道在望`,body)+statusCard();
    return;
  }
  const pb={炼气:88,筑基:82,结晶:75,金丹:65,具灵:58,元婴:50,化神:40,悟道:30,羽化:18}[S.realm]||15;
  const rA=clamp(pb*1.0+S.six.资质*0.4+S.six.道心*0.3,5,98);
  const rB=clamp(pb*0.82+S.six.资质*0.4+S.six.道心*0.3,5,98);
  let rC=clamp(pb*0.55+S.six.资质*0.4+S.six.道心*0.3,3,95);rC=clamp(rC+S.merit*1.5-S.karma*2.5,3,95);
  const body=`<div class="row em">修为圆满，可破 ${S.realm} 之境。三途择一：</div><div class="opts">
  ${opt('A','平和','#6FA698','人道：服突破丹，成功率高，加成低','bb','人道',`胜算：约 <b>${rA}%</b>；影响：破境无属性加成`)}
  ${opt('B','机缘','#A98FD9','地道：需天材地宝，成功率中，加成中','bb','地道',`胜算：约 <b>${rB}%</b>；影响：破境资质+1`)}
  ${opt('C','风险','#C4675C','天道：天材地宝+灵珠+渡雷劫，成功率最低、加成最高','bb','天道',`胜算：约 <b>${rC}%</b>（功德+${Math.round(S.merit*1.5)} · 业力-${Math.round(S.karma*2.5)}）；影响：破境资质+2，根基远超同阶`)}
  </div><div class="sm">破境有生死之险，失败留暗伤、修为倒退，乃至陨落。慎之。</div>`;
  $('panel').innerHTML=panel('warn',`破境 · ${S.realm} → ${REALMS[idxOf(S.realm)+1]}`,body)+statusCard();
}
function doAscend(){
  const base=20;
  let rate=clamp(base+S.merit*2-S.karma*4+S.six.道心*0.5+S.six.资质*0.2,3,92);
  log('飞升','天降紫霄神雷，心魔劫随至——这是你此生最后一战。');
  if(d100()<=rate){
    endGame(computeEnding());
  }else{
    if(d100()<=55)return endGame('陨落','你于飞升雷劫中道心崩散，形神俱灭，化作一捧劫灰。');
    S.status='入魔';S.karma+=5;endGame('入魔');
  }
}

  if((S.daoban||[]).includes('温若曦')&&S.merit>=15)return '医仙';

function bigBreak(path){
  const next=REALMS[idxOf(S.realm)+1];
  if(!next){log('登仙','已是登仙，前路唯飞升。');renderPlay();return;}
  let base={炼气:88,筑基:82,结晶:75,金丹:65,具灵:58,元婴:50,化神:40,悟道:30,羽化:18}[S.realm]||15;
  let rate=clamp(base*{人道:1.0,地道:0.82,天道:0.55}[path]+S.six.资质*0.4+S.six.道心*0.3,5,98);
  if(path==='天道')rate=clamp(rate+S.merit*1.5-S.karma*2.5,3,95);
  if(d100()<=rate){
    S.realm=next;S.sub='初期';S.xiu=0;
    const b={人道:0,地道:1,天道:2}[path]; if(b)S.six.资质=clamp(S.six.资质+b,1,20);

function outMul(a,d){const diff=a-d;if(diff>=2)return 2.2;if(diff===1)return 1.6;if(diff===-1)return 0.4;if(diff<=-2)return 0.12;return 1.0;}
function keMul(a,d){if(!a||!d)return 1;if(KE[a]===d)return 1.3;if(KE[d]===a)return 0.8;return 1.0;}
function bestBondAlly(enemy,minAff){
  if(!S)return null;ensureGameState();minAff=minAff||40;
  const list=Object.keys(BOND_ROUTES).filter(n=>S.bonds[n]&&S.bonds[n].met&&(S.aff[n]||0)>=minAff).map(n=>{
    const r=BOND_ROUTES[n],aff=S.aff[n]||0,power=idxOf(r.realm)*18+aff+(S.daoban||[]).includes(n)*35;
    const counter=enemy&&keMul(r.elem,enemy.elem)>1?18:0;return {name:n,route:r,aff,power:power+counter};
  }).sort((a,b)=>b.power-a.power);
  return list[0]||null;
}

function callBondAid(lethal){

function startCombat(enemy,afterWin){

  if(enemy.key||enemy.name){const k=enemy.key||enemy.name;(S.codex[k]=S.codex[k]||{}).seen=true;}
  genQi();
  const diff=enemy.idx-idxOf(S.realm);
  let odds=diff>=2?'正面交手胜算极低':diff===1?'胜算低，宜避战':diff===0?'旗鼓相当':diff===-1?'你略占上风':'你可压制此敌';
  log('战斗 · 敌情',`${enemy.name}（${enemy.realm}·${enemy.sub}），威压令${(diff>=1&&idxOf(S.realm)>=enemy.idx)?'其':'你'}${diff>=1?'窒息':''}。${odds}`);
  renderPlay();

/* 胜负预估：按境界差、资质、气血、战意估算胜率（仅供参考） */
function combatOdds(){
  if(!CB)return null;
  const e=CB.enemy;
  const diff=e.idx-idxOf(S.realm);
  let odds=50 - diff*24;
  odds+=(S.six.资质-10)*1.2;
  odds+=(S.six.遁速-10)*0.5;
  odds+=((S.hp/S.hpMax)-(e.hp/e.hpMax))*20;
  odds-=e.spirit*0.08;
  if(S.xiu>=100)odds+=6;
  odds=clamp(Math.round(odds),4,96);
  const verdict=odds>=70?'胜算可观，可放手一搏':odds>=45?'胜负五五，谨慎行事':odds>=25?'凶多吉少，宜避其锋':'九死一生，速速遁走';
  return {odds,verdict,diff};
}

function enemyTurn(){
  const e=CB.enemy;
  if(e.stun>0){e.stun--;log('战斗',`${e.name}被定身，无法行动。`);return;}
  const mul=outMul(e.idx,idxOf(S.realm));
  let intentMul=CB.intent==='heavy'?1.65:CB.intent==='feint'&&!CB.observed?1.2:1;
  let dmg=Math.round(e.atk*mul*intentMul*(CB.def?0.45:1)*(0.85+Math.random()*0.3));
  S.hp=clamp(S.hp-dmg,0,S.hpMax);
  log('战斗',`${e.name}反击，伤你 ${dmg}。${S.hp<=0?'':''}`);
  if(S.hp<=0){if(callBondAid(true))return;if(S.hp<=0)return combatLose();}
  CB.def=false;CB.round++;CB.intent=rollEnemyIntent();genQi();
}
function combatAct(a){
  if(!CB)return;
  const e=CB.enemy;
  if(a==='observe'){CB.observed=true;log('战斗','你凝神观察，觅得破绽。');enemyTurn();renderPlay();return;}
  if(a==='def'){CB.def=true;log('战斗','你凝罡防御。');enemyTurn();renderPlay();return;}
  if(a==='bond'){
    const before=CB&&CB.enemy;if(!bestBondAlly(before,40)){log('情缘求援','尚无达到知己阶段的有缘人可以响应。先在情缘路线中相识并提升好感。');renderPlay();return;}
    const helped=callBondAid(false);if(!CB)return;if(helped&&CB.enemy.hp>0){enemyTurn();if(CB)renderPlay();}else if(CB){enemyTurn();if(CB)renderPlay();}return;
  }
  if(a==='attack'){
    if(S.mp<5){log('战斗','灵力不足，无法攻击。');renderPlay();return;}
    S.mp-=5;let dmg=Math.round((8+S.six.资质*0.6)*outMul(idxOf(S.realm),e.idx)*keMul('金',e.elem)*(CB.observed?1.5:1)*(CB.intent==='guard'?0.55:1));
    e.hp-=dmg;CB.observed=false;log('战斗',`你挥剑直击，伤${e.name} ${dmg}。`);
    if(e.hp<=0)return winCombat();enemyTurn();renderPlay();return;
  }
  if(a==='skill'){
    if(!CB.charging){CB.charging=true;log('战斗','你引而不发，绝技蓄势。');enemyTurn();renderPlay();return;}
    else{CB.charging=false;let dmg=Math.round((30+S.six.资质*1.5)*outMul(idxOf(S.realm),e.idx));e.hp-=dmg;log('战斗',`绝技爆发！伤${e.name} ${dmg}。`);if(e.hp<=0)return winCombat();enemyTurn();renderPlay();return;}
  }
  if(a==='flee'){
    const chance=S.six.遁速*4+e.spirit*0.3;
    if(d100()<=chance){log('战斗','你遁术精妙，脱身而去。');CB=null;renderPlay();return;}
    else{log('战斗','遁走失败，被黏住！');enemyTurn();renderPlay();return;}
  }
  if(a==='dan'){
    const d=S.bag.find(b=>b.n==='聚气丹');
    if(!d||d.num<=0){log('战斗','无丹可服。');renderPlay();return;}
    d.num--;S.hp=clamp(S.hp+20,0,S.hpMax);log('战斗','你服下聚气丹，气血+20。');enemyTurn();renderPlay();return;
  }
  if(a==='talk'){
    const c=20+S.six.道心+S.xianzi.length*2-S.karma*3;
    if(d100()<=c){e.spirit=clamp(e.spirit-30,0,100);log('战斗',`你言辞周旋，${e.name}战意大减（${e.spirit}）。`);if(e.spirit<=0){log('战斗',`${e.name}收手离去，就此罢战。`);CB=null;renderPlay();return;}}
    else{log('战斗',`${e.name}冷笑不为所动。`);}
    enemyTurn();renderPlay();return;
  }
}
function castSpell(i){
  if(!CB)return;const e=CB.enemy,sp=S.fashu[i];
  if(!sp||sp.power<=0){log('战斗','此招非攻击。');return;}
  if((S.qi[sp.elem]||0)<1){log('战斗',`${sp.elem||''}系灵气不足，无法施法。`);renderPlay();return;}
  if(S.mp<sp.mp){log('战斗','灵力不足。');renderPlay();return;}
  S.qi[sp.elem]-=1;S.mp-=sp.mp;
  let dmg=sp.power*outMul(idxOf(S.realm),e.idx)*keMul(sp.elem,e.elem)*(CB.intent==='guard'?0.55:1);
  if(sp.系==='剑')dmg*=(1+0.05*(S.wudao['剑道']||0));
  if(CB.observed)dmg*=1.5;
  dmg=Math.round(dmg*(0.9+Math.random()*0.2));
  e.hp-=dmg;CB.observed=false;
  log('战斗',`你施展${sp.n}，伤${e.name} ${dmg}。`);
  if(e.hp<=0)return winCombat();
  enemyTurn();renderPlay();
}
function winCombat(){
  const e=CB.enemy;
  const afterWin=CB.afterWin;
  log('战斗',`${e.name}轰然倒地，战局已定。`);
  const ck=S.codex[e.key||e.name];if(ck)ck.slain=true;
  const loot=['妖丹','玄铁','灵草'].filter(x=>Math.random()<0.45);
  loot.forEach(x=>giveItem(x,1));
  S.lingShi+=20+Math.floor(Math.random()*30);
  if(e.beast){log('战利品',`猎得灵石与兽材${loot.length?('、'+loot.join('、')):''}。除妖不增业力。`);S.merit+=1;}
  else if(e.outlaw){log('战利品',`缉凶所得灵石${loot.length?('、'+loot.join('、')):''}。此战有名有据，侠义+1。`);S.jianghu.xia+=1;}
  else{log('战利品',`夺得灵石${loot.length?('、'+loot.join('、')):''}。无名杀伐有损心性，业力+2。`);S.karma+=2;S.jianghu.evil+=1;}
  if(S.flags.血魔仇&&/血魔/.test(e.name)){S.flags.血魔仇=false;S.merit++;log('因果','你斩却昔日之仇，了却一桩因果，功德+1。');}
  CB=null;if(afterWin)finishStoryBattle(afterWin);advanceTime(0);maybeEvent();renderPlay();
}
function combatLose(){
  const e=CB.enemy;
  log('战斗',`你气血耗尽，眼前一黑……`);
  if(d100()<=40){ // 被救/被俘
    S.hp=Math.round(S.hpMax*0.3);S.status='重伤';S.lingShi=Math.max(0,S.lingShi-50);
    log('陨落边缘',`你重伤被俘/被救，财物散去，捡回一命。`);
  }else{
    CB=null;return endGame('陨落',`${e.name}未留活口，你形神俱灭于${e.realm}之手。`);
  }
  CB=null;renderPlay();
}

function applyLore(eff){
  if(eff==='灵泉'){S.mp=clamp(S.mp+30,0,S.mpMax);S.xiu=clamp(S.xiu+3,0,100);log('秘境','灵泉涤体，灵力+30、修为+3。');}
  else if(eff==='试炼'){S.six.道心=clamp(S.six.道心+1,1,20);S.xiu=clamp(S.xiu+5,0,100);log('秘境','你走过试炼阵，道心+1、修为+5。');}
  else if(eff==='残阵'){if(d100()<=60){S.six.道心=clamp(S.six.道心+2,1,20);S.bag.push({n:'玄铁',num:1});log('秘境','你破残阵，得玄铁、道心+2。');}else{S.hp=clamp(S.hp-15,1,S.hpMax);log('秘境','残阵反噬，气血-15。');}}

  else if(eff==='回廊'){const w=['剑道','丹道','体道','无情道','有情道'][Math.floor(Math.random()*5)];S.wudao[w]=(S.wudao[w]||0)+2;log('秘境','时空回廊中你悟得'+w+'，悟道点+2。');}
  else{S.xiu=clamp(S.xiu+5,0,100);log('秘境','你于此有所获，修为+5。');}

function enterSecret(type){
  const def=SECRET[type]; if(!def){showSecretMenu();return;}
  const need={通灵:0,上古:3,心魔:1,虚空:5}[type];
  if(idxOf(S.realm)<need){log('秘境',`${def.name}建议境界${REALMS[need]}，你仅${realmLabel()}，入则凶多吉少。`);}
  SEC={type,step:0,depth:0};

function showSecretMenu(){
  const rows=Object.keys(SECRET).map(k=>`<div class="row">${SECRET[k].name}　<span class="sm">${SECRET[k].desc}</span>　<a class="lnk" data-act="secret" data-arg="${k}">进入</a></div>`).join('');

function renderSecret(){

}
function secretStep(){
  const def=SECRET[SEC.type];
  if(SEC.depth>=4+(def.risk)){finishSecret();return;}
  let node=def.nodes[Math.floor(Math.random()*def.nodes.length)];
  if(node==='出口'&&Math.random()<0.5)node=def.nodes[Math.floor(Math.random()*def.nodes.length)];
  SEC.node=node;
  const N=NODE[node]||{fl:'幽径寂寂，前路未知。',kind:'next'};
  SEC.depth++;
  let opts='';
  if(N.kind==='fight'){
    opts=opt('A','风险','#C4675C','力战（计入妖兽图鉴）','sAct','fight')+opt('B','平和','#6FA698','迂回避战，退守一层','sAct','retreat');
  }else if(N.kind==='insight'){
    opts=opt('A','机缘','#A98FD9','参悟（悟道点/修为）','sAct','insight')+opt('B','平和','#6FA698','记下，继续深入','sAct','next');
  }else if(N.kind==='loot'){
    opts=opt('A','机缘','#A98FD9','取宝（灵材/丹药）','sAct','loot')+opt('B','风险','#C4675C','深探核心（更险更丰）','sAct','deep');

function secretAct(a){
  if(!SEC)return;const def=SECRET[SEC.type];const N=NODE[SEC.node]||{};
  if(a==='fight'){
    if(N.beast&&BESTIARY[N.beast])startCombat(spawnBeast(N.beast));
    else{const lvl=clamp(idxOf(S.realm)+(def.risk>=4?1:0),0,9);startCombat(mkEnemy(def.risk>=4?'秘境守卫':'妖兽',REALMS[lvl],'初期',['金','木','水','火','土'][Math.floor(Math.random()*5)],10+lvl*4,80+lvl*30,50));}
    return;
  }
  if(a==='retreat'){log('秘境','你避战而退，安返洞府。');SEC=null;renderPlay();return;}
  if(a==='insight'){
    const w=N.branch==='随机'?['剑道','丹道','器道','符道','阵道','体道','御兽道','无情道','有情道'][Math.floor(Math.random()*9)]:N.branch;
    S.wudao[w]=(S.wudao[w]||0)+1;S.xiu=clamp(S.xiu+5,0,100);
    let msg=`你于${SEC.node}参悟${w}，悟道点+1、修为+5。`;
    if(N.reward){msg+='（'+N.reward+'）';if(/剑道\+1/.test(N.reward))S.wudao['剑道']=(S.wudao['剑道']||0)+1;}
    log('秘境',msg);advanceTime(0);renderPlay();return;
  }
  if(a==='loot'){
    const items=N.items||['灵草','玄铁','玉髓','聚气丹'];
    let it=items[Math.floor(Math.random()*items.length)];
    if(it==='筑基丹?')it=d100()<=30?'筑基丹':'聚气丹';
    if(it==='灵石大'){S.lingShi+=Math.floor(Math.random()*200)+100;log('秘境','你取走一堆灵石！');}
    else{S.bag.push({n:it,num:1});log('秘境',`你取走${it}。`);}
    S.lingShi+=Math.floor(Math.random()*40);advanceTime(0);renderPlay();return;
  }
  if(a==='deep'){
    if(d100()<=def.risk*10){const lvl=clamp(idxOf(S.realm)+1,0,9);startCombat(mkEnemy('秘境凶物',REALMS[lvl],'初期',['火','金'][0],14+lvl*5,100+lvl*40,60));return;}
    else{S.bag.push({n:'天材地宝',num:1});S.lingShi+=100;log('秘境','你深探核心，获天材地宝一枚！');advanceTime(0);renderPlay();return;}
  }
  if(a==='lore'){applyLore(N.eff);advanceTime(0);renderPlay();return;}
  if(a==='next'){secretStep();return;}
}
function finishSecret(){
  log('秘境',`你自${SECRET[SEC.type].name}脱身，秘境之行落幕。`);
  SEC=null;advanceTime(1);maybeEvent();renderPlay();
}

function showJianghu(){
  ensureGameState();const j=S.jianghu,q=jianghuQuest();
  let story='';
  if(j.chapter===1)story=j.clue>=3?opt('破','主线','#C4675C','线索齐全：夜探后山废祠','jhStory','advance'):opt('查','主线','#C9A45C','调查失踪弟子的线索','jhInvestigate','main');
  else if(j.chapter===2)story=opt('赴','决断','#C4675C','赴血月客栈，与蒙面人对质','jhStory','advance');
  else if(j.chapter===3)story=(idxOf(S.realm)<1?`<div class="row danger">剑冢威压非炼气修士可承，请先突破至筑基。</div>`:(j.clue>=3?opt('悟','传承','#A98FD9','残章齐全：入剑冢参悟遗书','jhStory','advance'):opt('寻','主线','#C9A45C','追寻剑谱残章','jhInvestigate','main')));
  else if(j.chapter===4)story=opt('战','决战','#C4675C','血魔攻山：选择你的立场','jhStory','advance');
  else if(j.chapter===5)story=j.clue>=3?opt('夺','天命','#A98FD9','三碑合一：闯东海归墟，夺回天命','jhStory','advance'):opt('碑','主线','#C9A45C','追查天命古碑与幕后夺运者','jhInvestigate','main');
  else if(j.chapter===6)story=j.clue>=3?opt('宫','决战','#C4675C','证据齐全：夜闯皇城斩国师','jhStory','advance'):opt('京','主线','#C9A45C','潜入帝京，收集国师罪证','jhInvestigate','main');
  else if(j.chapter===7)story=j.clue>=3?opt('天','逆伐','#C4675C','万事俱备：登天梯、斩仙使','jhStory','advance'):opt('界','主线','#C9A45C','联合九州强者准备破界之战','jhInvestigate','main');
  else story=opt('游','奇闻','#7FA8C9','游历九州，触发地方奇闻与禁区挑战','jhInvestigate','wander');
  const body=`<div class="questbox"><div class="chapter">${q.title}</div><div>${q.objective}</div><div class="sm">${q.progress}</div></div>
  <div class="opts">${story}
    ${opt('榜','委托','#6FA698','查看侠义榜：护送、缉凶、寻药','jhContract','open')}
    ${opt('闻','情报','#7FA8C9','在茶馆打听江湖传闻','jhRumor','one')}
  </div><hr class="sep"><div class="row sm">江湖行为会改变侠义与恶名；名声影响交涉、奖励和后续剧情。战胜妖兽不再无故增加业力，滥杀与夺财才会。</div>`;
  $('panel').innerHTML=panel('mystic',`江湖志 · ${jianghuTitle()}`,body)+statusCard();
}

function showMap(){
  const cur=idxOf(S.realm);
  const places=[
    {n:'东洲·青岳',need:0,desc:'新手区，炼气~筑基可游'},
    {n:'青岳·灵泉',need:0,desc:'灵泉疗伤，恢复气血灵力（免费）'},
    {n:'中州·天阙',need:1,desc:'修真中心，卧虎藏龙，炼气期慎入'},
    {n:'南疆·赤炎',need:2,desc:'筑基~金丹，妖兽横行'},
    {n:'西漠·流沙',need:4,desc:'金丹~元婴，佛门净土镇魔渊'},
    {n:'北原·寒渊',need:5,desc:'元婴~化神，雪族与鬼修'},
    {n:'秘境·通灵',need:0,desc:'新手试炼'},
  ];
  const rows=places.map(p=>{const d=p.need>cur;const w=d?`<span class="danger">［危险·建议${REALMS[p.need]}］</span>`:'［可游］';return `<div class="row">${p.n}　${w}　${p.desc}　<a class="lnk" data-act="travel" data-arg="${p.n}|${p.need}">前往</a></div>`;}).join('');
  $('panel').innerHTML=panel('',`九州舆图 · ${timeLine()}`,`<div class="row sm">九州凶险，越界者死。按你当前${realmLabel()}标注可否久留。</div><hr class="sep">${rows}`)+statusCard();
}
function travel(name,need){
  const cur=idxOf(S.realm);
  if(need>cur){log('危险提示',`${name}建议${REALMS[need]}，你仅${realmLabel()}。已示警——去否由你。`);if(d100()<=40){const dmg=20+need*15;S.hp=clamp(S.hp-dmg,1,S.hpMax);S.status='重伤';log('杀劫',`你擅闯高阶地界，遭${REALMS[need]}修士镇压，重伤而逃！`);advanceTime(1);maybeEvent();renderPlay();return;}}
  S.loc=name;
  if(name==='青岳·灵泉'){spring();return;}
  log('游历',`你行至${name}，风物迥异。`);advanceTime(1);maybeEvent();renderPlay();
}

/* ============ 坊市 ============ */
const SHOP=[{n:'聚气丹',price:20,eff:'气血+20'},{n:'筑基丹',price:500,eff:'破境筑基必备'},{n:'玄阶功法',price:600,eff:'功法系数1.3'},{n:'灵药·玉髓',price:120,eff:'炼丹材料'},{n:'聚灵符',price:80,eff:'灵气临时+0.5'}];
function showShop(){const rows=SHOP.map((it,i)=>`<div class="row">${it.n}　${it.eff}　<span class="em">${it.price}</span>灵石　<a class="lnk" data-act="buy" data-arg="${i}">买</a>　<a class="lnk" data-act="sell" data-arg="${i}">卖</a></div>`).join('');$('panel').innerHTML=panel('',`天机坊市 · ${timeLine()}`,`<div class="row">持有灵石：<span class="em">${S.lingShi}</span></div><hr class="sep">${rows}<div class="sm">买则付灵石，卖则回收半数。杀人夺宝可夺财物，然业力自增。</div>`)+statusCard();}
function buy(i){const it=SHOP[i];if(S.lingShi<it.price){log('坊市','灵石不足。');}else{S.lingShi-=it.price;const h=S.bag.find(b=>b.n===it.n);if(h)h.num++;else S.bag.push({n:it.n,num:1});log('坊市',`购入${it.n}，灵石-${it.price}。`);}showShop();}
function sell(i){const it=SHOP[i];const h=S.bag.find(b=>b.n===it.n);if(!h||h.num<=0){log('坊市','你没有可卖的。');showShop();return;}h.num--;S.lingShi+=Math.floor(it.price/2);log('坊市',`售出${it.n}，灵石+${Math.floor(it.price/2)}。`);showShop();}

/* ============ 情缘 ============ */

function affGain(n,d){const b=bondState(n);b.met=true;S.aff[n]=(S.aff[n]||0)+d;log('情缘',`与${n}好感+${d}（${S.aff[n]}·${lvName(S.aff[n])}）。`);}
function bondRequirement(n){const r=BOND_ROUTES[n],j=S.jianghu||{};const reasons=[];if((j.chapter||1)<r.needChapter)reasons.push(`主线需到第${r.needChapter}章`);if(idxOf(S.realm)<r.needRealm)reasons.push(`境界需达${REALMS[r.needRealm]}`);if(n==='玄机子'&&(S.six.仙缘||0)<12)reasons.push('仙缘需达12');if(n==='姬无夜'&&(j.xia||0)<8)reasons.push('侠义需达8');return reasons;}
function meetBond(n){
  const b=bondState(n),r=BOND_ROUTES[n];if(b.met){log('情缘',`你与${n}早已相识。下一步：${bondNext(n)}`);showLove();return;}

  b.met=true;S.aff[n]=Math.max(S.aff[n]||0,12);S.loc=r.where;advanceTime(1);
  const scene=(BOND_STORIES[n]||GENERIC_BOND_STORY)[0];

}
function bondNext(n){const b=bondState(n),v=S.aff[n]||0;if(!b.met)return`循“${BOND_ROUTES[n].route}”前往相识`;const needs=[20,40,60,80];if(b.chapter>=4)return'个人缘线已完成，可在主线与战斗中生死相随';return`好感达到${needs[b.chapter]}后，推进第${b.chapter+1}幕个人剧情（当前${v}）`;}
function advanceBond(n){

/* ============ 存档 / 读档 ============ */
const SAVE_KEY='wenda_changsheng_saves_v1';
const AUTO_SAVE_KEY='wenda_changsheng_auto_v1';
function getSaves(){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return {};}}
function setSaves(o){try{localStorage.setItem(SAVE_KEY,JSON.stringify(o));return true;}catch(e){return false;}}
function saveLocalAuto(){if(!S||CB||SEC||curEvent||phase!=='play')return false;try{localStorage.setItem(AUTO_SAVE_KEY,JSON.stringify(snapShot()));return true;}catch(e){return false;}}
function loadLocalAuto(){try{const p=JSON.parse(localStorage.getItem(AUTO_SAVE_KEY)||'null');return p&&p.S?p:null;}catch(e){return null;}}
function snapShot(){return {S,turn,year,monthIdx,phase,t:Date.now(),v:3};}
function applySnapshot(p){
  if(!p||!p.S)return false;
  S=p.S;turn=p.turn||0;year=p.year||387;monthIdx=p.monthIdx||0;phase='play';ensureGameState();CB=null;SEC=null;curEvent=null;CST=null;return true;
}
function scheduleCloudAutosave(){
  if(!S||phase!=='play')return;
  saveLocalAuto();
  if(!SB_USER)return;
  clearTimeout(cloudSaveTimer);CLOUD_SYNC_STATE='等待同步';renderAcctBar();
  cloudSaveTimer=setTimeout(()=>cloudSaveNow(true),1200);
}
async function cloudSaveNow(silent){
  if(cloudSaveBusy||!S||!SB_USER||CB||SEC||curEvent||phase!=='play')return false;
  if(!await ensureSbAuth()){CLOUD_SYNC_STATE='登录已过期';renderAcctBar();return false;}
  cloudSaveBusy=true;CLOUD_SYNC_STATE='同步中…';renderAcctBar();
  const payload={user_id:SB_USER.id,save_data:snapShot(),updated_at:new Date().toISOString()};
  let r=await sbFetch('/rest/v1/game_saves?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});
  if(r.status===401&&await refreshSbSession())r=await sbFetch('/rest/v1/game_saves?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});
  cloudSaveBusy=false;
  if(r.err){CLOUD_SYNC_STATE='同步失败';renderAcctBar();if(!silent)log('云存档',r.err);return false;}
  CLOUD_SYNC_STATE='已同步 '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});renderAcctBar();
  if(!silent)log('云存档','当前进度已安全保存到账号。');return true;
}
async function loadSupabaseSave(){
  if(!SB_USER||!await ensureSbAuth())return false;
  CLOUD_SYNC_STATE='读取中…';renderAcctBar();
  const r=await sbFetch('/rest/v1/game_saves?select=save_data,updated_at&user_id=eq.'+encodeURIComponent(SB_USER.id)+'&limit=1');
  if(r.err){CLOUD_SYNC_STATE='读取失败';renderAcctBar();log('云同步',r.err);return false;}
  const row=Array.isArray(r.data)&&r.data[0];
  if(row&&applySnapshot(row.save_data)){
    CLOUD_SYNC_STATE='已读取云进度';renderAcctBar();log('云同步',`欢迎回来，已自动继续 ${S.name} 的${realmLabel()}进度。`);renderPlay();return true;
  }
  let migrated=null;
  if(S)migrated=snapShot();

function doCommand(c){
  if(phase==='create1'||phase==='create2pending'){log('天道','尚未创角完成，请先按格式回复落笔。');return;}
  if(phase==='ended'){log('天道','此世已终，可重开。');return;}
  c=c.trim();
  const map={面板:renderPlay,江湖:showJianghu,主线:showJianghu,结局:showFate,宿命:showFate,修炼:()=>doCultivate(false),闭关:()=>doCultivate(true),突破:doBreakthrough,地图:showMap,坊市:showShop,情缘:showLove,洞府:showDongfu,背包:showBag,宗门:showSect,技艺:showSkill,悟道:showWudao,对话:showDialogue,帮助:showHelp,存档:showSave,读档:showSave,秘境:showSecretMenu,图鉴:showBestiary,账号:showAccount};
  if(map[c]){map[c]();setTimeout(focusResult,30);return;}
  if(/闭关\s*(\d+)\s*年/.test(c)){closeYears(parseInt(c.match(/(\d+)/)[0]));return;}
  if(/秘境|探秘/.test(c)){showSecretMenu();return;}
  if(/修炼|打坐|吐纳/.test(c)){doCultivate(false);return;}
  if(/突破|破境/.test(c)){doBreakthrough();return;}
  if(/地图|去|前往|游历|出发/.test(c)){showMap();return;}
  if(/坊市|买|卖|交易|拍卖/.test(c)){showShop();return;}
  if(/双修|情缘|道侣/.test(c)){showLove();return;}
  if(/洞府/.test(c)){showDongfu();return;}
  if(/宗门|师门/.test(c)){showSect();return;}
  if(/背包|乾坤/.test(c)){showBag();return;}
  if(/悟道|论道/.test(c)){showWudao();return;}
  if(/技艺|炼丹|炼器/.test(c)){showSkill();return;}
  if(/对话|交谈/.test(c)){showDialogue();return;}
  if(/存档|读档/.test(c)){showSave();return;}
  if(/帮助|指令/.test(c)){showHelp();return;}
  freeAction(c);
  setTimeout(focusResult,30);
}
function freeAction(text){
  ensureGameState();log(timeLine(),`你决定：「${text}」。江湖依你的能力、名声与因果回应。`);
  if(/查|调查|追踪|线索|夜探/.test(text)){investigateJianghu('main');return;}
  if(/行侠|护送|缉凶|悬赏|委托/.test(text)){openContracts();return;}
  if(/休息|疗伤|睡|养伤/.test(text)){S.hp=clamp(S.hp+Math.round(S.hpMax*.35),0,S.hpMax);S.mp=clamp(S.mp+Math.round(S.mpMax*.35),0,S.mpMax);S.status='无';log('休整','你调息养伤，气血与灵力恢复三成。');advanceTime(1);renderPlay();return;}
  const chance=clamp(35+S.six.神识*2+S.six.遁速-S.jianghu.evil,15,90),r=d100();
  if(/偷|抢|劫|下毒|暗杀/.test(text)){
    if(r<=chance){const gain=30+Math.floor(Math.random()*50);S.lingShi+=gain;S.jianghu.evil+=4;S.karma+=2;log('暗行',`你借夜色成事，获灵石${gain}；但蛛丝马迹已在江湖留下。恶名+4、业力+2。`);}
    else{S.hp=clamp(S.hp-18,1,S.hpMax);S.reputation=Math.max(0,S.reputation-5);log('暗行失败','你被巡夜弟子撞破，负伤脱身，声望-5。');}
  }else if(/救|帮|护|施药|除暴/.test(text)){
    if(r<=chance+15){S.jianghu.xia+=2;S.merit++;S.reputation+=2;log('行侠',`你量力而行，解了旁人之困。侠义+2、功德+1。`);}else{S.hp=clamp(S.hp-10,1,S.hpMax);log('行侠','好心也需本事。你虽未竟全功，却护住了无辜之人。');}
  }else if(/练剑|演武|切磋/.test(text)){S.wudao['剑道']=(S.wudao['剑道']||0)+.5;S.xiu=clamp(S.xiu+2,0,100);log('演武','你将招式拆解重练，剑道与修为均有寸进。');}
  else if(r<=45){S.six.道心=clamp(S.six.道心+.5,1,20);log('江湖推演','此举合乎当前处境，你从中磨炼了心性。');}
  else if(r<=80){S.xiu=clamp(S.xiu+3,0,100);log('江湖推演','事情虽无惊天结果，却使你的修为有所精进。');}
  else{S.mp=clamp(S.mp-5,0,S.mpMax);log('江湖推演','时机与能力尚不匹配，此举未成，只耗去些灵力。');}
  advanceTime(1);maybeEvent();renderPlay();
}
function closeYears(y){
  y=clamp(y,1,50);log('闭关',`你闭关 ${y} 年，岁月无声……`);
  for(let i=0;i<y*12;i++){monthIdx++;if(monthIdx>=12){monthIdx=0;year++;onNewYear();}if(S.age>=MAXAGE[S.realm])return endGame('坐化');
    const k=1+S.six.资质*0.05,lc=LING_COEF[S.lingType]||1,gc=Math.max(...S.gongfa.map(g=>GONG_COEF[g.grade]||1)),qc=QI_COEF[S.dongfu.qi];
    const need=S.realm==='炼气'?8:10;const mc=S.six.道心>=need+4?1.2:(S.six.道心>=need?1.0:0.5);
    S.xiu=clamp(S.xiu+BASE[S.realm]*k*lc*gc*qc*mc*2,0,100);
    if(S.xiu>=100&&S.sub==='圆满'&&d100()<=70){const nx=REALMS[idxOf(S.realm)+1];if(nx){S.realm=nx;S.sub='初期';S.xiu=0;}}
    else if(S.xiu>=100){const si=SUBS.indexOf(S.sub);if(si<3){S.sub=SUBS[si+1];S.xiu=0;}}
  }
  turn++;log('出关',`${y}年转瞬，你睁眼。当前 ${realmLabel()}，修为 ${Math.round(S.xiu)}/100。`);maybeEvent();renderPlay();
}

/* ============ 输入与分发 ============ */
function sendInput(){const inp=$('cmd');const v=inp.value.trim();inp.value='';if(!v)return;
  if(phase==='create1'){const e=parseCreate(v);if(e){log('天道',e);return;}showCreate2();return;}
  if(phase==='create2pending'){parseCreate2(v);return;}
  doCommand(v);
}
function parseCreate2(v){
  let lingType='伪灵根',lingen=['木','火'],tizhi='凡体';
  let six={资质:10,悟性:10,神识:10,遁速:10,道心:10,仙缘:10},talents=[];
  if(/天灵根/.test(v))lingType='天灵根';else if(/地灵根/.test(v))lingType='地灵根';else if(/真灵根/.test(v))lingType='真灵根';else if(/变异/.test(v))lingType='变异灵根';
  const wxf=(v.match(/[金木水火土雷风冰阴阳]/g)||[]);if(wxf.length)lingen=Array.from(new Set(wxf)).slice(0,5);
  if(/先天道体/.test(v))tizhi='先天道体';else if(/剑灵体/.test(v))tizhi='剑灵体';else if(/九阳/.test(v))tizhi='九阳圣体';else if(/冰魄/.test(v))tizhi='冰魄灵体';else if(/玄阴|纯阳/.test(v))tizhi='玄阴体';else if(/混沌/.test(v))tizhi='混沌体';else if(/凡体/.test(v))tizhi='凡体';
  const nums=(v.match(/\d+/g)||[]).map(Number);
  const sixNums=nums.filter(n=>n>=1&&n<=20).slice(0,6);
  if(sixNums.length===6){const ks=['资质','悟性','神识','遁速','道心','仙缘'];ks.forEach((k,i)=>six[k]=sixNums[i]);}
  const total=six.资质+six.悟性+six.神识+six.遁速+six.道心+six.仙缘;
  if(total>60){log('天道',`六维合计${total}，超出60点上限，请重新分配（单项1-15）。`);return;}
  const talMatch=v.match(/天赋?[:：]?\s*([0-9①-⑪\s]+)/);
  if(talMatch){(talMatch[1].match(/[0-9①-⑪]/g)||[]).forEach(c=>{const n=c.charCodeAt(0)>=0x2460?(c.charCodeAt(0)-0x2460+1):parseInt(c);if(n>=1&&n<=11)talents.push(n);});}
  finishCreate(lingen,lingType,tizhi,six,talents);
}

/* ============ 全局点击委托 ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,arg=el.dataset.arg;
  switch(act){
    case 'evt':chooseEvent(arg);break;
    case 'bb':bigBreak(arg);break;
    case 'travel':{const p=arg.split('|');travel(p[0],+p[1]);}break;
    case 'buy':buy(+arg);break;
    case 'sell':sell(+arg);break;
    case 'gift':gift(arg);break;
    case 'meetBond':meetBond(arg);break;
    case 'bondStory':advanceBond(arg);break;
    case 'dual':dual(arg);break;
    case 'talknpc':talkNpc(arg);break;
    case 'view':viewNpc(arg);break;
    case 'travel2':travelLove(arg);break;
    case 'hold':hold(arg);break;
    case 'emb':emb(arg);break;
    case 'confess':confess(arg);break;
    case 'kiss':kiss(arg);break;
    case 'pillow':pillow(arg);break;
    case 'pledge':pledge(arg);break;
    case 'romE':romE(arg);break;
    case 'upQi':upgradeQi();break;
    case 'addFac':addFac();break;
    case 'rest':rest();break;
    case 'restFull':restFull();break;
    case 'spring':spring();break;
    case 'sectTask':sectTask();break;
    case 'sectBig':sectBig();break;
    case 'alchemy':doAlchemy();break;
    case 'wudao':gainWudao(arg);break;
    case 'secret':enterSecret(arg);break;
    case 'sAct':secretAct(arg);break;
    case 'cAct':combatAct(arg);break;
    case 'cSpell':castSpell(+arg);break;
    case 'cMenu':{const m=$('spMenu');if(m)m.style.display=(arg==='close')?'none':'block';break;}
    case 'qA':{ // 主线/年度事件：区分年度与主线
      if(curEvent&&(curEvent.t==='升仙大会'||curEvent.t==='灵气潮汐'))qActYear(arg);else qAct(arg);break;}
    case 'jhInvestigate':investigateJianghu(arg);break;
    case 'jhStory':storyJianghu();break;
    case 'jhContract':openContracts();break;
    case 'jhRumor':hearRumor();break;
    case 'cGender':syncCST();CST.gender=arg;showCreate1();break;
    case 'cOrigin':syncCST();CST.origin=arg;showCreate1();break;
    case 'cDaotu':syncCST();CST.daoTu=arg;showCreate1();break;
    case 'cNext1':cNext1();break;
    case 'cLingType':cLingType(arg);break;
    case 'cLingElem':cLingElem(arg);break;
    case 'cVariant':cVariant(arg);break;
    case 'cTizhi':cTizhi(arg);break;
    case 'cSix':cSix(arg);break;
    case 'cTalent':cTalent(arg);break;
    case 'cNext2':cNext2();break;
    case 'ascend':doAscend();break;
    case 'saveTo':saveTo(arg);break;
    case 'loadFrom':loadFrom(arg);break;
    case 'delSave':delSave(arg);break;
    case 'exportSave':exportSave();break;
    case 'importSave':importSave();break;
    case 'showAccount':showAccount();break;
    case 'doLogin':doLogin();break;
    case 'doReg':doReg();break;
    case 'doLogout':doLogout();break;
    case 'doSbLogin':doSbLogin();break;
    case 'doSbReg':doSbReg();break;
    case 'doSbLogout':doSbLogout();break;
    case 'cloudNow':cloudSaveNow(false);break;
    case 'localSaves':renderSaveLocal();break;
    case 'cloudSave':cloudSave(arg);break;
    case 'cloudLoad':cloudLoad(arg);break;
    case 'cloudDelete':cloudDelete(arg);break;
    case 'cmd':doCommand(arg);break;
    case 'reload':location.reload();break;
  }
  setTimeout(focusResult,30);
});

/* ============ 启动 ============ */
window.addEventListener('DOMContentLoaded',async()=>{
  loadAcct();detectApi();loadSbSession();renderAcctBar();
  // PWA：注册 service worker（仅 http(s) 下有效，file:// 自动跳过）
  if(location.protocol==='http:'||location.protocol==='https:'){
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
  }
  log('天玄历 387 年 · 春','灵气自地脉翻涌，千年灵气潮汐已在暗中酝酿。你立于凡尘与仙途的门槛，前路未卜，唯道心可问。');
  phase='create1';showCreate1();
  $('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')sendInput();});
  if(supabaseReady()&&SB_SESSION){
    if(await ensureSbAuth()){SB_USER=SB_SESSION.user;CLOUD_SYNC_STATE='已登录';renderAcctBar();await loadSupabaseSave();}
    else{CLOUD_SYNC_STATE='登录已过期';renderAcctBar();}
  }else{
    const localAuto=loadLocalAuto();
    if(localAuto&&applySnapshot(localAuto)){log('自动读档',`已继续本机最近进度：${S.name} · ${realmLabel()}。`);renderPlay();}
  }
});
window.addEventListener('online',()=>{if(SB_USER)scheduleCloudAutosave();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveLocalAuto();if(SB_USER)cloudSaveNow(true);}});
</script>
