<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6FA698">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="问道长生">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<title>问道长生 · 天道系统</title>
<style>
  :root{
    --paper:#FBF8F1; --gold:#C9A45C; --ink:#3F3A34; --grey:#8C8578; --blk:#2B2620;
    --cyan:#6FA698; --purple:#8B6FA8; --red:#C4675C; --pink:#D88FA5;
    --violet:#A98FD9; --blue:#7FA8C9; --bamboo:#8FBFA0;
    --warn:#FBEDE9; --mystic:#F5EFF9; --love:#FAEFF3;
    --empty:#E8E4DC;
    --hp:#C05F55; --mp:#5E8FAE; --xiu:#A87E2E; --life:#5C8C6E; --stone:#A87E2E; --merit:#6BA38E; --karma:#8E8578; --aff:#D88FA5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#EFEAE0;color:var(--ink);font-family:"Songti SC","STSong","SimSun",serif;font-size:15px;line-height:1.6;}
  #wrap{max-width:780px;margin:0 auto;padding:14px 12px 96px;}
  h1{text-align:center;color:var(--cyan);letter-spacing:4px;font-size:22px;margin:6px 0 2px;}
  .sub{text-align:center;color:var(--grey);font-size:12px;margin-bottom:10px;letter-spacing:2px;}
  #log{background:var(--paper);border:1px solid #E2DACC;border-radius:8px;padding:10px 14px;margin-bottom:10px;max-height:200px;overflow-y:auto;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  #log .t{color:var(--gold);font-weight:bold;letter-spacing:1px;}
  #log .n{color:var(--ink);margin:2px 0 8px;white-space:pre-wrap;}
  #feedbackToast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,14px);width:min(720px,calc(100% - 24px));background:rgba(43,38,32,.96);color:#fff;border-left:4px solid var(--gold);border-radius:8px;padding:9px 12px;box-shadow:0 6px 24px rgba(0,0,0,.24);z-index:20;opacity:0;pointer-events:none;transition:.2s;line-height:1.45;font-size:13px;}
  #feedbackToast.show{opacity:1;transform:translate(-50%,0);}
  #feedbackToast b{color:#F2D28B;margin-right:6px;}
  #panel{scroll-margin-top:8px;}
  .panel{border:3px solid var(--cyan);background:var(--paper);border-radius:10px;padding:0;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden;}
  .panel.warn{border-color:var(--purple);background:var(--warn);}
  .panel.mystic{border-color:var(--violet);background:var(--mystic);}
  .panel.love{border-color:var(--pink);background:var(--love);}
  .panel.fight{border-color:var(--red);background:var(--paper);}
  .titlebar{background:var(--cyan);color:#fff;font-weight:bold;font-size:17px;padding:8px 12px;letter-spacing:2px;text-align:center;}
  .panel.warn .titlebar{background:var(--purple);}
  .panel.mystic .titlebar{background:var(--violet);}
  .panel.love .titlebar{background:var(--pink);}
  .panel.fight .titlebar{background:var(--red);}
  .body{padding:10px 14px 12px;}
  .sep{border:0;border-top:2px solid var(--gold);margin:8px 0;opacity:.7;}
  .row{margin:3px 0;}
  .sm{color:var(--grey);font-size:12.5px;}
  .em{color:var(--blk);font-weight:bold;}
  .bar{display:inline-block;width:7.2em;height:1em;background:var(--empty);border-radius:2px;vertical-align:middle;overflow:hidden;border:1px solid #ddd6c8;}
  .bar .fill{display:block;height:100%;}
  .barval{font-size:12px;color:var(--grey);margin-left:4px;}
  .wb{display:inline-block;color:#fff;background:#999;border-radius:3px;padding:0 6px;margin:0 2px;font-size:12.5px;font-weight:bold;}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .opt{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--cyan);border-radius:7px;padding:7px 10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--blk);transition:.12s;}
  .opt:hover{background:#f1f6f3;}
  .optkey{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;min-width:26px;height:24px;background:var(--cyan);color:#fff;font-weight:bold;border-radius:5px;}
  .opttag{display:inline-block;flex:0 0 auto;color:#fff;font-size:11.5px;font-weight:bold;padding:1px 7px;border-radius:4px;letter-spacing:1px;}
  .opt.sel{background:#eef4ef;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
  .opt:disabled{opacity:.45;cursor:not-allowed;}
  .cgrp{margin:6px 0;}
  .clabel{display:block;color:var(--cyan);font-weight:bold;font-size:13px;margin-bottom:3px;letter-spacing:1px;}
  .cinline{font-family:inherit;padding:3px 6px;border:1px solid #ccc;border-radius:5px;}
  .cwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;}
  .cwrap label{color:var(--ink);font-size:13px;}
  .opttext{flex:1 1 180px;min-width:0;line-height:1.45;overflow-wrap:anywhere;}
  .txt{width:92%;padding:6px 8px;background:#14151c;border:1px solid #3a3d4c;border-radius:4px;color:#e8e6e0;font-size:13px;margin:4px 0;}
  .opthint{display:block;flex:0 0 100%;width:100%;padding-left:34px;font-size:11px;color:var(--grey);line-height:1.5;letter-spacing:.3px;overflow-wrap:anywhere;}
  .opthint b{color:var(--red);}
  .opthint .g{color:#5C8C6E;}
  .cmdbar{position:fixed;bottom:0;left:0;right:0;background:#f3efe6;border-top:1px solid #ddd6c8;padding:7px 8px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:780px;margin:0 auto;z-index:5;}
  .cmdbar button{background:var(--cyan);color:#fff;border:0;border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:1px;}
  .cmdbar button:hover{opacity:.85;}
  .cmdbar input{flex:1;min-width:140px;border:1px solid #ccc;border-radius:6px;padding:6px 9px;font-family:inherit;font-size:14px;}
  .cmdbar .send{background:var(--gold);}
  .danger{color:var(--red);font-weight:bold;}
  .questbox{background:#F7F1E4;border:1px solid #DAC58F;border-radius:8px;padding:9px 10px;margin:7px 0;}
  .questbox .chapter{color:#9A7027;font-weight:bold;letter-spacing:1px;}
  .actiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px;}
  .actiongrid .opt{height:100%;}
  .intent{border:1px dashed #C4675C;background:#FBEDE9;border-radius:6px;padding:6px 9px;color:#8A4038;margin:6px 0;}
  .center{text-align:center;}
  a.lnk{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .qi{display:inline-block;margin-right:8px;font-size:12.5px;}
  /* 账号条 */
  .acctbar{text-align:center;color:var(--grey);font-size:12.5px;margin:2px 0 8px;letter-spacing:1px;}
  .acctbar b{color:var(--blk);}
  /* 触感优化：去除点击延迟，避免误触缩放 */
  button,.opt,a.lnk{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  html,body{text-size-adjust:100%;-webkit-text-size-adjust:100%;}
  /* 大屏：输入框与按钮同行 */
  .cmdbar input{flex:1 1 160px;}
  /* 移动端适配 */
  @media (max-width:600px){
    body{font-size:14px;line-height:1.55;}
    #wrap{max-width:100%;padding:8px 8px 168px;}
    h1{font-size:18px;letter-spacing:3px;margin:4px 0 2px;}
    .sub{font-size:10.5px;letter-spacing:1px;margin-bottom:6px;}
    #log{max-height:160px;padding:8px 10px;margin-bottom:8px;}
    .panel{border-width:2px;margin:8px 0;}
    .titlebar{font-size:15px;padding:7px 10px;}
    .body{padding:9px 11px 10px;}
    .opt{font-size:13.5px;padding:10px 11px;border-radius:8px;}
    .optkey{min-width:24px;height:22px;}
    .opthint{padding-left:32px;font-size:11.5px;}
    .acctbar{font-size:11.5px;}
    /* 指令栏：输入框独占一行，按钮下方自动换行 */
    .cmdbar{left:0;right:0;max-width:100%;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:5px;justify-content:flex-start;}
    .cmdbar input{order:0;flex:1 1 100%;min-width:0;font-size:16px;padding:11px 10px;margin-bottom:4px;border-radius:8px;}
    .cmdbar button{flex:0 0 auto;font-size:13px;padding:9px 8px;letter-spacing:0;border-radius:7px;}
    .cmdbar .send{flex:0 0 auto;}
    #feedbackToast{bottom:158px;font-size:12.5px;}
    .actiongrid{grid-template-columns:1fr;}
  }
  @media (min-width:601px) and (max-width:820px){
    #wrap{max-width:680px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>问 道 长 生</h1>
  <div class="sub">高自由修仙模拟器 · 作者：雾见川 · 天道系统主持</div>
  <div id="acctbar" class="acctbar"></div>
  <div id="log"></div>
  <div id="panel"></div>
</div>
<div id="feedbackToast" aria-live="polite"></div>
<div class="cmdbar">
  <input id="cmd" placeholder="输入指令或自由行动，如：修炼 / 突破 / 去南疆 / 秘境 / 双修" autocomplete="off">
  <button class="send" onclick="sendInput()">行</button>
  <button onclick="doCommand('面板')">面板</button>
  <button onclick="doCommand('修炼')">修炼</button>
  <button onclick="doCommand('突破')">突破</button>
  <button onclick="doCommand('秘境')">秘境</button>
  <button onclick="doCommand('地图')">地图</button>
  <button onclick="doCommand('江湖')">江湖</button>
  <button onclick="doCommand('坊市')">坊市</button>
  <button onclick="doCommand('情缘')">情缘</button>
  <button onclick="showBestiary()">图鉴</button>
  <button onclick="showSave()">存档</button>
  <button onclick="showSave()">读档</button>
  <button onclick="showRecovery()">休整</button>
  <button onclick="showRestart()">重开</button>
  <button onclick="doCommand('帮助')">帮助</button>
</div>

<script src="./supabase-config.js"></script>
<script>

const NPCS={

  '谢无咎':{desc:'血魔宗少主，红衣妖冶，杀伐果决，24',gender:'女',like:['酒','战','真心'],tone:'邪魅'},

  '沈墨卿':{desc:'江南女散修，诗酒疏狂，23',gender:'女',like:['酒','诗','棋'],tone:'疏狂'},

};
/* 众女画像：外貌、气质与心性（立体的她们） */
const PORTRAIT={
 '顾清玄':'月白剑袍，乌发以青玉簪束得一丝不苟，眉如远山、眸若寒星，握剑的指节处有常年磨出的薄茧。清冷如谪仙，却在无人处会放缓脚步等你，或偷偷把你爱喝的茶换成更温的一盏。',

 '花千影':'眉眼是蚀骨的媚，眼尾微挑，唇色如血，爱穿月白与绯红相间的薄纱，腕上一串铃铛。一举一动皆是风情，笑里藏着刀，可那刀尖从不舍得朝向有你的方向。',
 '洛青瑶':'一袭雪白剑袍，乌发高束，眉眼清傲如霜，鼻梁挺直，下颌线利落，执剑的手极稳。浑身是生人勿近的孤高，唯独会为你，把高处的雪也捂出一丝暖意。',
};

const BOND_STORIES={
 '顾清玄':[
  '暮雨洗过青云山，洗剑台上只余松声。顾清玄的本命剑被人动过手脚，你没有声张，陪她从断裂的剑穗查到执事堂暗柜。天将亮时，她把重新系好的剑递到你面前，却没有先接剑，只低声说：“这一夜你替我守的不是剑，是我在宗门里最后一点可以相信的东西。”自此，你在她眼中不再只是同门。',
  '外门大比前夕，有人以你的出身为由逼你退赛。顾清玄素来清冷寡言，那日却横剑挡在长阶中央，一人压得满堂噤声。她没有替你决定，只陪你把每一式剑招重新拆开。月落时，你累得靠在她肩上，她仍握着你的手腕教你运气，声音轻得像怕惊散这场难得的亲近。',

 '云栖':[
  '天机坊市灯火如昼，云栖故意把一枚假玉简卖给你，又笑吟吟等你拆穿。你没有掀她的摊子，反而借假玉简钓出了追查她的黑市杀手。收市后，她请你坐在堆满账册的小阁楼里，第一次收起商人的笑：“人人都想从我这里买答案，只有你先问我怕不怕。”那夜她送你的不是宝物，而是一枚只对你发亮的传音铜钱。',

 '谢无咎':[

  '你被正道误认为血魔同党，昔日同门纷纷拔剑。谢无咎原可置身事外，却独自闯进审剑台，将所有罪名揽到自己身上。你与她杀出重围后，她在荒寺里替你包扎，笑说自己本就是恶人，不在乎多背几口黑锅。你按住她的手告诉她，你在乎。那一瞬，她眼底惯有的戏谑彻底碎了。',

 '白凝霜':[
  '北原暴雪封路，你在冰窟里找到白凝霜时，她正用最后的灵力护着一只幼小雪灵。你把唯一的火种推给她，自己守在风口一夜。天亮后，她没有道谢，只把冰魄珠放入你掌心：“雪族不轻易欠人。此珠在，你若遇险，我会知道。”她转身走入风雪，却在百步之外第一次回头。',
  '寒渊祭典上，族人逼白凝霜斩断尘缘。她站在万丈冰台上仍旧清冷，直到看见你独自穿过雪族剑阵。你没有要求她离开族群，只说愿意陪她承担选择的代价。冰台崩裂时，她握住你的手，指尖依旧冰凉，却再也没有松开。',
  '玄冰雪魇吞噬神识，你被困在最痛苦的旧梦里。白凝霜以本命冰莲闯入梦境，一寸寸替你冻结心魔。她因此修为大损，却只在你醒来时淡淡说了一句“无妨”。你看见她雪白长发间新生的霜色，终于明白这两个字背后，是她几乎押上了全部性命。',
  '北原极夜，万里冰川映着星河。白凝霜摘下圣女冠，任长发落在你肩头。她说自己从前以为道心应当无情，后来才知道，真正的强大是有了牵挂仍敢迎向天劫。她主动吻你，冰雪在脚下开出一线春花。从此寒渊有两位主人，也有了一盏永远为你亮着的灯。'

 '叶知秋':[
  '问道崖上，叶知秋问你为何执剑。你没有答苍生大义，只说弱小时曾无人替你出头，所以想成为后来者身前的那个人。她听罢久久不语，最终将自己的旧剑借给你三日。那柄剑曾斩过化神妖王，而她真正交给你的，是一位玄门女长老罕见的信任。',
  '你在论道会上被诸宗天骄围攻，叶知秋没有出手替你取胜，只在你最狼狈时传来一句：“不必像任何人。”你因此悟出自己的剑意，反败为胜。散场后她在无人处替你擦去脸侧血迹，端方神色里藏着压不住的欣慰：“我教过许多人，唯有你让我想陪着看得更远。”',
  '天衍宗要她以你为祭推演大劫，叶知秋当众毁去宗门至宝天机盘。反噬令她一夜白发，她却仍平静地护你下山。你问是否值得，她望着远山说，修道千年若连想护之人都护不住，所谓天机不过是笑话。那是她第一次牵你的手，也是第一次违逆整个天下。',

 ],
 '姬无夜':[
  '古妖山王庭前，你接下姬无夜三招，膝骨几乎碎裂也不肯跪。她本在王座上冷眼旁观，第三招落下时却亲自收了力。群妖都以为你必死，她却俯身将你抱起，宣告你是古妖山的贵客。只有你看见，那位绝代风华的女妖王眼中第一次出现了欣赏之外的东西。',
  '妖族诸王反叛，姬无夜被困万妖噬魂阵。你明知境界悬殊仍闯阵，将自己的血抹在她眉心，替她唤回神智。她破阵后杀意滔天，却先把披风裹在你身上。面对跪伏群妖，她只朱唇轻启：“今日之后，见此人如见本王。”那不是赏赐，而是她能给出的最高承认。',
  '天劫降临古妖山，姬无夜本可独自飞升，却为护你硬生生折断一角妖王真身。你在雷海中抱住她，说若不能同行，长生也无趣。她仰天大笑，第一次放下帝王威仪，低头与你额心相抵。万妖看见他们的王为一女子红了眼，却无人敢出声。',
  '九州平定后，姬无夜将半座王庭改成你喜欢的模样。朝会散去，她会卸下冠冕，把头枕在你膝上，任你触碰无人敢近的妖角。她仍号令天下、威压万族，却会在你远行时亲自撕开虚空来接。所谓妖王法旨，最常说的一句竟成了：“谁敢动你，本王便让这一界换个主人。”'
 ],
 '萧景行':[
  '帝京长街刺客暴起，你与萧景行隔着人海同时拔剑。事后她没有拿无辜侍卫顶罪，反而顶着朝臣压力彻查幕后。你因此答应暂入长公主府相助。她给你最高规格的客卿令，却在无人处问：“若我不是长公主，只是萧景行，你还愿不愿与我喝一杯？”',
  '夺嫡风波中，萧景行被逼在江山与你之间选择。她当着满朝文武烧掉能置你于死地的伪证，也因此失去最稳妥的登基之路。深夜宫墙上，她笑得仍旧英锐，说帝位可以再争，真正并肩的人失去便不会再有。你替她披上风氅时，她握住你的手，久久未放。',
  '敌国仙师压境，萧景行以龙气强行迎战，重伤坠下城楼。你在万军之前接住她，她醒来的第一句话不是战况，而是问你有没有受伤。后来你们共守孤城七日，她将背后交给你，也把最不容人窥见的恐惧与疲惫一并交给了你。',
  '新朝立国那日，萧景行没有把你困在后宫或王座旁。她在百官面前赐你与帝王并行之权，又在夜里独自捧来一枚没有刻凤纹龙纹的素戒。她说天下是责任，你才是归处。宫灯万盏，她吻你时不再是长公主或女帝，只是那个终于得偿所愿的萧景行。'
 ],
 '玄机子':[
  '无名棋亭不在地图上，你循着一片逆风而飞的落叶找到那里。玄机子与你下了三日残局，每一步都能看见自己不同的死法。你最终没有落在唯一的生门，而是替棋盘外受劫的村庄挡下一灾。她第一次抬眼认真看你：“能舍天命而取本心，才配与我再下一局。”',
  '玄机子带你行走在被抹去的时间支流，看见你若从未修道，本可平安终老。你没有后悔，只问那些与你相识的人是否仍会孤独。她沉静千年的心湖因此起了波澜。归来时，她把一枚棋子放进你掌心，允许你在任何生死时刻唤她一次。',
  '域外天魔以众生未来逼玄机子回归无情大道，她几乎抹去与你有关的全部记忆。你在棋亭等了七年，每年都摆同一盘棋。第八年雪落时，她终于回来，明明不记得你，却在看见残局的一刻落下泪来。原来有些情意比轮回更深，连天道也删不干净。',
  '最终她替你落下一枚逆天之子，改去必死命数，也因此失去窥见未来的能力。你问可曾后悔，玄机子只是握住你的手，说从前看遍万世却从未真正活过，如今前路一片未知，反而觉得欢喜。棋亭外春山如笑，她俯身吻你眉心，从此不再算你们的结局。'
 ],
 '温若曦':[
  '药王谷的百草园里，一株千年药王正以肉眼可见的速度枯黄。满谷丹师束手无策，温若曦却对着它连诊了三日，像在为一个老友把脉。你没有随众离开，而是替她翻遍谷中残卷，终于找出病根——不是药王中毒，而是地脉灵气被人抽走了一条。你连夜以自身灵机温养地脉，天光破晓时，药王重新抽芽。她捧着一盏清茶走到你面前，指尖还沾着泥：“你救的不是一株药，是我医道里最不舍的一课。”',
  '疫病蔓延至药王谷外三镇，温若曦一人之力救不了一城。你把攒下的灵石尽数换了药材，跟着她一头扎进疫镇。她在前头看诊，你在后头煎药，七天七夜不曾合眼。最后一名病愈的孩子搂着她的脖子不肯松手，她回头看你，眸子里是疲惫而明亮的笑意：“从前我以为医者孤身可渡众生，如今才知，有人并肩比什么灵丹都管用。”',
  '北疆大旱，温若曦为救一片将死的药田，透支本源招来灵雨，自己却灵力溃散倒在田埂上。你背着她走了三百里找到药王谷，又守在榻前看她昏迷了整整七日。她醒来第一句话是问你田里的药活没活。你气笑，把那株她拼死救下的药草放进她手里：“活得好好的——现在轮到你的命，我来治了。”',

let SB_USER=null;
let CLOUD_SYNC_STATE='未登录';

let cloudSaveBusy=false;
let CLOUD_REVISION=null;
function sbConfig(){const c=window.WENDA_SUPABASE||{};return {url:String(c.url||'').replace(/\/$/,''),anonKey:String(c.anonKey||'')};}
function supabaseReady(){const c=sbConfig();return /^https:\/\/.+\.supabase\.co$/.test(c.url)&&c.anonKey.length>40;}
function loadSbSession(){try{SB_SESSION=JSON.parse(localStorage.getItem('wenda_supabase_session')||'null');SB_USER=SB_SESSION&&SB_SESSION.user||null;}catch(e){SB_SESSION=null;SB_USER=null;}}
function saveSbSession(){try{localStorage.setItem('wenda_supabase_session',SB_SESSION?JSON.stringify(SB_SESSION):'');}catch(e){}}
async function sbFetch(path,opts={}){
  const c=sbConfig();if(!supabaseReady())return {err:'云同步尚未配置'};
  const headers={apikey:c.anonKey,'Content-Type':'application/json',...(opts.headers||{})};
  if(opts.auth!==false&&SB_SESSION&&SB_SESSION.access_token)headers.Authorization='Bearer '+SB_SESSION.access_token;
  try{
    const res=await fetch(c.url+path,{...opts,headers});
    const data=await res.json().catch(()=>null);
    if(!res.ok)return {err:(data&&(data.msg||data.message||data.error_description||data.error))||('请求失败 '+res.status),status:res.status};
    return {data,status:res.status};
  }catch(e){return {err:'云端网络不可达：'+e.message};}
}
async function refreshSbSession(){
  if(!SB_SESSION||!SB_SESSION.refresh_token)return false;
  const r=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:JSON.stringify({refresh_token:SB_SESSION.refresh_token})});
  if(r.err){SB_SESSION=null;SB_USER=null;saveSbSession();return false;}
  SB_SESSION=r.data;SB_USER=r.data.user;saveSbSession();return true;
}
async function ensureSbAuth(){
  if(!SB_SESSION||!SB_SESSION.access_token)return false;
  const expires=(SB_SESSION.expires_at||0)*1000;
  if(expires&&Date.now()>expires-60000)return refreshSbSession();
  return true;
}
async function verifySbAuth(){
  if(!await ensureSbAuth())return false;
  let r=await sbFetch('/auth/v1/user',{method:'GET'});
  if(!r.err)return true;
  if(r.status===401&&await refreshSbSession()){r=await sbFetch('/auth/v1/user',{method:'GET'});if(!r.err)return true;}
  SB_SESSION=null;SB_USER=null;CLOUD_REVISION=null;saveSbSession();CLOUD_SYNC_STATE='请重新登录';renderAcctBar();return false;
}
function detectApi(){ if(location.protocol.indexOf('http')===0){API_BASE='';} else {API_BASE=(localStorage.getItem('wenda_apibase')||'').trim();} }
function loadAcct(){try{ACCT=JSON.parse(localStorage.getItem('wenda_account')||'null');}catch(e){ACCT=null;}}
function saveAcct(){try{localStorage.setItem('wenda_account',ACCT?JSON.stringify(ACCT):'');}catch(e){}}
async function api(path,body,method){
  const url=(API_BASE||'')+path;
  const headers={'Content-Type':'application/json'};
  if(ACCT&&ACCT.token)headers['Authorization']='Bearer '+ACCT.token;
  try{
    const res=await fetch(url,{method:method||(body?'POST':'GET'),headers,body:body?JSON.stringify(body):undefined});
    const j=await res.json().catch(()=>({err:'返回非JSON'}));
    if(!res.ok)return {err:j.err||('错误'+res.status)};
    return j;
  }catch(e){return {err:'网络不可达：请确认服务器已启动且地址正确（'+e.message+'）'};}
}

function lifeSummary(){
  const parts=[];
  const tj=Object.keys(S.tianjiao||{}).map(i=>TIANJIAO[+i]&&TIANJIAO[+i].name).filter(Boolean);
  if(tj.length)parts.push(`曾败尽天骄「${tj.slice(0,2).join('」「')}」`);
  if((S.fortunes||[]).length)parts.push(`身负「${S.fortunes[0]}」`);
  if((S.daoban||[]).length)parts.push(`与道侣${S.daoban[0]}携手同行`);
  if(S.merit>=10)parts.push('功德无量');
  if(S.karma>=10)parts.push('业力缠身');
  if(S.jianghu&&S.jianghu.xia>=10)parts.push('侠名满九州');
  if(S.origin&&S.origin.lv>=5&&ORIGINS[S.origin.key])parts.push(`${S.origin.key}家业登峰，号「${ORIGINS[S.origin.key].levels[4]}」`);
  const t=[
   `那一世，${parts.length?parts.join('，')+'。':'并无惊天动地的大事迹，可每一步都是你自己走出来的。'}`,
   `那一世，后世修士谈起你，总会说起${parts.length?parts.slice(0,2).join('与'):'你那一句问心无愧的「道」'}。`,
   `那一世，你在${S.loc}住了很久，久到山下的孩子都以为你是山的一部分。${parts.length?'偶尔有人问起你的往事，你只笑着摇摇头。':''}`,
  ];
  return pick(t);
}

function doAscend(){
  const base=20;

/* 结局计算：由道途、业力/功德与主线分支共同决定 */
function computeEnding(){
  const c=S.choices||[],hits=[];
  if((S.origin||{}).lv>=5){
    const k=S.origin.key;
    const om={'商贾之家':'富可敌国','农家子':'田园仙隐','妖族后裔':'万妖之祖','将门之后':'铁血元帅','书香门第':'文圣'};
    if(om[k])hits.push(om[k]);
  }
  if(S.karma>=15&&(S.daoban||[]).includes('谢无咎'))hits.push('魔帝');
  if((S.daoban||[]).includes('温若曦')&&S.merit>=15)hits.push('医仙');
  if((S.wudao['剑道']||0)>=12&&c.includes('humanitySword'))hits.push('剑神');
  if(c.includes('dynasty')&&(S.daoban||[]).includes('萧景行')&&S.reputation>=60)hits.push('人皇');
  if(S.karma>=12)hits.push('魔道');
  if(S.daoTu==='逍遥长生')hits.push('逍遥');
  if(S.daoTu==='问鼎天下')hits.push('仙尊');
  if(S.daoTu==='守护所爱')hits.push('守护');
  if(!hits.length)hits.push('飞升');
  /* 天机不定：命数不在写死的优先级里——同一境遇，也可能走向不同的终局 */
  if(hits.length>1&&d100()<=30)hits.splice(Math.floor(Math.random()*hits.length),1);
  return hits[Math.floor(Math.random()*hits.length)];
}

function bigBreak(path){

function outMul(a,d){const diff=a-d;if(diff>=2)return 2.2;if(diff===1)return 1.6;if(diff===-1)return 0.4;if(diff<=-2)return 0.12;return 1.0;}

function bestBondAlly(enemy,minAff){
  if(!S)return null;ensureGameState();minAff=minAff||40;
  const list=Object.keys(BOND_ROUTES).filter(n=>S.bonds[n]&&S.bonds[n].met&&(S.aff[n]||0)>=minAff).map(n=>{
    const r=BOND_ROUTES[n],aff=S.aff[n]||0,power=idxOf(r.realm)*18+aff+(S.daoban||[]).includes(n)*35;

/* 胜负预估：按境界差、资质、气血、战意估算胜率（仅供参考） */
function combatOdds(){
  if(!CB)return null;
  const e=CB.enemy;

  odds+=(S.six.遁速-10)*0.5;
  odds+=((S.hp/S.hpMax)-(e.hp/e.hpMax))*20;

  if(S.xiu>=100)odds+=6;
  odds=clamp(Math.round(odds),4,96);
  const verdict=odds>=70?'胜算可观，可放手一搏':odds>=45?'胜负五五，谨慎行事':odds>=25?'凶多吉少，宜避其锋':'九死一生，速速遁走';

function enemyTurn(){

  let intentMul=CB.intent==='heavy'?1.65:CB.intent==='feint'&&!CB.observed?1.2:1;
  let dmg=Math.round(e.atk*mul*intentMul*(CB.def?0.45:1)*(0.85+Math.random()*0.3));
  S.hp=clamp(S.hp-dmg,0,S.hpMax);
  log('战斗',`${e.name}反击，伤你 ${dmg}。${S.hp<=0?'':''}`);
  if(S.hp<=0){if(callBondAid(true))return;if(S.hp<=0)return combatLose();}
  CB.def=false;CB.round++;CB.intent=rollEnemyIntent();genQi();
}

function castSpell(i){

  e.hp-=dmg;CB.observed=false;
  log('战斗',`你施展${sp.n}，伤${e.name} ${dmg}。`);
  if(e.hp<=0)return winCombat();
  enemyTurn();renderPlay();
}
function winCombat(){
  const e=CB.enemy;
  const afterWin=CB.afterWin;
  log('战斗',`${e.name}轰然倒地，战局已定。`);
  const ck=S.codex[e.key||e.name];if(ck)ck.slain=true;
  const loot=['妖丹','玄铁','灵草'].filter(x=>Math.random()<0.45);
  loot.forEach(x=>giveItem(x,1));
  S.lingShi+=20+Math.floor(Math.random()*30);
  if(e.beast){log('战利品',`猎得灵石与兽材${loot.length?('、'+loot.join('、')):''}。除妖不增业力。`);S.merit+=1;}

  else{log('战利品',`夺得灵石${loot.length?('、'+loot.join('、')):''}。无名杀伐有损心性，业力+2。`);S.karma+=2;S.jianghu.evil+=1;}
  if(S.flags.血魔仇&&/血魔/.test(e.name)){S.flags.血魔仇=false;S.merit++;log('因果','你斩却昔日之仇，了却一桩因果，功德+1。');}
  masteryTick(1);

}
function combatLose(){

}

function secretAct(a){

    log('秘境',msg);advanceTime(0);renderPlay();return;
  }
  if(a==='loot'){
    const items=N.items||['灵草','玄铁','玉髓','聚气丹'];
    let it=items[Math.floor(Math.random()*items.length)];
    if(it==='筑基丹?')it=d100()<=30?'筑基丹':'聚气丹';
    if(it==='灵石大'){S.lingShi+=Math.floor(Math.random()*200)+100;log('秘境','你取走一堆灵石！');}
    else{S.bag.push({n:it,num:1});log('秘境',`你取走${it}。`);}
    S.lingShi+=Math.floor(Math.random()*40);advanceTime(0);renderPlay();return;
  }
  if(a==='deep'){
    if(d100()<=def.risk*10){const lvl=clamp(idxOf(S.realm)+1,0,9);startCombat(mkEnemy('秘境凶物',REALMS[lvl],'初期',['火','金'][0],14+lvl*5,100+lvl*40,60));return;}

  if(a==='next'){secretStep();return;}
}

  {k:'C',tag:'夜话',c:'#6FA698',tx:'跟她讲这些年仙路见闻',f:()=>{rdLove('李青君',2);log('红颜录','你给她讲幽冥的鬼差、天界的门、妖城的狐火，讲万界盟约立成那天诸界之主挤在一桌喝酒的窘态。她听得认真，偶尔插一句嘴，句句都在点上。讲到孟轻影翻墙送酒那段，她挑眉：“那魔女还缠着你？”你赶紧岔开话题。她哼了一声，却也没有追究，只把酒碗往你面前一推：“继续讲——本将军听着呢。”');}}

{who:'明河',t:'月落问道 · 十年之约',scene:'月上中天，你在山巅道观寻到明河。她正对着月亮打坐，道袍在夜风里轻轻摆动，像一朵被月光浸透的云——观中的香火早已熄了，只有檐角的风铃在风里轻轻作响。听见脚步声，她也不睁眼，声音平静如水面：道友深夜来访，所为何事？你也不客气，在她对面的蒲团上坐下，从怀里摸出一壶酒——那是临走时从南离新城带出来的，还温着：十年之约，贫道没忘——不是，我是说，你当初说要看我问道能走到哪一步。如今七卷走完，想请你品评品评。她终于睁开眼，眸中倒映着月色，像两泓清泉，映着你那副嬉皮笑脸的模样，却罕见地没有斥你妄语。她看着你，看了很久，才缓缓道：走到万界之巅，还惦记着叫贫道品评——道友这颗心，倒是一点没变。她说着，难得地弯了弯唇角，那笑意极淡，却让满山的月色都仿佛亮了一分。她从袖中取出两只陶盏，素白的指尖在月光下显得格外干净：山泉沏的，将就喝。你接过，滚烫的盏沿却让她指尖与你一触即离，快得像怕烫着——可你分明感觉到，那一触之间，她的指尖微微颤了一下。夜风穿过道观，檐角风铃轻响，像在替谁说着什么。她望着月色，沉默了很久，忽然轻声说：当年在长生观前赠你桃木剑，说术法只用于妖魔——如今才知道，有些东西，比妖魔更难对付。她没有说那是什么东西。可你望着她低垂的眉眼、微微泛红的耳尖，忽然觉得，自己好像明白了。你端起那盏茶，一口饮尽，茶香清苦，回甘却长。她没有看你，只望着月亮，可你分明看见，她握着茶盏的指尖，悄悄松了松。你与明河就着月光，喝完了那壶从南离带来的酒。她难得没有念你妄语，也没有说道友不可饮酒——只是偶尔举盏，与你碰一碰，发出一声极轻的脆响。酒过三巡，你问起她这些年的近况。她说她依旧游历天下、斩妖除魔，只是如今妖邪渐少，她更多时候是在各宗讲道授法，把毕生所学传下去。你说：那你可曾后悔，当年把桃木剑赠了我？她沉默片刻：不曾。那柄剑替你挡过东华子，替你护过南离百姓——它比跟着贫道斩妖，更有意义。你听着她的话，忽然觉得，这位总是清冷自持的道姑，其实比谁都明白——有些东西，赠出去，比留在身边更圆满。夜渐深，她起身送你到观门口。月光下，她稽首一礼，声音还是那般清冷：道友——后会有期。你回了一礼：后会有期。你转身走出几步，忽然听见她在身后轻声补了一句：……若得空，常来。你没有回头，只朝她挥了挥手。月色里，那声常来，比任何道法都让你心头一暖。你回到住处，却翻来覆去睡不着。窗外月色正好，你索性披衣起身，又走回那座道观。观门虚掩着，你轻轻推开——明河还坐在蒲团上，没有睡，像是在等什么。她见你回来，也不惊讶，只抬眼看了你一下：道友落东西了？你摇头：不是。是方才有一句话，没来得及说。她望着你，没有接话。你看着她月光下的眉眼，忽然道：明河——若我说，这十年里，我偶尔也会想起长生观前，你递给我那柄桃木剑的样子，你信么？她沉默了很久。月光在她眼底流转，像一泓被风吹皱的秋水。良久，她轻声道：信。她又顿了顿，声音低下去：因为贫道这十年里，也偶尔会想起，离火城头那个替我挡风的背影。你们都没有再说话。月色静悄悄地流淌，把满观都镀上一层银白。你走过去，在她对面的蒲团上坐下，像来时那样。她垂下眼，没有赶你走。这一坐，便坐到了天明。晨光初现时，她忽然道：道友——下回来，贫道给你沏一壶好茶。你望着她，笑了：一言为定。',opts:[
  {k:'A',tag:'听禅',c:'#7FA8C9',tx:'问她：这十年可曾后悔入道',f:()=>{rdLove('明河',3);log('红颜录','明河沉默了很久：“后悔过——在离火城看你守城那一夜，在羽人婚礼看你替我解围那一回。”她顿了顿：“可若不入道，便遇不见道友。如此算来，倒也不算亏。”她垂下眼，素来平静的声音里多了一丝不易察觉的温度：“贫道一生斩妖除魔、问心无愧——唯一问心有愧的，是那一晚月色太好，贫道竟觉得，并肩坐着的人比道更重要。”');}},
  {k:'B',tag:'看月',c:'#6FA698',tx:'不说大道，只陪她看完这轮月',f:()=>{log('红颜录','你没有谈道，只是与她并肩坐在蒲团上，看月亮一寸寸爬过中天。明河也不再打坐，难得地放任自己发了一会儿呆。夜深露重，她忽然道：“道友可知，贫道活了这些年，看过的月色，都没有这一晚好看。”你转头看她，她却不看你，只望着月亮：“……大约是因为，今日有人陪着看。”');}},
  {k:'C',tag:'送鞘',c:'#A98FD9',tx:'把一枚新斫的剑穗赠她',f:()=>{rdLove('明河',2);log('红颜录','你取出一枚新斫的桃木剑穗——用的是当年她赠你那柄剑的木芯。明河接过，指尖抚过剑穗，许久无言。最后她把剑穗系在自己剑上，轻声道：“贫道收下了。”她起身，向你稽首一礼：“道友——后会有期。”转身时，月色恰好落在她微微泛红的耳尖上。');}}
]},
{who:'程程',t:'双身闺话 · 狐火满城',scene:'妖城含香殿，灯火通明，暖意融融，与殿外裂谷的风雪恍如两个世界。你推门时，正撞见一幕熟悉的景象——人身程程正叉着腰数落妖身程程，声音又气又好笑：说了多少次，化形前先把尾巴收好！差点把给客人的茶打翻！妖身程程缩在白狐形态里，雪白的毛炸成一团，委屈巴巴地嘤了一声，又偷偷抬眼瞥你，琥珀色的眼底满是控诉，像在说：你看她！看见你进来，两个程程同时转头，表情同步得可怕，异口同声：回来了？你下意识后退半步，干笑：……回来了。夜翎从梁上探出脑袋，翅膀一扇一扇，唯恐天下不乱：师父师公，你们三——不对，你们俩加我，能凑一桌麻将了。三只眼睛齐刷刷瞪过去，夜翎立刻缩回梁上装死，只留下一根尾巴尖在梁外晃啊晃。夜里，妖城的花灯亮了满城，狐火在屋檐上跳跃，把整座城染成一片暖融融的金红。人身程程拉着你赏灯，妖身程程非要挤在你另一边，两只白狐尾巴一左一右缠着你手腕，谁也不肯松。她俩明明是一个人，偏要演成争风吃醋的样子，还演得乐此不疲——人身程程说东街的花灯好看，妖身程程便非要说西街的糖人更甜，两人你一句我一句，吵着吵着，又同时转头看你，等你说句公道话。你被两只狐狸一左一右夹着，看着满城狐火与两张一模一样的笑脸——一张明媚，一张狡黠，眼底却都映着同一个人——你忽然觉得，这一趟趟地往妖城跑，不是没有道理的。你伸手，一手一个，把两只狐狸都揽进怀里。她们同时安静下来，尾巴尖却都悄悄翘了起来。两只程程在你怀里安静了一会儿，又几乎同时挣动起来——人身程程推你：放开，满街小妖看着呢！妖身程程却往你怀里拱了拱，尾巴一卷，理直气壮：让他抱！我还没抱够！于是又吵了起来。你夹在中间，哭笑不得，只好一人发一颗糖葫芦堵嘴。她们含含糊糊地啃着糖葫芦，总算安静下来。走到护城河边时，灯影在水里碎成一片流光，两只狐狸一左一右蹲在你身边，难得同时安静。良久，人身程程忽然开口，声音很轻：秦弈，妖城这些年……变了许多。你说：我知道。她顿了顿：可有些东西没变。她说着，尾巴尖轻轻碰了碰你的手腕，像在确认什么：比如——这盏灯，永远给你留着。妖身程程在旁边哼了一声，却没有反驳，只把脑袋往你膝上搁了搁。你坐在河边，看着满城灯火与水中碎影，忽然觉得，这妖城的风，竟比任何地方都让人安心。你轻声答：我知道。所以我回来了。两只狐狸都没有说话，可你分明感觉到，她们靠在你身上的力道，都悄悄重了几分。你们在护城河边坐到很晚。夜翎不知何时溜了出来，化作小蛇盘在你们头顶的老树上，假装自己只是一根树枝——可那尾巴尖一晃一晃的，骗得了别人，骗不了你。你抬头喊她：下来吧，树上凉。她这才不情不愿地滑下来，化作人形，挤到你另一边坐下，气鼓鼓道：师父跟师公说话都不带我！人身程程哼了一声：你方才不是在偷听么？夜翎心虚地缩了缩脖子：我……我是怕你们说妖城坏话！妖身程程懒洋洋地接口：妖城最大的坏话，就是你当了大王还偷吃糖。夜翎炸毛：我没有！三只狐狸——不，两只狐狸加一条蛇，在你身边闹成一团。你被她们挤在中间，左边是人身程程，右边是妖身程程，头顶还趴着个夜翎，哭笑不得。可你望着她们闹腾的模样，心里却软得一塌糊涂——这便是你在妖城的家，吵吵闹闹，却永远暖着。夜深了，你送她们回含香殿。人身程程在殿门口拉住你的袖子，声音低低的：秦弈——明天，还来么？你看着她眼底那点小心翼翼的光，点头：来。天天都来。她松开手，弯眼笑了。那一笑，比满城的狐火还要亮。',opts:[
  {k:'A',tag:'赏灯',c:'#D88FA5',tx:'陪两只程程走遍妖城灯市',f:()=>{rdLove('程程',3);log('红颜录','你一手牵一个，把妖城灯市从头走到尾。人身程程给你讲这盏灯的来历，妖身程程叼着糖葫芦非要你喂——两只狐狸一路叽叽喳喳，惹得满街小妖捂嘴偷笑。走到护城河边时，两人忽然安静下来，异口同声：“……谢谢你回来。”你说不出那瞬间心里的感觉，只觉得满城灯火，都不如这一句。');}},
  {k:'B',tag:'梳毛',c:'#6FA698',tx:'给白狐形态的她顺毛谈心',f:()=>{log('红颜录','你在廊下坐下，妖身程程便化作白狐趴在你膝上，尾巴有一下没一下地扫着。人身程程倚在门边，难得没有吃醋，只静静看着。你一边替她梳着雪白的皮毛，一边听她讲妖城这些年的趣事——哪只小妖又闯了祸，哪位妖王又闹了笑话。夜风里，白狐眯起眼，咕哝道：“要是能一直这样……当个普通狐狸精，也不错。”');}},
  {k:'C',tag:'定约',c:'#C9A45C',tx:'与她定下每年灯节必归之约',f:()=>{rdLove('程程',2);log('红颜录','你认真道：“往后每年灯节，我都回妖城陪你。”人身程程挑眉：“那要是不回来呢？”你笑道：“那就罚我变回凡人，给你种一辈子灵田。”两只程程对视一眼，一人一狐同时别过脸去，声音却都带着压不住的笑意：“……谁要你种灵田了。”');}}
]},
{who:'夜翎',t:'大王不乖 · 螣蛇撒娇',scene:'妖城新王御书房，你推门时，夜翎正端端正正坐在王座上批折子——螣蛇金瞳，威仪赫赫，底下跪着一排汇报的妖臣，屏息凝气，大气都不敢出。阳光从窗棂漏进来，照着她认真板着的小脸，竟真有几分王者的气势。可一看见你，那点威严瞬间崩了个干净——她眼睛一亮，嗖地从王座上蹦下来，尾巴都露出来了，一路小跑扑过来，又硬生生在王座台阶前刹住脚，清了清嗓子，板起脸，一本正经：咳咳……寡人正在处理国事，尔等闲人退下。妖臣们面面相觑，看看她，又看看你，小心翼翼地问：大王，这位是……夜翎挺起小胸脯，努力维持威严，声音却有点虚：这是寡人的师——呃，故人。她顿了顿，又补了一句：……很重要的故人。你看着她翘得老高的尾巴——那尾巴尖正不受控制地左右摇晃，出卖了她所有的故作镇定——你忍不住伸手一按。她噌地一下跳开，脸红到耳根，声音都拔高了：大、大胆！竟敢调戏寡人！可没过三秒，她又蹭回来，尾巴卷着你的手腕，小声问，声音里带着一丝小心翼翼：哥哥……我批得对吗？你低头看了看她手里的折子，上头歪歪扭扭的字迹，还带着练字时蹭的墨印——有些字写错了，又用墨涂掉重写，涂得一团黑，可看得出每一笔都写得极认真。你忽然想起很多年前，她还是条小蛇妖时，蜷在你怀里问你会不会杀她的样子。你伸手揉了揉她的发顶：批得挺好。就是这个地方——她眼睛一亮：那哥哥教我！她把你按在王座上，自己搬了个小凳子坐在旁边，尾巴一晃一晃，听你讲折子里的门道，听得聚精会神，连妖臣们什么时候退下都没发现。你教她批折子教到掌灯时分。夜翎学得极认真，遇到不懂的便问，问完了还要自己复述一遍，确认真懂了才放过去——这份较真劲儿，倒像极了当年她学化形时的模样。末了，她把最后一份折子批完，长长舒了口气，往后一靠，尾巴无意识地在你手臂上蹭了蹭：哥哥，当大王好累啊。你看着她眼底那点藏不住的疲惫，忽然有些心疼：那要不要……不当了？她猛地坐直，摇头，声音却带着一丝犹豫：不行。妖城是程程师父交给我的，我不能辜负她。她说着，又小声补了一句：而且……我想让妖城变得更好，好到哥哥以后回来，能住得舒心。你望着她认真的小脸，忽然想起她初到太子府那年，披风裹得严严实实，像一只戒备的小兽。你伸手揉了揉她的发顶：你已经做得很好了。她仰头看你，眼睛亮晶晶的：真的？你点头：真的。她咧嘴笑了，忽然从怀里摸出一颗糖——糖纸已经有点皱了，显然揣了很久：给哥哥的。你接过糖，剥开糖纸放进嘴里，甜丝丝的。她看着你吃糖，满意地眯起眼，像只偷到小鱼干的猫。窗外，妖城的灯火次第亮起，把整座城映成一片暖融融的金色。你坐在王座上，她搬着小凳子靠在你膝边，谁也没有再说话——可你知道，这妖城的新王，已经不再是当年那个需要你护在身后的小蛇妖了。她长大了。而你，为她高兴。你正要起身告辞，袖口却被她轻轻拽住。你低头，夜翎仰着脸，眼底带着一丝小心翼翼的期待：哥哥……今晚住下吧？御书房后头有间偏殿，我让人收拾好了。她说着，又急急补了一句：不是我特意收拾的！是……是反正空着也是空着！你看着她那副欲盖弥彰的模样，忍不住笑了：好，住下。她眼睛一亮，又赶紧绷住小脸，维持她大王的威严：咳咳……那寡人让人备膳。她转身要走，走了两步又折回来，从怀里摸出一颗糖塞进你手里，声音闷闷的：这是……今天新贡的，寡人赏你的。说完，她嗖地一下跑了，连尾巴都忘了收，在身后一晃一晃的。你看着手里那颗糖，又看着她跑远的背影，忽然想起很久以前——她还是一条小蛇妖时，你也是这样，看着她笨拙地学着信任你。你剥开糖纸放进嘴里，甜丝丝的。夜色里，妖城的灯火次第亮起，像一颗颗温暖的星子。你站在御书房门口，忽然觉得，这一趟趟地回妖城，看着当年的小蛇妖一点一点长大，变成如今这个会偷偷给你留糖的大王——这大概，就是养成的意义吧。你笑了笑，把那颗糖纸仔细收好，大步朝偏殿走去。身后，御书房的灯还亮着，夜翎大概又在偷偷练字了。',opts:[
  {k:'A',tag:'教习',c:'#D88FA5',tx:'坐下来教她批折子的门道',f:()=>{rdLove('夜翎',3);log('红颜录','你坐下来，把几份难办的折子拆开揉碎讲给她听——哪里该硬、哪里该软、哪里要留三分余地。夜翎听得认真，小脑袋一点一点，偶尔提问，句句都在点子上。末了她眼睛亮晶晶地看着你：“哥哥，我是不是进步了？”你点头：“进步很大——就是下次别把‘剿匪’批成‘剿妹’。”夜翎低头一看，脸腾地红了：“……哥哥你闭嘴！”');}},
  {k:'B',tag:'陪玩',c:'#6FA698',tx:'政务堆明天，今天先带她出城放风',f:()=>{log('红颜录','夜翎把折子往桌上一推，化作螣蛇缠在你肩上，小声欢呼：“走！”你带着她飞出妖城，在裂谷上空追了一下午的流云。她盘在你肩头，忽然问：“哥哥，我当大王是不是当得不太好？”你拍了拍她的蛇脑袋：“当得挺好的——就是别老学你师父板脸。”她“噗”地笑出声，尾巴尖在你脸上轻轻拍了一下：“讨厌。”');}},
  {k:'C',tag:'夜宵',c:'#A98FD9',tx:'陪她溜去人间的糖铺子',f:()=>{rdLove('夜翎',2);log('红颜录','你带着一条缠在腕上的小蛇，鬼鬼祟祟溜进人间的糖铺。夜翎在袖子里小声指点：“这个……那个……都要。”你买了一整包麦芽糖，她藏在袖子里一路吃回妖城，腮帮子鼓鼓的，还非要装作大王威严。第二天妖臣们上朝，看见大王嘴角沾着糖渣，谁也不敢问。只有你收到了她偷偷递来的一颗糖——糖纸上歪歪扭扭写着“谢谢哥哥”。');}}
]},
{who:'孟轻影',t:'债主上门 · 来世今生',scene:'月黑风高——这种天气，翻墙的果然只有一个人。孟轻影熟门熟路地翻进你院子，连瓦片都没踩响一声，指尖一枚飞梭转得飞快，幽蓝的光在夜色里划出一道弧：喂，听说你把七卷红尘都走完了？你正在院里赏月，头也不抬，给自己斟了杯酒：你消息倒是灵通。她在你对面坐下，难得没有阴阳怪气，也没有翻你的酒坛，只是直直看着你，眼底有一种说不清道不明的认真：那当年说的话，还算数么？你一时没反应过来，举着酒杯的手顿在半空：什么话？她眯起眼，声音却低了几分：若有来世，还想跟你做这一世的冤家——本座如今等到了来世，你可别装傻。月光下，这位统御三途的轮回之主，统御万魂的女魔头，眉眼间竟难得地有了一丝……心虚。她见你不说话，耳根慢慢红了，那点红从耳尖一路蔓延到脖颈，声音也低了下去，带着一丝你从未在她身上见过的局促：……你若不愿意，就当我没说过。她说着，指尖的飞梭转得越来越慢，最后几乎停了下来——她向来是那个把一切握在掌心的人，可此刻，她却像把所有筹码都推到了桌面上，等着你一句话定输赢。月光静静洒下来，你看着她那张强装镇定、却藏不住紧张的脸，忽然想起很多年前，弘法寺前第一次见她——她也是这样坐在月光下，笑吟吟地说：秦弈，咱们后会有期。你放下酒杯，认真地看着她。她被你看得更不自在，正要开口说点什么补救，你忽然道：谁说不愿意了。她猛地抬头，眼底有光一闪而过。那点光在她眼底一闪而过，随即被她压了下去，可她嘴角却不受控制地翘了起来，又赶紧绷住：……你方才说什么？你看着她那副明明想笑又硬装镇定的模样，忍不住逗她：我说什么了？她瞪你：你！她气结，指尖飞梭转得飞快，却半天没说出下文。月光下，她那张向来玩世不恭的脸，此刻竟透出几分难得的孩子气。你不再逗她，认真道：我说——谁说不愿意了。来世今生，都做冤家。她愣了很久，忽然笑了——那笑容与平日那些算计的、狡黠的笑都不同，是真正的、眉眼弯弯的笑：成交。她伸出手，像谈生意一样郑重：不过说好了，往后你坏我一次事，便欠我一顿酒。你握住她的手，指尖微凉，却握得很紧：一言为定。她抽回手，转身要走，走了两步又停住，背对着你，声音闷闷的：……喂。你说：嗯？她道：那盏轮回灯……你早些备好。本座，等得起。她说完，足尖一点，翻墙而去，只留下一阵若有若无的香。你站在原地，望着她消失的方向，忽然笑了——这魔女，连表白都像在谈生意。可偏偏，你吃她这套。第二日，你果然收到一盏轮回灯——是孟轻影差人送来的，灯身通体幽蓝，灯焰却极亮，照得人影子都淡了三分。灯座下压着一张字条，字迹潦草，却一笔一划写得极认真：灯先给你备好了。本座想了想，还是你收着合适——省得你哪天又说本座不告而取。你看着那张字条，几乎能想象她写这行字时别扭的模样，忍不住笑出声。后来你才知道，那盏轮回灯她寻了许久——是幽冥最深处一盏万年不灭的古灯，她费了好大的劲才弄到手，却轻描淡写地说先给你备着。你把灯小心收好，放在院里最高的石台上。入夜，那盏灯便亮起来，幽蓝的光在夜色里静静摇曳，像她那双总是故作漫不经心、却藏不住认真的眼睛。某个月夜，她再次翻墙而来，看见那盏灯被供在石台上，还细心地罩了盏防风的琉璃罩，怔了怔，别过脸去：……谁让你摆那么高。你笑：摆高点，省得你翻墙的时候看不见。她哼了一声，耳尖却悄悄红了。月光下，那盏轮回灯静静亮着，把两个人的影子，都镀上一层幽蓝的光。',opts:[
  {k:'A',tag:'应约',c:'#8B6FA8',tx:'握住她的手：这世也做冤家',f:()=>{rdLove('孟轻影',3);log('红颜录','你伸手握住她的腕子，那枚总在指尖打转的飞梭“当啷”一声落地：“来世今生，都做冤家——只要你别嫌我总坏你的事。”孟轻影怔怔看着你，半晌，忽然笑了，笑得眉眼弯弯：“成交。不过说好了，往后你坏我一次事，便欠我一顿酒。”你看着她，忽然觉得这世上的账，有些是越欠越好的。');}},
  {k:'B',tag:'斗嘴',c:'#6FA698',tx:'照旧跟她斗嘴，不接这个话茬',f:()=>{log('红颜录','你挑眉：“堂堂轮回之主，翻墙来跟人定来世——传出去，万象森罗的脸往哪儿搁？”孟轻影气笑：“本座的脸，早被你踩没了！”她甩袖要走，走了两步又停住，背对着你，声音闷闷的：“……你不接茬，本座也不勉强。就是那句‘冤家’，本座说了，便当数一辈子。”你望着她翻墙而去的背影，忽然觉得，有些话虽然没答，但她听懂了。');}},
  {k:'C',tag:'赠灯',c:'#A98FD9',tx:'送她一盏轮回灯作信物',f:()=>{rdLove('孟轻影',2);log('红颜录','你取出一盏从幽冥带来的轮回灯——灯焰幽蓝，照得人影子都淡了三分：“拿着。往后轮回盘转多少世，这盏灯都替你记着——有个冤家，说话算话。”孟轻影接过灯，端详许久，忽然把灯往怀里一揣，转身就走。走到墙头，她才背对着你丢下一句：“……灯，本座收了。人，本座也记下了。”');}}
]},
{who:'居云岫',t:'画里有你 · 琴棋书画',scene:'万道仙宫，琴棋书画山。你到时，居云岫正倚在窗边看书，手边一盏热茶悠悠冒着白汽——岁月在她身上几乎没有留下痕迹，依旧是初见时那副云淡风轻的模样，仿佛这山间的云与茶，就是她的全部岁月。清茶从她袖子里探出半个脑袋，看见是你，眼睛一亮，声音清脆：师父，客人来了——这次还带礼物吗？居云岫头也不抬，声音懒洋洋的：带不带都行，他欠我的画，还欠着呢。你在她对面坐下，也不客套：什么画？她终于抬眼，指尖在你面前轻轻一点——一幅水墨山水凭空凝成，悬在你面前：画中是你当年初上琴棋书画山，在夕阳里学画的模样——你坐在竹楼前，面前摊着画纸，笔下是一株歪歪扭扭的墨竹，而夕阳把你的影子拉得很长。她淡淡道：补全了。当年你说略懂，如今再看——倒也不是完全不懂了。你看着那幅画，画里的少年眉眼青涩，却带着一股初生牛犊不怕虎的倔劲——那是多少年前的事了？你忽然想起那年她指尖一点，画魂化作蝴蝶绕你三匝的样子；想起她教你画竹时，只在你最得意的那笔旁画个圈，说这里是你自己的。窗外的琴声不知何时响了起来，是当年那首你没听懂、如今却觉得句句都懂的曲子——琴音穿过竹楼，掠过云海，像在替谁说着那些没说出口的话。你听着那琴声，忽然道：这曲子……你教过我。她没答话，指尖轻轻按在琴弦上，琴音余韵袅袅。良久，她才轻声道：教过你的东西多了，你倒记得这一首。她说着，把热茶往你面前推了推：喝茶。你端起那盏茶，茶汤清亮，入口是琴棋书画山特有的山泉味——清冽回甘，像这山间的云。你慢慢喝着，她也不催你说话，只倚在窗边，偶尔翻一页书。清茶在旁边探头探脑，一会儿看看你，一会儿看看她师父，忽然福至心灵，抱着茶壶溜了出去，还贴心地带上了门。屋里安静下来，只剩下窗外竹叶的沙沙声。你放下茶盏，忽然道：居云岫。她抬眼：嗯？你说：当年你说我笔下有牵挂——如今，我好像明白那牵挂是什么了。她没接话，指尖却微微一顿。你继续说：我牵挂的东西很多——南离的雪，妖城的灯，幽冥的河，北冥的光。可最牵挂的，是那个教我画竹、说我笔下有牵挂的人。她沉默了很久。窗外，竹影摇动，茶烟袅袅。良久，她忽然轻声道：油嘴滑舌。可她的声音里，带着一丝藏不住的笑意。她又给自己斟了一盏茶，与你碰了碰杯沿：当年你上山学画，说略懂——如今，倒是真懂了些。你看着她，她也看着你，眼底是许多年沉淀下来的温润。窗外的琴声不知何时又响了起来，依旧是那首曲子。你们谁也没有再说话，只是就着茶与琴声，把这一个下午，坐成了永恒。那一日，你在琴棋书画山待到很晚。清茶中途进来添了三次茶，最后一次时，她终于没忍住，小声问：师父，客人今晚住下么？居云岫头也不抬：山间多的是空房，他爱住便住。清茶眼睛一亮，抱着茶壶就跑了——你猜她是去收拾那间看得见云海的客房了。夜里，你坐在客房廊下，看满山云雾在月光下翻涌。居云岫不知何时也来了，在你身边坐下，膝上搁着那把旧琴：睡不着？你摇头：是舍不得睡——这样的月色，这样的山，不知何时才能再见。她没有答话，只抬手，轻轻拨了一串琴音——正是那首你听了一下午的曲子。琴音在夜风里流淌，与满山的云雾一同起伏。你闭目听着，忽然觉得，这些年走过的万水千山，都不如此刻这一曲琴音来得安宁。曲终时，她轻声问：听懂了么？你睁开眼：听懂了。她微微一笑，没有追问你听懂了什么，只把琴收好，起身道：夜深了，睡吧。她走了两步，又停住，背对着你，声音轻得像山间的雾：明日走的时候……不必来辞行。你怔了怔：为何？她沉默片刻：因为我会忍不住，想留你。她说完，便走进月色里，衣袂飘飘，像一朵被风吹远的云。你坐在廊下，望着她消失的方向，很久很久，才轻轻道：那便……不辞行了。',opts:[
  {k:'A',tag:'回画',c:'#7FA8C9',tx:'以指代笔，回赠她一幅画',f:()=>{rdLove('居云岫',3);log('红颜录','你以指代笔，凝墨于空——画的是她倚窗看书的样子，窗外是琴棋书画山的云海，还有一只探头探脑的小茶叶。居云岫看了许久，难得地弯了弯唇角：“笔意尚可，就是把我画老了。”你笑：“那是岁月金贵。”她把画轻轻收进袖中：“这画，我收下了——连同你的人情，一起记着。”');}},
  {k:'B',tag:'听琴',c:'#6FA698',tx:'不打扰她，只安静听完整首曲子',f:()=>{log('红颜录','你没有说话，只安静坐在廊下，把那首曲子从头听到尾。琴声落时，居云岫忽然道：“当年教你画，是怕你走得太急，错过路上的风景。如今看来——你倒是把每一步都走得挺慢。”她顿了顿：“这样很好。道走得再远，也别把人间丢了。”你望着她，忽然觉得这位总是云淡风轻的师父，其实一直在用自己的方式，替你看路。');}},
  {k:'C',tag:'品茶',c:'#A98FD9',tx:'尝尝清茶新泡的茶，听师徒斗嘴',f:()=>{rdLove('居云岫',2);log('红颜录','清茶乐颠颠地给你倒了一盏：“客人尝尝——这回是我自己喝过没毒的！”居云岫面无表情：“你上次也这么说，结果茶里泡的是晒干的菜叶。”清茶：“……师父你怎么还记得。”师徒俩你一言我一语，你在旁边听着，忍不住笑出声。居云岫瞥你一眼：“笑什么？”“笑这里——像家一样。”她怔了怔，没再说话，只是把茶盏往你面前又推了推。');}}
]},
{who:'羽裳',t:'还你一场婚礼 · 北冥新雪',scene:'北冥的极夜尽头，寻木城的灯火在雪原上亮成一片，像撒在冰原上的碎金。你到时，羽裳正站在城头，望着漫天大雪出神——她如今已是北冥与羽人共尊的王，可独自一人时，还是会露出那种近乎落寞的神情。她听见脚步声，也不回头，声音被风雪吹得有些散：来了？你走到她身边，与她并肩站在城头，望着那片无垠的雪原：来了。当年那场婚礼，被人搅得不成样子——今日，想补你一场。她终于转头，雪光映着她微微泛红的脸，那双总是凌厉的眼睛里，罕见地掠过一丝慌乱：……谁稀罕。可她没有走开，反而往你这边靠了靠，羽翼的尖端轻轻擦过你的袖口。你从怀里取出一枚在北冥冰渊深处寻来的冰晶——那冰晶在极夜中冻了不知多少万年，通透得没有一丝杂质，在你掌心凝成一枚剔透的戒环，月光与雪光同时在上面流转：北冥没有凤冠霞帔，我便用这万载玄冰，替你结一枚戒。羽裳看着那枚冰戒，沉默了很久。雪落在她肩头，她没有拂去。良久，她忽然伸手，声音带着一丝她自己都没察觉的颤：……愣着干什么，替我戴上。你执起她的手，将那枚冰戒轻轻套上她的指尖——冰晶贴着她手指的刹那，竟没有一丝寒意，反而透出一点暖意，像极夜深处亮起的第一缕光。城头风雪大作，可那枚冰戒贴着她指尖时，却暖得没有一丝寒意。远处，安安带着一群北冥魔物探头探脑，被羽裳一个眼刀吓得缩了回去——可那眼刀弯弯的，分明是在笑。安安到底没忍住，拎着一坛酒凑了过来，温温柔柔地笑：大王，恭喜恭喜。她身后，一群北冥魔物齐刷刷拱爪，笨拙地学着人族道喜的模样，有几个还学岔了，把爪子拱到了旁边同伴脸上。羽裳的脸更红了，想板起脸训斥，唇角却压不住地往上翘，只好别过脸去，声音闷闷的：……都回去。安安却不怕她，笑嘻嘻地给两人各倒了一碗冰酿：大王脸皮薄，我这个做姐妹的，替她陪客。羽裳哼了一声，却没有反驳，只接过酒碗，仰头灌了一口——冰酿入喉，她眉间的霜色却像是融了几分。那一夜，寻木城的城头难得热闹——安安讲着北冥的旧事，说当年两个女魔头如何把这魔渊治得服服帖帖；羽裳偶尔插两句嘴，声音里带着难得一见的鲜活；你听着，时不时举碗，与她们碰一碰。风雪不知何时停了，极光在天边静静流淌，把整片雪原染成一片流动的青碧。你望着羽裳被极光照亮的侧脸——她正与安安说笑，眉眼间那点常年紧绷的棱角，此刻竟柔和了许多。你忽然觉得，北冥的极夜，其实也没有传说中那么冷。你伸手，轻轻握住她搁在膝上的手。她话声一顿，没有抽回，只是耳尖在极光下，悄悄红了几分。那一夜，你们在城头坐到极光散尽。安安不知何时已经识趣地退了场，临走还朝你挤了挤眼——那意思是：大王交给你了。你被她逗得差点笑出声，又赶紧绷住。羽裳没看见安安的小动作，只是望着天边渐渐淡去的极光，忽然道：秦弈。你嗯了一声。她说：我小时候听族里老人说，北冥的极光，是上古一位妖圣的羽翼化成的——它飞了最后一程，把羽毛都留给了这片天空。她顿了顿：我从前不懂，为何要这样傻。如今……好像懂了一点。你问她：懂了什么？她没答话，只是把脑袋轻轻靠在你肩上，声音闷闷的：……不告诉你。你被她这个动作弄得一愣——这位向来高傲的羽人圣女、北冥共尊的女王，此刻竟像个赌气的小女孩，把脸埋在你肩窝里，不肯抬头。你不敢动，怕惊着她。极光在天边明明灭灭，寻木城的灯火在脚下静静亮着。你忽然觉得，这片传说中苦寒的北冥，其实藏着这世上最暖的一颗心。良久，她闷闷的声音从你肩窝传来：……你要是敢说出去，我就把你冻成冰雕。你忍住笑：不敢，不敢。她哼了一声，却没有抬起头——反而往你怀里又靠了靠。北冥的夜风呼啸而过，可你怀里这一方天地，却暖得像阳春。',opts:[
  {k:'A',tag:'成礼',c:'#D88FA5',tx:'在雪原上与她对拜成礼',f:()=>{rdLove('羽裳',3);log('红颜录','漫天飞雪为证，你在北冥的极光下与她相对而揖。羽裳向来高傲的脸，此刻红得比极光还艳：“礼成了……你可不许反悔。”你笑：“不反悔。”城头下，安安带着魔物们齐声起哄，被羽裳一脚一个踹下城头——踹完，她又回过头，小声问：“那……婚礼上该说的话，你是不是还欠我一句？”你望着她，认真道：“愿与卿，白头共雪。”');}},
  {k:'B',tag:'看雪',c:'#6FA698',tx:'不说话，只陪她在城头看完这场雪',f:()=>{log('红颜录','你与她并肩站在城头，看北冥的雪一片一片落满寻木城。谁也没提婚礼、也没提当年——只是偶尔，她羽翼的尖端会不经意擦过你的袖口。雪停时，她忽然轻声道：“其实那场婚礼有没有都不打紧。”你转头看她。她望着远方，声音轻得像雪：“……人来了，比什么都强。”');}},
  {k:'C',tag:'访友',c:'#7FA8C9',tx:'与安安一起围炉夜话，听北冥旧事',f:()=>{rdLove('羽裳',2);log('红颜录','安安不知何时拎着一坛酒摸了过来，温温柔柔地笑：“大王害羞，我这个做姐妹的，替她陪客。”羽裳哼了一声，却没反驳。三人围着炉火，听安安讲北冥的旧事——当年两个女魔头如何把这片魔渊治得服服帖帖。讲到兴起，羽裳也会插两句嘴，眼底是难得一见的鲜活。你看着炉火映着的两张笑脸，忽然觉得，北冥的冬天，其实也没那么冷。');}}
]},
{who:'流苏',t:'从棒到人 · 白玉归身',scene:'补天之后，流苏终于有了完整的肉身——不是那根狼牙棒里的器灵，也不是识海里的小白玉人，而是一个真真切切、有体温、有影子的人。她站在你面前，低头看着自己的手，翻来覆去地看，又轻轻握拳、松开，像是不敢相信：原来有手，是这种感觉。你在她对面坐下，看着她那副新奇的模样，忍不住笑：感觉如何？她忽然抬手，在你脑门上轻轻弹了一下——力道不重，却带着一种熟悉的、蛮横的温柔，和你识海里那道声音念叨你时一模一样：先试试这手能不能打你。你笑了，她也忍不住笑了。那一晚，你们坐在院中，没有谈道，也没有谈补天，只是做着一件件在凡人看来再寻常不过的事——她第一次用人的手端起茶碗，热茶烫了指尖，她嘶了一声，却不肯放下；她第一次用人的脚踩在雪地上，听着雪在脚下咯吱作响，眼睛亮得像发现了什么了不起的秘密；她第一次尝了颗糖葫芦，酸得皱眉，又甜得眯眼，表情丰富得像换了个人。月光下，她忽然安静下来，认真地看着你，那双曾经只存在于识海里的眼睛，此刻真实地映着你的脸。她轻声说：喂。你说：嗯？她别过脸，声音闷闷的，却带着一丝藏不住的软：往后我不在你识海里了，你……别走丢了。你望着她——月光把她新生的影子拉得很长，长到与你并肩——你忽然觉得，这一路从一根棒子走到今天，值了。你轻声答：不会的。从前你在识海里领路，往后，换我带你认路。她没有回头，可你分明看见，她耳尖慢慢红了。那之后的日子，你带着流苏走了很多地方——不是以修士的身份，而是像两个寻常人那样，慢慢地走。你们去看了南离新城的灯会，她在猜灯谜的摊子前站了许久，认真思索的模样惹得摊主都笑了；你们在妖城的茶馆里听了一下午的狐妖报恩故事，她听到一半，忽然问你：那狐妖后来怎么样了？你说：后来啊，它报完了恩，就去过自己的日子了。她想了想：那它一定过得很开心。你们在幽冥的忘川边钓了一尾鱼，又把鱼放了——她蹲在岸边看鱼游走，轻声说：原来活着的感觉，是这样的。你们在北冥看了极光，在仙宫听了居云岫的琴，在昆仑看了一场日出。某一日黄昏，你们坐在一处不知名的山巅，看着夕阳把云海染成一片金红。她忽然开口：秦弈。你嗯了一声。她说：我以前总觉得，道是天地间最要紧的东西。可如今才知道——若这天地间，没有一个人值得你停下来看这夕阳，那道，要来何用？你望着她被夕阳镀上一层金光的侧脸，忽然觉得，这句话，比任何道法都重。你没有答话，只是轻轻握住她的手。她反手扣紧你的指节，没有再松开。夕阳沉下去，晚风拂过山巅。你们就这样并肩坐着，把这一天的光，看到尽头。天色完全暗下来时，天上亮起了星星。流苏靠在石头上，仰头望着星空，忽然道：我从前在识海里，看不见这些——只能透过你的眼睛，模模糊糊地看。如今亲眼看见了，才知道，原来星星真的会眨眼。你听着她的话，心头忽然涌上一阵说不清的柔软。你想起她陪你的这些年——从仙迹山那根狼牙棒开始，她教你修行，护你性命，替你挡过多少明枪暗箭，可她自己，却从未亲眼看过这满天星光。你轻声说：那往后，我陪你看遍所有的星星。她没答话，可你在月光下看见，她嘴角微微翘了起来。山风拂过，吹动她的发丝。她忽然道：秦弈——你说，凡人的一辈子，有多长？你想了想：大约……几十年吧。她又问：那修士呢？你说：看修为。像你我这般，活个几百上千年，也不稀奇。她沉默片刻，轻声道：那几十年，够不够看遍星星？你说：不够。她转头看你：那便……多活几年。你看着她眼底映着的星光，忽然觉得，这世上的长生，若有人陪着一起看星星，才算真正圆满。你握住她的手：好。多活几年，多陪你几年。她没有挣开，只是反手扣紧你的指节。山巅的风吹了一夜，你们便并肩看了一夜的星。',opts:[
  {k:'A',tag:'牵手',c:'#D88FA5',tx:'握住她的手，带她看人间',f:()=>{rdLove('流苏',4);log('红颜录','你握住她的手——温热的、真实的、属于她自己的手：“走，带你去凡间逛逛。先教你认认糖葫芦，再去看看庙会。”流苏没有挣开，只别扭道：“……我又不是小孩。”可走了两步，她忽然反手扣紧你的指节：“……庙会，往哪边走？”你笑着指了指前方。那一夜，白玉小人第一次用人的眼睛，看遍了人间灯火。');}},
  {k:'B',tag:'叙旧',c:'#6FA698',tx:'跟她从头把这路走一遍',f:()=>{log('红颜录','你们坐在院中，从仙迹山那根狼牙棒说起——说当年她如何唬你修仙，说一路的坑与甜，说那碗没喝成的人间茶。流苏听得入神，末了轻声道：“其实当年我挑中你，是因为你在山神庙里，肯给一个无主的神像上香。”你怔住。她望着月亮：“那时候我便知道——你这人，心软。心软的人，走不远；可心软的人，走得远。”');}},
  {k:'C',tag:'许愿',c:'#A98FD9',tx:'与她说好：往后年年岁岁，都在人间相见',f:()=>{rdLove('流苏',3);log('红颜录','“往后年年岁岁，我都回来——陪你过每一个凡间的节。”你认真道。流苏挑眉：“说好了？”你点头：“说好了。”她忽然笑了，笑得眉眼弯弯：“那我可要好好学学——怎么当个凡人。”她顿了顿，又补了一句：“……当个，有人惦记的凡人。”月光下，两个从仙凡两途走到同路的人，相视而笑。');}}
]},
{who:'群像',t:'万界家宴 · 故人满座',scene:'这一日，你把散落诸界的故人都请回了南离新城的小院。院子不大，挤得满满当当——李青君在灶台前掌勺，锅铲翻飞，油烟气混着菜香飘了满院；程程化作白狐蹲在案头监工，尾巴一卷一卷，时不时指点两句火候；夜翎偷吃刚出锅的丸子被烫得直哈气，眼泪汪汪，却舍不得吐。明河帮着摆碗筷，动作不紧不慢，却把每双筷子都摆得整整齐齐；孟轻影大剌剌坐在主位嗑瓜子，磕得咔嚓响：喂，本座的位置是不是太靠门了？羽裳与安安带了北冥的冰酿，坛子一开，寒气扑面，惹得满院子人打了个哆嗦；居云岫携清茶而来，清茶一进门就往茶壶里钻，被居云岫拎着后领子提出来：先见过客人。连瑶光都难得地落座了，正饶有兴致地看着满院鸡飞狗跳，眼底带着一种万古未有的好奇——她活了那么久，大约还是头一回见到这样的场面。你端着酒杯站到院子中央，望着这一屋子从七卷红尘里走出来的故人——他们有的曾与你生死相托，有的曾与你针锋相对，有的曾隔着仙凡两途遥遥相望，可此刻，他们都坐在这间小小的院子里，围着一桌热腾腾的饭菜。你忽然有些词穷。你清了清嗓子，声音却有些哑：各位——这杯酒，敬……这一路。李青君第一个举杯，笑意在油烟气里格外暖：敬南离。程程尾巴一甩：敬妖城。明河举盏：敬问道。孟轻影晃着酒杯，笑得狡黠：敬冤家。夜翎举着糖葫芦，含糊不清：敬哥哥！满院哄堂大笑，连瑶光都弯了唇角。流苏在你身侧，轻轻碰了碰你的杯沿，低声道：敬——你终于，不用一个人走了。你望着满院灯火与笑脸，忽然觉得，这人间最盛的宴席，也不过如此。宴到中途，不知谁提议要行酒令。李青君起头，出的题是带雪字的诗句——她吟到一半卡了壳，被程程毫不留情地笑话：堂堂枪神，连句诗都背不全。李青君恼羞成怒，抄起酒勺作势要打，程程化作白狐满院子乱窜，惹得满座哄堂大笑。明河稳稳当当地接了下一句，赢得满堂喝彩；孟轻影不服，非要也显一手，出口却是半首艳词，被羽裳一记眼刀逼了回去，悻悻道：行行行，本座不跟你们这些正人君子一般见识。夜翎凑热闹，奶声奶气念了句打油诗，把全院子人都逗笑了——她自己还不知道笑点在哪，茫然地看看这个看看那个，最后也跟着傻乐。居云岫被推着弹了一曲助兴，琴声起时，满院渐渐安静——明河跟着琴音低声哼起一首古调，羽裳的羽翼随着节拍轻动，连瑶光都闭目聆听。曲到中段，不知谁先跟着唱了起来，渐渐地，一屋子人都和进了调子里——李青君的嗓音浑厚，程程的尾音带着狐族的媚，孟轻影唱着唱着便改词，把正经古调唱成了打趣的调子，惹得众人又笑又骂。那一夜的风很轻，灯很暖，歌很长——长到许多年后，你仍记得那个院子，那盏灯，和那些并肩唱歌的人。宴散时，你在门口送走最后一位故人。回头，看见流苏正坐在廊下等你，手里还拎着半壶酒，眉眼弯弯：走，再看一眼雪。你笑了，接过那半壶酒，与她并肩走出院门。南离新城的雪，正下得温柔。你与流苏并肩走在雪地里，脚下咯吱作响。走出不远，你忽然听见身后传来一阵喧哗——回头一看，孟轻影正追着夜翎满院子跑，嘴里喊着：小丫头，把本座的酒还来！夜翎抱着那坛北冥冰酿跑得飞快，边跑边喊：是安安姐姐让我尝的！安安在廊下笑吟吟地看热闹：我可没让你抱着整坛跑。李青君在门口磕着瓜子，看得津津有味：这丫头，比当年她师父还能闹腾。程程化作白狐蹲在墙头，尾巴一卷一卷，优哉游哉地评点：跑得不够快，左边有空当。夜翎闻言，果然一个急拐弯，从孟轻影手底下溜了过去。满院子的人都笑了。你站在雪地里，看着这一院子鸡飞狗跳的故人——他们有的曾经生死相搏，有的曾经隔着万水千山，可此刻，都聚在这小小的院子里，为了一坛酒闹成一团。你忽然觉得，这一路走来所有的苦与累，都值了。流苏在你身边，也看着这一幕，忽然轻声道：真好啊。你转头看她：什么好？她望着那满院子的灯火与人影，声音轻得像雪：这样……热闹的人间。你握住她的手，与她一同站在雪里，看着那满院的笑闹。雪下得越发温柔，像是也在替这个夜晚，感到圆满。远处，不知是谁又起了个头，唱起了那首南离的老调子——歌声穿过风雪，穿过灯火，穿过这漫长又短暂的夜晚，飘向很远很远的地方。',opts:[
  {k:'A',tag:'回敬',c:'#D88FA5',tx:'挨个敬过去，说几句掏心窝的话',f:()=>{log('红颜录','你挨个敬过去——敬李青君那壶永远温着的酒，敬程程永远亮着的灯，敬明河那句“纯路人”，敬孟轻影翻过的每一道墙……满院的酒越喝越暖，夜翎醉得在梁上打转，被程程一尾巴卷下来。散席时，你在门口送走最后一位故人，回头看见流苏正坐在廊下等你，手里还拎着半壶酒：“走，再看一眼雪。”');}},
  {k:'B',tag:'听曲',c:'#6FA698',tx:'让居云岫弹一曲，听众人合唱',f:()=>{log('红颜录','你请居云岫弹一曲。琴声起时，满院渐渐安静——明河跟着琴音低声哼起一首古调，羽裳的羽翼随着节拍轻动，连瑶光都闭目聆听。曲到中段，不知谁先跟着唱了起来，渐渐地，一屋子人都和进了调子里。那一夜的风很轻，灯很暖，歌很长——长到许多年后，你仍记得那个院子，那盏灯，和那些并肩唱歌的人。');}},
  {k:'C',tag:'守夜',c:'#A98FD9',tx:'宴散后独自收拾，却有人陪你留灯',f:()=>{log('红颜录','宴散后你独自收拾杯盏，程程化作白狐蜷在炉边不肯走，夜翎盘在梁上打盹，明河默默帮你叠好碗碟，孟轻影难得没有翻墙——只在门边靠着，看你们忙碌。李青君温了一壶新酒放在案上：“慢慢收拾，不急。”你望着这一屋子不肯散的故人，忽然觉得，这就是你问道长生，最想守住的答案。');}}

{who:'尾声',t:'再入仙迹山 · 此心如初',scene:'故事的最后，你独自回到了仙迹山。山还是那座山，红霞缭绕，乱石嶙峋——山脚却早已物是人非：当年那个教你认药的老村医，早已化作一抔黄土；那群笑闹着长大的孩子，也都已白发苍苍，或已归于尘土。村口的老槐树还在，只是树干上多了许多新刻的痕——是后来的人，又把它当成了许愿树。你沿着那条熟悉的樵径上山，走到半山腰时，忽然停下脚步——那里有块青石，是你当年歇脚的地方。青石还在，只是被岁月磨得更圆润了些。你在青石上坐下，从怀里摸出一壶酒——那是临走时流苏塞给你的：路上喝。你仰头灌了一口，酒液滚过喉头，辛辣中带着回甘，像这一路的滋味。你望着满山红霞，忽然想起很多年前，自己第一次站在这里——那时候你刚被徐伯从泥沟里捞起来不久，身上还穿着补丁摞补丁的衣裳，望着这座传说有仙的山，问天问道问长生。那时你想要的，是长生；如今你才知道，你真正想要的，是这一路走来的人。风起，红霞漫天，把你独自坐在青石上的影子拉得很长。你忽然听见身后传来一个熟悉的声音，带着笑意：喂——一个人喝酒，也不叫我？你回头，流苏站在霞光里，手里也拎着一壶酒，眉眼弯弯——她如今有了肉身，站在晚霞里，竟比满山红霞还要好看。你笑了，朝她举了举酒壶：来，坐下。这山，这霞，这长生——我都分你一半。远处，仙迹山的钟声悠悠响起，像是替这故事，落下了最后一个句点。你与她并肩坐在青石上，看红霞一点点沉入山后，谁也没有再说话——可你知道，这故事没有结束，它只是换了种方式，继续往前走。红霞散尽后，天边升起第一颗星。流苏靠着你的肩，忽然道：喂——你说，若当年你没有进这座山，如今会在做什么？你想了想：大约……会在山脚的村里，做个替人看病的郎中。她问：那你后悔么？你摇头：不后悔。做郎中也好，做修士也好——只要这一路遇见的人没错过，做什么都好。她没答话，只把脑袋在你肩上蹭了蹭。山风拂过，带着草木与露水的气息，与你当年初上山时一模一样。你忽然想起很多年前，自己第一次站在这块青石前，望着满山红霞，心里想的只有一件事：要长生。如今你坐在这里，身边有并肩的人，怀里有喝了一半的酒，山下的村子里有等你回去的灯火——你忽然觉得，你早已得到了比长生更珍贵的东西。你轻声说：流苏。她嗯了一声。你说：往后，每年的今天，我们都回来这里坐坐吧。她沉默片刻，声音里带着笑意：好。看这山的红霞，看这山的四季——看到我们都老了，也看不腻。你握紧她的手：那一言为定。她反手扣住你的指节，声音轻轻：一言为定。远处，仙迹山的钟声又响了一声，悠悠荡荡，传遍山野。山脚下，南离新城的灯火次第亮起，像一颗颗温暖的星子，缀在人间。你与她并肩坐着，望着那满山的夜色与满城的灯火——而你，终于不再是一个人了。你们在仙迹山上住了三日。白日里，你带她走遍了你当年走过的每一条路——那片你采过药的林子，那口你喝过水的山泉，那块你练过剑的平地。她一路听着，偶尔问两句，偶尔笑一声。走到那片乱石地时，你忽然停住——那是你当年除妖虎的地方。流苏看着那片空地，忽然道：就是这里？你点头：就是这里。她环顾四周，轻声道：那会儿，你连御风都不会，就敢跟一头妖虎拼命。你有些不好意思：年少轻狂。她却认真道：不是轻狂——是这里的人，值得你拼命。你怔了怔。她望着你，眼底映着满山红霞：我从那时候就知道，你这人，心软。心软的人，走不远；可心软的人，走得远。她说着，伸出手：走，下山吧——山下的灯，还亮着。你握住她的手，与她并肩走下山去。身后，仙迹山的红霞依旧，仿佛万古不变。可你知道，这座山已经不一样了——因为它记得你走过的路，记得你带上来的人。山脚下，南离新城的灯火次第亮起。你与她一同走进那片灯火里，像走进一个永远不会结束的故事。而故事的名字，叫人间。',opts:[

  {k:'B',tag:'忆往',c:'#6FA698',tx:'把这七卷路，从头到尾讲给她听',f:()=>{log('红颜录','你把这一路从头讲起：南离的雨、裂谷的妖、仙宫的琴、幽冥的灯、北冥的雪、天界的门……讲到兴起时手舞足蹈，讲到自己都笑出声。流苏静静听着，偶尔插一句：“这段我知道，那时候你在洞府里哭鼻子。”你：“……你能不能别提。”她笑而不语。等你说完，她轻声道：“你看——你走过的地方，我都记得。”你望着她，忽然明白：有些陪伴，比长生更长久。');}},
  {k:'C',tag:'启新',c:'#A98FD9',tx:'放下旧事，与诸女共赴新章',f:()=>{log('红颜录','你在山巅坐了很久，直到第一颗星亮起。起身时，你对着满山红霞郑重地一揖——敬这一路的风雪与故人。远处，山脚下亮起几点灯火，是故人们在等你下山。流苏起身，拍了拍衣上的尘土：“走吧，下一程。”你点头，与她并肩走下仙迹山。身后，钟声再响——故事未完，道无穷尽。');}}

{t:'天界 · 远古宫阙',meta:'强制节点：踏足天界，远古宫阙与近古新道',scene:'开天路的尽头，是层层云海之上的天界。你踏出最后一步时，脚下是绵延不知多少万里的白玉台阶，每一级都刻着开天辟地时的古老符文，在云雾间若隐若现。这里的宫阙古朴恢宏，一砖一瓦都带着开天辟地之初的气息——檐角的铜铃锈成了青绿色，廊柱上爬满不知年岁的藤蔓，可那些纹路里，却透着一股连岁月都磨不掉的厚重。可宫阙里走动的修士，却大多修行着近古才出现的新道法——有人御着流光飞遁，有人驱使着机关傀儡，有人以符箓为衣。你立于南天门下，望着这座既古老又年轻的城池，忽然明白瑶光为何说天界病了：它守着远古的规矩，却早已没了远古的道。那些年轻的修士从你身边经过，有人好奇地打量你，有人不屑地撇嘴——你身上那件沾过幽冥阴气与北冥风雪的衣袍，在这片一尘不染的玉阶上，显得格格不入。一名守门仙将拦住你，长戟横陈，声音冷淡：来者何人？可知天界禁地，不得擅闯？你尚未答话，一道身影已从宫内迎出——竟是曦月，她衣袂飘飘，快步而来，仙将见她连忙收戟行礼：曦月仙子。曦月微微颔首，转向你，眼底有一丝不易察觉的暖意：贵客远来，有失远迎。她引你入宫，避开人群，压低声音，眉间凝着一丝忧色：天外之影已至界外，天界诸派却还在内斗——有人主张闭界自守，有人想借天外之影立威，还有人暗中与它眉来眼去。她顿了顿，望着你，声音沉下去：你来得正是时候。若是再晚些，恐怕天界内部先要打起来了。你望着她眼底那丝疲惫，又望了望远处那些衣冠楚楚、行色匆匆的天界修士，忽然觉得，这天上与人间，其实也没什么两样——有人的地方，就有江湖。曦月引你到一处偏殿住下。殿中陈设素简，却样样都是古物——一盏青铜灯，一张石案，墙上挂着一幅水墨山水，笔意苍劲，一看便知出自大家之手。你放下行囊，曦月亲自替你斟了一盏茶：天界的茶，用的是云海间采的灵芽，入口清冽，带着一丝极淡的兰香。你赞了一句，她微微颔首，算是领了情。她坐下，缓缓说起天界的现状：天界本有数脉——守旧派以天规为尊，闭门不出，认为天外之影再凶，也攻不破开天时就立下的界壁；进取派则想借天外之影立威，好在天界诸脉中争一个话事之位；还有一撮人，暗中与天外之影眉来眼去，打着借外力清除异己的主意。她说着，指尖轻轻敲着茶盏，眉间凝着忧色：天外之影将至，天界却四分五裂——若不能先弥合内斗，只怕不待它攻入，天界自己便要乱了。你听着，忽然问：瑶光呢？她不是天界的主人么？曦月沉默片刻，才道：她……站在守旧派那边。她说，天界的规矩虽然旧，却是她亲手定的——她要守的，不是那些规矩本身，而是她当年立规矩时的那份初心。你放下茶盏，若有所思。当夜你独自登上天界最高的那座观星台。脚下是层层云海，头顶是浩瀚星河——天界的星空比凡间更近，星子大如灯盏，仿佛伸手可摘。你望着那些亘古不变的星辰，忽然想起流苏说过的话：天界是瑶光建的，她想给万界一个永恒的秩序。可秩序这东西，最难的从来不是立，而是守——守得久了，便容易忘了当初为何而守。你正出神，身后忽然传来脚步声。你回头，是曦月。她披着一件外衫，显然也是睡不着：在想天外之影的事？你摇头：在想天界的事。她走到你身边，与你并肩望着星海，沉默半晌才道：我师父鹤悼常说，天界病了——病在大家都忘了，规矩是为人立的，而不是人为规矩活的。你转头看她：那你呢？你信什么？她想了想，道：我信……总该有人记得，天界最初的样子。你看着她被星光勾勒的侧脸，忽然觉得，这个看似清冷的仙子，心里其实藏着一团火。她没有再多说，只陪你站了一会儿，便转身离去。你望着她的背影消失在回廊深处，心里那点关于天界的盘算，渐渐清晰起来。',opts:[
  {k:'A',tag:'观局',c:'#7FA8C9',tx:'先摸清天界诸派虚实与内斗缘由',hint:'影响：知彼；谋定后动',run:()=>{log('红尘卷·终卷','曦月为你摆了一整天茶局，把天界几大势力的底细一一说透——守旧派闭门不出，进取派想借天外之影立威，还有一撮人暗中与天外之影眉来眼去。你听完，忽然问：“瑶光呢？”曦月沉默片刻：“她……站在守旧派那边。她说，天界的规矩虽然旧，却是她亲手定的。”');}},
  {k:'B',tag:'扬威',c:'#C4675C',tx:'以力服人，先镇住天界宵小',hint:'影响：入战（天界天骄·强）；立威',run:()=>{log('红尘卷·终卷','总有不开眼的想拿新来的立威。一名天界天骄拦在路中间，冷笑道：“下界来的土包子，也配登天？”你没有废话，一掌拍出——那是你在北冥镇混沌的道则之力。天骄连同他身后看热闹的一群人，齐齐被掀翻在地。曦月望着满地狼藉，半晌才道：“……你下手倒是利落。”你收掌：“天都要塌了，没空陪他们磨嘴皮。”');startCombat(rdEnemy('天界天骄·昆吾',2.6),'rd7Fight');}},
  {k:'C',tag:'访旧',c:'#D88FA5',tx:'先寻瑶光，问清她与天外之影的渊源',hint:'影响：洞悉天外之影真相（关键）',run:()=>{log('红尘卷·终卷','你循着瑶光的气息寻到天界最僻静的一处星台。她正独自观星，见你来也不意外：“来问天外之影的？”你点头。她望着星海良久：“我与它同源而生——它是我当年斩下的一道‘求全’执念，想让万界都按它想的模样存在。可我早明白：没有哪一界，该活成别人的影子。”');}},

{t:'曦月观星 · 瑶光二现',meta:'强制节点：星台夜话，源初意识的真正选择',scene:'星台之上，万籁俱寂，唯有星光如瀑。瑶光难得说起了从前，声音在夜风里显得格外轻：开天之后，我建了天界，想给万界立一个永恒的秩序——我以为只要一切都按着规矩来，便不会再有大乱。可我发现，越是想让一切对，一切就越是错——规矩压住了乱，也压住了活气，万界像一潭不再流动的死水。于是我又亲手推翻了它。她说着，指尖轻轻划过膝前的星光，像是在拨动一泓看不见的水：推翻之后我才明白，道不该是被谁定死的模样。她转头看你，目光里带着一丝审视，又有一丝说不清道不明的欣赏：你那位老师说得对。你心头微动，知道她说的是流苏——那道在识海里陪你走了半生的白玉小人。远处，一颗流星划过天幕，拖着长长的光尾，像一滴坠落的泪。你忽然问她：天外之影来了——你会怎么选？瑶光沉默了很久。久到那颗流星已经坠入云海深处，她才开口，声音平静却笃定：我斩了它一次。若它再来……我便再斩它一次。她顿了顿，忽然笑了，笑意里带着一丝你从未见过的释然：不过这次，我大概不用一个人了。夜风拂过星台，吹动她的衣袂与发丝。两个曾经站在万界之巅的意识——一个建过天界又亲手推翻了它，一个困在残魂里蹉跎了万古——此刻并肩而立，望着同一片星海。你忽然觉得，这万古的恩怨，似乎在这一刻，有了一个比胜负更重要的答案。你伸出手，声音不大，却很稳：行。这一仗，我陪你打。瑶光看着你伸出的手，怔了怔，随即失笑，笑意里带着一丝万古未有的轻快：你这小辈，倒比那些老家伙爽快。她抬手与你击掌，掌风激荡间，整座星台的星光都为之一亮，仿佛万古的星子都被这一掌惊醒了。她望着你，忽然认真道：若此战之后我还活着——我想去你那人间的茶馆，喝一碗粗茶。你说：那一言为定。她笑了笑，转身望向星海深处，声音低下去：天外之影是我的执念所化，这一战，本该由我了结。你站到她身侧：可你方才说，这次不用一个人了。她沉默片刻，轻声道：是啊——万古以来，我习惯了独来独往。没想到临了，倒多了个并肩的。夜风拂过星台，两人之间那点微妙的距离，仿佛被星光填满。你忽然想起什么，道：对了，流苏让我带句话给你。瑶光微微一怔：她说什么？你说：她说——那年在混沌里，你推她出那片光海的时候，她便知道了。瑶光没有说话，背对着你，声音有些哑：知道什么？你道：知道你没想让她死。星台上，万古的冰，仿佛化了一角。那一夜，你们在星台上聊了很久。瑶光说起她建天界的初衷，说起她推翻天界时的决绝，说起万古来那些无人可说的孤独。你说起你从仙迹山一路走来的故事——南离的银枪、妖城的狐火、幽冥的忘川、北冥的雪。她听着，偶尔插一句，偶尔笑一声。天将亮时，她忽然问你：你这一路，可曾后悔过？你想了想，摇头：没有。她望着你，目光里有一丝说不清道不明的神色：那若是再来一次呢？你笑了：再来一次，我还是会走这条路——遇该遇的人，做该做的事，喝该喝的酒。她沉默很久，忽然轻声道：我忽然有些羡慕你。你问：羡慕什么？她望着渐渐泛白的天际，声音轻得像叹息：羡慕你心里有牵挂的东西。我活了万古，建过天界，又亲手推翻它——可到头来，竟不知自己为何而活。你看着她，忽然道：那你现在知道了么？她怔了怔，没有答话。可你分明看见，她望着天边那缕晨光的眼底，第一次有了一丝温度。',opts:[

  {k:'B',tag:'抚古',c:'#6FA698',tx:'劝她放下旧怨，与流苏言和',hint:'影响：流苏瑶光破冰（温情）',run:()=>{log('红尘卷·终卷','“你们争了万古——其实一个求序，一个求道，谁都没错。”你轻声说，“只是这天地太大，装得下两种活法。”星台陷入长久的寂静。良久，识海里流苏忽然开口：“瑶光……那年在混沌里，你推我出那片光海的时候——我便知道了。”瑶光背对着你们，声音有些哑：“……知道什么？”流苏：“知道你没想让我死。”星台上，万古的冰，仿佛化了一角。');}},
  {k:'C',tag:'谋阵',c:'#7FA8C9',tx:'与曦月连夜推演，布天界大阵',hint:'影响：悟性+2；为大决战布后手',run:()=>{S.six.悟性=clamp(S.six.悟性+2,1,20);log('红尘卷·终卷','你与曦月对着天界星图推演了七天七夜，将天界诸峰连成一座前所未有的万界镇魔阵。曦月画下最后一笔时，手都在抖：“若此阵成，天外之影入界即入瓮中。”你点头：“那就等它来。”远处，天穹尽头的阴影，又近了一分。');}},

{t:'诸界 · 烽烟将起',meta:'强制节点：天外之影降临，诸界同仇敌忾',scene:'天外之影终究还是来了。它没有形体，是一道横贯星海的巨大阴影，从银河深处缓缓压来，所过之处星辰黯淡、法则扭曲，连光都像被它吸走了颜色。它开口时，声音像无数个世界同时哀鸣，又像万古的潮汐一同倒卷：万物……当归于一。那一刻，无论天界、人间、幽冥、妖城还是北冥，所有生灵都仰头望见了那道阴影——它横在苍穹之上，像一柄悬在诸界头顶的利剑。人间，李无仙在人皇殿中拔剑，剑光映着她年轻而坚毅的脸：传令诸界！它要吞我们的世界，便先问过我们的剑！妖城，程程化作白狐腾空而起，独角映月，身后万妖列阵，妖气连成一片；夜翎展开螣蛇金翼，金光灿灿，如一轮新生的太阳。幽冥，孟轻影与明河并肩而立，一黑一白，像两道剪影。北冥，羽裳与安安带着魔物踏浪而来，冰甲森然。连瑶光都落在你身侧，衣袂猎猎，眼底映着那道阴影。你立于诸界大军之前，望着那道遮天蔽日的阴影，感受着身后那些或熟悉或陌生的气息——有人间凡人的剑，有妖城狐妖的尾，有幽冥鬼差的锁链，有北冥魔物的嘶吼——你忽然笑了，声音不大，却清晰地传遍诸界：诸位——这一战，我等了很久了。话音落下，你身后响起震天的应和声，声浪滚滚，竟把星海都震得微微颤抖。那道阴影仿佛也被这声浪激怒了，骤然收缩，又猛然膨胀，化作无数黑色的触手，向诸界探来——每一根触手都裹挟着扭曲的法则，所过之处，空间寸寸碎裂。你举剑指天，声音传遍诸界：它要我们归于一——我们偏要各自精彩！话音未落，你已率先化作一道光冲向那道阴影。身后，万界大军如星河倒卷：李无仙的剑光如虹，程程的独角射出雪白的妖光，夜翎的金翼掀起漫天风云，孟轻影的飞梭划出幽暗的轨迹，明河的剑意清冽如霜，羽裳与安安的冰火交织，瑶光周身泛起源初的混沌光——无数道光芒汇聚成一道洪流，狠狠撞向那道横贯星海的阴影。碰撞的刹那，星海都仿佛被撕裂了。你冲在最前，剑刃切进阴影深处，却像切进了一团没有实体的浓雾——它顺着你的剑光缠绕而上，试图将你吞没。你咬牙，周身混沌火猛然燃起，将那团浓雾灼得滋滋作响。远处，传来李无仙清越的呼喊：先生！我们来了！你回头，看见万界大军正冲破阴影的触手，向着你的方向汇聚而来。你忽然觉得，自己从未像此刻这样，不是一个人在战斗。那一战从黄昏打到天明，又从天明打到下一个黄昏。天外之影的触手无穷无尽，斩断一茬又生一茬，诸界大军且战且进，每一步都踏着血与光。你浑身是伤，剑刃卷了口，可你始终冲在最前——因为你知道，你身后是整个人间。中途有一次，你被一道阴影触手缠住，几乎被拖进那片浓雾深处。千钧一发之际，一杆银枪破空而来，枪尖寒芒如电，将那道触手钉穿——是李青君。她不知何时上了前线，一身戎装，鬓角已有些花白，可那杆银枪在她手里，依旧稳如磐石。她一把拽住你，声音带着怒气：臭小子！谁让你一个人冲这么前的！你咧嘴一笑，血顺着额角流下来，却浑不在意：青君姐，你怎么来了？她哼了一声：我不来，谁替你收尸？她说着，枪尖一转，替你荡开一片阴影：跟紧我！你望着她染血的背影，忽然想起很多年前，在离火城头，她也是这样护在你身前。那时候你还是个无名散修，她也是个莽撞的丫头。如今你们都老了，可那杆枪、那份护短的心，却一点没变。你抹了把脸上的血，笑着跟上去：来了！',opts:[
  {k:'A',tag:'振臂',c:'#C4675C',tx:'举剑号令诸界联军，正面迎战',hint:'影响：大决战（天外之影·归一劫）',run:()=>{log('红尘卷·终卷','你举剑指天，声音传遍诸界：“它要我们归于一——我们偏要各自精彩！”诸界强者齐声应和，声浪震得星海颤抖。你率先化作一道光冲向那道阴影，身后万界大军如星河倒卷。');startCombat(rdEnemy('天外之影·归一劫',3.3),'rd7Boss');}},
  {k:'B',tag:'布阵',c:'#7FA8C9',tx:'以万界镇魔阵为引，将诸界之力汇于一身',hint:'影响：聚力一击（天外之影·灭世）',run:()=>{log('红尘卷·终卷','你立于万界镇魔阵的阵眼，将诸界强者的力量尽数引于己身——那一刻你仿佛听见无数世界的心跳：人间孩童的啼哭、妖城狐狸的笑闹、幽冥鬼差的叹息、北冥魔物的嘶吼。你睁开眼，眸中倒映诸界众生：“这一拳——替万界打的。”');startCombat(rdEnemy('天外之影·灭世',3.2),'rd7Boss');}},
  {k:'C',tag:'请君',c:'#8B6FA8',tx:'诱它入镇魔阵深处，再行绝杀',hint:'影响：险中求胜（天外之影·困兽）',run:()=>{log('红尘卷·终卷','你佯装不敌且战且退，将天外之影一步步引入曦月布下的大阵。当阴影彻底没入阵中，你转身一笑：“欢迎光临——此界，谢绝吞噬。”阵纹轰然亮起，诸界之力化作亿万道锁链缠向阴影。');startCombat(rdEnemy('天外之影·困兽',3.1),'rd7Boss');}},
]},
{t:'决战 · 天外之影',meta:'强制节点：最后一战，以诸界之名',scene:'这一战打得天崩地裂。天外之影被万界之力撕碎了三次，又重组了三次——它本就是求全的执念，只要诸界还存差异，它便不死。你浑身是血，站在虚空之中，衣袍破碎，剑刃卷了口，连呼吸都带着铁锈般的腥甜。你望着那道再度聚拢的阴影，心里却忽然一片清明。你想起很多年前，仙迹山下那个连饭都吃不饱的少年，想起他第一次握剑时笨拙的样子，想起这一路走来遇见的每一个人——李青君在城头死守的倔强、夜翎小心翼翼试探的信任、程程藏在笑里的狠与软、孟轻影嘴上不饶人却比谁都重情义、明河清冷外表下的温柔、居云岫画里藏着的念想……每一个人，都有自己活法；每一盏灯火，都亮着不同的光。你忽然明白了什么，喃喃道：它杀不死……因为它就是我们的一部分——每个想把自己活法强加给世界的人，都是它。瑶光的声音从身后传来，带着一丝疲惫的赞许，还有一丝连她自己都没察觉的欣慰：你看懂了。她顿了顿：所以，要打败它，只有一个办法——让万界都活成自己的样子，它便再也找不到可以落脚的影子。你缓缓闭上眼睛。虚空之中，风停了。你松开手中剑，盘坐于诸界之间，将自身道韵化作亿万盏灯火，洒向诸界——每一盏灯，都照见一种活法：有锄头刨地的农人，有挑灯夜读的书生，有妖城里追着风车跑的狐妖，有幽冥岸边钓前尘的老鬼，有北冥雪原上赶路的魔物……万盏灯火，万种活法，在星海中次第亮起。天外之影在万光之中嘶吼着、挣扎着、消融着——它找不到任何一处相同的阴影可依附，那巨大的阴影终于一寸寸碎裂，化作漫天流萤，散入星海。你睁开眼时，诸界寂静。李无仙望着这一幕，眼眶微红，轻声说：先生……天，亮了。漫天流萤散尽后，那道横贯星海的阴影彻底消失了。你依旧盘坐在虚空之中，周身那亿万盏灯火渐渐敛去，融回你体内。你缓缓站起身，只觉得浑身虚脱，几乎站立不稳——散尽道韵那一击，几乎耗尽了你全部的力量。一只手稳稳扶住了你。你转头，是程程——她不知何时化作人形，站在你身边，眼眶红红的，却硬撑着没让眼泪掉下来：你疯了！把道韵全散出去，你不要命了？！你咧嘴笑了笑，声音虚弱却带着一丝得意：命……不是还在么。夜翎扑棱着翅膀冲过来，一头撞进你怀里，声音带着哭腔：哥哥！你吓死我了！你揉了揉她的发顶：没事，哥哥命硬。明河、孟轻影、羽裳、安安、曦月、瑶光……诸界强者纷纷围拢过来。瑶光望着你，目光里带着一丝复杂的神色，半晌才道：你方才那一手——把道韵散尽，化作万界灯火。这法子，连我都没想到。她顿了顿：你果然……比她想的还要像她。你说：像谁？她没有答话，只望了一眼你识海的方向——那里，流苏的气息正静静流转着。你忽然明白，瑶光说的是流苏——那个求了一辈子道，最后却愿意为了一缕残魂停下来的人。你低下头，看着自己空空的双手，却忽然觉得，一点都不空。诸界强者扶着你回到昆仑时，天已经彻底亮了。你躺在榻上，浑身虚脱，连抬手的力气都没有。流苏坐在榻边，替你擦去额角的血，动作很轻，像怕弄疼你。你看着她，忽然道：流苏。她嗯了一声。你说：我方才散道韵的时候，看见你了。她手上动作一顿：看见我什么？你说：看见你在识海里，急得团团转，又不敢出声打扰我。她别过脸去，耳尖微红：……谁急了。你笑了笑，没有拆穿她。窗外，传来诸界强者们低低的议论声——他们在商量如何修补那道被天外之影撕开的裂隙。你听着那些声音，渐渐沉入梦乡。梦里，你又回到了仙迹山脚下那个小村庄，徐伯磕着烟杆，坐在老槐树下，笑眯眯地对你说：小伙子，人这一辈子，总得有个念想。你站在村口，望着远处红霞缭绕的仙迹山，忽然觉得，这一路走来，你一直都在追着那个念想跑。如今念想还在，你便还有力气继续走。',opts:[
  {k:'A',tag:'同辉',c:'#C9A45C',tx:'以自身道韵为灯，引万界各自绽放',hint:'影响：最终击溃天外之影（大胜）',run:()=>{log('红尘卷·终卷','你松开手中剑，盘坐于虚空之中，将自身道韵化作亿万盏灯火，洒向诸界——每一盏灯，都照见一种活法。天外之影在万光之中嘶吼着消融，它找不到任何一处相同的阴影可依附，终于化作漫天流萤，散入星海。李无仙望着这一幕，忽然轻声说：“先生……天，亮了。”');}},
  {k:'B',tag:'死战',c:'#C4675C',tx:'以身合剑，与它同归于尽一搏',hint:'影响：惨胜（入战·至凶）；开启裂隙线',run:()=>{log('红尘卷·终卷','你化作一柄贯穿星海的长剑，直直刺入天外之影的核心。它哀嚎着撕裂你，你也撕裂了它——两败俱伤。当光芒散尽，天外之影终于消散，而你浑身浴血地坠向人间，被夜翎拼死接住。你睁开眼，看见头顶的天穹上，有一道被撕裂后没能完全愈合的裂隙。');startCombat(rdEnemy('天外之影·垂死',3.0),'rd7Fight');}},
  {k:'C',tag:'化道',c:'#A98FD9',tx:'将混沌道则反哺诸界，补全大道',hint:'影响：道我合一前奏（入战）',run:()=>{log('红尘卷·终卷','你放开丹田中那团混沌道则，任它化作甘霖洒向诸界——枯竭的灵脉重焕生机，断损的法则自行弥合。天外之影失去了“吞噬”的对象，在万界复苏的光中一点点干涸。你亦因道则离体而虚弱，流苏的声音在识海响起，带着罕见的急切：“傻子！你把道都散尽了——自己怎么办？”你笑了笑：“道这东西，本就是给人用的。”');startCombat(rdEnemy('天外之影·残喘',3.0),'rd7Fight');}},
]},
{t:'裂隙 · 生与死',meta:'强制节点：大战之后，天道裂隙与流苏的抉择',scene:'天外之影退了，可它撕开的那道天道裂隙仍在——裂隙横亘在苍穹之上，像一道永远不会愈合的伤疤，每扩大一分，此界的灵气便外泄一分，连日月的光辉都黯淡了几分。诸界强者齐聚昆仑，商议补天之法。曦月推演了三天三夜，面前的天机图上布满密密麻麻的推演痕迹，最终她说出那个谁都不愿听的办法，声音很轻，却像重锤砸在每个人心上：补天，需一道与天道同源的力量填入裂隙——源初之灵，或者……以身合道的人。满殿寂静。连风都停了。流苏的声音忽然在所有人耳边响起，清越而平静，像说着一件再寻常不过的事：我来。你猛地抬头。识海里，那道陪了你一路的白玉小人飘然而出，在满殿目光中化作一个清丽的女子身影——她第一次以完整的面貌站在你面前，眉眼如画，衣袂飘飘，微微笑着：别这副表情。我本就是开天时一缕求道的意识，回到道里去，算不得死。她说着，望向那道裂隙，目光平静得像在望一个老朋友。你看着她，很久没有说话。满殿的目光都落在这边，却没有人出声。你忽然开口，声音很稳，稳得连你自己都有些意外：要合道，也该是我来。流苏怔住了。她转头看你，眼底第一次浮现出慌乱：你说什么？你盯着她，一字一句道：你陪我走了一路，最后却要你填进去——这算什么道理？她张了张嘴：可是……你打断她：没有可是。要合道，我去。你留在这人间，替我看看它将来长成什么样。她望着你，眼底有水光一闪而过，却倔强地没有让它落下来：……你凭什么替我做决定？你笑了笑：凭你叫我一声傻子，叫了这么多年。流苏被你噎得说不出话来，眼眶却慢慢红了。她别过脸去，声音闷闷的：……谁叫你了。满殿的人看着这一幕，都极有默契地没有出声——连最跳脱的夜翎都安静下来，乖乖蹲在李青君肩头。良久，流苏才低声开口，声音里带着一丝前所未有的柔软：秦弈，我不是要去死。我是源初之灵，回归天道，是我本来的归处——就像水流回大海，云散入长空。她说着，转回头看你，眼底有泪光，却也在笑：可你不一样。你还有大好的路要走，还有那么多人等着你。你说：那你呢？你就不想看看，这人间将来长成什么样？她沉默了很久，才轻声道：想。可若要以你为代价……我宁愿不看。你心头一震。你看着她，忽然明白了——她不是不怕死，她只是更怕你替她去死。你张了张嘴，想说什么，却被一阵突如其来的琴音打断。殿外，居云岫不知何时到了，正坐在昆仑的松树下抚琴——琴音清越，像山间的溪水，又像林间的风，把满殿凝重的气氛冲淡了几分。你听着那琴音，忽然想起居云岫说过的话：你笔下有牵挂——这是好事，也是修行路上最难的一关。你望着流苏，轻声道：那便都活着。牵挂也好，修行也罢——总得先活着，才能有以后。殿中沉默了很久。最终打破沉默的，是李青君。她站起来，声音不大，却让满殿都听得清清楚楚：秦弈说得对——都活着。补天的事，可以再想别的办法；可人若是没了，就什么都没了。程程接口道：妖城也这么觉得。她顿了顿，化作白狐跳上桌案，尾巴一卷：再说了，我们这么多人，还凑不出一个补天的法子？非要让谁来填命？孟轻影哼了一声：就是。本座活了几百年，还没见过哪道裂隙，是拿人命填平的。满殿你一言我一语，竟把方才那股凝重的气氛冲散了大半。流苏望着这满殿替她说话的人，眼眶有些发红。她转头看你，声音低低的：……你朋友真多。你笑了笑：都是这一路捡的。她噗嗤一声笑出来，又赶紧绷住脸：少贫。可你分明看见，她眼底那层薄薄的水光，已经悄悄退了。曦月适时开口：既然诸位都不同意以命补天，那便只剩最后一个法子——寻一件与天道同源、却又不属于天道的物事填进去。她说着，目光落向你：比如，一扇完整的众妙之门。你心头一震。',opts:[
  {k:'A',tag:'不允',c:'#C4675C',tx:'拦住她：要合道，也该是我来',hint:'影响：开启以身合道抉择',run:()=>{log('红尘卷·终卷','你一把拉住她：“你陪我走了一路，最后却要你填进去——这算什么道理？”流苏怔了怔，随即笑了：“那你教我个道理？”你盯着她：“要合道，我去。你留在这人间，替我看看它将来长成什么样。”流苏的笑容僵住了：“……你说什么？”你松开手，转身望向那道裂隙：“我说——这一次，换我来护你。”');}},
  {k:'B',tag:'惜别',c:'#D88FA5',tx:'与她并肩看遍诸界灯火，做最后的告别',hint:'影响：流苏线温情结局前奏',run:()=>{rdLove('流苏',5);log('红尘卷·终卷','那一夜，你们并肩走遍了人间：看南离新城的灯会，听妖城狐狸的夜话，在幽冥忘川边钓了一尾鱼，又去北冥看了极光。天亮时，流苏靠在桥栏边，望着远处的朝阳，轻声道：“其实我早就不怕死了——怕的是，没好好活过。”你站在她身侧：“那便好好活着。补天的事，再想办法。”');}},
  {k:'C',tag:'问道',c:'#7FA8C9',tx:'问瑶光：源初之灵是否另有补天之法',hint:'影响：另寻他途（关键）',run:()=>{S.six.悟性=clamp(S.six.悟性+2,1,20);log('红尘卷·终卷','你寻到瑶光，劈头便问：“你是源初之灵，有没有别的补天法？”瑶光沉默良久，缓缓道：“还有一个法子——找一件与天道同源、却又不属于天道的‘东西’填进去。比如……一扇完整的众妙之门。”你心头一震：“门？”瑶光点头：“门本身便是道的具现。若能集齐诸界散落的门之碎片，重铸众妙之门——或许可补天，亦可不伤一人。”');}},
]},
{t:'三生 · 流苏塑身',meta:'强制节点：众妙之门重铸之路，与前世今生的幽皇',scene:'为了集齐众妙之门的碎片，你走遍诸界。天界的残片被曦月与鹤悼完好地封存着；妖城的碎片藏在地脉深处，程程亲自带你去取；北冥的碎片镇在魔渊之底，羽裳与安安为你开了禁制；人间的碎片，则被李无仙供在人皇殿中，她说这是先生的东西，她替先生守着。最后一块碎片，在幽冥最深处——忘川之源。你重临忘川时，两岸的彼岸花开得正盛，殷红如血。当年那位自称幽皇的初代轮回之主早已坐化，只在原地留下一枚流转着幽光的玉髓，和一册摊开的古卷，古卷上压着一枚小石，像是不忍被风吹走。你拾起古卷，只见扉页写着一行字，笔迹古朴，却力透纸背：予后来者：此玉髓乃吾一缕本源所化，与混沌同源，可补天道之缺。你握着那枚温润的玉髓，忽然明白了一切——幽皇他当年坐化，等的就是今天。他守着幽冥万古，守的不是权力，不是地位，而是这一枚能补天的玉髓——他早已算到，总有一日，天道会有裂隙，会有人需要它。流苏在你识海里，声音轻得像怕惊碎什么：他……把路都铺好了。你沉默良久，握着那枚玉髓，郑重地朝忘川一拜——这一拜，拜那位素未谋面却为你铺了万古路的老人。身后，三生石微微发亮，仿佛在说：去吧。你转身，带着诸界集齐的门之碎片与那枚玉髓，走向忘川之畔的开阔处。混沌火在你掌中燃起，太一水环绕流转，北冥冰镇住虚空——七日七夜后，一扇古朴的门在虚空中缓缓成形。门开的刹那，万道齐鸣，天地间仿佛响起一声开天辟地时的钟响。流苏望着那扇门，久久无言，最后轻声说：……谢谢你，没让我一个人走。众妙之门成形的那一刻，整个幽冥都仿佛亮了一瞬。忘川的水倒映着那扇古朴的门，两岸的彼岸花无风自动，像在朝拜。你伸手，轻轻抚过门框上那些流转的纹路——它们与你在天界紫微殿见过的那块碎片同源，却又比那碎片完整得多，带着开天辟地时的气息。你忽然明白，这扇门，本就是道的具现——它不属于任何一界，却连通着所有世界。流苏走到门边，伸出手，指尖触到门面时，门上的纹路轻轻亮起，像是在回应她。她怔了怔，低声道：它……认得我。你说：它是你当年那根棒子的一部分——自然会认得你。流苏沉默良久，忽然道：秦弈，等补完天……你带我回凡间住一阵子吧。你一愣：怎么突然说这个？她别过脸去，声音低低的：我活了一辈子，都在求道。还从来没好好看过——人间的花是怎么开的，茶是怎么沏的，月亮是怎么圆的。你望着她，忽然笑了：好。等补完天，我带你看遍人间。她没答话，可你看见她耳尖悄悄红了。身后，三生石微微发亮，像是那位铺了万古路的幽皇，也在无声地笑着。重铸众妙之门后，你与流苏并肩坐在忘川之畔，望着那扇在虚空中静静流转的门。门上的纹路明灭不定，像在呼吸。你忽然问：这门……补完天之后，会怎样？流苏想了想：众妙之门本就是道的具现。补天之后，它或许会化作天地间的一道法则，永镇裂隙；也或许会重新散作碎片，回归诸界。你说：那它还会记得我们么？她沉默片刻，道：道不记人，人记道。它或许不会记得我们——可我们走过的路，会记得。你听着她的话，忽然觉得，这扇门像极了这一路的修行：聚散有时，来去无痕，可走过的每一步，都算数。远处，忘川的水声轻轻传来，两岸的彼岸花在幽光里摇曳。你伸手，轻轻握住流苏的手。她没有抽回，只是把指尖与你扣得更紧了些。你们就这样并肩坐着，看着那扇门在虚空中静静流转，像看着一段即将开始的新的故事。良久，流苏忽然开口：秦弈。你嗯了一声。她说：谢谢你。你笑了笑：谢什么？她望着那扇门，声音很轻：谢谢你让我知道——求道这条路，也可以走得这么暖。',opts:[
  {k:'A',tag:'集门',c:'#A98FD9',tx:'以玉髓为引，重铸众妙之门',hint:'影响：开启补天之法；流苏不必赴死',run:()=>{log('红尘卷·终卷','你盘坐于忘川之畔，将诸界集来的门之碎片与那枚玉髓置于一处。混沌火燃起，太一水淬炼，北冥冰镇形——七日七夜后，一扇古朴的门在虚空中缓缓成形。门开的刹那，万道齐鸣，天地间仿佛响起一声开天辟地时的钟响。流苏望着那扇门，久久无言，最后轻声说：“……谢谢你，没让我一个人走。”');}},
  {k:'B',tag:'寻幽',c:'#7FA8C9',tx:'先以三生石探寻幽皇的前世今生',hint:'影响：悟性+2；洞悉幽冥旧事',run:()=>{S.six.悟性=clamp(S.six.悟性+2,1,20);log('红尘卷·终卷','你以道韵触碰三生石，看见了幽皇的过往——他本是开天后第一缕守序的意识，为护轮回秩序耗尽本源，坐化前将最后一缕神魂炼成玉髓，只为“若有一日天道有缺，有人能用得上”。你睁开眼，久久无言。流苏轻声道：“原来他求的秩序……是把自己也算了进去。”');}},
  {k:'C',tag:'归魂',c:'#6FA698',tx:'以轮回盘引渡忘川万魂，答谢幽皇遗泽',hint:'影响：功德+8；幽冥安宁',run:()=>{S.merit+=8;log('红尘卷·终卷','你取出轮回盘，将忘川两岸万古的游魂一一引渡。那一夜忘川的水声格外温柔，仿佛那位坐化的幽皇，在无声地说谢。引渡完最后一缕游魂时，你仿佛看见忘川尽头，一道透明的身影朝你微微一揖，随即散入波光。你回了一礼。');}},
]},
{t:'昆仑 · 万界之约',meta:'强制节点：众妙之门补天，诸界立约',scene:'众妙之门被送入天道裂隙的刹那，万界齐明——那扇古朴的门在裂隙中缓缓展开，门光如潮水般漫过诸界，裂隙在门光中一寸寸弥合，像一道伤口终于愈合。逸散的灵气倒灌回诸界，枯了三年的灵田一夜返青，干涸的灵泉重新涌出清流，连天穹都仿佛高了几分。天地大定，诸界强者却都留在了昆仑——因为李无仙说了那句憋了很久的话，声音不高，却让满殿都安静下来：天外之影没了，可天上人间这么多年的账，该算一算了。程程、夜翎、明河、孟轻影、羽裳、安安、曦月、瑶光——诸界之主围坐一席，谁也没有先开口。殿中气氛微妙：天界与妖城有旧怨，幽冥与北冥积了千年的梁子，人间夹在中间，看谁都像看债主。你坐在末席，望着这满殿的旧敌与新友——几个月前，他们还在互相提防；几天前，他们还并肩抗过天外之影。你忽然端起酒杯站了起来，满殿目光齐齐落过来。你环视一圈，缓缓开口：诸位，听我一言。你们之间有仇，有怨，有算不清的旧账——可天外之影来的时候，你们都站到了一起。为什么？因为它要吞的是我们每一个。她顿了顿：今日坐在这里的，都是守住了自己世界的人。这杯酒，敬诸位——敬我们各自活成了自己的模样。你仰头饮尽。满殿沉默片刻，程程第一个端起酒杯：妖城，敬了。瑶光第二个举杯：天界，也敬了。李无仙眼眶微红，举杯站起：人间……永记此约。那一夜，昆仑的灯火亮了很久。万界盟约的细目一条条敲定：天界修士行走人间需持牒，不得擅动凡人性命；妖城与人间通商互市，妖族入城需备案；幽冥渡魂需向人皇府报备，不得私吞生魂；北冥魔物不得越界伤人；修士斗法，不得殃及凡人。你坐在席间，看着那些曾互相提防、甚至兵戎相向的界主，此刻却为一字一句争得面红耳赤——争完了，又举杯一笑。散席时，瑶光端着酒杯走到你面前，难得没有那副云淡风轻的模样，眼底带着一丝认真的神色：这盟约……是你一手促成的。你举杯与她一碰：是诸界自己愿意。她沉默片刻，忽然道：若早千年有人像你这般……天界或许不会走到今天这一步。你说：现在也不晚。她笑了笑，仰头饮尽杯中酒：是啊，不晚。远处，李青君正与程程说话，不知说了什么，程程化作白狐蹲在她肩上，尾巴一甩一甩的；夜翎追着清茶满山跑，清茶抱着茶壶哇哇大叫。你看着这满山的灯火与人影，忽然觉得，这一路的颠沛流离，都值了。盟约既定，诸界之主本该各自归位，可谁也没急着走。李青君拉着程程在篝火边坐下，说起当年南离城破时，程程是怎么带着妖城的小妖们收留南离遗民的——程程化作白狐，尾巴一卷一卷，懒洋洋道：那时候就看你一个人扛着座城，怪可怜的。李青君失笑：那会儿我可不知道，妖城的大王是个这么心软的主儿。程程哼了一声：谁心软了？我那是看你顺眼。夜翎不知从哪冒出来，插嘴道：师父明明偷偷哭了！程程一尾巴把夜翎扫开：小崽子胡说什么！远处，曦月正与瑶光站在山石边说话。曦月问：前辈往后有什么打算？瑶光望着天边的云海，沉默片刻，道：想去凡间走走。看看那丫头说的茶馆、粗茶，还有人间烟火。她说着，目光落向你这边，声音轻了几分：或许……也学学怎么像个人一样活着。你听着她的话，忽然觉得，这位曾经站在万界之巅的源初意识，此刻竟像个初入人间的孩子——带着好奇，带着期待，也带着一点点小心翼翼的欢喜。你端起酒杯，远远朝她举了举。她看见了，微微一怔，随即也端起酒杯，朝你遥遥一敬。',opts:[
  {k:'A',tag:'立约',c:'#C9A45C',tx:'提议立万界盟约：各守其土，互不侵犯',hint:'影响：成就「万界同盟」之路',run:()=>{log('红尘卷·终卷','“天界不得干涉人间，幽冥不得私吞生魂，妖城与北冥各守其土——人间的事，由人皇执掌。”你一字一句说完，满殿寂静。良久，瑶光第一个点头：“可。”程程化作白狐蹲在桌上，尾巴一甩：“妖城同意。”明河稽首：“幽冥附议。”李无仙望着你，眼眶微红：“先生……人间，永记此约。”那一日，万界盟约成于昆仑之巅。');}},
  {k:'B',tag:'和稀泥',c:'#8B6FA8',tx:'劝诸界各退一步，先把旧怨放下',hint:'影响：恩怨暂缓；人心渐齐',run:()=>{log('红尘卷·终卷','你端着酒杯挨个敬了一圈——先敬程程，再敬曦月，又去敬羽裳和孟轻影……几杯下肚，满殿的剑拔弩张竟化成了推杯换盏。夜翎偷偷问你：“哥哥，这就行了？”你笑道：“有些账，喝酒的时候算不清；可只要还肯坐在一起喝这杯酒——就还有得谈。”');}},
  {k:'C',tag:'立规',c:'#7FA8C9',tx:'牵头起草盟约细则，定诸界行走规矩',hint:'影响：悟性+1；盟约更牢',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·终卷','你在昆仑峰顶铺开一卷长帛，亲自执笔起草万界盟约——天上人行走人间需持牒、妖族入城需备案、幽冥渡魂需报备、修士斗法不得殃及凡人……你写得很慢，每一句都斟酌再三。曦月在一旁看着，忽然道：“你这一笔一划，倒是比天界万年的规矩更像个‘序’。”');}},
]},
{t:'归来 · 相见欢',meta:'强制节点：大战落幕，故人重逢',scene:'万界盟约既立，诸界散去前，众人在昆仑山脚摆了一场流水席。那夜的风很轻，灯很暖——桌案从山脚一直摆到半山腰，酒坛子堆得像小山，菜肴是各界的厨子八仙过海：人间端来红烧肉与桂花酿，妖城送来自家酿的蜜酒与烤灵菇，幽冥居然也派鬼差送来一坛忘川酿，说是鬼市老店的手艺，北冥则扛来一头烤得金黄流油的雪兽。李青君带着南离新城的酒来了——那酒她温了一路，坛身还暖着，她拍开泥封时，酒香混着桂花香飘了满山。程程化作白狐蹲在案头，偷吃了几颗灵果，被夜翎抓了个正着；夜翎盘在梁上啃灵果，啃得咔嚓作响，还不忘往你这边丢两颗。明河难得没有急着走，捧着茶盏坐在角落，听居云岫的琴声。孟轻影翻墙进来扔给你一壶酒，扬声道：喂，说好的来世冤家——本座觉得，今生也不错。居云岫的琴声从远处飘来，清茶在她袖子里探头探脑，偷偷往自己嘴里塞了块点心。连流苏都以完整的模样坐在你身侧——她如今有了实体，眉眼间却还是那副偶尔嫌弃你、偶尔又默默护着你的样子。她安静地看着满座喧哗，唇角带着一丝极淡的笑意。你忽然想起很多年前，仙迹山下那个连饭都吃不饱的少年。他大概怎么也想不到——有朝一日，自己会坐在万界之间，听故人笑闹，看星河长明。你端起酒杯，望着满座熟悉的面孔，忽然觉得，这一路走来所有的苦与累，都在这一刻，值了。你正要饮下那杯酒，夜翎忽然从梁上探下脑袋，声音清脆：哥哥，先别喝！她不知从哪变出一只小泥人，递到你面前——泥人捏的是你的模样，歪歪扭扭，却透着几分憨态：这是我照着你捏的，好不好看？你接过泥人，看着那歪歪扭扭的笑脸，失笑道：好看。夜翎眼睛一亮：那我再捏一个师父，一个明河道长，一个青君姑姑……把大家都捏一遍！满座哄堂大笑。程程化作白狐跳进你怀里，尾巴一卷你的手腕：你那泥人捏得丑死了，回头我教你。夜翎不服气：才不丑！李青君端着酒过来，在你身边坐下，轻声道：还记得当年在离火城头，你说要替我扛一半担子么？你点头：记得。她笑了笑，眼角有细纹，眼底却亮着光：如今南离虽没了，可这满座的故人，大约就是我当年想守的东西。你沉默片刻，忽然道：不。她一愣。你说：你当年想守的，从来不是一座城——你守的是城里的人，是愿意跟你站在一起的人。她怔怔看着你，良久，轻轻嗯了一声。流苏坐在你身侧，安静地看着这一幕，忽然伸手，在你手背上轻轻拍了拍。你转头看她，她没说话，只是笑了笑。那笑容里，有万古的风霜，也有此刻的圆满。宴至深夜，众人都有些醉意。程程化作白狐窝在你膝上打盹，尾巴时不时轻轻扫一下；夜翎趴在梁上，抱着啃了一半的灵果睡着了，口水都快流下来；明河靠在廊柱边，难得没有急着走，闭着眼，像是睡着了，又像只是在听风。你轻手轻脚起身，怕惊动他们，谁知刚一动，程程便醒了，迷迷糊糊道：去哪？你低声道：透透气，就回来。她嗯了一声，又蜷回去睡了。你走出殿外，昆仑的夜风带着雪山的清冽。你抬头望天——星河如水，万界的光都在同一片星空下安静地亮着。你忽然想起很多年前，在仙迹山下的那个夜晚，你也是这样一个人站在院子里看星星。那时候你什么都没有，只有一腔不知天高地厚的热血。如今你什么都有了——有故人，有灯火，有这一路走来的故事。可你发现，那份看星星时的心境，却一直没有变。身后传来脚步声。你回头，是流苏。她走到你身边，与你并肩站着，没有说话。你们就这样静静地站着，看着星河在头顶缓缓流淌。良久，她忽然道：好看么？你点头：好看。比三生石上的前世今生，都好看。她没有答话，只是轻轻嗯了一声。夜风拂过，吹动你们的衣袂与发丝。万界灯火，星河长明。这一刻，人间值得。',opts:[

  {k:'B',tag:'看灯',c:'#6FA698',tx:'独自登高，看这万界灯火',hint:'影响：道心+2；心有所悟',run:()=>{S.six.道心=clamp(S.six.道心+2,1,20);log('红尘卷·终卷','你没有留在席间，独自登上了昆仑之巅。脚下是人间万家灯火，远处是天界宫阙微光，幽冥的忘川、妖城的狐火、北冥的极光——万界的光，都在同一片星空下安静地亮着。流苏不知何时飘到你身边，轻声道：“好看么？”你点头：“好看。比三生石上的前世今生，都好看。”');}},
  {k:'C',tag:'许愿',c:'#A98FD9',tx:'向流苏许一个“来日方长”的约',hint:'影响：流苏好感+2；温情收尾',run:()=>{rdLove('流苏',2);log('红尘卷·终卷','席散时，你忽然叫住流苏：“喂——等诸界都安顿好了，我带你去凡间住一阵子吧。教你钓鱼，教你赶集，教你看戏。”流苏挑眉看你：“就这？”你笑：“还有——教你像个人一样，好好活着。”流苏怔了怔，许久，轻声答：“……一言为定。”');}},
]},
{t:'终幕 · 创世纪',meta:'终幕抉择：天已补全，道已在身——你选择成为怎样的“后来者”',scene:'万界宴罢，诸界强者各自归位。你独自站在昆仑之巅，看星河在脚下缓缓流淌——人间万家灯火如碎金，妖城狐火如流萤，幽冥忘川泛着幽幽的蓝，北冥的极光在天边明灭，天界的宫阙在云海深处若隐若现。万界的光，都在同一片星空下安静地亮着。流苏与你并肩而立，夜风拂动她的衣袂与发丝。她忽然轻声问：想好了么——以后的路，怎么走？你望着万界灯火，想起这一路：仙迹山下的懵懂少年、南离城头的银枪与酒、妖城的狐与蛇、仙宫的琴与茶、幽冥的灯、北冥的雪、天界的门……还有那个永远在识海里念叨你的白玉小人。你想起李青君在城头等你归来的背影，想起夜翎扑棱着翅膀喊哥哥的样子，想起程程化作白狐钻进你怀里的温度，想起孟轻影那句来世还做冤家，想起明河低眉垂眼间的一缕温柔，想起居云岫画里藏着的那个人。风起，吹动你的衣袍。你忽然笑了：路怎么走不重要——重要的是，这一路走来，我从来没有后悔过。流苏也笑了，笑意在星光下格外柔和：那便好。往后万界，任你逍遥。远处，第一缕晨光刺破云海，洒在昆仑之巅——新的一天，新的世界，新的故事，正缓缓展开。你望着那缕晨光，忽然觉得，这万古的追问、千山的跋涉、百战的硝烟，都在这道光里，有了最圆满的答案。你转身，朝山下走去——那里有等你的人，有暖着的酒，有你用一生守护的人间烟火。你走下山时，天光已经大亮。昆仑的山道上，不知何时开满了不知名的野花，露珠在花瓣上滚着，晶莹剔透。你走了没多远，忽然听见身后传来一阵翅膀扑棱声——夜翎追了上来，怀里抱着那包没吃完的灵果，气喘吁吁：哥哥！你等等我！你说：你怎么来了？她理直气壮：师父说，你去哪我就去哪！你回头望了一眼昆仑之巅——程程化作白狐蹲在山石上，远远望着你，没有追来，只是朝你挥了挥尾巴。你心头一暖，揉了揉夜翎的发顶：走吧，带你回家。下山的路很长，晨光却越来越亮。夜翎叽叽喳喳地说着妖城的趣事，说程程师父最近又跟鹰厉斗嘴了，说沙雕杠精石头学会了新把戏……你听着，时不时应一声，忽然觉得，这人间烟火，比任何道法都要让人心安。路过一处山涧时，你停下来，掬了一捧清水洗脸。水面上倒映着你的脸——眉眼间早已没有当年那个懵懂少年的青涩，却也不算老。你看着水中的自己，忽然想起三生石上那些流转的光影：端坐云端的神祇、仗剑人间的侠客、挑灯夜读的书生……原来每一世的你，都在走同一条路。你笑了笑，站起身来。夜翎在不远处喊：哥哥，快走啦！再不走，午饭该赶不上了！你应了一声，大步跟上她的脚步。晨光洒在你身上，温暖而明亮。归途还很长，可你心里清楚——无论走多远，总有一盏灯，会为你亮到天明。你回头最后望了一眼昆仑之巅——流苏还站在峰顶，衣袂飘飘，见你回头，远远朝你挥了挥手。你没有喊她，只笑了笑，也挥了挥手。有些话不必说出口——来日方长，她总会跟上来，像这一路走来的每一次那样。夜翎在身前蹦蹦跳跳地催：哥哥！快些！太阳要晒屁股啦！你应了一声，大步跟上去。春风拂过山道，吹落满树桃花，纷纷扬扬，像一场温柔的雪。你忽然想起仙迹山下的那个黄昏——少年站在村口，望着红霞缭绕的仙迹山，心里想着：山那边，是什么？如今你终于知道答案了——山那边，还是山；可每翻过一座山，都有人在等你。这就是问道长生，最好的样子。',opts:[
  {k:'A',tag:'合道',c:'#C9A45C',tx:'以身补全天道裂隙，与天地同寿',hint:'影响：大结局「道我合一 · 与天同寿」',run:()=>{log('红尘卷·终卷','你最后看了一眼流苏，又看了一眼脚下的万界灯火：“替我……看着它们。”你化作一道光，补入那道裂隙。裂隙弥合的刹那，天地间响起一声钟鸣——万道齐贺。人间山野间，一个牧童忽然指着天空说：“娘，天好亮。”流苏站在原地，很久很久，才轻轻道：“……傻子。”眼角却有一滴泪，缓缓滑落。');rd7Ending('道我合一');}},
  {k:'B',tag:'立盟',c:'#7FA8C9',tx:'留在诸界之间，做那个牵线立约的人',hint:'影响：大结局「万界同盟 · 左天帝右人皇」',run:()=>{log('红尘卷·终卷','你没有去合道，也没有去称尊。你成了诸界之间那个“爱管闲事”的枢纽——天界要开新门，人间要通商路，幽冥要渡魂，妖城要联姻……都来找你。李无仙登基那日，她望着你，眼眶微红：“先生，无仙做到了。”你笑着点头：“往后人间的事，人间自己说了算——这是你赢来的。”');rd7Ending('万界同盟');}},
  {k:'C',tag:'归隐',c:'#D88FA5',tx:'回到人间故土，与故人共守烟火',hint:'影响：大结局「相见欢 · 红尘圆满」',run:()=>{log('红尘卷·终卷','你没有当天帝，也没有合道。你在南离新城外的小院里住了下来，种了一院桃花。程程化作白狐赖在藤椅上，夜翎隔三差五从妖城溜出来蹭饭，明河路过时会进来喝盏茶，孟轻影总爱翻墙送酒。某个午后，你躺在桃花树下，流苏坐在你身侧翻书。你忽然说：“我好像……圆满了。”流苏头也不抬：“早圆满了——从你踏进仙迹山那天起。”');rd7Ending('相见欢');}},
  {k:'D',tag:'传道',c:'#A98FD9',tx:'立道统传万世，让问道之火不熄',hint:'影响：大结局「问道长存 · 万世之师」',run:()=>{log('红尘卷·终卷','你把毕生所学编成一部《问道书》，放在仙宫与人间的交界处，任人参阅。有人劝你：“法不可轻传。”你摇头：“道若只传几人，还算什么道。”许多年后，一位凡间老农靠它修成金丹，在田埂上热泪盈眶；一千年后，你的徒子徒孙遍布诸界。他们不知道你的名字，却都知道——曾有一个人，把道门向天下敞开。');rd7Ending('万世师');}},

 '北冥归心':{title:'北冥归心 · 双王镇渊',review:'你助羽裳与安安将北冥魔渊镇入新序——混沌道则不再暴走，北冥魔物有了自己的王法。',text:'北冥的极夜尽头，羽裳与安安并肩站在魔渊之巅。羽裳冷着脸把一枚魔纹令按进你掌心：“北冥认你这个朋友——下回再来，别客气，直接打上门。”安安在旁边笑得温温柔柔：“她是说，欢迎常来。”你握着那枚冰凉却灼烫的令牌，望着两尊新王的背影，忽然觉得：这世上的凶地，也不全是凶的。',give:()=>{S.reputation+=30;S.hpMax+=60;S.hp+=60;S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='北冥镇渊令'))S.fashu.push({n:'北冥镇渊令',elem:'冰',power:42,mp:20,系:'宝'});}},
 '万象归流':{title:'万象归流 · 轮回之主',review:'你助孟轻影斩却悲愿恶念，她以鸑鷟之身坐镇六道，成为真正的轮回之主——万象森罗，终归有序。',text:'悲愿恶念在紫火中湮灭的刹那，整个三途都为之一静。孟轻影收拢羽翼，落地时脸色苍白，却笑得张扬：“谢了——这笔账，本座记在轮回盘上，来世还你。”你失笑：“你倒是会许愿。”她难得认真：“不是许愿。若真有来世，我还想跟你做这一世这样的……冤家。”',give:()=>{S.merit+=8;S.six.神识=clamp(S.six.神识+3,1,20);S.gongfa=S.gongfa||[];if(!S.gongfa.find(g=>g.n==='六道轮回经'))S.gongfa.push({n:'六道轮回经',grade:'仙阶'});}},
 '天枢共道':{title:'天枢共道 · 门开一线',review:'曦月与鹤悼放下了旧怨，天枢神阙重开道门。你在众妙之门的残片上，看见了通往太清的那条路。',text:'紫微殿中，鹤悼把那块被争了万年的石墩轻轻推到你面前：“参吧。门这东西，本就是给人悟的。”曦月站在殿门处，淡淡道：“莫要学我们。”你盘坐于石墩之前，识海深处仿佛有古门洞开——天地的纹理、道的脉络，第一次如此清晰。你这一坐，便是四十九日。',give:()=>{S.six.悟性=clamp(S.six.悟性+4,1,20);S.six.道心=clamp(S.six.道心+2,1,20);S.reputation+=25;}},
 '开天问道':{title:'开天问道 · 三生石前',review:'凤皇为你指了开天之路。三生石前，你看见了前世今生——原来你与这方天地的缘分，早在创世之前便已埋下。',text:'三生石上的光影流转，你看见了许多个自己：有端坐云端的神祇，有仗剑人间的侠客，有挑灯夜读的书生，还有……一个在混沌初开时，轻轻拨动第一缕光的影子。醒转时，凤皇垂眸看你：“看见什么了？”你沉默良久：“看见我为何而来。”',give:()=>{S.six.道心=clamp(S.six.道心+3,1,20);S.six.仙缘=clamp(S.six.仙缘+3,1,20);S.flags.开天路=true;}},
 '云游北冥':{title:'云游北冥 · 极夜有灯',review:'你没有与任何一方立约。北冥的极夜很长，你在那里看够了星河，也帮够了一些值得帮的魔物。',text:'北冥的极夜有极光，也有魔物们围炉的灯火。你替被欺负的小魔物讨过公道，给迷路的雪妖指过方向，还被一头老冰魔拉着喝了三天三夜的酒。临别时那老冰魔红着眼眶：“外乡人，你比那些高高在上的魔主……像个人。”你笑了笑：“魔主也是人变的。”',give:()=>{S.six.道心=clamp(S.six.道心+2,1,20);S.merit+=4;}},
};

{t:'海外 · 寻木城',meta:'强制节点：海外寻木城，羽人族的树洞城邦',scene:'北冥与幽冥的消息接踵而来，你在东海之极寻到一处不载于舆图的城邦——寻木城。整座城建在一株撑天巨木之上，树干粗得望不见两边，树冠如云盖般遮天蔽日，无数藤蔓与枝叶间挂着灯火，远远望去像一颗浮在云海上的巨大灯笼。城门是个开在半空的树洞，垂着层层藤帘，不会飞的人根本进不去——你在城下仰头看了半晌，只好捏了个御风诀，踏着树根盘错的台阶一级一级走上去，惹得几个巡天的羽人频频侧目。城中居民皆是羽人：背后生着各色羽翼，性情高傲，喜洁，爱穿白，连街边的铺面都擦得一尘不染，挂着素白的幌子。你刚入城便撞上一队羽人卫士，为首的女子衣饰华贵，眉目如画，额头悬着一枚流光溢彩的额饰，衬得那张脸更添三分清冷——羽人族的圣女羽裳。她打量你片刻，目光在你身上那件沾过风尘的衣袍上停了停，声音淡淡：人族修士？来我羽人领地，所为何事？你正欲答话，远处忽然传来一声清越鹤鸣——一名素衣道姑缓步而来，蓝白道袍，素色道巾，正是明河。她见你，微微一怔，随即低声道：……你也来了。羽裳看看她又看看你，眉头微挑：原来是道长的故人。明河颔首：故人，也是道友。她说着，目光在你脸上落了一瞬，又移开，声音里带着一丝不易察觉的久别重逢的温意：多年不见，道友风采更胜往昔。你笑了笑，正要客套，羽裳却已转身，声音淡淡飘来：既是道长的故人，那便不算外人。随我来吧——树上的茶，比地上的好喝。她走在前面，雪白的羽翼在日光下微微泛着光，像一捧会移动的月光。你与明河并肩跟在她身后，头顶是层层叠叠的枝叶与灯火，脚下是踩上去微微晃动的藤桥。寻木城的风从叶隙间穿过，带着草木与露水的清甜。你忽然觉得，这趟北冥之行，似乎比预想中要热闹些。羽裳将你们引至一处悬在树冠半腰的茶室——四壁通透，只有几根藤蔓虚虚绕着，风从四面八方涌进来，吹得茶盏里的水汽袅袅散开。她亲手沏了一壶羽人特有的百花露，茶汤清冽，入口带着一丝极淡的甜。你赞了一句好茶，她眉头微动，算是领了情。席间你问起北冥近况，羽裳沉吟片刻，才道：北冥魔渊近年躁动，有魔主欲证混沌之道，四处吞噬异种道则——羽人族的白凤血脉、幽冥的冥河之意，都在它的食谱上。她说着，指尖轻轻摩挲着额间那枚额饰，眼底掠过一丝忧色：我族长老占过一卦，卦象凶险，说北冥之劫若起，天下皆危。明河捧着茶盏，接口道：贫道此来，便是想请羽人援手——共镇魔渊。羽裳没有立刻答话，目光在你与明河之间转了转，半晌才道：道长于我有恩，你引来的故人，我信得过。可她话锋一转，声音沉了几分：只是北冥冰王那边……两族联姻的事，已经议了半年。若要与魔渊开战，便需先稳住北冥。你听得心头一动，隐约明白了这趟寻木城之行，正撞上一桩天大的事。你放下茶盏，望着窗外寻木城层层叠叠的灯火，心里那根弦绷了起来。北冥冰王、羽人圣女、魔渊异动——三件事像三条线，正悄悄拧成一股。你正要细问，窗外忽然传来一阵清越的鹤鸣——那是羽人族的迎宾号。羽裳起身，理了理衣摆：冰王的迎亲队伍到了。她顿了顿，目光在你脸上落了一瞬：秦先生若不嫌弃，今夜喜宴上，可以坐得近些——北冥的贵客们，大约也想见识见识，能镇裂谷、平妖城的人族修士，是何等模样。你听出她话里的试探，也不点破，只笑着拱手：圣女盛情，那便叨扰了。羽裳微微颔首，转身离去时，雪白的羽翼在灯光下掠过一道流光。明河望着她的背影，低声道：她待你，倒比待旁人客气些。你笑了笑：大概是看在你这个引荐人的面上。明河没有接话，只低头抿了一口茶，也不知在想些什么。',opts:[
  {k:'A',tag:'叙旧',c:'#D88FA5',tx:'与明河并肩入城，听她说北冥之变',hint:'影响：明河好感+2；得北冥异动情报',run:()=>{rdLove('明河',2);log('红尘卷·六卷','明河引你入城，一路说起北冥的怪事：北冥魔渊近年躁动，有魔主欲证“混沌之道”，四处吞噬异种道则，羽人族的白凤血脉、幽冥的冥河之意，都在它的食谱上。她眉间难得凝着一丝忧色：“贫道此来，便是想请羽人援手——共镇魔渊。”');}},
  {k:'B',tag:'查证',c:'#7FA8C9',tx:'先自行探查寻木城虚实',hint:'影响：窥见羽人秘辛（白凤祖脉）',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·六卷','你在寻木城的典籍阁泡了三日，翻出一卷残史：羽人族先祖是白凤血脉，曾为远古某位大神执掌“北冥之渊”，后迁居海外。卷末有一行小字：凤鸣于野，其羽为仪；渊魔欲起，白凤当醒。你合上残卷，若有所思。');}},
  {k:'C',tag:'送礼',c:'#A98FD9',tx:'以一枚妖纹结好羽裳圣女',hint:'影响：羽裳好感+2；打开羽人通路',run:()=>{log('红尘卷·六卷','你取出一枚从裂谷妖城带出的乘黄妖纹，递到羽裳面前：“一点薄礼，聊表敬意。”羽裳本欲冷拒，目光落在那妖纹上却微微一凝：“乘黄之纹……你是妖城的人？”她沉吟片刻，到底接了过去，语气缓了几分：“既是妖城旧友，那便算是半个客人。随我来吧。”');}},
]},
{t:'婚礼 · 道魔并肩',meta:'强制节点：羽裳圣女大婚之夜，风波陡起',scene:'原来你来得正巧——今夜是羽裳圣女与北冥冰王联姻的大婚之夜，两族联姻意在共镇魔渊。寻木城一夜之间挂满白羽与冰晶，灯火通明，巨木的每一根枝丫上都系着祝福的丝带，风一吹，满城飘摇如雪。宴席设在高处的穹顶大殿，四面无墙，夜风与星光一同涌进来。北冥来的宾客通体裹着寒气，羽人宾客则衣白如雪，两族分坐两侧，气氛说不上热络，却也还算客气。你与明河被安排在羽人一侧的末席，本该是你们说正事的机会——魔渊的异动、镇渊台的构想，都还没来得及开口。可席间忽然多了一道黑影——孟轻影端着酒杯不请自来，足尖在穹顶边缘一点，翩然落在殿中，笑吟吟道：好热闹。北冥与羽人结亲，怎么不请我万象森罗？她这一现身，满殿气氛顿时一紧——北冥冰王麾下的侍卫已按住了刀柄，羽人的卫士也纷纷起身。孟轻影却浑不在意，端着酒杯在满殿目光里走了一圈，目光落在你身上，意味深长地停住：哟，秦大监察也在——那今晚这洞房，怕是要改改章程了。羽裳的脸一下子红到耳根，霍然起身：孟轻影！你胡说什么！明河捧着茶盏默默往旁边挪了挪，低声道：贫道……纯路人。你夹在三个女人之间，只觉得这北冥的风雪，都没这宴席上的暗流冷。满殿的目光在你、羽裳、孟轻影之间来回打转，连北冥冰王都多看了你两眼，眼底带着一丝探究。你端着酒杯，进也不是退也不是，忽然有些后悔——这趟浑水，怎么就越蹚越深了呢。你深吸一口气，干咳一声，把话题硬生生掰回正事：两族联姻为的是镇魔渊——诸位若有心，不如先听我一句：那魔主要证混沌道，吞的可不是一家一族的血脉。今夜先议正事，旁的花边，留待魔渊平了再说不迟。满殿静了一瞬，北冥冰王率先抚掌而笑：说得好。秦先生之名，本王亦有耳闻——镇裂谷、平妖城，是条汉子。他这话一出，殿中剑拔弩张的气氛顿时松了大半。羽裳哼了一声，总算没再炸毛，只瞪了孟轻影一眼。孟轻影却浑不在意，端着酒杯在你身边坐下，似笑非笑：倒是个会说话的。她压低声音，凑到你耳边：喂，你到底是来镇魔渊的，还是来当和事佬的？你端起酒杯抿了一口：两样都沾。她嗤笑一声，却也没再拆台。那一夜，两族盟约的草案在酒席间草草立了初稿——北冥出寒渊精铁，羽人出白凤之羽，共筑镇渊台。散席时羽裳叫住你，声音难得温和了几分：今夜……多谢你解围。你摆摆手：客气什么，我也是为了魔渊的事。她望着你，忽然轻轻笑了一下，像冰面下透出的一缕光：你这个人，倒和传闻中不太一样。你被她那句和传闻中不一样说得一愣，正要追问传闻里自己是个什么形象，孟轻影却端着酒杯晃了过来，往你身边一坐，笑吟吟道：聊什么呢这么投缘？羽裳白了她一眼：与你无关。孟轻影也不恼，自顾自抿了一口酒，忽然压低声音，正色道：说正经的——我今晚来，不是为了捣乱。北冥魔渊那边，我的人探到消息，那魔主似乎已察觉两族要筑镇渊台，正暗中调集冰魔大军。羽裳神色微变：消息可准？孟轻影难得收起玩世不恭的模样：我的人用命换来的，你说准不准？羽裳沉吟片刻，看向你：秦先生，你看此事……你放下酒杯，心里已飞快地转过几个念头：若魔主当真要先下手，那婚礼便是它动手的最佳时机——两族首领齐聚一堂，一网打尽。你沉声道：既如此，我们便给它来个将计就计——婚礼照常，暗地里加派人手，布下天罗地网。它若敢来，便让它有来无回。羽裳与孟轻影对视一眼，都从对方眼底看到了一丝认同。那一夜，一场婚礼，暗地里已变成一张大网。',opts:[
  {k:'A',tag:'解围',c:'#C4675C',tx:'站出来岔开话头，把话题引回镇魔大计',hint:'影响：羽裳好感+2、孟轻影好感+1',run:()=>{rdLove('羽裳',2);rdLove('孟轻影',1);log('红尘卷·六卷','你干咳一声，把话题硬生生掰回正事：“两族联姻为的是镇魔渊——诸位若有心，不如先听我一句：那魔主要证混沌道，吞的可不是一家一族的血脉。今夜先议正事，旁的花边，留待魔渊平了再说不迟。”羽裳哼了一声，总算没再炸毛。孟轻影把玩着酒杯，似笑非笑：“倒是个会说话的。”');}},
  {k:'B',tag:'拱火',c:'#8B6FA8',tx:'看热闹不嫌事大，笑而不语',hint:'影响：恶名+1；看修罗场',run:()=>{S.jianghu.evil=(S.jianghu.evil||0)+1;log('红尘卷·六卷','你默默给自己斟了杯酒，决定装死。孟轻影与羽裳你来我往，句句机锋，明河时不时被拖下水，一脸“贫道只是路过”的表情。你看着这场大戏，忽然理解了什么叫三个女人一台戏——不对，是四个人。');}},
  {k:'C',tag:'议约',c:'#7FA8C9',tx:'趁乱与两族敲定镇魔盟约细节',hint:'影响：盟约推进；为后幕铺路',run:()=>{log('红尘卷·六卷','趁着满堂目光都被两个女人吸引，你拉着两族长老把镇魔盟约的条款一条条敲定——羽人出白凤之羽，北冥出寒渊精铁，共建一座镇渊台。等羽裳和孟轻影吵完，盟约已尘埃落定。羽裳看着你递来的盟书，半晌无语：“……你倒会挑时候。”');}},
]},
{t:'北冥 · 冰魔索棒',meta:'强制节点：北冥魔渊，冰魔觊觎“棒棒”',scene:'镇渊台动工那日，北冥魔渊深处忽然涌出无尽冰雾——白茫茫一片，遮天蔽日，连日光都透不进来。冰雾中传来沉闷的脚步声，一下一下，震得地面都在颤抖。紧接着，一头山岳般的冰魔首领破冰而出，浑身覆盖着半透明的玄冰，双目如两盏幽绿的灯，声如滚雷：人族修士！把那根狼牙棒交出来！它身后，成百上千的冰魔从冰雾中列阵而出，像一堵堵冰墙，森然林立，寒气逼人。原来那魔主已下令，要取你身上那根棒子——狼牙棒中沉睡的器灵，是它证混沌道缺的最后一块拼图。你低头看了看手里那根陪你走过无数年的狼牙棒——棒身上缠着旧布，布上沾着不知多少年月的风霜，柄端被你握得光滑温润。你忽然笑了。识海里，流苏冷哼道：它想要本座？那声音里带着一丝不屑，又有一丝说不清道不明的意味——像被气笑了。你把它往肩上一扛，迎着漫天冰魔，朗声道：想要它，就拿头来要！话音未落，你迎风而长，衣袍猎猎，身形节节拔高，化作比冰魔还高的巨人，脚下踩碎一片冰原。手中狼牙棒也随之一并变大，粗如山头，棒身上的旧布崩裂，露出底下森然的铁刺。北冥的魔渊之巅，狂风卷着冰屑，你与那冰魔首领隔空对峙——它仰头望着你，幽绿的眼底第一次闪过一丝迟疑。你咧嘴一笑，抡起棒子：来！那冰魔首领也不含糊，怒吼一声，双臂一振，漫天冰刃如暴雨般朝你倾泻而来。你挥棒格挡，冰刃砸在棒身上叮当作响，震得虎口发麻——这畜牲力气不小。你且战且进，寻机一棒轰在它肩头，冰屑飞溅，它却只晃了一晃，反手一爪拍在你胸口，把你震退数丈。你站稳身形，胸口隐隐发闷，心里却越发清明：这冰魔一身玄冰甲胄，寻常攻击破不开它的防御。你凝神细看，忽然发现它玄冰之盾的纹路流转处，有一道极细的裂隙——那裂隙极浅，若非你眼力过人，几乎看不出来，像是一道千年不愈的旧伤。你心头一动，指尖一点，一道灵力涟漪轻轻荡在裂隙上——冰盾竟如积雪般消融，露出底下灰白的本体。冰魔首领目瞪口呆，声音都变了调：这……这不可能！我的冰盾……你怎么会知道那里！你抡棒而上，咧嘴一笑：在下的门道，多了去了。远处，羽裳与那个叫安安的北冥女子同时出手，替你架开两侧扑来的冰魔夹击，让你得以腾出手来，把那首领捶得冰块飞溅。你一棒接一棒，边打边喊：要棒棒？给你啊——你倒是吃啊！北冥魔渊上空，回荡着冰魔首领的怒吼与你的大笑，混成一片。那冰魔首领被你捶得节节败退，玄冰甲胄碎了大半，露出底下灰白色的本体。它怒吼一声，忽然拼着挨你一棒，猛地一把攥住棒身——它竟想夺棒！你心头一紧，棒子里还睡着流苏，岂能让它得手！你低喝一声，灵力猛然灌入棒身，棒上的铁刺骤然亮起一层暗红的光——那是狼牙棒沉睡多年的器灵被激怒的征兆。冰魔首领触到那层暗红的光，惨嚎一声，双手如被烙铁烫过，猛地松开棒子，倒退数丈，眼底第一次浮现出恐惧：那……那棒子里……是什么东西！你抡棒而立，棒身嗡鸣不止，声音冷下去：它是我过命的道友。想抢她——先过我这一关。冰魔首领望着你，又望着你手里那根嗡鸣的狼牙棒，沉默半晌，忽然发出一声低吼，转身遁入冰雾之中：撤！它竟带着麾下冰魔，头也不回地跑了。你握着棒子站在原地，胸口起伏，忽然觉得棒身微微发烫——像流苏在隔着棒身，轻轻应了你一声。你低头看着那根旧棒，低声说：没事，有我在。远处，羽裳与安安收了手，快步走来。安安看着你手里那根嗡鸣未止的棒子，欲言又止。羽裳却直接问：那棒子里……当真住着器灵？你点了点头，没有多解释。她望着你，目光里多了几分说不清道不明的意味，半晌才道：能为一根棒子拼到这个地步的人……难怪它们都说你怪。',opts:[
  {k:'A',tag:'硬撼',c:'#C4675C',tx:'化身巨人，与冰魔首领正面硬撼',hint:'影响：入战（北冥冰魔首领·极凶）',run:()=>{log('红尘卷·六卷','你大步上前，狼牙棒划破冰雾直轰而下。冰魔首领的玄冰之盾在一声脆响中裂开——它根本想不通自己的盾为何会碎，而你的棒子已兜头砸落。远处，羽裳与安安同时出手替你架开两侧的冰魔夹击，让你得以腾出手来，把那首领捶得冰块飞溅：“要棒棒？给你啊——你倒是吃啊！”');startCombat(rdEnemy('北冥冰魔首领',2.5),'rd6Fight');}},
  {k:'B',tag:'破盾',c:'#7FA8C9',tx:'先破其玄冰之盾的窍门，再行反击',hint:'影响：悟性+1；破敌更快',run:()=>{S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·六卷','你看出那玄冰之盾的弱点——盾纹流转处有一道极细的裂隙，正是冰魔千年不愈的旧伤。你指尖一点，一道涟漪轻荡在盾上，冰盾竟如积雪般消融。冰魔首领目瞪口呆：“这……这不可能！”你抡棒而上：“在下的门道，多了去了。”');}},
  {k:'C',tag:'借力',c:'#C9A45C',tx:'引它撞向镇渊台阵纹，借阵困敌',hint:'影响：盟约合力；轻松破局',run:()=>{log('红尘卷·六卷','你且战且退，把冰魔首领引向刚落成的镇渊台。白凤之羽与寒渊精铁铸成的阵纹轰然亮起，将冰魔首领牢牢锁在原地。它怒吼着挣扎，羽裳与安安却已联手压下——北冥魔渊上空，第一场镇渊之战，就此落幕。');}},
]},
{t:'三途 · 万象森罗',meta:'强制节点：万象森罗之劫——孟轻影的因果，轮回盘上的一战',scene:'冰魔败退后，孟轻影忽然拦住你的去路，神色难得凝重，不见平日那副玩世不恭的模样：北冥那魔主不过是幌子。真正的麻烦在幽冥——我当年炼的那张轮回盘，恶念不知何时成了精，自号悲愿，如今已吞下小半个三途，要证轮回之主。她顿了顿，声音低下去：那是我造出来的孽，我去收。你看着她转身要走的背影，忽然开口：一个人去？她头也不回：一个人惯了。你摇了摇头，大步跟上：巧了，我正好闲得慌。她脚步一顿，没有回头，可你分明看见她的肩膀微微松了松。三途路上，怨气如潮，忘川翻涌，两岸的彼岸花都蔫了，像被什么吸走了生气。越往深处走，空气越沉，连呼吸都带着铁锈般的腥涩。那道自称悲愿的身影盘踞于轮回盘之上，周身的恶念几乎凝成实质，化作无数扭曲的面孔在它身周翻涌。它看见孟轻影，竟咧嘴笑了，声音又尖又细，像指甲刮过铁板：你来了？我的……母体。孟轻影的脸色微微一白，随即又恢复那副似笑非笑的模样：哟，长本事了，都敢认亲了。她指尖飞梭一转，声音冷下去：当年炼你的时候，我就该把你丢进忘川里沤烂。悲愿嘿嘿笑着，周身的恶念骤然暴涨：可你舍不得——你舍不得的，我都会替你记着。它说着，无数恶念面孔齐齐转向你：母体，你身后那个人……你的因果里，也有他一份吧？孟轻影没有答话，但她的身周骤然腾起一层幽暗的火焰——那是九幽道的心火，一旦燃起，便是要以命相搏的架势。悲愿恶念咧嘴笑着，周身的恶念凝成漫天炼狱之火，铺天盖地地朝她压来。你正要出手，孟轻影却回头看了你一眼：别动。这是我和它的事。你看着她眼底那点执拗的光，没有上前，却也没有退开——你只是握紧了剑，站在她身后一丈处，替她架开三途的阴风。孟轻影独自迎向悲愿恶念，鸑鷟之翼在炼狱火海中一次次展开又收拢——那对紫羽蔽日、星空之龙盘踞的法相，在她身后明灭不定，像是随时会碎，却又始终没有碎。她与悲愿恶念在轮回盘上缠斗了不知多久，火海一次次漫过她的身影，又一次次被她撕开。你站在阴风里，看着那个向来玩世不恭的魔女，第一次露出近乎狼狈的狠厉——她在斩自己的因果，每一剑都带着血。当最后一声凄啸消散，悲愿恶念化作漫天黑灰落下。孟轻影踉跄落地，半跪在忘川边，脸色白得像纸。你走过去，没有扶她，只是在她身边蹲下来，递过一壶水。她抬头看你，忽然笑了笑，声音沙哑：看够了？你点头：看得很值。她接过水壶，仰头灌了一大口，半晌才低声道：……谢了。这两个字，从她嘴里说出来，比从别人嘴里说出来要沉得多。孟轻影歇了半晌，才撑着身子站起来，走到轮回盘前，望着盘面上那道渐渐消散的黑灰，沉默了很久。你顺着她的目光看去——悲愿恶念已经彻底散了，可轮回盘边缘却留下了一道极浅的裂痕，像一道不肯愈合的旧疤。她伸手抚过那道裂痕，指尖微微发颤：它是我炼的。这道裂痕，也是我留下的。你问：那它还会再长出来么？她摇了摇头：不会了。悲愿是我当年一念之差养出的执念，如今执念已散，轮回盘虽留有裂痕，却不会再滋生出新的恶念。她说着，忽然转头看你，眼底那点脆弱已经收得干干净净，又恢复了平日那副玩世不恭的模样：行了，别用那种眼神看我——本姑娘还没到要人可怜的地步。你笑了笑：谁可怜你了？我是想问你，这轮回盘上的裂痕，要不要我帮忙补。她怔了怔，随即别过脸去，声音闷闷的：……要你多管闲事。可你分明看见，她嘴角微微翘了一下。三途的风从忘川方向吹来，带着彼岸花清苦的气息。她站在风里，忽然轻声说：秦弈。你嗯了一声。她说：等轮回盘补好那天……请你喝酒。你笑了笑：那我等着。',opts:[
  {k:'A',tag:'助魔',c:'#8B6FA8',tx:'助孟轻影斩却悲愿，坐镇六道',hint:'影响：入战（悲愿恶念·至凶）；成就「万象归流」',run:()=>{log('红尘卷·六卷','你纵身跃入三途。悲愿恶念化作漫天炼狱之火扑来，孟轻影却在火海中回头看你一眼：“多管闲事。”话音未落，她额间火纹彻底绽放——鸑鷟法相冲天而起，左边紫羽蔽日，右边星空之龙盘踞，六道法则在她掌中重排：“破！”你趁机一剑钉住悲愿恶念的命门。');startCombat(rdEnemy('悲愿恶念·轮回劫',2.7),'rd6Boss');}},
  {k:'B',tag:'旁观',c:'#6FA698',tx:'只替她掠阵，看她亲手了结因果',hint:'影响：孟轻影好感+2；护其道果',run:()=>{rdLove('孟轻影',2);log('红尘卷·六卷','你没有插手，只在她身后为她架开三途的阴风。孟轻影独自迎向悲愿恶念，鸑鷟之翼在炼狱火海中一次次展开又收拢——那是她的因果，终究要她自己了结。当最后一声凄啸消散，她踉跄落地，回头看你，忽然笑了笑：“看够了？”你点头：“看得很值。”');}},
  {k:'C',tag:'护道',c:'#A98FD9',tx:'先护住三途中被殃及的游魂',hint:'影响：功德+6；超度万魂',run:()=>{S.merit+=6;log('红尘卷·六卷','孟轻影与悲愿恶念打得天崩地裂时，你张开道域，将三途中被余波殃及的千万游魂护在身后。那一夜你诵了三千遍安魂咒，直到天际泛起灰蓝的幽光。孟轻影战后瘫坐在你身边，看着你发白的嘴唇，难得柔了声气：“……谢了。这些魂，我欠他们的。”');}},
]},
{t:'忘川 · 幽皇旧事',meta:'强制节点：忘川之源，幽冥最古的秘辛',scene:'悲愿既除，你与孟轻影循着忘川一路下行，直抵幽冥最深的源头。越往下走，忘川的水越静，两岸的彼岸花也越发稀疏，到最后只剩灰蓝的幽光与亘古的寂静。灰蓝的幽光里，一道近乎透明的身影静静坐在忘川之畔，膝上摊着一册无字的古卷，指尖缓缓摩挲着卷面，像在读着什么看不见的文字——他自称幽皇，是幽冥初开时第一任轮回之主，已在忘川边坐了不知多少万年，久到连忘川的水都记住了他的影子。你们来到他面前时，他缓缓抬起头，目光温和得像一潭死水，声音也轻飘飘的：你们来晚啦。那个叫悲愿的小家伙，不过是我当年一念之差留下的影子。真正的轮回盘，早在太古便被锁在此处。他抬手，忘川深处缓缓浮起一枚流光溢彩的古盘——盘面流转着万千幽光，仿佛有无数魂魄在其中轮回往复，发出极轻极远的声音，像潮汐，又像叹息。他把古盘轻轻推向你们：拿去。轮回有序，方有生机——这是我等了太久的一件事。你伸手接过轮回盘，入手温凉，一股沉甸甸的分量压在掌心，像接过了万古的因果。你正要道谢，幽皇却又开口，目光在你身上停了许久，带着一丝深远的探寻：你身上那道器灵……气息很旧。旧到，我仿佛在开天之前见过。你心头一震，正要追问，识海里那道白玉小人却罕见地沉默着，像一潭深不见底的水，没有泛起一丝涟漪。你斟酌着措辞，缓缓道：前辈说她的气息旧——旧到什么程度？幽皇没有立刻答话，指尖摩挲着膝上那册无字的古卷，目光落在虚空中某处，像在看一段极远的旧事。良久，他才轻声道：开天之前，混沌之中曾有两道意识相伴而生——一道求序，一道求道。它们一同在混沌里沉浮了不知多少万年，看着混沌中第一缕光如何亮起，第一滴水如何凝结，第一缕风如何流动。后来天地初开，它们各奔东西——一道去建了轮回与秩序，一道去追寻道的尽头。他顿了顿，抬眼看向你，目光温和却深邃：你那位器灵，气息与求道那道，很像。你心头大震，识海里流苏却依旧沉默着。你几乎能感觉到她蜷在识海深处，像一只受伤的兽，把自己藏得严严实实。幽皇看着你，声音愈发和缓：不必追问她。有些事，她不说，自有不说的道理——等她自己愿意开口时，你自然就明白了。他说完，身影已渐渐淡去，只留下一声极轻的叹息：轮回有序，方有生机。吾去矣——愿后来者，胜于吾。他的身影散作点点幽光，没入忘川，两岸的彼岸花仿佛感知到什么，齐齐轻轻摇曳，像是在为这位枯坐万古的轮回之主送行。你握着轮回盘站在原地，心里翻涌着无数念头。识海里，流苏终于开口，声音很轻，带着一丝说不清道不明的涩意：别问了。有些事……等此间事了，我再慢慢告诉你。你嗯了一声：好，不急。她沉默片刻，又补了一句：……谢谢。你笑了笑，没有答话，只把轮回盘小心收好。忘川的水在脚下静静流淌，孟轻影倚在岸边一块石头上，望着你这边，难得没有出声打扰——她只是静静看着，眼底有一种说不清道不明的神色，像在替谁心疼，又像在替谁欣慰。你走过去时，她忽然道：她不肯说的事，你就不问了？你说：她不想说，我便等她愿意说。孟轻影看了你半晌，忽然轻轻嗤笑一声：痴人。她别过头去，声音却低了下来：……可这世上，愿意这样痴的人，本就不多。你笑了笑，没有接话。忘川的风从上游吹来，带着彼岸花清苦的气息，与轮回盘上那抹流转的幽光，一同融进灰蓝的夜色里。',opts:[
  {k:'A',tag:'受盘',c:'#A98FD9',tx:'接掌轮回盘，还幽冥一个清明秩序',hint:'影响：得轮回盘（道行大进）；幽皇馈赠',run:()=>{S.gongfa=S.gongfa||[];if(!S.gongfa.find(g=>g.n==='幽冥轮回盘'))S.gongfa.push({n:'幽冥轮回盘',grade:'仙阶'});S.six.道心=clamp(S.six.道心+2,1,20);log('红尘卷·六卷','轮回盘入手的刹那，忘川之水忽然倒流——万古的怨气、执念、因果，在盘面上织成一幅流转的星图。幽皇看着你，终于露出一丝极淡的笑：“好。幽冥等了万古，总算等来一个肯接盘的人。”他化作点点幽光，散入忘川：“吾去矣——愿后来者，胜于吾。”');}},
  {k:'B',tag:'问旧',c:'#7FA8C9',tx:'追问流苏的来历与“开天之前”的旧事',hint:'影响：洞悉流苏身世线索（关键）',run:()=>{S.flags.流苏身世线索=true;S.six.悟性=clamp(S.six.悟性+1,1,20);log('红尘卷·六卷','你问起流苏的来历。幽皇沉默良久，指腹摩挲着无字古卷：“开天之前，混沌之中曾有两道意识相伴而生——一道求序，一道求道。后来天地初开，它们各奔东西……你那位器灵，气息与‘求道’那道，很像。”你心头一震，识海里流苏却罕见地没有接话，只沉默得像一潭深水。');}},
  {k:'C',tag:'安魂',c:'#6FA698',tx:'以轮回盘超度忘川两岸万古游魂',hint:'影响：功德+10；忘川为之一净',run:()=>{S.merit+=10;log('红尘卷·六卷','你盘坐忘川之畔，将轮回盘悬于头顶。盘面转动间，两岸万古的游魂如百川归海，一道道投往该去的归处。那一夜忘川的水声都温柔了许多。幽皇静静看你，忽然轻声说：“心善至此，难怪能走到这里。”');}},
]},
{t:'混沌 · 吾即混沌',meta:'强制节点：混沌凶魂复苏，道则争夺战',scene:'轮回盘归位那夜，北冥最深处忽然传来一声低沉的轰鸣——像大地的心脏被什么东西狠狠攥了一下。上古被镇压的混沌凶魂破封而出了。它无形无相，时而化作吞天巨口，一口咬碎半座山头；时而散作漫天混沌气，灰蒙蒙一片，所过之处，连道都像被它吞进口中——花草枯萎，山石崩解，连光线都扭曲起来。流苏的声音骤然绷紧，罕见的急促：它要证混沌神格——若让它吞尽此界道则，万物皆会归于混沌！你立于北冥之巅，狂风卷着冰屑与混沌气扑面而来。你体内三种本源之力缓缓流转：混沌火、太一水、北冥冰——火与冰、极热与极寒，在你体内前所未有地交融，经脉里像有两条巨龙在纠缠翻涌，痛得你几乎要弯下腰去。可你没有退。你咬着牙，把三股力量一点一点往一处拧。流苏的声音在识海响起，带着一丝难以置信的颤抖：混沌初开，烈火焚天；阴阳遽变，化为极寒；积雪化水，万物初生……你竟真把这条路走通了。你缓缓睁开眼，眸中仿佛有日月轮转，声音却平静得出奇：不是它要证混沌——是我。那团混沌凶魂仿佛感知到你的气息，骤然收缩成一点，又猛然炸开，发出一声不似人声的嘶吼，铺天盖地地朝你压来。你立于狂澜之中，衣袍猎猎，缓缓抬起了手。你体内的混沌火、太一水、北冥冰三种本源之力同时绽放——混沌火焚尽邪气，太一水涤荡污浊，北冥冰镇住翻涌的混沌。三股力量在你掌中交织成一道漩涡，与你周身的混沌气遥相呼应。那凶魂的嘶吼声里第一次带上了惊惧，它似乎没想到，一个活人竟能同时驾驭三种本源。你迎着漫天的混沌气，一步一步向前走去——每走一步，混沌气便消融一分。凶魂化作无数锁链缠来，你挥手震断；化作吞天巨口咬来，你一拳轰散。你于混沌最深处睁开眼，眸中日月轮转，声音却平静得像一潭深水：万法归一，吾即混沌。那一瞬，你周身的三种本源之力彻底交融，化作一道混沌色的光柱冲天而起，贯穿天地。凶魂在光柱中嘶吼、挣扎、消融，最终化作一缕青烟，散于天地之间。北冥之巅，风停雪住，天光乍破。你收拳而立，衣袍猎猎，只觉得体内那道混沌色的本源之力沉甸甸地悬在丹田，像一颗新生的星辰。识海里，流苏的声音轻轻响起，带着一丝说不清道不明的复杂：……你做到了。你笑了笑：嗯，我做到了。你收功而立时，北冥的雪原已经安静下来——混沌凶魂散尽后，连常年呼啸的北风都歇了。你低头看着自己的手，掌心隐隐透着一层混沌色的光，又渐渐敛去。你握了握拳，感觉体内那道本源之力沉甸甸的，像揣着一整个初开的世界。远处传来脚步声——羽裳、安安、明河、孟轻影，几人先后赶到，看见你完好无损地立在峰顶，都松了一口气。羽裳上下打量你，难得没有冷言冷语，只道：……你没事就好。安安温温柔柔地补了一句：方才那道混沌光柱冲天而起时，我们都以为你要跟那凶魂同归于尽了。孟轻影哼了一声：我就说这小子命硬，死不了。明河没有说话，只是远远看着你，眼底有一丝不易察觉的安心。你看着她们，忽然觉得，这一路走来，你早已不是当年那个孤身闯南离的散修了——你的身后，不知何时，已经站了这么多愿意为你担心的人。你咧嘴一笑：放心，我命硬。北冥的风雪吹过峰顶，带着劫后余生的清冽。你抬头望了一眼渐渐放晴的天穹，忽然想起那道天外之影——混沌凶魂只是开胃菜，真正的硬仗，还在后头。你握紧拳头，眼底没有惧色，只有一种跃跃欲试的光。',opts:[
  {k:'A',tag:'镇浑',c:'#C4675C',tx:'以身合道则，正面镇杀混沌凶魂',hint:'影响：终局BOSS战（混沌凶魂·至凶）',run:()=>{log('红尘卷·六卷','你化作一道贯穿天地的光，撞入那团混沌气之中。凶魂发出不似人声的嘶吼，万千混沌气化作锁链缠来——而你体内的三种本源之力齐齐绽放，混沌火焚尽邪气，太一水涤荡污浊，北冥冰镇住翻涌的混沌。你于混沌最深处睁开眼：“万法归一，吾即混沌。”');startCombat(rdEnemy('混沌凶魂',3.0),'rd6Boss');}},
  {k:'B',tag:'引劫',c:'#7FA8C9',tx:'引九天神雷，借天道之力劈散凶魂',hint:'影响：需高境界；伤敌亦伤己',run:()=>{log('红尘卷·六卷','你冲天而起，以自身为引，召来九天神雷。雷海倾泻而下，混沌凶魂在雷火中嘶吼翻滚——可那混沌气竟连天雷都开始吞噬。你咬牙支撑，流苏的狼牙棒在你掌中化作万丈光柱：“撑住！它吞不下的！”');startCombat(rdEnemy('混沌凶魂·雷劫',2.8),'rd6Fight');}},
  {k:'C',tag:'分食',c:'#8B6FA8',tx:'以混沌道则反向吞噬凶魂本源',hint:'影响：凶险（入战）；胜则道则大进',run:()=>{log('红尘卷·六卷','你反其道而行之——既然它要吞你，你便先吞它。混沌火、太一水、北冥冰在体内形成一道吞噬漩涡，将那混沌凶魂一缕缕扯入己身。凶魂惊恐地挣扎：“你……你也是混沌！”你阖目，将最后一丝混沌气吞入丹田：“是啊——所以，该你让位了。”');startCombat(rdEnemy('混沌凶魂·反噬',2.9),'rd6Boss');}},
]},
{t:'天枢 · 神阙风云',meta:'强制节点：天上人登门——天枢神阙的道与谋',scene:'混沌凶魂既灭，你之名已传遍天上人间——北冥镇渊、三途斩恶、忘川受盘、混沌归位，一桩桩一件件，被说书人编成段子，从东海传到西域。这一日，云海之上忽有仙乐阵阵，璎珞垂空，一道气度雍容的白衣女子踏云而下，身后跟着两名随侍，衣袂飘飘，不带一丝凡尘气。她落在你面前，微微颔首：阁下镇混沌、平北冥，天上亦有耳闻。她自称曦月，来自天枢神阙：天枢有一块众妙之门的碎片，万年来无人能悟。鹤悼师兄说，若天下还有一人能参透它——大约是你。你随她登临天界。天界与你想象中不同——没有琼楼玉宇的浮华，反而空旷寂静，云海之上立着几座素朴的宫殿，宫墙斑驳，带着岁月的痕迹。紫微殿中，一块流转着混沌光的石墩静静立在大殿中央，光晕明灭，像一颗沉睡的心脏。你走近它时，识海深处，流苏的声音忽然轻轻响起，带着一丝你从未听过的复杂情绪：这碎片……我认得。它本是我那根棒子的……一部分。满殿寂静。曦月站在殿门口，静静看着你，没有催促，也没有说话，只是等着——等着你做出选择。你望着那块石墩，掌心忽然有些发痒，像有什么东西在隔着万古的时光，轻轻呼唤着你。你缓步走近那块石墩，在它面前盘膝坐下。流苏没有再说话，可你感觉到她正透过你的识海，静静望着那块碎片——那眼神里，有重逢的欢喜，也有说不清道不明的怅然。你闭目，神识缓缓沉入那片混沌光中。恍惚间，你看见一扇顶天立地的古门——门身斑驳，刻着无数你认不出的古老符文，门后是道的尽头，是天地未分时的最初模样。门缝里透出一线光，那光极淡，却带着一种说不出的亲切，像在召唤你。你伸出手，指尖触到门缝的刹那，万道齐鸣，无数法则如潮水般涌入识海——丹道、剑道、阵道、符道、琴道、棋道……万千道则在你识海中交织成一张庞大的网，而你站在网的中心，第一次看清了这张网的全貌。不知过了多久，你缓缓睁开眼。曦月正静静站在殿门口，看着你，没有催促，只是轻声问：看见了什么？你沉默良久，才道：看见了……门后的路。她眼底掠过一丝极淡的光，没有追问，只微微颔首：鹤悼师兄说对了——天下能参透此门的，大约只有你。她顿了顿：天枢欠你一个人情。往后若有需要，凭此玉牌，可入紫微殿。她递来一枚温润的玉牌，你接过时，指尖触到一丝沁凉。你在天枢住了下来。每日晨昏，你都会到紫微殿中，在那块门之碎片前静坐参悟。流苏也渐渐愿意开口了——她告诉你，那碎片本是她那根棒子的一部分，当年天地初开时，那根棒子曾是一柄顶天立地的神器，后来在连番大战中折断，碎片散落各界，其中最大的一块，便落在了天枢。你问：那要集齐所有碎片，才能让棒子复原？她沉默片刻：难。碎片散落各界，有的在幽冥，有的在妖城，有的可能早已被人炼化成了别的法器。你嗯了一声，没有再说。可你心里已经暗暗记下——往后无论走到哪，都要留意那些与棒子气息相近的东西。第七日夜里，你从参悟中醒转，发现曦月正站在殿门口，静静看着你。你问：怎么了？她轻声道：瑶光前辈来了，在云海之外等你。你心头微动，起身走出殿外。云海之上，那道白衣身影正负手而立，见你出来，微微侧头：参悟得如何？你说：略有寸进。她忽然笑了：那你可愿随我去一个地方？你问：何处？她望着云海尽头，声音轻飘飘的：源初之地——开天辟地之前，你我本来的家。',opts:[
  {k:'A',tag:'参悟',c:'#A98FD9',tx:'盘坐参悟门之碎片',hint:'影响：悟性+3；窥见太清之路',run:()=>{S.six.悟性=clamp(S.six.悟性+3,1,20);log('红尘卷·六卷','你盘坐于石墩之前，神识沉入那片混沌光中。恍惚间你看见一扇顶天立地的古门——门后是道的尽头，是天地未分时的最初模样。你伸出手，指尖触到门缝的刹那，万道齐鸣。醒转时，曦月正静静看你：“看见了什么？”你沉默良久：“看见了……门后的路。”');}},
  {k:'B',tag:'对峙',c:'#C4675C',tx:'先问清天上人对人间与妖城的立场',hint:'影响：为天界诸族争一诺',run:()=>{log('红尘卷·六卷','你没有急着参悟，反而直视曦月：“天上人圈养裂谷、牧养妖城——这笔账，天枢打算怎么算？”曦月沉默片刻：“鹤鸣之流，不代表天枢。你若能悟透此门，我便以天枢之名立誓：裂谷自此为两界共守，妖城不再为他人牧场。”她顿了顿：“这是鹤悼师兄闭关前，亲口许的。”');}},
