{t:'启程 · 南离难离',meta:'衔接卷一：无论你在南离留下了怎样的结局，此去裂谷，皆从别离开始',scene:'横断裂谷，不知其长，不知其宽，不知其深，终年云雾深深，飞鸟难渡，坠石无声——那是这片大陆最南端的天涯。当地老人说，裂谷不是天生的——上古年间，有两位大能从天上打到地下，最后一击劈开大地，留下这道深不见底的伤口。传说裂谷底下沉着一座上古妖修的古城，也传说谷底埋着直通九幽的门户。谁也不知道谷底究竟有什么，下去的人，十个里有九个再没上来过；剩下那一个，也疯了，只会反复念叨：黑的，全是黑的，黑得会动。南离人对它又敬又畏，老一辈常拿它吓唬不听话的娃娃：再不乖，把你丢进裂谷喂妖去。娃娃们便哭，可总有胆大的少年郎，偷偷结伴跑到谷边张望，对着那翻涌的云雾喊一嗓子，听回声层层叠叠传回来，像有无数人在谷底应答。东华子之事尘埃落定后，南离的风物渐渐让你觉得局促——你替李青君修好了城防图，替李青麟拟定了新政的条陈，连长生观里那些炼丹的旧炉都有人来请你过目。你帮得了一时，帮不了一世，这座城已经不需要你了。夜翎扒着门框探进半个脑袋，眼睛亮晶晶的：那个传说，裂谷底下有妖修的法门……我们去看看？她如今已与你亲厚，翅翼收在背后，像一只收着锋芒的小鹰，说话时尾音微微上翘，藏着一点小心翼翼的期待——她记得自己的血脉源自妖修，总想着也许谷底能找到她真正的根。你蹲下来与她平视，问她：那里没人去过，你怕不怕？她挺了挺胸脯，又偷偷摸了摸自己收拢的翅根，老实道：怕。可她又补了一句，声音小小的：反正，有哥哥在。城中故人来送行。李青麟倚着宫门咳嗽了两声，把一叠金叶塞进你怀里，欲言又止半晌，只拍了拍你的肩：先生此去，山高水长，保重。他话不多，可那一下拍得很重，重得像要把这些年的谢意都拍进去。他送你到城门口便不肯再走，说是怕自己这身子骨拖累行程——你这才注意到他鬓角已添了霜色，袖口露出半截绷带。你皱眉要说什么，他摆摆手，笑得很淡：先生放心，青麟这条命，是先生从东华子手里抢回来的，我比谁都惜命。他顿了顿，压低声音：倒是那丫头……她性子倔，认准的事九头牛拉不回。先生此去，若是路过什么安稳的地方，多想想她。你怔了怔，没有接话，只把金叶塞回他手里，又从怀里摸出一瓶养身的丹药递过去：药丸每日一粒，温水送服，别熬夜批折子。他接了，眼眶却忽然有点红，别过头去咳了两声。李青君骑着马追出城外十里，把一壶温好的酒挂在你的鞍上，别过脸去，声音闷闷的：活着回来。她说罢便要打马往回跑，马尾在风里扬起老高。你伸手唤住她，把那壶还温着的酒解下来掂了掂——壶身上系着一根红绳，拴着一枚缝得歪歪扭扭却极结实的平安符，针脚粗拙，一看就是她连夜自己缝的。你笑问：这符，求的什么？她梗着脖子不回头，声音却软下来：求……求你别死在没人收尸的地方。说完她自己也觉得这话不吉利，啐了一口，又急急改口：不是！是求你好好的，喝完了酒还想喝，就回来找我买！她说完一夹马腹，头也不回地跑了。你低头把那枚平安符解下来，贴身收好，那壶酒重新挂回鞍上，忽然觉得这趟远行，肩上多了点什么，心里却暖洋洋的。你望着城门的方向，终究勒转马头，向南。身后，那道蓝白道袍的身影在长生观的檐角一闪而过，似有似无的一声叹息散在风里——是明河。你放慢马速，回头望了一眼那道檐角的身影，仿佛能听见她临别那夜说过的话：此去裂谷，妖气纵横，公子务必记住——人心难测，妖心未必难测；可有些披着人皮的，比妖更该提防。她说完，把一叠连夜画好的符纸塞进你行囊，又补了一句：若遇生死关头，燃一张，贫道千里之内，必至。你摸了摸怀里那沓符纸，厚厚一叠，还带着墨香。你朝那檐角拱了拱手，一夹马腹，再不回头。前路漫漫，可你知道，身后始终有一双眼睛，蓝白衣袂，立在离火城最高的檐角上，望着你一路向南。',opts:[
  {k:'A',tag:'带她',c:'#D88FA5',tx:'带上夜翎同行，直奔裂谷',hint:'影响：夜翎随行；卷二主线默认',run:()=>{rdLove('夜翎',2);log('红尘卷·二卷','夜翎高高兴兴地把包袱往你马背上一扔——里面全是她偷偷攒的零嘴。你失笑：“这是去探险还是去春游？”她理直气壮：“都带上！”');}},
  {k:'B',tag:'独行',c:'#6FA698',tx:'让她留守，你独自先行探路',hint:'影响：夜翎好感-1；她赌气跟来',run:()=>{rdLove('夜翎',-1);log('红尘卷·二卷','你前脚出城，后脚就听见翅膀扑腾声——夜翎抱着小包袱蹲在路边的老树上，面无表情：“我说了要去。”你看着她，忽然觉得东华子要是知道自己催生的小妖倔成这样，怕是棺材板都压不住。');}},
  {k:'C',tag:'问路',c:'#7FA8C9',tx:'先寻明河师门留下的裂谷地图',hint:'影响：明河好感+1；得裂谷地形',run:()=>{rdLove('明河',1);log('红尘卷·二卷','你循着明河留下的联络暗号，在城郊道观神像下取到一卷地图——上面标着裂谷周边，某处画了个小小的圈。夜翎凑过来看了半天：“这画的是什么？”“大概……是妖修会感兴趣的地方。”');}},
]},
{t:'裂谷 · 坠石无声',meta:'强制节点：横断裂谷之险',scene:'裂谷边缘，云雾如海，从崖畔往下望，只有一片吞噬一切的灰白。风从谷底倒灌上来，呜呜咽咽，像大地在叹息。你撕下半张神行符贴在腿弯，符光一闪，整个人轻得几乎要飘起来——这是你在长生观地宫里摸来的几张残符，本是为逃命备的，此刻倒先用在探路上了。夜翎扑棱着翅膀在你头顶盘旋，小脸绷得紧紧的，忽然脸色一变，急急收翅落在你肩头：有腥味。山风送来浓重的血腥与兽臭，隐隐还有嘶吼声从谷侧的山那头传来，一声接一声，像有无数的东西在厮杀。你按住要往前冲的夜翎，压低声音：绕过去看看——小心点。绕过山脊，眼前的景象让你瞳孔一缩：一片血色斜坡横亘在谷壁之间，无数妖物正自相残杀——双尾的狐狸甩着尾巴撕咬同类，三眼的巨狼一口咬断对手的喉管，比蛇还粗的蜈蚣盘成一团缠绞猎物，张着花瓣巨口的花状妖物喷着酸液，把半边山坡都腐蚀得滋滋冒烟。血流成河，顺着斜坡往下淌，汇入中央一个深坑。坑底，一朵黑色的莲花幽幽绽放，花瓣如墨玉，在血光中妖异而圣洁，每一缕血腥气涌过去，都被它无声吸尽。夜翎盯着那朵黑莲，眼睛一眨不眨，忽然扯了扯你的衣角，声音有些发颤：哥哥……我的血脉，在叫它。她体内蛰伏的螣蛇血统，与那血潭深处的气息遥相呼应，像失散多年的血脉在隔空呼喊。你盯着那朵黑莲看了片刻，识海深处那道声音忽然开口，难得的凝重：黑血妖莲，以万妖血魂浇灌而生，五百年一开，开花七日即谢。若是炼成净血丹，足以让寻常妖兽脱胎换骨——对那小丫头而言，是天大的造化。可它顿了顿，声音沉下去：能在这谷侧攒起这么大一片妖潮厮杀、以血养莲的，背后必有人手笔不小。你心头一凛：你是说，这血潭是有人养的？那声音没答话，算是默认。你低头看了一眼怀里昏睡的夜翎——她方才那一跃，已经沾了血潭的气息，若就这么走了，那养莲之人迟早会顺着气息寻来。这朵莲，你不想抢，恐怕也脱不开身了。你按住她微微发抖的手，目光沉凝地扫过那片血坡——妖潮仍在厮杀，谁先靠近那血潭，谁就会成为众矢之的。你带着夜翎退到一处背风的岩石缝隙藏好身形，她乖乖窝在你怀里，只露出一双眼睛。血坡上的厮杀从正午持续到日头偏西——妖物的嘶吼、断肢的飞溅、血水汇入深坑的汩汩声，混成一片地狱般的交响。你冷眼看着，渐渐看出门道：这些妖物并非漫无目的地混战，它们总在不经意间把那朵黑莲护在中央，凡是扑向莲花的，都会被其他妖物合力撕碎——仿佛有什么本能，驱使着它们守着这朵莲，又等着它成熟。夜翎在你怀里忽然轻轻动了动，声音闷闷的：哥哥……那些妖，好像都疯了。你低声道：不是疯了，是被人养在这里的。这片血坡，这深坑，这朵莲——都是局。夜翎仰头看你，眼底有些茫然，又有些说不清的难过：那我们……也在这个局里吗？你没有答话，只把她往怀里拢了拢。风从谷底翻涌上来，带着浓重的血腥气。你知道，天黑之前，这个局总会开一个口子。正思量间，血坡上的厮杀忽然停了——不是分出胜负，而是所有的妖物都同时僵住，齐齐望向深坑。坑底那朵黑莲无声绽开最后一瓣，莲心处浮起一点幽蓝的微光，像一颗沉睡的眼珠缓缓睁开。霎时间，万籁俱寂。你识海深处那道声音猛地一凝：莲花要谢了！血魂将凝——机不可失！话音未落，你已抱着夜翎跃出岩缝。可与此同时，血坡边缘的阴影里，几道潜伏已久的身影也同时动了——螳螂捕蝉，黄雀在后，这血潭边上，等着摘桃子的，远不止你一个。可那朵黑莲，显然不是凡物。',opts:[
  {k:'A',tag:'静观',c:'#6FA698',tx:'按兵不动，等妖潮厮杀出结果',hint:'影响：稳；可能错过血莲时机',run:()=>{log('红尘卷·二卷','你拉着夜翎缩在岩后看了半日。妖潮互相吞噬，血潭里那朵黑莲似乎更艳了一分。待到最后一头巨狼倒下，你才缓步而出——夜翎却盯着血潭移不开眼：“我的血脉……在叫它。”');}},
  {k:'B',tag:'虎口夺莲',c:'#C4675C',tx:'趁乱潜入血潭，抢先取走黑莲',hint:'影响：入战（守潭妖蟒·极凶）；得黑血妖莲',run:()=>{log('红尘卷·二卷','你贴着地面无声掠向血潭。即将触到莲瓣的一瞬，血潭猛然炸开——一条比水缸还粗的巨蟒昂首而出，竖瞳如灯。夜翎尖啸一声扑下，竟以血脉压住它片刻：“快！”');startCombat(rdEnemy('守潭妖蟒',1.6),'rd2Fight');}},
  {k:'C',tag:'护她',c:'#D88FA5',tx:'护住夜翎入血潭，让她吸收蛇血',hint:'影响：夜翎好感+2、血脉蜕变前奏（需战守潭者）',run:()=>{rdLove('夜翎',2);log('红尘卷·二卷','夜翎小声说“哥哥，我想试试”，便纵身投入血潭。无数妖蟒之血顺着她的鳞片涌入，她痛得蜷起，却在血中发出一声细小的龙吟。潭底一道黑影猛然窜出——守了这血潭不知多少年的老妖，怒了。');startCombat(rdEnemy('血潭老蛟',1.65),'rd2Fight');}},
]},
{t:'荒山 · 哑巴美人',meta:'强制节点：裂谷荒山救起程程',scene:'夜翎吸足了血，伏在你怀里沉睡——她冒险跳进血潭边缘，让螣蛇血脉汲取了那缕本源气息，代价是伤重裹挟着换血的造化，一时半刻醒不来。你把她仔细裹在披风里，独自背着行囊绕出山丘。山谷荒凉，碎石遍地，风呜呜地刮过岩缝，像野鬼在哭。你正寻着避风处，忽然听见岩堆后传来极轻的呜咽，断断续续，像受伤的小兽在呻吟，又像人在压着嗓子哭。你脚步一顿，循声拨开乱石——一名女子倒在石缝间，衣裳褴褛，遍体血痕，裸露的肩头有几道深可见骨的抓伤，赤着的足踝被碎石磨得通红，伤口里还嵌着沙砾。她还有气息，胸口微弱地起伏着。此地荒僻，方圆几十里没有人烟，一名孤身女子出现在这里，本就不合常理。你识海深处那道懒散声音冷声道：荒山野岭，重伤独身，来历不明——直接杀了最稳妥，免得惹祸上身。那声音见你不答话，又补了一句：妇人之仁。这荒山野岭，前不着村后不着店，一个姑娘家重伤倒在这里，不是被人追杀灭口，就是自己作死惹了不该惹的东西。你救了她，就等于接了她的因果——追杀她的人，回头就会找上你。你没有答话，蹲下身，探了探她的鼻息，又看了看她身上的伤——那抓痕有半寸深，皮肉外翻，边缘平整，寻常野兽留不下这样的伤口，倒像被什么人的指甲生生抠出来的。你心里那根弦绷紧了些，可犹豫了一瞬，还是把人背了起来。那声音叹了口气，没再说话。走出数里，她醒了，在你背上安静地待了很久，没有挣扎，也没有出声，只把头轻轻偏开，像怕蹭到你。等到了安全的山洞，你生起火，把她放下来。她挣扎着下地，拢了拢散乱的头发，朝你端端正正行了一礼，又指了指自己，摆了摆手。你试探道：你……不会说话？她点点头，眼睛很亮，像一汪安静的泉水。你叹了口气：行吧，先治伤。你生起火，把水囊里的水烧热，撕了条干净里衣当绷带。她安安静静坐着，看你忙活，忽然指了指自己的喉咙，又摆摆手，比划了一个动作——张嘴，却发不出声。你明白了：她不是天生哑，是嗓子受过伤。你示意她张嘴看看，她犹豫了一下，还是微微张开嘴。火光下，你看见她喉咙深处有道狰狞的旧疤，从喉结一直延伸到锁骨——那是被人用利器割的，下手极狠，再深一分，她当年就没命了。你眉头微微皱起：这伤……有些年头了。她点点头，垂下眼，指尖无意识地摩挲着喉咙那道疤，像在摸一道永远好不了的旧伤口。你没有追问，只把一块烤热的饼递给她：先吃东西。她接过饼，没有立刻吃，而是先掰了一半，递回给你，眼睛亮亮地看着你，等你先咬一口。你失笑，接过那半块饼咬了一口。她这才低头，小口小口地吃起来，吃得极慢，像怕糟蹋了粮食。你替她上药时，她始终安安静静的，只有药酒碰到伤口时，她才会轻轻抽一口气，攥紧衣角，却不肯躲。你只道：伤口别沾水，三天换一次药。她点点头，忽然伸手，在你手背上轻轻写了两个字。你低头看——她指尖微凉，一笔一画写得认真：谢谢。你抬起头，她正看着你，眼睛弯弯的，像一弯新月。那一瞬间，你忽然觉得，这世上的防备，有些是可以放一放的。上完药，她默默起身，到溪边洗了手，捧了水回来，又不知从哪寻了片大叶子，卷成杯状，把水小心地喂到你嘴边——明明是萍水相逢，她却像养熟了的猫，知道谁对她好，便要把这点好还回去。火光在她脸上跳跃，你看着她忙前忙后的身影，忽然觉得，这荒山野岭的夜，也没那么冷了。你靠着岩壁合眼假寐，心里却记下了一笔：一个不会说话的孤身女子，为什么受这么重的伤，倒在这裂谷附近的荒山里？她喉咙上那道疤，又是谁留下的？这谜底，怕是比这荒山更深。',opts:[
  {k:'A',tag:'救人',c:'#6FA698',tx:'带她一起走，送她回有人的地方',hint:'影响：程程线开启；夜翎好感微降（吃醋）',run:()=>{log('红尘卷·二卷','她不会说话，却极会照顾人——替你换药、打水、把烤焦的饼默默掰掉焦壳再递给你。你问起她来历，她寻了根树枝，在地上写了两个字：程程。又写道：家在南方，妖城。你眼皮一跳。');}},
  {k:'B',tag:'安置',c:'#7FA8C9',tx:'治好伤后送她到安全处，不深究来历',hint:'影响：功德+1；程程线浅尝',run:()=>{S.merit++;log('红尘卷·二卷','你把能用的丹药都留给她，指了个方向：“往北有镇子。”她怔了怔，接过药包，在你手背上轻轻按了按，算是道别。你走出很远，回头看见她还站在原地，衣摆被风吹起，像一株孤零零的芦苇。');}},
  {k:'C',tag:'提防',c:'#8B6FA8',tx:'她来历成谜，暗中试探虚实',hint:'影响：程程察觉你的戒备，若她是妖则敌意暗生',run:()=>{log('红尘卷·二卷','你表面照料，夜里却始终留着一只眼睛。她像是毫无所觉，安安分分地睡在火堆另一侧。直到第三天清晨，你醒来发现火堆上温着一壶水，水壶边压着一片叶子，叶脉上被人用指甲划出四个字：“我不是妖。”你捏着那片叶子，一时竟不知该信几分。');}},
]},
{t:'妖城 · 百妖街市',meta:'强制节点：踏入妖城，百妖人形，各称妖王',scene:'妖城在裂谷东侧数十里，依山而建，城墙斑驳，长满青苔，却比南离都城还热闹。城门没有守卫，只有两只蹲在石墩上的老龟，慢吞吞地抬了抬眼皮，又继续打盹。进了城，你才真正明白什么叫百妖街市——九成行人是妖，化作人形的狐狸精摇着团扇卖胭脂，胭脂摊上摆着一排小镜，每面镜子里都映着狐狸精自己毛茸茸的真身；熊妖蹲在铺子前啃甘蔗，啃得咔嚓作响，见你路过还憨憨地递来半截；几只小妖追着风车满街跑，撞到你腿上，抬头看你一眼，吐了吐舌头，又咯咯笑着跑远。夜翎收了翅膀，混在妖群里毫不违和，甚至比在人间更自在，一双眼睛亮晶晶地四处看；程程回到这里反而松了口气，整个人都舒展了——她本是妖城长大的孩子。程程比划着告诉你她的来历：她原是城南织坊老绣娘捡来的孤儿，老绣娘是个人类，年轻时流落妖城，凭一手好女红立了足，把她当亲闺女养大。老绣娘三年前过世了，留给她一间绣庄、一柜子绣样，还有一句叮嘱：手艺是人的根，走到哪儿都丢不得。她比划到这里，眼里有泪光，却还是笑着，又比划道：绣庄的生意，我做得很好。你没说话，只是多看了她一眼——一个人类绣娘，能在妖城里安安稳稳地把一间绣庄经营下去，这本事，怕是比她露出来的要多得多。夜翎凑过来，盯着程程绣庄橱窗里那幅百妖贺寿图看了半天，忽然指着角落里一只绣得活灵活现的小蛇妖问：程程姐姐，这个是你照着我绣的吗？程程弯眼笑，摇摇头，比划道：是我小时候梦见的——一条小蛇，长着翅膀，从血里飞出来。夜翎愣住了，那正是她血脉苏醒时的样子。你心里也微微一动，多看了程程一眼——她一个人类绣娘，怎么会梦见螣蛇化形？程程却没察觉你的目光，只低头理着绣线，阳光落在她发梢上，安静得像一幅画。你带着她们走在街上，竟有种误入异乡集市的恍惚。妖城的铺子也有意思——卖灵药的铺子门口挂着风干的妖藤，卖兵器的铺子里淬的是妖火，连卖豆腐脑的小摊，卤子里都搁着提鲜的妖菇。夜翎起初还绷着，后来被一阵糖炒栗子的香气勾得走不动道，你给她买了一包，她剥了一颗，眼睛顿时亮了，含糊道：哥哥，这比南离的香！程程在旁边看着，忽然比划：你们是从南离来的？你点点头。她眼底掠过一丝极淡的波动，又垂下眼，把帕子叠好，没有再多问。你注意到她方才那一瞬的异样——南离这两个字，对她似乎有别的分量。程程比划着告诉你：她自幼在此长大，靠刺绣织衣为生——妖怪们不擅女红，人类的手艺在此格外金贵，她绣的云纹帕子能换三两银子。她比划时眼里带着笑，是那种靠手艺吃饭的踏实。只是街角的妖谈论起城外那个巫师，语气都带着忌惮与厌恶：那老东西以炼妖为乐，自成一窟，连几位妖王都不愿招惹他。据说他窟里攒了上百具妖骨，还养着一盏怨气凝成的骨灯，谁撞见他都没好下场。夜翎在你身边轻轻攥住了你的衣角夜翎的异样，你其实看在眼里——进了妖城之后，她整个人反而安静得过分，不吵不闹，也不像在人间那样随时绷着防备。她只是看着那些化作人形的妖，看着他们买菜、砍价、追打小孩，看了很久，忽然小声问你：哥哥，他们……都活得这么自在吗？你一时不知怎么回答。她低下头，声音更小：我原来以为，天下所有的妖，都像我一样，生下来就是给人取丹的。直到她看见熊妖把啃了一半的甘蔗分给小妖，看见狐狸精的胭脂摊被顾客夸了几句，尾巴就控制不住地冒出来摇啊摇——她眼底那点小心翼翼的向往，让你的心软得一塌糊涂。她攥着你衣角的手，也悄悄松了松。，指节发白，声音低低的：哥哥……那个巫师，是不是和东华子一样？她没问完，但你听懂了她的意思——是不是也靠杀妖取丹，把她们这样的妖，当作炉里的药材。',opts:[
  {k:'A',tag:'查巫',c:'#7FA8C9',tx:'打听巫师底细，筹备除巫',hint:'影响：夜翎好感+1；推进主线',run:()=>{rdLove('夜翎',1);log('红尘卷·二卷','你以行商身份在茶摊坐了一下午，听了一肚子巫师劣迹：捕妖炼丹、阵窟层层、连妖王地盘都敢越界设卡。夜翎安静地听完，忽然说：“他炼的妖，都是像我这样被催出来的吗？”你没回答。答案你和她都清楚。');}},
  {k:'B',tag:'绣庄',c:'#D88FA5',tx:'随程程去她的绣庄落脚',hint:'影响：程程好感+2；窥见妖城人情',run:()=>{rdLove('程程',2);log('红尘卷·二卷','程程的绣庄不大，墙上挂满绣品——云纹、鹤影、腾蛇，针脚细密得惊人。夜翎盯着一幅绣着翅膀小蛇的帕子看了半天：“这个……像我。”程程弯眼笑，把帕子叠好塞进夜翎怀里。你看着这一幕，忽然觉得这妖城也没那么可怕。');}},
  {k:'C',tag:'寻路',c:'#C9A45C',tx:'不掺妖城恩怨，只寻裂谷深处的修行遗迹',hint:'影响：走探险路线，略过妖城剧情',run:()=>{log('红尘卷·二卷','你婉拒了程程留宿的好意，准备绕过妖城直入裂谷深处。程程送你们到城门口，忽然塞给你一卷手绘的地图——墨迹未干，是她连夜画的裂谷地形。你看着那精准的标注，心里那点疑虑又浮了上来：一个绣娘，怎会如此熟悉裂谷？');}},
]},
{t:'巫窟 · 祭火与阵',meta:'强制节点：闯入巫师窟，炼化巫祝祭火',scene:'巫师的巢穴藏在裂谷侧壁的溶洞里你带着夜翎摸到洞口时，天色已经暗下来。溶洞像一张咧开的黑嘴，洞口的阵纹在暮色里泛着幽幽的蓝光，像无数只竖瞳。你蹲下身，指尖描过那些纹路——这是巫门惯用的血禁阵，以妖血为墨，画阵的人越狠，阵就越凶。你闻到阵纹上残留的气息，不是兽血，是带着灵智的妖血。夜翎站在你身后，忽然开口，声音平静得不像她：我闻到了……同类的味道。她没有说害怕，可你看见她垂在身侧的手，指甲已经掐进掌心。你握住她的手，低声道：跟紧我。这趟进去，要是遇上什么，你先护自己。她抬起头看你，眼底那点水光一闪而过，重重点了点头。，洞口阵纹密布，阴风阵阵，吹得人骨头缝里发凉。洞口的岩壁上刻着密密麻麻的符文，一圈套一圈，像无数只眼睛在暗处盯着你。你让程程留在洞口望风，带着夜翎摸了进去。溶洞幽深，岔路极多，每一条岔路口都散落着几块妖骨，有的骨头上还留着齿痕——那巫师竟用妖骨做路标。夜翎闭目感应片刻，睁开眼，声音很轻：里面……有很多妖骨，密密麻麻的，活着的妖气只有一缕，很淡，藏在最深处。你心里一沉，破开三道阵门——第一道是幻阵，你踩中阵眼时眼前闪过无数怨魂扑来，你默念心法稳住心神，硬生生走过去；第二道是毒瘴，你含了颗解毒丸，屏息穿过；第三道是傀儡阵，两具妖骨拼成的傀儡摇摇晃晃站起来，被你一剑劈散。一路行至最深处，一座祭坛静静矗立。祭坛上燃着一簇幽绿的火，火焰不高，却幽幽地跳动着，不灼人，反而让识海都微微一暖——你认出这是一簇炼化过的巫祝祭火，于对敌无用，却是炼丹炼器的顶级辅火，多少丹师求一辈子都求不来这么一簇。识海深处那道声音难得地赞了一声：好东西。以你如今的修为，正好能炼。话音刚落，祭坛后的阴影里传来一声沙哑的冷笑：闯老夫的洞府，还打老夫火种的主意？那巫师竟一直藏在暗处——他佝偻着背，枯瘦如柴，手中捧着一盏骨灯，灯里飘着一缕怨气凝成的妖影，那妖影在灯焰里挣扎嘶吼，五官扭曲那巫师上下打量你，忽然怪笑一声：倒是个生面孔。近些年敢闯老夫这窟的，都成了灯里的料。他抬了抬骨灯，灯焰里的妖影嘶吼得更凄厉：看见没？这就是不听话的下场。他以为你会怕，可你注意到他捧灯的手在微微发抖你盯着那盏骨灯，心里飞快地盘算着。这老巫师修为不浅，正面硬拼未必稳赢，可他手里的骨灯是双刃剑——灯里囚着上百条怨魂，若能破灯放魂，那些怨魂第一个要找的，就是困了它们半辈子的仇人。你面上不动声色，嘴上却顺着他的话说：前辈说的是。晚辈初来乍到，不懂规矩，冲撞了前辈洞府，实在是罪过。那巫师见你服软，神色稍缓，却仍不肯放下骨灯：算你识相。说罢他上下打量你，忽然眯起眼：你身上……有妖气。你背着夜翎那缕血脉气息，瞒不过他这种炼妖的老手。他嘿嘿一笑，眼底泛起贪婪的光：也好，老夫这灯，正缺一味新鲜的妖魂。——他方才催动骨灯时，指尖的灵力明显滞了一瞬。这老东西，远没有他装的那么游刃有余。你识海深处那道声音也低声道：他灵力虚浮，多半是长年炼妖损了根基，全靠那盏骨灯撑场面。灯里的怨魂是他的倚仗，也是他的催命符。你心里有了计较，目光却仍落在那簇幽绿的祭火上——先稳住他，再寻机破灯。，看得出生前是头通灵的妖。你握住剑柄，目光落在祭坛上那簇幽绿祭火上——这火种，你要定了。',opts:[
  {k:'A',tag:'夺火',c:'#C4675C',tx:'先夺祭火，再与巫师一战',hint:'影响：入战（驭妖巫师）；胜后得巫祝祭火',run:()=>{log('红尘卷·二卷','你抢在巫师催动骨灯之前纵身扑向祭坛，逆火诀展开，那簇幽绿火焰竟真的顺从地钻入你眉心。巫师惊怒交加：“竖子安敢！”骨灯一倾，怨气妖影铺天盖地压来。');startCombat(rdEnemy('驭妖巫师',1.7),'rd2Fight');}},
  {k:'B',tag:'破灯',c:'#6FA698',tx:'先碎骨灯，解放灯中妖魂',hint:'影响：功德+3；巫师战力大减',run:()=>{S.merit+=3;log('红尘卷·二卷','你掷出桃木剑，一剑削碎骨灯。千百缕怨气妖魂脱困而出，却没有四散而逃——它们整齐地朝那巫师扑了过去，嘶声如哭。巫师惨叫着在妖魂中翻滚，你甚至没来得及补一剑，他已被自己炼了一辈子的怨气啃噬殆尽。夜翎站在你身边，静静看完，轻声说：“这是报应。”');}},
  {k:'C',tag:'引走',c:'#8B6FA8',tx:'不恋战，取走祭火与妖骨便撤',hint:'影响：得材料，巫师记恨（后患）',run:()=>{log('红尘卷·二卷','你与巫师对了一掌，借着阵势掩护卷走祭坛核心与几卷妖骨秘录，扬长而去。身后巫师的怒吼追了半里地：“老夫记住你了！”你心想：记着也好，省得我忘了还有这茬。');}},
]},
{t:'血莲 · 炼丹换血',meta:'强制节点：以黑血妖莲炼两炉丹，夜翎血脉蜕变',scene:'回到落脚处，你将黑血妖莲取出——五瓣莲瓣，幽光流转，在暗处竟透出玉质的光泽。你识海深处那道声音难得正经：这玩意在修仙界也算宗门珍藏，寻常散修一辈子见不着。半瓣炼培元丹，壮你练气根基；半瓣炼净血丹，助那条小蛇混融血脉，去芜存菁。你依言开炉。巫祝祭火在炉底安静地燃烧，竟比寻常丹火温驯数倍，火舌温柔地舔着炉壁，一丝烟气都不乱跑，连炉身都被养得温润。你头一回觉得，炼丹原来是件可以静下心来做的事——火候由心，药材在炉中舒展、化开、凝合，像在写一幅字，每一笔都不急不徐。你甚至分心想：若是东华子那老东西知道自己炼了一辈子丹，最后把丹道心得和这簇巫祝祭火都便宜了你，怕是要从地宫里爬出来骂街。你嘴角翘了翘，随即敛了笑，屏息凝神——丹道最忌分心，这两炉丹，一炉关系你的根基，一炉关系夜翎的蜕变，容不得半点马虎。炉火映在你脸上，明明灭灭。你忽然想起程程蹲在廊下比划的样子，想起她说的那句：丹成之际，最忌分心。她一个绣娘，怎么会知道丹道忌讳？这个念头在你心里一闪而过，又被你压了下去——眼下，先把丹炼好。三个时辰后，一炉培元丹出炉，丹香扑鼻，金灿灿的十二粒，颗颗饱满圆润；又一炉净血丹凝如琥珀，隐隐透出莲花的清苦，丹面上天然浮着一缕墨色纹路，像一朵缩小的黑莲。夜翎服下净血丹，蜷在蒲团上，鳞片一阵阵泛起微光，像有光在皮下流淌——蛰伏的螣蛇血脉开始真正苏醒，她的呼吸变得绵长，偶尔发出一两声梦呓似的低吟，像是在和血脉里沉睡的古老记忆对话。你盘坐炼化培元丹，只觉丹田气海如春水初涨，修为壁垒隐隐松动，像有什么东西在体内破壳，又像一粒种子正顶开冻土。门外忽然传来轻轻的叩门声。你起身开门——程程捧着一碗热气腾腾的菌汤站在门口，汤上飘着几片嫩黄的菌菇，香气扑鼻。她比划道：妖城人说，丹成之际，最忌分心——我给你送了吃的。你接过来，汤还是烫的，也不知她在门外等了多久。她弯眼笑了笑，指了指汤，又指指屋里沉睡的夜翎，比了个睡觉的手势，意思是：你安心炼，我守着。她说完便在门外的廊下坐下，拢了拢裙摆，当真守起夜来。你端着菌汤回到屋里，夜翎已经沉沉睡去，呼吸绵长平稳，鳞片上的微光渐渐敛去，像一颗安静的珠子。你坐在她身边，把菌汤一口口喝完——汤很鲜，菌菇是山里才有的野味，程程不知跑了多远的路才采来。你放下碗，隔窗望出去，月光照着程程安静的侧脸，她手里攥着半块没绣完的帕子，帕角那朵腾蛇云纹刚绣了一半，人却已经靠着廊柱睡着了，发出极轻极匀的呼吸。你轻手轻脚走过去，想替她披件衣裳，她却像受惊的小鹿一样猛地睁开眼，看见是你，才慢慢放松下来，弯眼笑了笑，比了个手势：我睡着了？你点点头，把外衫披在她肩上：回去睡吧，今夜不用守了。她摇摇头，固执地指了指屋里，又指指自己，比了个守夜的手势。你拗不过她，只好由她去。回到屋里躺下时，你隔着门板听见她极轻地哼起一支调子——是首眠歌，调子很老，像她小时候，老绣娘哄她睡觉时唱的那支。你翻了个身，听着廊下那支眠歌渐渐低下去，变成极轻的哼唱，最后连哼唱也停了，只剩均匀的呼吸。月光从窗缝漏进来，在地上画出一道银线。你想：这妖城啊，来时觉得是龙潭虎穴，住下来才发现，也就是个寻常人家过日子的小城——有守夜的人，有温着的汤，有绣到一半的帕子。若天下妖城都这般，东华子那样的炼妖人，倒显得格外可憎了。你合上眼，梦里竟也染上了淡淡的菌汤香。',opts:[
  {k:'A',tag:'安心',c:'#D88FA5',tx:'接过菌汤，让程程坐在门外守夜',hint:'影响：程程好感+2；炼丹顺利',run:()=>{rdLove('程程',2);log('红尘卷·二卷','程程果然规矩，只在门外廊下坐了整夜，替你赶走了三拨嗅着丹香摸来的小妖。天光放亮时，她靠着廊柱睡着了，手里还攥着半块没绣完的帕子。你轻手轻脚给她披上外衫，心想：这妖城，也不全是吃人的地方。');}},
  {k:'B',tag:'兼修',c:'#7FA8C9',tx:'趁机把巫祝祭火炼成永久火种',hint:'影响：火系法术威力提升（永久）',run:()=>{S.wudao['丹道']=(S.wudao['丹道']||0)+1;S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='巫祝真火'))S.fashu.push({n:'巫祝真火',elem:'火',power:18,mp:8,系:'丹'});log('红尘卷·二卷','你将巫祝祭火引入眉心明堂，以逆火诀炼化为己用。火苗安静地悬在识海，像一盏长明的灯——从此你炼丹炼器，都比旁人多三分成算。');}},
  {k:'C',tag:'分丹',c:'#C9A45C',tx:'把净血丹分给夜翎，培元丹留作筑基之资',hint:'影响：夜翎蜕变更快；你夯实根基',run:()=>{rdLove('夜翎',2);S.xiu=clamp(S.xiu+30,0,100);log('红尘卷·二卷','夜翎服下整炉净血丹，沉睡三日。醒来时她第一件事是展翅——那对翅膀竟泛起一丝淡金色的边缘。她愣愣地看着自己的翅膀，忽然扑进你怀里，闷声道：“哥哥……我好像，再也不用怕那个炼妖阵了。”');}},
]},
{t:'南离 · 烽烟四起',meta:'强制节点：裂谷事毕归返，南离遭逢大变',scene:'你在裂谷逗留月余，夜翎血脉初定，能稳稳收放那对泛着淡金边缘的翅膀了；程程的帕子绣完三块，每一块都送给了你，说是谢礼，其实那花纹分明是妖城的腾蛇纹——她把你和夜翎都绣了进去。你终究惦记着南离，踏上归途。程程送你到城门口，把一卷连夜赶绘的裂谷舆图塞进你手里，比了个平安的手势，没有说留，也没有说等——可你走出很远回头，她还站在城门下，衣摆被风吹起，像一株孤零零的芦苇。你策马疾行，然而行至国境，烽火狼烟刺破天际——西荒蛮族大举叩边，一路烧杀，直逼离火城。你策马狂奔三日三夜，换了四匹马归途比你想的更难。蛮族南下，沿途村镇十室九空，官道上全是拖家带口逃难的人。你在一处破庙里给一群难民施了药，有个瞎眼老婆婆抓住你的袖子，颤巍巍地问：后生，离火城……还在吗？你答：在。她浑浊的眼里滚出泪来，念叨着：在就好，在就好，我那儿子在城里当兵……她不知道，她儿子所在的营，三天前在城外三十里被蛮军围了，无一生还。你没有说破，只把干粮悄悄塞进她怀里。你一路走，一路看见焦黑的村庄、被践踏的麦田、倒在路边的尸首。那些尸首里，有老人，有孩子，有抱着婴儿的妇人。蛮族不是来抢掠的，他们是来灭国的。你握着缰绳的手，指节一点点收紧。你想起李青君在城头那声快走，忽然明白她为什么让你走——她早就知道这一仗有多难，她不想你陪她一起死。可你更明白，自己为什么回来了。，回到城下时，见到的却是浴血的城墙与一面残破的王旗。城墙上箭孔密布，石垛缺了半边，墙根的砖石被血浸成深褐色。城头站着一名银甲女将，枪尖染血，正指挥部众死死堵住一处被撞开的缺口——是李青君。她瘦了，也黑了，盔甲上全是刀痕箭孔，可那杆银枪在她手里依然稳如磐石。她看见你，愣了一瞬，眼底掠过一丝说不清道不明的光，随即沙哑着嗓子喊：你回来做什么！快走！城下蛮军如潮，新一轮攻势正在集结，号角声呜呜地响。她身后，离火城的万家灯火摇摇欲坠——那些灯火里，有徐伯的烟杆，有村里娃娃的糖葫芦，有长生观檐角那抹蓝白道袍的身影。你抬头望了一眼城头的残旗，又看了看她倔强的眼睛，没有回答她的话——你只是下了马，一步一步，走向那扇浴血的城门。城门吱呀呀开了一条缝，守军警惕地探出头，看见是你，顿时红了眼眶：秦先生！您回来了！快进城——将军她，将军她在城头守了七天了！你三步并作两步登上城楼。李青君还站在缺口处，背对着你，正低声跟一个校尉部署防务，声音哑得像砂纸磨过铁。她说完话转过身，冷不防看见你站在身后，整个人愣住了。你看着她——满身尘土，盔甲上全是干涸的血迹，嘴唇干裂起皮，眼底全是血丝。她张了张嘴，半天才挤出一句：你……你怎么回来了。声音还是哑的，却带着一点藏不住的颤。你没答话，从怀里掏出那壶她送你的酒——一路奔袭，酒壶一直没舍得喝——拔开塞子，递到她面前：御厨酿的，你敢不喝完，我要你好看。她看着那壶酒，又看看你，忽然噗嗤一声笑出来，笑着笑着，眼眶就红了。她别过头，胡乱抹了把脸，接过酒壶，仰头灌了一大口，呛得直咳嗽，却死活不肯把酒壶还给你，只哑着嗓子说：败家玩意，这是给你路上喝的！那壶酒到底被她灌了大半，剩下小半，她小心地塞回你手里，凶巴巴道：留着，等城守住了，你再陪我喝。你说：好。她又瞪你一眼，转过身去指挥士卒搬运箭矢，走两步又回头，像是怕你跑了似的，见你还站在原地，才放下心来，大步走向城垛。你望着她染血的背影，忽然觉得，这一城的残垣断壁，都比不上她笔直的脊梁来得让人安心。你知道，这城，她会守住的。你也会。',opts:[
  {k:'A',tag:'并肩',c:'#C4675C',tx:'翻身上城，与她同守离火',hint:'影响：李青君好感+3；入战（蛮族先锋）',run:()=>{rdLove('李青君',3);log('红尘卷·二卷','你跃上城头，与她背靠背抵住一波冲城。她百忙中瞪你一眼，眼底却有笑意：“你还是老样子，拦都拦不住。”你抹了把脸上的血：“废话，你家城楼，我说了要分一半担子的。”');startCombat(rdEnemy('蛮族先锋·呼延烈',1.7),'rd2Fight');}},
  {k:'B',tag:'奇谋',c:'#7FA8C9',tx:'以符阵封城，为守军争取喘息',hint:'影响：李青君好感+2；消耗符材',run:()=>{rdLove('李青君',2);log('红尘卷·二卷','你连夜在城头布下连环符阵，晨曦初现时蛮军再攻，却一头撞进漫天风雷火雨里，折戟城下。李青君望着城下溃退的蛮军，半晌没说话，最后低低道：“我哥若还在，大概也会像你这样……用脑子打仗。”');}},
  {k:'C',tag:'断后',c:'#C9A45C',tx:'率一支死士出城袭扰，断蛮军粮道',hint:'影响：李青君好感+2、声望+10（高风险）',run:()=>{rdLove('李青君',2);S.reputation+=10;log('红尘卷·二卷','你带三十死士夜袭蛮军粮营，火烧连营数十里。归城时人人带伤，你却笑着把烧焦的蛮军帅旗往地上一插：“够他们饿三天的。”李青君亲自在城门口等你，见你平安归来，一言不发，只把你沾血的衣领慢慢理平。');}},
]},
{t:'终幕 · 难离，亦难离',meta:'终幕抉择：战后的南离，留下还是远行',scene:'蛮军退了。离火城保住了，可代价沉重——王族凋零，朝堂残破，街市上十家店铺有五家挂着白幡。李青君站在城楼废墟上，看着满城招魂的白幡，背影单薄得像一张纸。她摘下头盔，抱在怀里，头发散下来，沾着灰和干涸的血。她回过头，勉强笑了笑，声音哑得不成样子：这一仗，死了很多人……我哥要是还活着，大概会骂我打得不够漂亮。她说这话时没有哭，可你看见她的指尖在头盔上轻轻摩挲，摩挲着那处被流矢擦过的凹痕——那是她替一个小兵挡箭时留下的。她沉默了一会儿，忽然低声说：那个替我挡刀的小校，才十七岁，家里还有个瞎眼老娘。他死前跟我说，将军，我娘爱喝甜粥。你沉默着听完，没有说那些节哀顺变、你已经尽力了的空话——你只是从怀里摸出那枚平安符，看了片刻，又收回去。这满城的白幡，每一挂下面都有一个家，都有一盏再也点不亮的灯。李青君忽然开口，声音很轻：我爹走的时候，我还是个只会胡闹的小丫头，整天想着溜出宫去玩。我哥走的时候，我总算学会扛枪守城了。现在……她顿了顿，望着满城白幡：现在连那些替我挡刀的孩子，都一个一个走了。她转头看你，眼底没有哭，却比哭更让人心口发紧：秦弈，你说，我守这座城，到底守得住吗？你没有立刻回答，而是抬头看了看天边最后一抹残阳。那些白幡在风里轻轻摆动，像无数只手在招魂。你想了想，才开口：我小时候听人说过一句话——城不是墙垒的，是人垒的。墙塌了可以再修，人散了，城就真没了。她怔怔看着你。你继续说：你守的不是这座城，是城里的人。只要还有人愿意跟着你守，这座城就守得住。她张了张嘴，想说什么，又咽回去，半晌才哑声道：可我已经……不知道还有多少人愿意跟我守了。你看着她，一字一句：我回来了，这就是答案。她猛地抬头看你，眼底那层薄薄的水光，终于还是没忍住，顺着脸颊滑了下来。她没有哭出声，只是任由那滴泪滚落，砸在满是尘土的手背上，砸出一个小小的坑。你假装没看见，只把外袍脱下来，披在她肩上：夜里风凉。她攥着那件外袍的衣角，攥了很久，才低低嗯了一声。你看着她，一字一句道：守不守得住，不是你一个人说了算的。她怔了怔。你继续说：城破了我替你修，修好了你继续守；你要是累了，换我来守几天——反正我这一路走来，别的不多，就是命硬。她盯着你看了半晌，忽然低下头，把脸埋进头盔里。你没有催她，只在她身边坐下来，陪她一起看着南离的夕阳，把断墙一寸一寸染成金色。城楼下，有士兵唱起了歌——是首南离的老调子，唱的是春耕秋收，唱的是姑娘在河边洗衣裳。唱着唱着，越来越多的人跟着和起来。李青君没有抬头，可你听见她闷在头盔里的声音，带着一点鼻音：……这歌，我小时候，我娘常唱。她说着说着就说不下去了，别过头去，肩膀微微发抖。夜翎不知何时蹲在你肩头，翅膀轻轻蹭了蹭你的脸，小声问：哥哥，我们……要留下吗？她问得很轻，可你听得懂她话里的意思——她怕你难过，也怕你把自己绑在这座满是伤疤的城里。程程的信鸽也到了，扑棱棱落在城垛上，爪上系着一条帕子，帕角绣着一只展翅的腾蛇，针脚细密——她什么都知道了。南离的风吹过城头，带着烟火与纸灰的气息，拂动你鬓边的发。留下，还是远行——这个选择，终究要你自己做。城楼下，李青君瘦削的身影仍立在废墟上，像一杆插在焦土里的银枪，孤独，却不肯弯。城楼下，陆续有百姓从藏身的屋檐下走出来，帮着搬运伤兵、清理街巷。有个扎着羊角辫的小姑娘，怯生生地跑到城楼上，踮起脚，把一朵蔫了的野花插进城垛的缝隙里——那是她家院子里仅剩的一朵花。李青君看见了，没有作声，只是走过去，把那朵蔫花轻轻扶正。她回过头，见你还站在原处，忽然道：还站着干什么？跟我去清点粮草——城要守，人也要养。她声音还是哑的，却已经没了方才那点脆弱，又变回了那个在城头立了七天七夜的银甲将军。你笑了笑，跟上去。经过她身边时，你低声道：你守城，我守你。她脚步一顿，没有回头，可你看见她耳尖慢慢红了，在夕阳里，像一点小小的火光。',opts:[
  {k:'A',tag:'渡她',c:'#6FA698',tx:'留下：替她扛起这座城，直到天下太平',hint:'影响：成就「归去来兮 · 南离难离」',run:()=>{log('红尘卷·二卷','你站在城头看了很久，最终把那半块虎符握进掌心：“走吧，回府——城得修，粮得筹，民心也得抚。”李青君怔怔看你，忽然蹲下去，把脸埋进臂弯里。你没有催她，只在她身边坐下，一起看南离的夕阳把断墙染成金色。',);rd2Ending('归去来兮');}},
  {k:'B',tag:'携羽',c:'#D88FA5',tx:'带上夜翎，循血脉源头远行修行',hint:'影响：成就「螣蛇新生 · 振翅化龙」',run:()=>{log('红尘卷·二卷','“我要走了。”你对李青君说。她点点头，没有挽留，只把一壶酒塞进你怀里：“路上喝。”夜翎在城门口等你，翅翼在晨光里镀了一层金边。你翻身上马，走出很远，回头看见城头那面残旗还在飘——旗下一个小小的银甲身影，站了很久很久。',);rd2Ending('螣蛇新生');}},
  {k:'C',tag:'赴约',c:'#A98FD9',tx:'南下妖城，赴程程一约',hint:'影响：成就「妖城烟雨 · 织者有心」',run:()=>{log('红尘卷·二卷','你南下妖城时，程程正在绣庄门口晾帕子。看见你，她怔了怔，随即弯起眼睛，把一方新绣的帕子系在你手腕上——帕角绣着两个字：归期。你没有回答归期何时，只在她绣庄对面的小院住了下来。妖城的雨又下了起来，程程撑着伞站在门口，笑得比晴空还亮。',);rd2Ending('妖城烟雨');}},

{t:'缘起 · 仙迹山',meta:'强制节点：必见徐伯与李家兄妹',scene:'南疆小国南离，国境西陲有山，名曰仙迹山。山中终年红霞缭绕，山巅乱石嶙峋，远远望去，像一块从天外飞来、横亘在云天与凡尘之间的顽石。故老相传，古时有仙人踏霞而歌于此，山名便是由此而来。可传了百年千年，从没有谁真在山里寻到过半根仙人的衣带——倒是豺狼虎豹一年比一年凶，山腰的毒瘴也一年比一年浓，猎户们宁可绕远路，也不肯再往深处去。山脚下有个小小的仙迹村，几十户人家靠山吃山，日出而作，日落而息，日子过得清苦，人心却质朴。村口那棵老槐树不知活了几百年，树身要三个壮汉合抱，夏夜村民都在树下乘凉，听老人讲山里的古话：说从前有人真在山里遇见过仙人，仙人只问了他一句话，你为何而来？那人答不上来，仙人便散了，从此再没人寻得着仙踪。你姓秦，无名无姓，来历成谜，只说是游方郎中——一个比郎中多懂些药理、比术士多识些阵纹的年轻人。半年前你不知从何处流落到此，衣袍尽破，满身风霜，是徐伯把你从村口的泥沟里捞起来的。你替他治好了纠缠多年的腿疾，又陆陆续续替村人诊病，不收分文，只换一碗热饭、一席落脚之地。哪家孩子被蛇咬了、老人犯了咳喘，都爱来找你，日子久了，村里人真把你当成了半个自家人。只有你自己知道，你识海深处住着一道懒散的声音，平日半睡半醒，懒洋洋地不理世事，只在撞上真正的凶险时才会睁开眼，用只言片语提点你。你问过它的来历，它只打个哈欠：说来话长，懒得说。这一日黄昏，你坐在院中石墩上捣药，药杵一声声闷响，震得草叶上的露珠簌簌滚落。村口老槐树上的乌鸦忽然扑棱棱惊飞了一片，徐伯磕了磕烟杆，压着嗓子凑过来，一身旱烟味呛得你直皱眉：城里来了贵人，要去山上寻仙。他朝村口努努嘴，声音压得更低：那山上有怪虎，还起了毒瘴——小伙子你懂药理，若那贵人吃坏了，你可千万搭把手。咱这穷村，经不起贵人折在山里的罪过。你顺着他目光望去，正见一黑一白两匹骏马踏着残阳飞驰入村，蹄声如鼓，惊得满村鸡飞狗跳，几个在路边玩泥巴的娃娃被大人一把捞进怀里。白马上是个十四五岁的少年，束着银带武士髻，眉目如画，偏生一身勃勃英气，腰间剑穗在风里甩得老高；黑马上是个年长四五岁的锦袍青年，五官冷峻，背上一杆长枪用油布裹着，枪尖仍透出一点寒芒，冷得渗人，连村口那条见人就吠的黄狗都夹着尾巴缩回了窝里。那白衣少年翻身下马时，怀里掉出一只巴掌大的铜铃铛，叮当滚到徐伯脚边。他忙弯腰捡起，耳根微微发红，低低道了声谢——堂堂武士，随身却带着只姑娘家的铃铛，倒有几分蹊跷。徐伯接过他递来的一小锭碎银，手都抖了，连声道不敢收，那少年却已翻身上马，扬声道：劳烦老丈了。你远远望着，心里那点猜测又笃定了一分。两骑在村口勒住缰绳，白衣少年四下张望，目光扫过村舍，扬声问：老丈，仙迹山往哪边走？他说话时故意压着嗓子，声音又清又脆，像含着块冰。徐伯还没来得及答话，那锦袍青年已翻身下马，拱手一礼，声音沉稳：在下李青麟，这是舍弟青君。我兄弟二人久仰仙迹山灵秀，特来寻访仙缘，想借贵村歇脚一晚，明日进山，不知方便与否？他说得客气，目光却越过徐伯的肩头，径直望向红霞深处那座仙迹山——那目光里的急切不似寻仙问道，倒像赶赴一场迟了许多年的约。你放下药杵，正要起身，忽然嗅到一丝极淡的腥气，混在黄昏的草木清香里，寻常人闻不出，你的指尖却微微一凉——那不是虎狼的腥膻，是妖气，底下还压着一点极淡的、人为的香火味。你识海深处那道懒散声音难得主动哼了一声：有意思，这山上的东西，怕是有人养的。你望着那对兄妹的背影，心里也打起算盘：这趟浑水，看来是躲不掉了。',opts:[
  {k:'A',tag:'结善缘',c:'#6FA698',tx:'备好解毒丸，等他们上门',hint:'影响：李青麟好感+2；引出同行之机',run:()=>{rdLove('李青麟',2);log('红尘卷','你坐在院子里捣药，等那对兄妹来买“一丸尽解”的解毒丸。青年李青麟多看了你两眼，忽然笑道：“先生药理精纯，不似山野村夫。”他自称国都来客，想请你做个向导——那白马上的“少年”李青君却冷哼：“又一个骗子！”');}},
  {k:'B',tag:'藏锋',c:'#A98FD9',tx:'主动上前，点破山中凶险',hint:'影响：李青君好感+2；她记你一个人情',run:()=>{rdLove('李青君',2);log('红尘卷','你走到兄妹面前，直言：“山顶有怪虎，已生妖气，莫要夜里进山。”白马少年李青君挑了挑眉：“你怎么知道？”你答：“我闻得见。”她怔了怔，反被激出兴致：“知难而上，才显诚意——不如我们替你除了这虎可好？”');}},
  {k:'C',tag:'观察',c:'#C9A45C',tx:'借卖药之机套问来历',hint:'影响：徐伯好感、摸清二人底细',run:()=>{log('红尘卷','你以十两银子卖出一丸解毒药，趁机探问。李青麟自称“李青麟”，那“少年”是其弟“青君”——但你分明闻见白马少年身上一缕极淡的女儿清香。你不动声色，心里却记下了这个疑点。');}},
]},
{t:'夜话 · 红妆识破',meta:'强制节点：月夜遇李青君，识破其女扮男装',scene:'当夜，你被一阵窸窸窣窣的响动惊醒。月光斜斜照进窗来，院中影影绰绰有人走动，像在翻找什么。你披衣起身，无声推开半扇门，贴着墙根绕到晒药棚后——果不其然，白天那个白衣少年正蹲在你药架前，鬼鬼祟祟地把瓶瓶罐罐凑到鼻尖下闻，挑出几瓶解毒清瘴的药，一股脑往怀里塞。你也不出声，只把脚边那捆晒干的麻绳悄悄顺在手里，蹑手蹑脚绕到他身后。少年身手不差，警觉得很，你才迈出两步他便霍然转身，短剑出鞘半截，月光下寒光一闪：谁！话音未落，你手里的绳圈已稳稳套住他的手腕，一拽一带，借着他转身的力道把他绊了个趔趄。他闷哼一声，反手要削绳索，你早防着这手，药杵横里一递，正抵在他腕脉上：大半夜的，偷药偷到主人家头上来了？少年僵在原地，僵持片刻，忽然泄了气，把怀里的药瓶一股脑丢回药架，闷声道：我……我哥夜里咳嗽得厉害，我想找点止咳的药，又不想惊动你。他说着咳嗽了两声，倒不像是装的——那咳声闷在胸腔里，带着旧伤的底子。你听得真切，他说话时声音又清又脆，哪有半分男儿的粗粝，分明是刻意压着嗓子。你心里一动，也不点破，只收回药杵，从架子上取下一只青瓷瓶丢给他：枇杷膏，兑温水服，一勺就够。他接住药瓶，愣了一愣，低低道了声谢，转身要走。你忽然开口：令兄不是咳嗽，是旧伤吧？夜风里他脚步一顿。你缓声道：他今日下马时左肩僵了一瞬，是受过贯穿伤的旧疾，天阴雨湿便要发作，拖久了于寿数有损。我这里有一味外敷的膏药，专治这种陈年暗伤，一夜便能见好。他猛地回头，月光下那双眼睛又惊又疑，盯了你半晌，才轻声道：你……你到底是什么人？他说话时忘了压嗓子，声音清脆如泉，月下听来，分明是少女的嗓音。你也怔了怔。他似也察觉失言，慌忙别过脸去，耳根腾地烧红，一直红到脖颈：我……我不是……你装作没听见，只把膏药也递了过去，笑吟吟道：拿去吧，别让你哥明日进不了山。他一把抢过药瓶和膏药，逃也似的翻墙走了，墙头瓦片被他踩得咔嗒一响，过了好一会儿，隔壁院子里传来极轻的、压着嗓子的说话声，是他把哥哥摇醒，絮絮地说着什么。你隔着墙隐约听见那青年低哑的笑声：傻丫头，又胡闹。你摇摇头，正要回屋，脚步却忽然顿住——药架最里层那只木匣被挪了半分，你睡前明明闩好了院门，匣里那卷从不示人的旧阵图却像被人翻看过，又原样放了回去。你蹲身细看，匣角夹着一根极细的乌羽，油光水滑，绝非山野禽鸟所有。你心头微凛：那丫头偷药是假，探你的底才是真。你摇了摇头，正要回屋，山那边忽然传来一声低沉的虎啸，震得檐角积灰簌簌而落——虎啸声里，还夹着另一种令人心悸的嗡鸣，像某种法器被催动的颤音，一下一下，极有规律，仿佛有人在暗处操控着它。你识海深处那道懒散声音忽然清醒了几分，语气第一次带上了凝重：妖气底下藏着人为的气息。这虎……怕是被人用邪法喂大的，专等着有缘人送上门。你问它：能对付么？它沉默片刻：寻常法子不能，但破它身上那层人为的禁制，倒未必不能。你且看那对兄妹的枪法，路数里藏着一套破瘴的门道，像是专门练来克这东西的。你心头一跳：这对兄妹……怕是早就在为今日进山做准备了。你望着仙迹山的方向，月光下那团红霞似乎比白天更浓了一些，像一锅烧开又慢慢收汁的浓汤，沉甸甸地压在心头。你关上房门，把那道声音的话在心底过了三遍，一夜没睡踏实——窗外那嗡鸣声，后半夜才渐渐歇了。',opts:[
  {k:'A',tag:'坦诚',c:'#6FA698',tx:'告诉她自己布了缚妖阵，请她兄妹明日同除虎',hint:'影响：李青君好感+3，走合力除虎线',run:()=>{rdLove('李青君',3);S.rd.f.除虎线='合力';log('红尘卷','李青君眼睛一亮：“缚妖阵？你果然有点门道！”她拍着胸脯说会拉上哥哥。临别她翻身上马，忽然回头：“喂，你叫什么名字？”“……秦某不在，我是无名散修。”她哼了一声：“不说拉倒，明天见！”');}},
  {k:'B',tag:'试探',c:'#C9A45C',tx:'不托底，只说自有办法，请她护住村民',hint:'影响：李青君将你当“高深莫测”之人',run:()=>{S.rd.f.除虎线='护民';log('红尘卷','你只说了句“虎有我，人有你”。李青君愣了半天，嘟囔道：“神神叨叨的……”却还是连夜去敲了各家各户的门，把村民都赶回了屋里。月光下，你看着她忙前忙后的背影，忽然觉得这姑娘莽归莽，心里是真装着人的。');}},
  {k:'C',tag:'守密',c:'#8B6FA8',tx:'不答虎事，只点破她女儿身',hint:'影响：李青君好感+1、尴尬离场；你独面妖虎',run:()=>{rdLove('李青君',1);S.rd.f.除虎线='独行';log('红尘卷','李青君涨红了脸，丢下一句“登徒子”就跑了。你独自站在院中，听着山上传来的虎啸，把狼牙棒…不，把你的药杵握得紧了些。');}},
]},
{t:'除虎 · 缚妖阵',meta:'强制节点：妖虎之战（化妖瘴催生的插翅虎）',scene:'翌日天光未亮，李青麟便来敲门。他换了一身玄色劲装，长枪斜背，精神抖擞，昨夜那点咳喘早被膏药压了下去，拱手一礼：先生既愿同行，青麟感激不尽。他身后，李青君一身利落短打，银枪在手，冲你挑了挑眉，眼底分明写着不信，却碍着哥哥的面子没说什么，只把马缰绳甩得啪啪响，别过脸去假装看风景。你背起药箱，又拎了一捆刻满符纹的桃木楔子，引着二人沿樵径上山。晨雾未散，林间白茫茫一片，越往上走瘴气越重，草木也越发狰狞——藤蔓如蛇缠满树干，蕨类高过人头，脚下的腐叶踩上去噗噗作响，偶尔露出半截白骨，也不知是野兽还是人的。李青君到底是少年心性，走着走着便憋不住话，拿枪尖挑开一丛挡路的藤蔓，低声问：喂，这山看着也不高，怎么瘴气这么重？你随口应：山不在高，有妖则灵。她呸了一声，还想再问，被李青麟一个眼神止住。你边走边留神打量地势，趁二人不注意，将一枚枚桃木楔子不着痕迹地按进树根、岩缝与乱石堆里，袖中掐指默算方位——这是你昨夜就盘算好的缚妖阵，以山中地势为盘，二十八处阵眼，暗合二十八宿，只等那东西自投罗网。走到第七处阵眼时，你蹲下身拨开枯叶，发现地上竟有一道焦黑的灼痕，呈爪形，深达寸许，边缘还残留着极淡的腥气——那畜牲在这山上来回过不止一趟。你心头一紧，面上不动声色，继续布阵。行至半山腰，晨雾忽然散开一角，露出一片开阔的乱石地。乱石地寸草不生，地面却光滑得异常，仿佛被什么野兽日复一日地摩挲，连石头棱角都被磨圆了。你脚步一停，抬手示意二人噤声。乱石地中央，一头半人高的猛虎正伏卧着，虎首缓缓转向你们——它背上生着一对肉翅，收拢时紧贴脊背，浑身皮毛油亮如缎，血色瞳孔里竟没有寻常兽类的凶蛮，反而透着一种近乎不悦的灵智，仿佛在责怪你们打扰了它的清静。它缓缓站起身，喉咙里滚出一串低沉的呼噜声，竟隐隐带着几分威压，尾巴一扫，碎石哗啦啦滚下山坡。李青君攥紧银枪，手心沁出汗来，低声问：这就是那怪虎？翅膀都长出来了，还是虎么？李青麟缓缓抽出长枪，油布滑落，枪尖寒芒如电，沉声道：不管是什么，今日都得除了它，否则山下百姓寝食难安。话音未落，妖虎低吼一声，双翅猛然展开，带起一阵腥风，乱石飞溅！它扑击的速度快得惊人，李青君银牙一咬，银枪如练，抢先掠出，枪尖直取妖虎咽喉：妖物，吃我一枪！妖虎肉翅一拍，竟硬生生拍开她的枪锋，虎爪顺势横扫，爪风凌厉如刀，刮得地面石屑纷飞！李青麟大惊，长枪一抖化作银龙之形，从侧翼抢入，枪芒如雨点般罩向妖虎肋下：青君退后！兄妹二人一攻一守，配合默契，枪影重重叠叠，将妖虎困在当中。妖虎厉啸连连，翅爪并用，竟与他们斗了个旗鼓相当——这畜牲通了些灵智，晓得避实就虚，专挑李青君枪势稍老的空当扑击，几次险险擦着她的咽喉掠过，惊得她鬓发散乱，又咬牙挺枪再上。你站在阵外，不急着出手，只凝神观察妖虎的走位，待它被兄妹逼得连退三步，堪堪踏入你预设的阵眼范围时，你猛地将手中最后一枚桃木楔子钉入脚下石缝，沉声一喝：起！二十八道符纹同时亮起，游走如蛇，乱石地上凭空织出一张金色的网，兜头罩下！妖虎猝不及防，被金网缠住肉翅，挣扎间身形一滞。李青君眼睛一亮，枪尖急刺，正扎在它肩胛，血花迸溅！妖虎痛吼，双翅狂拍，竟扯断几根金网丝线，转身就要扑向你——它似乎记得，束缚它的气味就来自你。腥风扑面，血盆大口近在咫尺，獠牙上的涎水几乎滴到你脸上，那双血瞳里竟透出一丝近乎哀求的狰狞。你稳稳站在原地，手按大地，缚妖阵纹在你掌下再度亮起，地底传来低沉的嗡鸣。虎吼声里，你眼角余光瞥见乱石地中央那道裂缝中，袅袅飘出一丝暗红烟气，带着浓重的香火与血腥味——那才是妖化的根源。一头好好的猛虎，是被这地底的东西，生生喂成了妖。',opts:[
  {k:'A',tag:'并肩',c:'#C4675C',tx:'拔药杵入阵，与兄妹同战妖虎',hint:'影响：入战（妖虎·后期）；胜后声望+5、挖出化妖炉',run:()=>{log('红尘卷','你跃入战圈，与李家兄妹并肩。妖虎咆哮着扑向你——它似乎记得，束缚它的人就是你。');startCombat(rdEnemy('化妖插翅虎',1.15),'rdFight');}},
  {k:'B',tag:'策应',c:'#6FA698',tx:'在外围以阵法策应，保兄妹无伤',hint:'影响：李青麟好感+2、李青君好感+2，观战得妖虎之秘',run:()=>{rdLove('李青麟',2);rdLove('李青君',2);log('红尘卷','你稳住缚妖阵纹，让妖虎无法遁逃。李青麟长枪如龙、李青君枪芒如电，兄妹合击之下妖虎轰然倒地。李青麟收枪含笑：“先生这阵，比这虎厉害。”你蹲下身，从地底挖出一个泥泞的小香炉，炉边雕着狰狞妖物——你抡起药杵，一棒砸得稀碎：“就是这东西，让虎成了妖。”');}},
  {k:'C',tag:'先机',c:'#C9A45C',tx:'趁乱先挖出化妖香炉，断了虎的妖源',hint:'影响：风险高，若失败需独战妖虎',run:()=>{log('红尘卷','你趁兄妹缠住妖虎，扑向地底的香炉。妖虎似有所觉，厉吼扑来！');startCombat(rdEnemy('化妖插翅虎',1.25),'rdFight');}},
]},
{t:'道观 · 人面蛛',meta:'强制节点：暴雨夜入无人道观，必遇人面蛛妖',scene:'出山第二日，三人策马行至午后，天色骤变，黑云如墨，压得山道上一片昏暗。没走出几里，暴雨倾盆而下，豆大的雨点砸在脸上生疼，打得马匹嘶鸣不止，泥浆溅了满身。李青君抹了把脸上的雨水，四下张望，指着右侧山腰喊：那儿有座道观！三人纵马疾驰过去——道观不大，黑灯瞎火，门板半掩，檐角蛛网层层叠叠，显然荒废已久。一推门，一股陈腐的灰尘气扑面而来，呛得人直打喷嚏。大殿正中供着一尊神像，只是神像上罩着一张巨大的蛛网，从梁上垂到供桌，密得几乎不透光；地上横着几只死老鼠，干瘪得只剩皮骨，像被什么东西吸干了血肉，只余一层干皮贴在骨架上。李青君是个见不得脏乱的性子，抄起门闩就要去扫那张蛛网，被你一把按住手腕。她不解地瞪你。你低声道：一个月没人住的道观，能结这么大的网？那得有多少飞虫供它吃。她愣了一愣，顺着你的目光看向那张蛛网，忽然打了个寒噤，悄悄退后半步。识海深处那道懒散声音慢悠悠地响起：蜘蛛性喜清净，别吵它，别破它的网，相安无事。你便招呼二人退到偏殿，只求避过这场雨。偏殿更破，神像缺了半截脑袋，供桌腿断了一根，用砖头垫着。李青君嫌弃地踢开一堆烂草，勉强腾出一块干净地方坐下，一边拧着湿透的衣摆，一边嘀咕：这破地方，鬼影子都没有一个。李青麟却没什么抱怨，默默生起火堆，又取出干粮分给众人。雨声渐密，天色暗得像入了夜，火堆的光照得人脸忽明忽暗。你正要闭目养神，殿外忽然传来一阵杂乱的马蹄声和吆喝声，由远及近，紧接着，七八个江湖人推门涌入大殿，浑身湿透，骂骂咧咧地拧着衣裳，高声谈笑，声音震得屋瓦簌簌落灰。为首的是个满脸横肉的大汉，肩上扛着把鬼头刀，进门就踹翻了供桌，大马金刀地往上一坐：妈的，这雨说下就下，晦气！他目光一扫，瞧见偏殿里的李青君——她束着个不甚讲究的发髻，浑身淋得透湿，衣料贴着身段，虽是一身男装，眉眼间那份明丽却藏不住。大汉嘿嘿一笑，嬉皮笑脸地凑过去：好俊的小哥，白面皮细腰身，莫不是个兔儿爷？同行的江湖人哄堂大笑，笑声震得梁上灰尘扑簌簌直掉，打在蛛网上，蛛丝微微颤动。李青君脸涨得通红，手按枪柄就要发作，被你按住。你站起身，横身挡在中间，淡声道：奉劝各位，说话留神。那大汉斜你一眼：你算哪根葱？也敢教训你家爷爷？他仰天大笑，笑声却像被砍断一样，猛地止在喉咙里——一只小蜘蛛不知何时从梁上垂落，恰好掉进他张开的嘴里。他脸色霎时铁青，掐着脖子倒退两步，想吐吐不出，想咽咽不下，喉咙里发出嗬嗬的怪响，一双眼睛瞪得几乎要脱眶，额头青筋一根根暴起。变故只在一瞬之间。后门庭院的方向忽然传来一阵骚动，有人惊呼：珊瑚树！会发光的珊瑚树！满堂江湖人眼睛都直了，蜂拥而出，扑向后院——庭院里不知何时竟长出一株流光溢彩的珊瑚树，赤红如火，宝光流溢，在雨夜里妖异地发着光，每一根枝杈都像在冲人招手，雨点落在上面竟被弹开，化作细碎的宝光。贪念一起，谁也拦不住。七八个人扑到树下，伸手去抢那珊瑚枝，变故陡生——万道白丝从他们每一寸毛孔中喷薄而出，惨叫声被丝线堵在喉咙里，片刻之间，七八个人被缠成七八个白色人茧，悬在庭院的树枝间，像一串沉默的果实，轻轻晃荡，茧里的人还在微微抽搐，渐渐没了声息，鲜血顺着丝线渗出来，把白茧染出一朵朵暗红的花。而那个吞了蜘蛛的大汉整个人炸开，血肉横飞之中，一头马车大小、长着人脸的蜘蛛从他心口钻了出来，八只血红的复眼齐齐转向殿中，口器张合间，发出人一样的嘶哑笑声：鲜……鲜嫩的人肉……李青君脸色发白，却一步不退，银牙一咬，长枪如练，枪尖直指蛛妖：妖怪，别伤人命！暴雨如注，电光劈开夜色，照见那蜘蛛人脸上诡谲的笑。',opts:[
  {k:'A',tag:'同战',c:'#C4675C',tx:'与李青君合力除妖',hint:'影响：入战（人面蛛·强）；胜后得妖气线索',run:()=>{log('红尘卷','你与李青君一左一右攻向人面蛛。蛛丝漫天，腥风扑面——这妖已通灵将成，远非妖虎可比。');startCombat(rdEnemy('人面蛛妖',1.35),'rdFight');}},
  {k:'B',tag:'智取',c:'#A98FD9',tx:'借蛛性设局：毁其网引其怒，再以火攻',hint:'影响：李青君好感+2；胜算更高但耗灵力',run:()=>{rdLove('李青君',2);S.mp=clamp(S.mp-15,0,S.mpMax);log('红尘卷','你反手一剑挑碎蛛网，人面蛛厉啸转身扑向你——正撞上你备好的火阵。李青君趁机一枪贯其颅：“你这脑子，比枪好使！”妖躯倒地，一缕妖气散尽。你从灰烬里拾起一枚未成形的妖丹。');}},
  {k:'C',tag:'守心',c:'#6FA698',tx:'护住幸存者撤离，不恋战',hint:'影响：功德+1；妖物成丹为祸，埋下后患',run:()=>{S.merit++;S.rd.f.蛛患='未除';log('红尘卷','你拖起受伤的江湖人破窗而出。身后传来蛛妖吞噬生魂的咀嚼声与得意的嘶鸣——你救下了人，却没能除了妖。夜雨中，李青君罕见地没有怪你，只低声道：“它记住了我们。”');}},
]},
{t:'灵堂 · 白骨阵',meta:'强制节点：张家庄灵堂，白骨聚灵阵，必被围困',scene:'横山郡张家庄近来闹鬼闹得凶，庄主张员外惨死房中，死状蹊跷——眼窝深陷，皮肉干瘪，一身精血像被抽了个干净，只剩一张干皮包着骨头，仵作验了三天，只写了暴毙二字，连夜盖棺下葬，生怕再招来什么。张家的银子压在案头没人敢碰——前一个来查案的老捕头，回家当晚就中了风，嘴里颠来倒去只念着两个字：白骨，白骨。官府查了半月无果，悬赏百两请人驱邪。你接了这单活儿，带着李家兄妹夜入张家庄。庄里人心惶惶，一到入夜便家家闭户，连狗都不吠了，偌大的庄子静得像座坟，只有几盏惨白的灯笼挂在屋檐下，被风吹得晃晃悠悠。张少庄主是个白面书生模样的年轻人，一身重孝，将你们迎入灵堂，神色哀戚：家父停灵在此，夜间总有些不干净的东西作祟，闹得阖庄不宁，有劳先生了。他说着叹了口气，眼眶泛红，倒像真个孝顺。可他说话时目光闪烁，总在你脸上打转，像在掂量什么。你只当没看见，拱手还礼：好说，先看看令尊灵堂。灵堂设在正厅，白幔低垂，烛火昏黄，正中一口黑漆棺材，棺前供着果品，香烟袅袅。你只扫了一眼，脚步便顿住了——棺材底下的青砖缝里，露出森森白骨，一具、两具……层层叠叠，竟被人为摆成八个方位，骷髅头空洞的眼窝森然朝外，有淡红的烟气从白骨口中缓缓散出，顺着地砖的纹路游走，汇入棺底，像无数细小的蛇钻进棺材里去。这不是什么闹鬼，是有人用白骨布了一座邪门聚灵阵。你识海深处那道懒散声音忽然开口，难得的清醒：邪门聚灵阵，叠着八门金锁的机关变化。布阵的人……手上至少沾了百十条人命，而且这些年一直在添新的。李青君没你这份眼力，只觉灵堂阴风阵阵，搓了搓胳膊，低声说：这地方怎么这么瘆人，跟进了坟地似的。李青麟却察觉了什么，攥紧枪杆，目光在灵堂里缓缓扫过，最后落在你脸上，无声地问：有古怪？你微微颔首。你不动声色，沿着灵堂缓步踱了一圈，目光扫过八个方位的骷髅，忽然在东南一角停住——那里的一具骷髅，头骨上刻着一道极细的符文，与其余七具不同。其余七具的白骨颜色灰败，像是积年累月的旧骨，骨面还有啃噬的痕迹；唯有这一具，骨质莹白如新，像是才埋进去不久，连骨髓都还没干透。你蹲下身，指尖抚过那道符文，指腹传来一丝极淡的灵力波动，微微发烫，像被什么东西隔着骨头盯了一眼。你心里有了计较，站起身，径直走向东侧那具刻符的骷髅，伸手按住头骨，猛地一旋。咔嗒一声轻响，灵堂东侧的一面墙无声滑开，露出一道幽深的暗门，门后透出腥风与腐败的气味，隐隐还有流水声，像有活物在暗处蠕动，又像有什么东西在门后等着。你刚要探头查看，身后忽然火把通明，人影幢幢——张少庄主不知何时领着一群持刀庄丁将灵堂围了个水泄不通，火把的光在他脸上跳动着，那点哀戚早没了，皮笑肉不笑地看着你：先生，大半夜的，翻我家机关，是想偷什么？家父尸骨未寒，你们就这般作为，莫不是那些个招摇撞骗的贼道？李青君气得银枪一横，怒道：你血口喷人！你爹棺材底下埋着白骨阵，聚的是生人精血，你倒问问你家老爹，他都干了些什么好事！张少庄主面色一变，随即恼羞成怒：满口胡言！我看你们就是觊觎我张家财物，故意设局讹诈！来人，给我拿下！庄丁们持刀逼近，刀光在烛火里连成一片，将你们三人围在当中。你站在暗门与火把之间，目光缓缓扫过那些骷髅——八门金锁，死门开在正北，生门藏在棺下。布这阵的人，比你想的更狠。这庄子里的水，比那口棺材还深。',opts:[
  {k:'A',tag:'破阵',c:'#C4675C',tx:'当场揭开白骨阵，正面对质庄丁',hint:'影响：李青君好感+2、声望+4；可能动武',run:()=>{rdLove('李青君',2);log('红尘卷','你朗声道：“聚生灵之气以修行的邪阵，也是你家祖宗布置的？”少庄主语塞，随即恼羞成怒挥手：“拿下！”李青君横枪而立，枪尖寒芒扫过一圈，竟逼得庄丁无人敢先动。远处屋檐上，一道蓝白道袍的身影一闪而逝，只留下一声几不可闻的轻咦：“八门金锁，一眼而破……”');S.reputation+=4;}},
  {k:'B',tag:'查证',c:'#7FA8C9',tx:'先逼问主谋，追查阵图来历',hint:'影响：李青麟好感+2、得东华子线索',run:()=>{rdLove('李青麟',2);log('红尘卷','你一手扣住少庄主手腕，淡声道：“阵纹繁复，非村野术士能布——你这阵图，哪来的？”他脸色骤变，脱口而出：“是……是国师府的道爷赏的，只叫我们圈养此地，供他取……”话音未落，他像被什么掐住喉咙，翻白眼倒地。你与李青麟对视一眼——国师府。这条线索，比一具白骨更沉。');}},
  {k:'C',tag:'纵容',c:'#8B6FA8',tx:'收下封口银，佯装不知',hint:'影响：得200灵石、恶名+2；线索中断',run:()=>{S.lingShi+=200;S.jianghu.evil=(S.jianghu.evil||0)+2;log('红尘卷','少庄主见你神色松动，连忙奉上银两。你掂了掂，收进袖中，说了句“看错了”便走。身后传来李青君不敢置信的目光——她没有当场发作，只是那之后一路上，再没主动同你说过半句话。');}},
]},
{t:'离火城 · 长生观',meta:'强制节点：国都长生观前，必遇明河赠剑',scene:'南离国都离火城，这几日正在举城戴孝——太子遇刺驾薨，王宫内外白幡如雪，连街市上的吆喝声都低了几分，满城商铺门前都挂了素白的灯笼。你一路行来，听见茶客们压着声议论：太子殿下仁厚，可惜天不假年；也有人摇头叹气，说国师府这阵子香火愈发旺了，求什么的都有。你把这些话暗暗记下。李青麟兄妹入宫奔丧，你无事一身轻，便独自在城中闲走。离火城不愧是国都，青石长街宽阔，商铺鳞次栉比，即便国丧期间，市井烟火气依然十足——卖糖人的吹出栩栩如生的龙，耍猴的敲着锣满街转，茶馆里说书先生正拍着醒木讲妖狐报恩的故事，听客们挤得里三层外三层，不时爆出一阵叫好声。你走走停停，在布庄给徐伯捎了匹青布，又给村里娃娃买了几串糖葫芦，路过一家药铺时，还顺手替坐堂老大夫指点了两味药性的错处，惹得那老大夫追出半条街非要请你喝茶。不知不觉，你走到一座高观前——长生观。那是离火城最高的建筑，登仙台九层，飞檐斗拱直插云霄，竟比王宫还高出一截，仿佛要替这人间离天更近些。石阶上人潮如织，男女老幼虔诚叩首，香火缭绕得连日光都染上一层淡金，那股子檀香味隔了半条街都闻得见。你拢了拢衣袖，嗅出那香里藏着一丝极淡的甜腥，像炼过丹的余味——寻常香客闻不出来，你这种常年捣药的，却一鼻子就辨了个分明。你仰头望了望那九层高台，心里那股说不清道不明的异样感又浮了上来——这观里的香火气太重了，重得不像诚心供奉，倒像在遮掩什么。你正要抬脚离开，观门内忽然走出一名道姑，径直停在你面前。你从没见过这么好看的道姑——蓝白相间的道袍随风轻摆，素色道巾下是一张清冷出尘的脸，眉目如远山含黛，偏偏她手上倒提着一柄长剑而非拂尘，剑鞘素净，像一泓秋水收了锋芒。整个人仿佛站在红尘之外，遗世独立，只一双眼平静地看着你，像在看一个等了很久的答案。她开口，声音清冷如碎玉：公子背囊上露出的铁柄，是公子的武器？你低头一看——那是你随手别在行囊边的药锄柄，昨夜除蛛时沾了妖血，虽已擦净，仍隐隐透出一丝妖物的腥气。你心头微凛，面上却不动声色：道长好眼力。敢问如何称呼？贫道明河，玄门正宗出身，游历至此，专为降妖除魔。她目光落在你脸上，平静得像夜空里的银河，没有一丝波澜：我观公子器宇，不似寻常医者。昨夜离火城外三十里有人除了一头通灵蛛妖，用的是缚妖阵加火攻，手法老练——是公子手笔？你没想到她连这个都能算出来，一时语塞。她也不追问，话锋一转，声音沉了几分：公子既除过妖，当知妖物之患非止山林。贫道想请公子帮一个忙。李青麟府上……妖气深浓。她顿了顿，眼底掠过一丝凝重，声音低得几乎只有你们二人听得见：贫道立过誓言，术法只用于妖魔，不得用于凡人。李府门深，贫道不便擅入，又恐府上妖物害人，迟迟不能决断。说着，她从袖中取出一柄桃木剑，剑身温润，隐隐有清气流转，剑柄处系着一枚素色剑穗，双手递到你面前：此剑附了驱邪之术，遇妖自会示警渴饮妖血，与人则无伤。若公子执意入府，这剑你收着——可免被妖物所害。她说完便静静看你，风拂过她的道袍下摆，蓝白的衣袂在香火烟气里轻轻飘荡，仿佛这满城喧嚣都与她无关。你伸手接过桃木剑，入手温润，剑身轻轻一颤，像认了主，那枚剑穗在你指间一晃，带着淡淡的清苦药香。你抬头再看她时，她已转身拾级而上，衣袂飘飘，没入九层高台的香火深处，只余一缕清音远远传来：公子……自重。',opts:[
  {k:'A',tag:'受剑',c:'#A98FD9',tx:'接过桃木剑，答应暗中查探李府',hint:'影响：明河好感+3；得到法宝诛妖桃木剑',run:()=>{rdLove('明河',3);S.fashu=S.fashu||[];if(!S.fashu.find(f=>f.n==='诛妖木剑'))S.fashu.push({n:'诛妖木剑',elem:'金',power:20,mp:10,系:'剑'});log('红尘卷','你接过桃木剑，入手温润，隐隐有清气流转。明河微微颔首：“剑上附了术，遇妖自会渴饮妖血，与人无伤。”她转身欲去，忽又驻足：“公子……自重。”你望着她消失在长街尽头的背影，忽然想起一句很老的话：有些人修的是术，有些人修的是道。');}},
  {k:'B',tag:'守诺',c:'#6FA698',tx:'婉拒调查，只应下与她同除国师之妖',hint:'影响：李青麟好感+2（不疑你）；明河好感+1',run:()=>{rdLove('李青麟',2);rdLove('明河',1);log('红尘卷','你摇头：“李青麟待我不薄，恕难从命。”明河也不恼，只深深看你一眼：“公子重诺，是好事。”她将桃木剑还是塞进你手里：“剑你收着，用不用在你。”说罢飘然而去。你握着剑站在原地，忽然觉得这道姑清冷归清冷，待人却意外地执拗。');}},
  {k:'C',tag:'权衡',c:'#C9A45C',tx:'收下剑但明言立场中立，两边都不得罪',hint:'影响：无好感变动，可左右逢源',run:()=>{log('红尘卷','你收下桃木剑，笑吟吟道：“道长放心，我这人最公道，谁作恶我帮谁收拾谁。”明河看了你半晌，似是没听出哪里不对，只点点头走了。倒是你识海里那道懒散声音又冒了出来：“啧，两头下注，滑头。”');}},
]},
{t:'夜翎 · 羽翼',meta:'强制节点：太子府初见李青麟与夜翎；夜翎身世浮出',scene:'太子案后，李青麟受封新太子，太子府换了门楣，往来的人也多了一倍不止，门前车马络绎，道贺的官员排成长队。这日午后，李青麟邀你入府小酌，说是多谢你一路相助。酒过三巡，他忽然放下酒杯，屏退左右，拍了拍手，朝殿角唤道：夜翎，过来。你这才注意到殿角一直站着一个瘦小的身影——一个十二三岁的黑衣小侍女，披着一件奇怪的黑披风，从领口一直罩到脚踝，直挺挺站着，既不说话也不行礼，垂着眼帘，安静得像一件摆在角落的物件。若不是她偶尔极轻地换一口气，简直要让人忘了那里还站着个人。听到呼唤，她沉默片刻，才慢慢走上前来，在阶下站定，仍是不抬头，只在披风下悄悄攥紧了手指，指节泛白。李青麟温声道：这是夜翎，往后跟在你身边听用。她性子冷，不爱说话，但手脚利落，你使唤着试试。说着他转向那小女孩，声音放得更柔：夜翎，这位是秦先生，我信得过的人。以后他的话，就是我的话。小女孩这才飞快地抬眼瞥了你一下，又垂下去，细声道：是。你打量着眼前的小女孩，正要客气两句，识海深处那道懒散声音忽然凝起，难得的认真：化形妖，还是幼年期。妖气被那披风压着，凡人看不出，瞒不过我。你心里一动，面上却不动声色，笑着谢过李青麟，将小侍女领回了住处。一路上她默默跟在你身后三步远，不近不远，像一片影子，踩着你踩过的每一块砖，连你停下系鞋带，她也立刻停下，垂着手等。回到住处，你推门进屋，回头一看，她站在门槛外，犹豫着要不要进来。你说：进来吧，把门关上。她这才跨过门槛，仍是站着，双手规规矩矩拢在身前到了晚间，她不知从哪寻来热水，替你兑好洗脚水，又默默退到外间守着——分明是个被当物件养大的孩子，做起伺候人的事来却熟极而流，熟得让人心里发酸。她仍是站着，双手规规矩矩拢在身前，像一株移植到陌生花盆里的小树，浑身都是防备，连呼吸都放得极轻。你点了一盏灯，灯影摇摇晃晃，照着她半张苍白的小脸。她一直垂着眼不敢看你，像是怕灯光照见什么不该照见的东西，直到你问起她的年岁，她才像鼓了很久的勇气，轻轻应了一声。你温声问：夜翎，你多大了？她垂着眼：不知道。被殿下捡到那年，我像十二三岁，如今大概……十五六了吧。她的声音稚嫩却淡漠，听不出喜怒，像在说一串与自己无关的数字。你心里微微一紧，又问：你原先住在哪里？她沉默了很久，久到你以为她不会回答了，才忽然开口，一字一句，平静得像在说别人的事：我本是一条普通小蛇，被东华子的化妖瘴催生，启灵成妖。他四处设化妖瘴催生小妖，为的是取妖丹炼化服用，修行增寿。我们那一窝七条，死了六条——都被挖了丹。她顿了顿，声音更轻：我亲眼看着它们一条条被开膛取丹，血把池子都染红了，那气味我到现在都记得。她说这话时语气始终平平的，可指尖却无意识地抠着披风的边角，把布料都捻皱了。你忽然明白，她不是不怕，是怕惯了，怕到不知道该怎样怕了。我拼死闯出炼妖阵，只剩一口气，是殿下救了我。名字也是他起的，说是一根稚嫩的翎羽，在夜晚里透出惊惶的血色。她说着，终于抬起眼，黑沉沉的瞳仁里映着摇曳的灯火，没有恨意，也没有哀求，只有一种认命般的平静，像深潭底的水：殿下让我跟着你，说你不会杀我。她停了停，声音轻得像要散在风里：你……也会杀我吗？窗外风声呜咽，灯火在她眼底明明灭灭，映出那层薄薄的水光。她问完便不再看你，垂着头，像在等一场宣判，肩膀绷得又直又紧。',opts:[
  {k:'A',tag:'善意',c:'#D88FA5',tx:'告诉她：你是人是妖由你自己定，翅膀也很好看',hint:'影响：夜翎好感+3，走驭妖线',run:()=>{rdLove('夜翎',3);log('红尘卷','夜翎愣住了。她大概从没听过这样的话——她出生的意义就是被取丹，活着是因为血誓还有用。她张了张嘴，没说出话，半晌才极小声道：“……那你，别把我当怪物。”窗外月光明亮，照见她披风下探出的一对稚嫩羽翼，微微发着抖。');}},
  {k:'B',tag:'同盟',c:'#7FA8C9',tx:'只谈合作：她知东华子底细，你替她除东华子',hint:'影响：李青麟好感+2、夜翎好感+1，纯利益同盟',run:()=>{rdLove('李青麟',2);rdLove('夜翎',1);log('红尘卷','你平静道：“我不杀你。我杀东华子——他那些化妖瘴，也该有人管管了。”夜翎看了你很久，忽然露出一个极浅极淡的笑，像是冰面下终于透出的一丝暖意：“那……我们算是盟友了。”她伸出手，试探着、又缩回去，最后还是你主动握了握她微凉的手指。');}},
  {k:'C',tag:'密报',c:'#C9A45C',tx:'将夜翎之事告知明河，换她的信任',hint:'影响：明河好感+2；夜翎线断绝，她将恨你',run:()=>{rdLove('明河',2);rdLove('夜翎',-3);log('红尘卷','你权衡再三，还是将夜翎的来历写成纸条，放在明河常过的桥头。三日后，夜翎依旧出现在你面前，只是眼底那一点刚亮起的暖意彻底熄了。她平静得像初见：“明河道长今日来府上除妖，扑了个空——多谢你，让我提前知道该躲。”她转身离去，披风在风里鼓起，像一只被惊飞的鸟。你忽然觉得，自己好像做错了一件很蠢的事。');}},
]},
{t:'太子案 · 风起',meta:'强制节点：太子案疑云笼罩，李青麟遭疑，抉择立场',scene:'太子死于非命那夜，恰有人亲眼目睹妖气如电，出没于李青麟府邸上空。消息传开，朝堂风向微妙起来——有御史连夜上本，参李青麟弑兄夺嫡，奏章写得字字诛心，什么豺狼野心、人面兽心，恨不得把他钉死在骂名上。一夜之间，新太子府门前冷落，往日趋奉的官员避之唯恐不及，连府里采买的管事出门买菜，都被人指指点点，说新太子府上的狗都带着妖气。夜里还有胆大的泼皮，往府门上扔烂菜叶，被巡夜的侍卫撵出半条街去。这些风言风语传进府里，下人们噤若寒蝉，走路都踮着脚，生怕惊动了什么。你亲眼见一个端茶的小厮手抖得厉害，茶盏摔了个粉碎，跪在地上抖成筛糠。李青麟却只摆摆手让他下去，转头对你苦笑：连自家下人都吓成这样，我这太子当得，够窝囊的。你站在廊下，看着满府惶惶，心里却越来越清明：太子死得蹊跷，妖气来得蹊跷，连御史的动作都快得蹊跷——像是有人早就算好了每一步，只等着把李青麟推进坑里。深夜，李青麟独坐后园亭中，面前温着一壶酒，两盏杯。他见你进来，也不客套，只把另一盏酒推到你面前，自己仰头饮尽一盏，半晌才开口，声音有些哑：先生信我么？你没有立刻回答，在他对面坐下，也饮了一盏，酒液滚过喉头，辛辣中带一点回甘，是上好的秋露白。你放下酒盏，缓声道：殿下信我么？李青麟怔了怔，随即笑了，那笑里有几分疲惫，几分苦涩，又有一点难得的暖意：先生是第一个问我这句话的人。他给自己斟满酒，望着杯中晃动的月影，低声道：我那个兄长……小时候偷偷教我骑马，我摔断腿那年，是他背我走了三十里山路去求医。那回我烧得人事不知，他一个锦衣玉食的太子，背着我在泥地里摔了七八跤，鞋都丢了一只。到了医馆门口，他先跪下来给大夫磕头，说救救我弟弟，我什么都给你。你想起仙迹山上，他纵马替你挡开妖虎的那一枪；想起除蛛那夜，他把李青君护在身后的背影；也想起张家庄灵堂里，那具刻着符文的骷髅头——八门金锁，阵纹繁复，非村野术士能布，那条线一路往上，隐隐连着长生观国师府。你心里清楚，李青麟诛东华子的执念，比王位更深。他若要弑兄，早该动手，何必等到太子死了，才让自己落进这满城风雨的算计里？你说：殿下要的不是王位。你看着他的眼睛：你要的是给令兄一个交代，给南离一个太平。李青麟端酒的手顿住了，半晌，他哑声道：先生知我。亭外月色如水，夜风穿过亭子，吹得酒盏里的酒微微起皱。远处更鼓敲过三响，太子府的灯笼在风里明明灭灭，像一城人都悬着的心。正此时，墙头传来一声轻响，李青君披着夜色翻墙进来，落地无声，一身夜行衣，手里攥着一封皱巴巴的密信，眼眶红红的，显然是哭过：查到了！太子案发当夜，东华子座下的炼丹童子出过宫！她把信拍在你面前，声音有些发颤：那童子走的是西门，守门校尉是我爹旧部，偷偷记了下来……我费了好大劲才弄到手。她抬头看你，眼底亮得灼人，像两簇小火苗：我哥不是凶手——你会帮他的，对不对？她问得又急又脆，像是怕你摇头。她说这话时攥着信的指节发白，却努力挺直了背，像小时候闯了祸站在夫子面前——明明心虚，偏要装出理直气壮的样子。她说着又把信往你面前推了推，纸页上还带着她掌心的汗意。李青麟静静望着你，没有开口，只把另一盏满上的酒又推近了一寸，酒面在月光下泛着细碎的银。你望着面前这对兄妹，心里那杆秤，其实早就有答案了。',opts:[
  {k:'A',tag:'佐证',c:'#C4675C',tx:'以方士身份连夜查证，替李青麟洗清嫌疑',hint:'影响：李青麟好感+4；从龙线关键',run:()=>{rdLove('李青麟',4);log('红尘卷','你连夜验过太子尸身遗留的药渣——那丹毒与长生观炼丹炉的残渣同出一源。你握着那纸证物走进朝堂，迎着满殿目光，一字一句道：“太子之死，非妖非兄，是丹毒。”满朝哗然。退朝后李青麟在无人处对你长揖到地：“先生此恩，青麟铭记。”远处，李青君抱着银枪倚在廊柱上，冲你弯起眼睛。');}},
  {k:'B',tag:'独查',c:'#7FA8C9',tx:'不站队，只查真相：直捣炼丹童子的窝点',hint:'影响：明河好感+2；线索指向东华子丹房',run:()=>{rdLove('明河',2);log('红尘卷','你不替任何人说话，只做一件事——查。你循着炼丹童子的踪迹摸到城外一座农庄，地窖里赫然是成堆的白骨与朱紫草。你取回一枚刻着“长生”二字的令牌，连夜掷在太子府桌上。李青麟看着令牌沉默良久，忽然笑了：“先生这份公道，比站队更难得。”');}},
  {k:'C',tag:'抽身',c:'#6FA698',tx:'朝堂水深，称病不掺和',hint:'影响：两不相帮，留待终幕自决',run:()=>{log('红尘卷','你称病闭门，谁都不见。门缝里塞进来一张纸条，是李青君的字：“我知道你不是怕事的人。可你若真不愿蹚浑水……那便愿你此世，永远不用蹚浑水。”你捏着那张纸，忽然有点想喝酒。');}},
]},
{t:'终幕 · 东华地宫',meta:'强制节点：国师东华子图穷匕见；按前缘抉择终局',scene:'所有线索终于连成一条完整的线：太子死于丹毒，丹毒出自长生观；长生观地底藏着一座地宫，国师东华子以化妖瘴催妖取丹，以万民药草炼丹，甚至借炽焰燧石之名搜刮全国灵材，凡不从者，轻则倾家，重则灭门。那位在离火城人人敬仰、活神仙一般的国师，此刻就站在你面前——地宫深处，丹炉火光明灭，映得满壁符文忽明忽暗，铁链的影子在地上拖出长长短短的黑痕。东华子白发童颜，一袭鹤氅，笑吟吟地抚着丹炉，像一位慈眉善目的长辈看着自家晚辈：小友资质不俗，何不随贫道共参长生？他嗓音温润如春风，却让你后背一层一层地发凉，指尖的桃木剑几乎要按捺不住地出鞘。你目光扫过地宫角落——一杆银枪被镇妖符钉在壁上，枪缨沾血，是李青君的；一方黑色披风被压在炉鼎之下，露出一角，是夜翎的。她们二人被东华子擒住，镇在地宫，生死一线。你看见李青君苍白的脸上那双眼睛还在倔强地瞪着你，嘴唇翕动，像在说快走，她腕上的伤口还在渗血，染红了半截衣袖；夜翎缩在角落里，披风下露出的一小截手腕被铁链勒出青紫的痕迹，她抬头望你，眼底没有哭，却比哭更让人心口发堵她大概是怕你担心，还努力扯了一下嘴角想笑一笑，可那笑比哭还难看。铁链一晃，叮当响了一声。——她张了张嘴，无声地对你说了两个字：别来。你握紧手中的桃木剑，剑身在你掌心里微微发烫，仿佛在渴饮着什么，剑尖不受控制地指向东华子。你识海深处那道懒散声音缓缓响起，一字一顿：此人修行至少百年，丹道通玄，正面硬撼，你十死无生。它顿了顿，又补了一句：但他今日炼炉正盛，分心乏术——你的机会，只在此时。丹炉里的火光摇曳了一下，照见东华子眼底一闪而过的贪婪。你看得很清楚，他看你的眼神，和看那些妖丹并无不同你想起夜翎说的那一窝七条小蛇，想起张家庄棺材底下那些层层叠叠的白骨——原来在这样的人眼里，天下万物，都不过是炉中一味药。——在他眼里，你也不过是一味上好的药材，药性比那俩丫头更足，更值得慢慢炮制。地宫深处传来铁链拖地的声响，东华子慢条斯理地开口，嗓音依旧温润：小友不必急着答复。贫道这炉丹，还差一味药引。他抬手一指，指尖遥遥点向被镇住的李青君：这丫头的精血，倒是上佳。你若肯替贫道取来，那卷化妖丹方，贫道便赠予你——你我共享长生，岂不快哉？他说这话时眼睛一眨不眨地看着你，像在欣赏一幅画，又像在打量一件货物。你甚至能在他眼底看见一丝近乎欣赏的惋惜，像名厨遇着好食材，舍不得一刀了结，偏要细细地片着吃。李青君脸色惨白，却咬着唇没有出声，只是那双眼睛死死盯着你，不肯移开半分。夜翎在角落里忽然抬起头，黑沉沉的眼睛直直望着你，嘴唇动了动，没有声音，但你读懂了她的口型：跑。你深吸一口气，把桃木剑握得更紧，一字一句道：放下她二人，我与你谈谈长生。东华子笑容更盛，眼底却深不见底：好说，好说。他缓缓抬起手，地宫四壁的符文同时亮起你余光扫见壁上那杆银枪旁的镇妖符微微发焦——李青君在符下挣动，想替你争出一线机会。，嗡鸣声大作那些符文游走如活的蛇虫，丹炉下窜起幽蓝的火苗，连地面都微微震颤起来。，丹炉里的火光猛然窜高，映得满室通红，也映出你眼底那一点决然的光。抉择的时刻，到了。',opts:[
  {k:'A',tag:'护道',c:'#6FA698',tx:'唤明河同至，联手斩东华子',hint:'影响：战东华子（终局BOSS）；胜则「护道斩邪」',run:()=>{if(rdInit().love.明河<3){log('红尘卷','你捏碎传讯符，可明河与你不过是数面之缘，未必会来……她来了。蓝白道袍自天而降：“贫道说过，术法只用于妖魔——东华子，你已是魔。”');}else{log('红尘卷','你捏碎明河所赠的传讯符。片刻，一道蓝白身影自天而降，明河持剑而立，目光清冷：“贫道说过，术法只用于妖魔——东华子，你已是魔。”');}startCombat(rdEnemy('东华子·护道',1.5),'rdBossMing');}},
  {k:'B',tag:'从龙',c:'#C9A45C',tx:'传信李青麟：里应外合，夺宫除贼',hint:'影响：战东华子（终局BOSS）；胜则「从龙功成」',run:()=>{log('红尘卷','你燃起太子府特制的传讯焰。片刻，地宫外杀声震天——李青麟亲率铁卫破门而入，银枪如龙：“东华子，你借国师之名搜刮南离二十年，该还了！”你与李青麟并肩攻向丹炉后的身影。');startCombat(rdEnemy('东华子·从龙',1.5),'rdBossQing');}},
  {k:'C',tag:'驭妖',c:'#D88FA5',tx:'借夜翎之力破阵，带她远走高飞',hint:'影响：需夜翎好感≥5；成就「驭妖同行」',need:()=>(rdInit().love.夜翎||0)>=5,needMsg:'夜翎还不信任你到这个地步。先回她身边。',run:()=>{log('红尘卷','你破开镇妖符，夜翎的羽翼猛然张开。她一声清啸，妖力化作狂风卷碎丹炉禁制——东华子勃然大怒，而你已拉着夜翎冲入传送阵。身后是南离的万家灯火，身前是未知的天大地大。夜翎在风中回头看了一眼那座困了她半生的地宫，轻声问：“……我们，去哪？”你笑：“去哪都行，先把翅膀展开。”');rdEnding('驭妖同行');}},
  {k:'D',tag:'同流',c:'#8B6FA8',tx:'接过丹方，与东华子共享长生秘法',hint:'影响：成就「黑幕同流」（恶名线）',run:()=>{log('红尘卷','丹火明灭间，你听见自己说：“好。”东华子抚掌而笑。你接过那卷《化妖丹方》，指尖微凉。身后，被镇住的李青君瞪大了眼睛，眼神从不敢置信到失望，最终归于沉默。你没有回头——有些路，走上去就不能回头了。');rdEnding('黑幕同流');}},
]},
];
function showJianghu(){
  ensureGameState();const j=S.jianghu,q=jianghuQuest();
  let story='';
  if(j.chapter===1)story=j.clue>=3?opt('破','主线','#C4675C','线索齐全：夜探后山废祠','jhStory','advance'):opt('查','主线','#C9A45C','调查失踪弟子的线索','jhInvestigate','main');
  else if(j.chapter===2)story=opt('赴','决断','#C4675C','赴血月客栈，与蒙面人对质','jhStory','advance');
  else if(j.chapter===3)story=(idxOf(S.realm)<1?`<div class="row danger">剑冢威压非炼气修士可承，请先突破至筑基。</div>`:(j.clue>=3?opt('悟','传承','#A98FD9','残章齐全：入剑冢参悟遗书','jhStory','advance'):opt('寻','主线','#C9A45C','追寻剑谱残章','jhInvestigate','main')));
  else if(j.chapter===4)story=opt('战','决战','#C4675C','血魔攻山：选择你的立场','jhStory','advance');
  else if(j.chapter===5)story=j.clue>=3?opt('夺','天命','#A98FD9','三碑合一：闯东海归墟，夺回天命','jhStory','advance'):opt('碑','主线','#C9A45C','追查天命古碑与幕后夺运者','jhInvestigate','main');
  else if(j.chapter===6)story=j.clue>=3?opt('宫','决战','#C4675C','证据齐全：夜闯皇城斩国师','jhStory','advance'):opt('京','主线','#C9A45C','潜入帝京，收集国师罪证','jhInvestigate','main');
  else if(j.chapter===7)story=j.clue>=3?opt('天','逆伐','#C4675C','万事俱备：登天梯、斩仙使','jhStory','advance'):opt('界','主线','#C9A45C','联合九州强者准备破界之战','jhInvestigate','main');
  else story=opt('游','奇闻','#7FA8C9','游历九州，触发地方奇闻与禁区挑战','jhInvestigate','wander');
  const body=`<div class="questbox"><div class="chapter">${q.title}</div><div>${q.objective}</div><div class="sm">${q.progress}</div></div>
  <div class="opts">${story}
    ${opt('榜','委托','#6FA698','查看侠义榜：护送、缉凶、寻药','jhContract','open')}
    ${opt('闻','情报','#7FA8C9','在茶馆打听江湖传闻','jhRumor','one')}
    ${(S.rd&&S.rd.done)?'':opt('卷','红尘','#D88FA5','入红尘卷：南离国·问道红尘','rdEnter','1')}
  </div><hr class="sep"><div class="sm">本章专属挑战：输入「<b>天骄</b>」查看本章可击败的九州天骄——越阶取胜可得专属功法（万剑归宗/焚天诀/谪仙诀……）与无上声望。</div><hr class="sep"><div class="row sm">江湖行为会改变侠义与恶名；名声影响交涉、奖励和后续剧情。战胜妖兽不再无故增加业力，滥杀与夺财才会。</div>`;
  $('panel').innerHTML=panel('mystic',`江湖志 · ${jianghuTitle()}`,body)+statusCard();
}
function setJianghuEvent(t,n,opts){curEvent={kind:'江湖抉择',t,n,opts};renderPlay();}

  ensureGameState();const j=S.jianghu;
  if(mode==='wander'){
    const pool=[
      {t:'雨夜破庙',n:'破庙里，一名受伤镖师死死护着染血木匣，门外已有追兵逼近。',opts:[
        {k:'A',tag:'侠义',c:'#6FA698',tx:'替他挡下追兵',f:()=>{j.xia+=3;S.reputation+=3;S.lingShi+=40;log('雨夜破庙','你守住木匣，也守住了镖师一家老小的活路。侠义+3。');}},
        {k:'B',tag:'机缘',c:'#A98FD9',tx:'取匣远走，不问因果',f:()=>{j.evil+=2;S.lingShi+=100;log('雨夜破庙','匣中是百两灵石。你得了财，也背上不问是非的名声。恶名+2。');}}]},
      {t:'古渡沉舟',n:'河心鬼雾翻涌，十年前沉没的客船竟再次靠岸，船上灯火通明。',opts:[
        {k:'A',tag:'风险',c:'#C4675C',tx:'登船查明失踪案',f:()=>{j.xia+=2;S.six.神识=clamp(S.six.神识+1,1,20);log('古渡沉舟','你送百余亡魂归岸，神识+1、侠义+2。');}},
        {k:'B',tag:'平和',c:'#6FA698',tx:'立碑祭奠，不惊亡者',f:()=>{S.merit++;log('古渡沉舟','香火照开一段归途，功德+1。');}}]},
    ];const e=pool[Math.floor(Math.random()*pool.length)];setJianghuEvent(e.t,e.n,e.opts);return;
  }
  if(j.chapter===1){

function explore(){
  if(d100()<=45){genDynamicEvent();return;}
  const evs=MAP_EVENTS[S.loc]||MAP_EVENTS['东洲·青岳'];
  const e=evs[Math.floor(Math.random()*evs.length)];
  curEvent={kind:'探索 · '+S.loc,t:e.t,n:e.n,opts:e.opts};
  renderPlay();
}
function travel(name,need){
  const cur=idxOf(S.realm);
  if(need>cur){log('危险提示',`${name}建议${REALMS[need]}，你仅${realmLabel()}。已示警——去否由你。`);if(d100()<=40){const dmg=20+need*15;S.hp=clamp(S.hp-dmg,1,S.hpMax);S.status='重伤';log('杀劫',`你擅闯高阶地界，遭${REALMS[need]}修士镇压，重伤而逃！`);advanceTime(1);maybeEvent();renderPlay();return;}}
  S.loc=name;
  if(name==='青岳·灵泉'){spring();return;}
  log('游历',`你行至${name}。这里的地貌、势力与机缘，都与别处截然不同——等待你的，是独属于此地的奇遇与凶险。`);
  if(name==='秘境·通灵'){enterSecret('通灵');return;}
  advanceTime(1);explore();
}

/* ============ 坊市 ============ */
const SHOP=[{n:'聚气丹',price:20,eff:'气血+20'},{n:'筑基丹',price:500,eff:'破境筑基必备'},{n:'玄阶功法',price:600,eff:'功法系数1.3'},{n:'灵药·玉髓',price:120,eff:'炼丹材料'},{n:'聚灵符',price:80,eff:'灵气临时+0.5'}];
function showShop(){const rows=SHOP.map((it,i)=>`<div class="row">${it.n}　${it.eff}　<span class="em">${it.price}</span>灵石　<a class="lnk" data-act="buy" data-arg="${i}">买</a>　<a class="lnk" data-act="sell" data-arg="${i}">卖</a></div>`).join('');$('panel').innerHTML=panel('',`天机坊市 · ${timeLine()}`,`<div class="row">持有灵石：<span class="em">${S.lingShi}</span></div><hr class="sep">${rows}<div class="sm">买则付灵石，卖则回收半数。杀人夺宝可夺财物，然业力自增。</div>`)+statusCard();}
function buy(i){const it=SHOP[i];if(S.lingShi<it.price){log('坊市','灵石不足。');}else{S.lingShi-=it.price;const h=S.bag.find(b=>b.n===it.n);if(h)h.num++;else S.bag.push({n:it.n,num:1});log('坊市',`购入${it.n}，灵石-${it.price}。`);}showShop();}
function sell(i){const it=SHOP[i];const h=S.bag.find(b=>b.n===it.n);if(!h||h.num<=0){log('坊市','你没有可卖的。');showShop();return;}h.num--;S.lingShi+=Math.floor(it.price/2);log('坊市',`售出${it.n}，灵石+${Math.floor(it.price/2)}。`);showShop();}

/* ============ 情缘 ============ */
function lvName(v){return v>=100?'生死相许':v>=80?'道侣':v>=60?'暧昧':v>=40?'知己':v>=20?'相识':'陌生';}
function bondState(n){ensureGameState();return S.bonds[n]||(S.bonds[n]={met:false,chapter:0,rescues:0});}
function affGain(n,d){const b=bondState(n);b.met=true;S.aff[n]=(S.aff[n]||0)+d;log('情缘',`与${n}好感+${d}（${S.aff[n]}·${lvName(S.aff[n])}）。`);}
function bondRequirement(n){const r=BOND_ROUTES[n],j=S.jianghu||{};const reasons=[];if((j.chapter||1)<r.needChapter)reasons.push(`主线需到第${r.needChapter}章`);if(idxOf(S.realm)<r.needRealm)reasons.push(`境界需达${REALMS[r.needRealm]}`);if(n==='玄机子'&&(S.six.仙缘||0)<12)reasons.push('仙缘需达12');if(n==='姬无夜'&&(j.xia||0)<8)reasons.push('侠义需达8');return reasons;}
function meetBond(n){
  const b=bondState(n),r=BOND_ROUTES[n];if(b.met){log('情缘',`你与${n}早已相识。下一步：${bondNext(n)}`);showLove();return;}
  const req=bondRequirement(n);if(req.length){log('缘线未启',`${n}的相识路线尚未满足：${req.join('、')}。<br>路线提示：${r.route}`);showLove();return;}
  b.met=true;S.aff[n]=Math.max(S.aff[n]||0,12);S.loc=r.where;advanceTime(1);
  const scene=(BOND_STORIES[n]||GENERIC_BOND_STORY)[0];
  log(`初遇 · ${n}`,`${scene}<br><br>【缘线已开启】所在地：${r.where}；初始好感 ${S.aff[n]}。达到20好感后可推进第一段个人剧情。`);maybeEvent();renderPlay();
}
function bondNext(n){const b=bondState(n),v=S.aff[n]||0;if(!b.met)return`循“${BOND_ROUTES[n].route}”前往相识`;const needs=[20,40,60,80];if(b.chapter>=4)return'个人缘线已完成，可在主线与战斗中生死相随';return`好感达到${needs[b.chapter]}后，推进第${b.chapter+1}幕个人剧情（当前${v}）`;}
function advanceBond(n){
  const b=bondState(n);if(!b.met){meetBond(n);return;}const need=[20,40,60,80][b.chapter];if(need===undefined){log('缘线',`${n}的四幕个人缘线已经完成。你们的后续故事会在主线、修炼与危难救场中继续发生。`);showLove();return;}const v=S.aff[n]||0;if(v<need){log('缘线未启',`第${b.chapter+1}幕需要好感${need}，当前${v}。可通过闲谈、送礼、同游与共同修炼增进感情。`);showLove();return;}
  const scenes=BOND_STORIES[n]||GENERIC_BOND_STORY,txt=scenes[Math.min(b.chapter,scenes.length-1)];b.chapter++;
  const gain=b.chapter===4?15:8;S.aff[n]=v+gain;S.reputation+=b.chapter>=3?2:0;
  if(b.chapter===2){S.hpMax+=10;S.hp=clamp(S.hp+10,0,S.hpMax);}if(b.chapter===3){S.mpMax+=10;S.mp=clamp(S.mp+10,0,S.mpMax);}if(b.chapter===4)giveItem(`${n}的同心信物`,1);
  log(`情缘个人章 · ${n} · 第${b.chapter}幕`,`${txt}<br><br>【缘线进展】好感+${gain}${b.chapter===2?'、气血上限+10':b.chapter===3?'、灵力上限+10':b.chapter===4?'、获得同心信物':''}。${bondNext(n)}`);advanceTime(1);maybeEvent();renderPlay();
}
function showLove(){
  ensureGameState();const db=(S.daoban||[]);
  const dbLine=db.length?`<div class="row em" style="color:#D88FA5">道侣（${db.length}）：${db.join('、')}</div>`:'';
  const rows=Object.keys(NPCS).sort((a,b)=>(bondState(b).met?1:0)-(bondState(a).met?1:0)).map(n=>{const v=S.aff[n]||0,lv=lvName(v),b=bondState(n),r=BOND_ROUTES[n];
    if(!b.met){const req=bondRequirement(n);return `<div class="questbox"><div class="chapter">未相识 · ${n}　<span class="sm">${r.realm}强者</span></div><div>${r.route}</div><div class="sm">相识地点：${r.where}　条件：${req.length?req.join('、'):'已满足'}</div>${req.length?'':`<div><a class="lnk" data-act="meetBond" data-arg="${n}">循线前往相识</a></div>`}</div>`;}
    const rescue=v>=40?`<span style="color:#D88FA5">可助战：${r.realm}·${r.role}</span>`:'好感40成为知己后可在战斗中求援';
    return `<div class="questbox"><div class="chapter">${n} · ${lv}　好感 ${v}　缘线 ${b.chapter}/4</div><div>${NPCS[n].desc}</div><div class="sm">${rescue}　·　${bondNext(n)}</div><div>
      <a class="lnk" data-act="bondStory" data-arg="${n}">推进缘线</a>　<a class="lnk" data-act="talknpc" data-arg="${n}">闲谈</a>　<a class="lnk" data-act="gift" data-arg="${n}">送礼</a>　<a class="lnk" data-act="travel2" data-arg="${n}">同游</a>　<a class="lnk" data-act="view" data-arg="${n}">路线详情</a><br>
      <a class="lnk" data-act="hold" data-arg="${n}">牵手</a>　<a class="lnk" data-act="emb" data-arg="${n}">拥抱</a>　<a class="lnk" data-act="confess" data-arg="${n}">诉衷肠</a>　<a class="lnk" data-act="dual" data-arg="${n}">双修</a>　<a class="lnk" data-act="kiss" data-arg="${n}">拥吻</a>　<a class="lnk" data-act="pillow" data-arg="${n}">共枕</a>　<a class="lnk" data-act="pledge" data-arg="${n}">定情</a>　<a class="lnk" data-act="romE" data-arg="${n}">密会</a></div></div>`;
  }).join('');
  const body=`<div class="row sm"><b>情缘不再只是数值：</b>每人都有明确的相识地点、前置条件和四幕个人剧情。好感40成为知己后可在战斗中主动求援；暧昧与道侣在你濒死时更可能破界救场，高阶人物甚至能镇压远超你境界的强敌。全性向，也可理解为知己、师徒、结义或爱情。</div><hr class="sep">${dbLine}${rows}`;
  $('panel').innerHTML=panel('love',`情缘 · ${timeLine()}`,body)+statusCard();
}
function gift(n){if(!bondState(n).met){log('情缘','尚未相识，贸然送礼只会被当成别有用心。请先循线结识。');showLove();return;}if(S.lingShi<30){log('情缘','灵石不足30，无以为赠。');showLove();return;}S.aff[n]=(S.aff[n]||0)+12;S.lingShi=Math.max(0,S.lingShi-30);const t=ROM[NPCS[n].tone];log('赠礼',`你没有随便挑一件昂贵之物，而是记住了${n}真正喜欢的“${NPCS[n].like.join('、')}”。${t?' '+t.hold.replace(/^他|^她/,''):''}<br><br>贵重的从来不是三十灵石，而是你在漫长江湖里仍把那个人的一句话放在心上。好感+12（${S.aff[n]}·${lvName(S.aff[n])}）。`);showLove();}
function travelLove(n){const v=S.aff[n]||0;if(v<20){log('情缘',`你与${n}尚${lvName(v)}，还不到同游之时。`);showLove();return;}

function estateBuild(k){
  const e=ESTATE[k];if(!e)return;
  S.estate=S.estate||[];
  if(S.estate.includes(k)){log('产业',k+'已建成。');showDongfu();return;}
  if(S.lingShi<e.cost){log('产业','灵石不足'+e.cost+'。');showDongfu();return;}
  S.lingShi-=e.cost;S.estate.push(k);
  log('产业',`你耗费${e.cost}灵石与数月光阴，${k}落成。看着崭新的${k}，你第一次觉得，这洞府有了家的模样。`);
  advanceTime(1);showDongfu();
}
function estateRun(){
  if(phase!=='play'||CB||SEC||curEvent){log('产业','当前行动尚未结束。');renderPlay();return;}
  S.estate=S.estate||[];
  if(!S.estate.length){log('产业','洞府还没有任何产业，先建一座吧。');showDongfu();return;}
  if(S.lingShi<30){log('产业','经营需要30灵石材料费。');showDongfu();return;}
  S.lingShi-=30;
  const k=S.estate[Math.floor(Math.random()*S.estate.length)];
  ESTATE[k].run();
  advanceTime(1);maybeEvent();renderPlay();
}
function showDongfu(){S.estate=S.estate||[];
  const es=Object.keys(ESTATE).map(k=>{const has=S.estate.includes(k);return `<div class="row">${has?`<span style="color:#6FA698">●</span> ${k}（已建）`:k+'　建造成本'+ESTATE[k].cost+'灵石　<a class="lnk" data-act="estateBuild" data-arg="'+k+'">建造</a>'}<span class="sm">${ESTATE[k].desc}</span></div>`;}).join('');
  const body=`<div class="row">灵气 ${S.dongfu.qi}（系数${QI_COEF[S.dongfu.qi]}）　设施：${(S.dongfu.fac||[]).join('、')}</div><div class="row"><a class="lnk" data-act="upQi">花200灵石提升灵气一档</a>　<a class="lnk" data-act="addFac">花150灵石建静室/丹房</a></div><div class="row"><a class="lnk" data-act="rest">打坐调息（耗时一月，恢复气血+灵力）</a>　<a class="lnk" data-act="restFull">服灵药调养（花50灵石，恢复至全满）</a></div><div class="row em">洞府产业</div>${es}<div class="row"><a class="lnk" data-act="estateRun">经营产业（花30灵石+一月，随机产出）</a></div><div class="sm">产业是你在仙途之外的立身之本：灵田产灵药、丹房精丹术、器坊赚灵石、兽栏驯灵宠。调息是免费的日常恢复：气血灵力各回四成。闭关苦修：灵气越浓月修为越高。可「闭关X年」快进岁月。</div>`;

function upgradeQi(){const o=['贫瘠','普通','浓郁','福地','洞天'];const i=o.indexOf(S.dongfu.qi);if(i>=4){log('洞府','灵气已至洞天。');showDongfu();return;}if(S.lingShi<200){log('洞府','灵石不足200。');showDongfu();return;}S.lingShi-=200;S.dongfu.qi=o[i+1];log('洞府',`聚灵阵成型，灵气升至${S.dongfu.qi}。`);showDongfu();}

    const k=1+S.six.资质*0.05,lc=LING_COEF[S.lingType]||1,gc=Math.max(...S.gongfa.map(g=>GONG_COEF[g.grade]||1)),qc=QI_COEF[S.dongfu.qi];
    const need=S.realm==='炼气'?8:10;const mc=S.six.道心>=need+4?1.2:(S.six.道心>=need?1.0:0.5);
    S.xiu=clamp(S.xiu+BASE[S.realm]*k*lc*gc*qc*mc*2,0,100);
    if(S.xiu>=100&&S.sub==='圆满'&&d100()<=70){const nx=REALMS[idxOf(S.realm)+1];if(nx){S.realm=nx;S.sub='初期';S.xiu=0;}}
    else if(S.xiu>=100){const si=SUBS.indexOf(S.sub);if(si<3){S.sub=SUBS[si+1];S.xiu=0;}}
  }
  turn++;log('出关',`${y}年转瞬，你睁眼。当前 ${realmLabel()}，修为 ${Math.round(S.xiu)}/100。`);maybeEvent();renderPlay();
}

/* ============ 输入与分发 ============ */
function sendInput(){const inp=$('cmd');const v=inp.value.trim();inp.value='';if(!v)return;
  if(phase==='create1'){const e=parseCreate(v);if(e){log('天道',e);return;}showCreate2();return;}
  if(phase==='create2pending'){parseCreate2(v);return;}
  doCommand(v);
}
function parseCreate2(v){
  let lingType='伪灵根',lingen=['木','火'],tizhi='凡体';
  let six={资质:10,悟性:10,神识:10,遁速:10,道心:10,仙缘:10},talents=[];
  if(/天灵根/.test(v))lingType='天灵根';else if(/地灵根/.test(v))lingType='地灵根';else if(/真灵根/.test(v))lingType='真灵根';else if(/变异/.test(v))lingType='变异灵根';
  const wxf=(v.match(/[金木水火土雷风冰阴阳]/g)||[]);if(wxf.length)lingen=Array.from(new Set(wxf)).slice(0,5);
  if(/先天道体/.test(v))tizhi='先天道体';else if(/剑灵体/.test(v))tizhi='剑灵体';else if(/九阳/.test(v))tizhi='九阳圣体';else if(/冰魄/.test(v))tizhi='冰魄灵体';else if(/玄阴|纯阳/.test(v))tizhi='玄阴体';else if(/混沌/.test(v))tizhi='混沌体';else if(/凡体/.test(v))tizhi='凡体';
  const nums=(v.match(/\d+/g)||[]).map(Number);
  const sixNums=nums.filter(n=>n>=1&&n<=20).slice(0,6);
  if(sixNums.length===6){const ks=['资质','悟性','神识','遁速','道心','仙缘'];ks.forEach((k,i)=>six[k]=sixNums[i]);}
  const total=six.资质+six.悟性+six.神识+six.遁速+six.道心+six.仙缘;
  if(total>60){log('天道',`六维合计${total}，超出60点上限，请重新分配（单项1-15）。`);return;}
  const talMatch=v.match(/天赋?[:：]?\s*([0-9①-⑪\s]+)/);
  if(talMatch){(talMatch[1].match(/[0-9①-⑪]/g)||[]).forEach(c=>{const n=c.charCodeAt(0)>=0x2460?(c.charCodeAt(0)-0x2460+1):parseInt(c);if(n>=1&&n<=11)talents.push(n);});}
  finishCreate(lingen,lingType,tizhi,six,talents);
}

/* ============ 启动 ============ */
window.addEventListener('DOMContentLoaded',async()=>{
  loadAcct();detectApi();loadSbSession();renderAcctBar();
  // PWA：注册 service worker（仅 http(s) 下有效，file:// 自动跳过）
  if(location.protocol==='http:'||location.protocol==='https:'){
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').then(reg=>{reg.update();reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){const el=$('feedbackToast');if(el){el.innerHTML='<b>发现新版本</b>　<a class="lnk" data-act="reload">立即更新</a>';el.classList.add('show');}}});});}).catch(()=>{}); }
  }
  log('天玄历 387 年 · 春','灵气自地脉翻涌，千年灵气潮汐已在暗中酝酿。你立于凡尘与仙途的门槛，前路未卜，唯道心可问。');
  phase='create1';showCreate1();
  $('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')sendInput();});
  if(supabaseReady()&&SB_SESSION){
    if(await verifySbAuth()){SB_USER=SB_SESSION.user;CLOUD_SYNC_STATE='已登录';renderAcctBar();await loadSupabaseSave();}
    else{CLOUD_SYNC_STATE='请重新登录';renderAcctBar();const localAuto=loadLocalAuto();if(localAuto&&applySnapshot(localAuto)){log('自动读档',`云账号登录已失效，已安全继续本机进度：${S.name} · ${realmLabel()}。请在“账号”中重新登录。`);renderPlay();}}
  }else{
    const localAuto=loadLocalAuto();
    if(localAuto&&applySnapshot(localAuto)){log('自动读档',`已继续本机最近进度：${S.name} · ${realmLabel()}。`);renderPlay();}
  }
});
window.addEventListener('online',()=>{if(SB_USER)scheduleCloudAutosave();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveLocalAuto();if(SB_USER)cloudSaveNow(true);}});
